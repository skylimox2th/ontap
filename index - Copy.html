<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Thi Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .bg-card { background: #1e293b; border: 1px solid #334155; }
        .option-item { background: rgba(30, 41, 59, 0.5); border: 1px solid #475569; transition: 0.3s; }
        .option-item:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .option-item.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        .nav-box { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #475569; font-size: 13px; }
        .nav-box.active { background: #3b82f6; border-color: #3b82f6; font-weight: bold; }
        .nav-box { border-radius: 4px; }
        .nav-box.correct-nav { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .nav-box.wrong-nav { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .nav-box.skipped { border-color: #eab308; color: #eab308; background: rgba(234, 179, 8, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto">
    <!-- MÀN HÌNH CHÍNH -->
    <div id="home-screen">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center"><i class="fas fa-graduation-cap mr-2"></i>KHO KHÓA HỌC</h1>
        <div id="subject-list" class="grid gap-4 mb-8"></div>
        <button onclick="showScreen('editor-screen')" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition shadow-lg">+ Thêm Môn Học Mới</button>
    </div>

    <!-- MÀN HÌNH TRÌNH BIÊN SOẠN -->
    <div id="editor-screen" class="hidden">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Cấu hình môn học</h2>
        <div class="bg-card p-6 rounded-xl">
            <input type="text" id="subject-name" placeholder="Tên môn học (Ví dụ: Cơ khí AWS)" class="w-full bg-slate-800 border border-slate-600 p-3 rounded mb-4 focus:outline-none focus:border-blue-500">
            <textarea id="json-input" rows="12" placeholder='Dán JSON câu hỏi vào đây...' class="w-full bg-slate-800 border border-slate-600 p-3 rounded text-sm font-mono focus:outline-none focus:border-blue-500"></textarea>
            <div class="flex gap-4 mt-6">
                <button onclick="saveSubject()" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Lưu lại</button>
                <button onclick="showScreen('home-screen')" class="flex-1 bg-slate-600 p-3 rounded-lg font-bold">Hủy</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="hidden">
        <div class="mb-4 text-yellow-500 font-bold uppercase tracking-wider">Câu hỏi <span id="cur-idx-text">1</span> / <span id="total-idx-text">10</span></div>
        <div class="bg-card p-6 rounded-lg mb-6 border-l-4 border-blue-500">
            <div id="question-text" class="text-xl leading-relaxed"></div>
        </div>
        <div id="options-container" class="space-y-3 mb-8"></div>
        <div class="flex flex-wrap gap-2 justify-between border-t border-slate-700 pt-6">
            <div class="flex gap-2">
                <button onclick="prevQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">← Trước</button>
                <button onclick="showHint()" class="bg-yellow-600/20 text-yellow-500 border border-yellow-500/50 px-6 py-2 rounded text-sm font-medium hover:bg-yellow-600 hover:text-white transition">💡 Gợi ý</button>
            </div>
            <button onclick="checkAnswer()" class="bg-blue-600 px-10 py-2 rounded font-bold shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:bg-blue-500">Trả lời</button>
            <div class="flex gap-2">
                <button onclick="showScreen('home-screen')" class="bg-slate-700 px-4 py-2 rounded text-sm font-medium">Dừng làm bài</button>
                <button onclick="nextQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">Tiếp →</button>
            </div>
        </div>
        <div id="hint-box" class="hidden mt-6 p-4 bg-blue-900/30 border border-blue-500/30 rounded-lg text-blue-200 italic text-sm"></div>
        <div class="mt-10">
            <div class="text-sm font-bold mb-4 uppercase text-slate-400">Danh sách câu</div>
            <div id="question-grid" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // DỮ LIỆU F12 ĐỂ ĐÂY
    // Hãy bôi đen toàn bộ chữ DÁN_CHỖ_NÀY và bấm Ctrl + V (hoặc chuột phải Paste)
    // Chú ý: Đừng xóa dấu chấm phẩy ; ở phía sau cùng nhé
    // =========================================================================
    
    const KHO_DU_LIEU = {"NGÂN HÀNG CÂU HỎI PT ":[{"q":"All of the following parts can be tested by the liquid penetrant method except? / Tất cả các chi tiết sau có thể được kiểm tra bằng phương pháp thẩm thấu ngoại trừ?","a":["an iron casting / vật đúc bằng gang","an aluminum forging / vật rèn bằng nhôm","a part made from a porous plastic material / chi tiết làm từ vật liệu nhựa xốp","a part made from a nonporous material / chi tiết làm từ vật liệu không xốp"],"c":2,"e":"PT chỉ áp dụng hiệu quả với vật liệu không xốp. Vật liệu xốp sẽ hấp thụ chất thấm gây nhiễu toàn bộ bề mặt."},{"q":"Which of the following discontinuities can be found by the penetrant test method? / Loại bất liên tục nào sau đây có thể được phát hiện bằng phương pháp PT?","a":["a surface crack / vết nứt bề mặt","a subsurface crack / vết nứt dưới bề mặt","an internal inclusion / tạp chất bên trong","none of the above / không có đáp án nào đúng"],"c":0,"e":"PT chỉ phát hiện được các khuyết tật hở bề mặt như vết nứt bề mặt."},{"q":"Liquid penetrant testing is capable of detecting: / Phương pháp PT có khả năng phát hiện:","a":["subsurface intergranular stress corrosion cracking discontinuities / nứt ăn mòn ứng suất dưới bề mặt","discontinuities open to the surface / khuyết tật hở bề mặt","subsurface discontinuities / khuyết tật dưới bề mặt","lack of fusion (subsurface) / không ngấu dưới bề mặt"],"c":1,"e":"Chất thấm chỉ có thể đi vào các khuyết tật thông ra bề mặt."},{"q":"Liquid penetrant inspection cannot find: / Phương pháp PT không thể phát hiện:","a":["surface porosity / rỗ khí bề mặt","surface cracks / nứt bề mặt","an internal cavity / lỗ rỗng bên trong","a surface forging lap / nếp gấp rèn bề mặt"],"c":2,"e":"PT không thể phát hiện khuyết tật nằm hoàn toàn bên trong vật liệu."},{"q":"All of the following materials can be inspected by the usual liquid penetrant test except: / Tất cả vật liệu sau có thể kiểm tra bằng PT ngoại trừ:","a":["unglazed porous ceramic / gốm xốp không tráng men","titanium / titan","high alloy steel / thép hợp kim cao","cast iron / gang đúc"],"c":0,"e":"Vật liệu xốp hấp thụ penetrant gây nhiễu toàn bộ bề mặt."},{"q":"Liquid penetrant testing can be used to detect: / PT có thể được dùng để phát hiện:","a":["discontinuities 1.6 mm below the surface / khuyết tật sâu 1.6 mm","internal discontinuities / khuyết tật bên trong","discontinuities open to the surface / khuyết tật hở bề mặt","all discontinuities / mọi loại khuyết tật"],"c":2,"e":"PT chỉ phát hiện được khuyết tật mở ra bề mặt."},{"q":"Which of the following is the primary limitation of liquid penetrant testing? / Giới hạn chính của PT là gì?","a":["penetrant testing cannot be used on ferromagnetic material / không dùng cho vật liệu sắt từ","penetrant testing cannot locate shallow surface discontinuities / không phát hiện khuyết tật nông","penetrant testing cannot be used on nonmetallic surface / không dùng cho phi kim","penetrant testing cannot locate subsurface discontinuities / không phát hiện khuyết tật dưới bề mặt"],"c":3,"e":"PT không thể phát hiện khuyết tật nằm dưới bề mặt."},{"q":"The procedure P6/QA/22 allows to check: / Quy trình P6/QA/22 cho phép kiểm tra:","a":["surface defects of base metal and welds / khuyết tật bề mặt kim loại cơ bản và mối hàn","welds of any metal with a thickness of 8mm or more / mối hàn dày trên 8 mm","any defects in the weld / mọi khuyết tật trong mối hàn","both a and c / cả a và c"],"c":0,"e":"Quy trình chỉ áp dụng cho khuyết tật bề mặt."},{"q":"Which of the following characteristics does not apply to liquid penetrant testing? / Đặc điểm nào sau đây không đúng với PT?","a":["this method can accurately measure the depth of a crack or discontinuity / đo chính xác chiều sâu khuyết tật","this method can be used for on-site testing of large parts / dùng tại hiện trường","this method can be used to find shallow surface discontinuities / phát hiện khuyết tật nông","this method can be made more or less sensitive by using different penetrant materials / thay đổi độ nhạy bằng vật liệu PT khác nhau"],"c":0,"e":"PT không thể xác định chính xác chiều sâu khuyết tật."},{"q":"Penetration liquid test procedure is document No? / Quy trình PT là tài liệu số mấy?","a":["P6/QA/19","P6/QA/22","P6/QA/20","P6/QA/21"],"c":1,"e":"Quy trình PT sử dụng tài liệu P6/QA/22."},{"q":"According to procedure P6/QA/22, who are authorized to perform the test? / Theo quy trình P6/QA/22, ai được phép thực hiện kiểm tra?","a":["Only individuals who are tested according to SNT-TC-1A level II or level III / chỉ Level II hoặc III","Technicians are tested according to SNT-TC-1A / kỹ thuật viên SNT-TC-1A","Technicians tested under SNT-TC-1A level I are allowed to inspect but reporting is done only by level II personnel or higher / Level I được kiểm tra nhưng báo cáo do Level II trở lên","Both a and c / cả a và c"],"c":3,"e":"Level I được thao tác dưới giám sát nhưng đánh giá do Level II trở lên."},{"q":"Theo quy trình kiểm tra chất lỏng thẩm thấu P6/QA/22, người đánh giá và hoàn thành báo cáo cần phải là: / According to P6/QA/22, the evaluator and report signer shall be:","a":["Kỹ thuật viên có chứng chỉ PCN PT / PCN PT technician","Kỹ thuật viên có chứng chỉ SNT-TC-1A PT level I hoặc II / Level I or II","Kỹ thuật viên có chứng chỉ SNT-TC-1A PT level II hoặc III / Level II or III","Tất cả đều đúng / all are correct"],"c":2,"e":"Việc đánh giá và ký báo cáo phải do nhân sự Level II hoặc III."},{"q":"Kỹ thuật viên có chứng chỉ SNT-TC-1A PT level 1 được phép: / A PT Level I technician is allowed to:","a":["Thực hiện công việc kiểm tra thẩm thấu dưới sự giám sát / perform PT under supervision","Thực hiện đánh giá kết quả / evaluate results","Thực hiện kiểm tra và đánh giá / inspect and evaluate","Tất cả sai / all incorrect"],"c":0,"e":"Level I chỉ được thao tác dưới giám sát."},{"q":"Theo quy trình P6/QA/22, nhân sự nào phù hợp để thực hiện kiểm tra PT mối hàn? / Which personnel are qualified to perform PT weld inspection?","a":["CSWIP PT level II expired / CSWIP hết hạn","SNT-TC-1A PT expired / SNT hết hạn","ISO 9712 PT expired / ISO hết hạn","SNT-TC-1A PT level II valid / SNT-TC-1A PT level II còn hiệu lực"],"c":3,"e":"Chứng chỉ phải còn hiệu lực."},{"q":"Theo quy trình P6/QA/22, vật tư kiểm tra thẩm thấu phù hợp: / According to P6/QA/22, suitable PT materials are:","a":["Đồng nhất từ một nhà sản xuất / same manufacturer","Kết hợp nhiều nhà sản xuất / mixed manufacturers","Có thể dùng tương đương / equivalent manufacturers","Cả a và c / both a and c"],"c":0,"e":"Hóa chất PT phải đồng bộ từ cùng nhà sản xuất."},{"q":"What is the purpose of developer in PT? / Mục đích của developer trong PT là gì?","a":["clean the surface / làm sạch bề mặt","draw penetrant from discontinuities / hút penetrant ra khỏi khuyết tật","increase hardness / tăng độ cứng","remove paint / loại bỏ sơn"],"c":1,"e":"Developer giúp tạo chỉ thị rõ ràng bằng cách hút penetrant ra ngoài."},{"q":"Which penetrant method requires ultraviolet light? / Phương pháp PT nào cần đèn UV?","a":["visible dye penetrant / PT màu","water washable penetrant / PT rửa nước","fluorescent penetrant / PT huỳnh quang","solvent removable penetrant / PT dung môi"],"c":2,"e":"PT huỳnh quang yêu cầu dùng đèn UV để quan sát."},{"q":"What is dwell time in penetrant testing? / Dwell time trong PT là gì?","a":["cleaning time / thời gian làm sạch","drying time / thời gian làm khô","time penetrant remains on surface / thời gian penetrant nằm trên bề mặt","developer storage time / thời gian lưu developer"],"c":2,"e":"Dwell time là thời gian penetrant thấm vào khuyết tật."},{"q":"What happens if excess penetrant is not properly removed? / Điều gì xảy ra nếu không làm sạch penetrant dư đúng cách?","a":["false indications / chỉ thị giả","better sensitivity / tăng độ nhạy","no effect / không ảnh hưởng","faster drying / khô nhanh hơn"],"c":0,"e":"Penetrant dư sẽ tạo chỉ thị giả."},{"q":"PT inspection is based on which physical principle? / PT hoạt động dựa trên nguyên lý vật lý nào?","a":["magnetism / từ tính","capillary action / hiện tượng mao dẫn","electric current / dòng điện","ultrasonic vibration / dao động siêu âm"],"c":1,"e":"PT dựa trên hiện tượng mao dẫn."},{"q":"Which discontinuity is best detected by PT? / Loại khuyết tật nào được phát hiện tốt nhất bằng PT?","a":["internal porosity / rỗ khí bên trong","subsurface crack / nứt dưới bề mặt","surface crack / nứt bề mặt","deep inclusion / tạp chất nằm sâu"],"c":2,"e":"PT đặc biệt hiệu quả với các vết nứt hở bề mặt."},{"q":"What should be checked before using UV light? / Cần kiểm tra gì trước khi sử dụng đèn UV?","a":["voltage only / chỉ điện áp","battery color / màu pin","light intensity calibration / hiệu chuẩn cường độ đèn","cable weight / trọng lượng dây cáp"],"c":2,"e":"Cường độ UV phải đạt yêu cầu trước khi kiểm tra PT huỳnh quang."},{"q":"What is the main limitation of PT? / Giới hạn chính của PT là gì?","a":["cannot detect surface cracks / không phát hiện nứt bề mặt","cannot test metals / không kiểm tra được kim loại","cannot detect subsurface defects / không phát hiện khuyết tật dưới bề mặt","cannot be portable / không thể dùng di động"],"c":2,"e":"PT chỉ phát hiện được khuyết tật hở bề mặt."},{"q":"Which cleaning method is common after PT inspection? / Phương pháp làm sạch nào thường dùng sau PT?","a":["grinding / mài","acid etching / ăn mòn axit","solvent cleaning / làm sạch bằng dung môi","hammering / gõ búa"],"c":2,"e":"Dung môi thường được sử dụng để làm sạch sau kiểm tra PT."},{"q":"Why should parts be dry before penetrant application? / Vì sao chi tiết phải khô trước khi áp dụng penetrant?","a":["to avoid dilution of penetrant / tránh làm loãng penetrant","to increase heat / tăng nhiệt","to change color / đổi màu","to reduce developer / giảm developer"],"c":0,"e":"Độ ẩm còn lại sẽ cản trở khả năng thấm của penetrant."},{"q":"Which indication usually appears as a round shape? / Loại chỉ thị nào thường có dạng tròn?","a":["crack / vết nứt","linear indication / chỉ thị dạng đường","porosity / rỗ khí","lack of fusion / không ngấu"],"c":2,"e":"Rỗ khí thường tạo chỉ thị tròn hoặc dạng đốm."},{"q":"Linear indications are usually associated with: / Chỉ thị dạng đường thường liên quan đến:","a":["porosity / rỗ khí","cracks / vết nứt","surface dirt / bụi bẩn bề mặt","paint / sơn"],"c":1,"e":"Chỉ thị dạng đường thường liên quan đến nứt hoặc không ngấu."},{"q":"Which PT method is easiest to use in field inspection? / Phương pháp PT nào dễ sử dụng nhất ngoài hiện trường?","a":["post-emulsifiable fluorescent / huỳnh quang hậu nhũ hóa","visible dye solvent removable / PT màu dùng dung môi","dry powder fluorescent / bột khô huỳnh quang","water suspendable / hòa nước"],"c":1,"e":"PT màu dùng dung môi rất phù hợp cho công việc hiện trường."},{"q":"What happens if developer coating is too thick? / Điều gì xảy ra nếu lớp developer quá dày?","a":["indications become clearer / chỉ thị rõ hơn","indications may be masked / chỉ thị bị che mất","penetrant sensitivity increases / tăng độ nhạy","no effect / không ảnh hưởng"],"c":1,"e":"Developer quá dày sẽ che khuất chỉ thị."},{"q":"What is the purpose of emulsifier in PT? / Mục đích của emulsifier trong PT là gì?","a":["increase hardness / tăng độ cứng","make penetrant water washable / giúp penetrant rửa được bằng nước","dry the surface / làm khô bề mặt","cool the part / làm mát chi tiết"],"c":1,"e":"Emulsifier giúp penetrant hậu nhũ hóa có thể rửa bằng nước."},{"q":"What type of discontinuity usually forms rounded indications? / Loại khuyết tật nào thường tạo chỉ thị tròn?","a":["cracks / vết nứt","laps / nếp gấp","porosity / rỗ khí","lack of penetration / thiếu ngấu"],"c":2,"e":"Rỗ khí thường xuất hiện dưới dạng chỉ thị tròn."},{"q":"Which of the following can reduce penetrant sensitivity? / Điều nào sau đây có thể làm giảm độ nhạy của PT?","a":["improper cleaning / làm sạch không đúng","correct dwell time / thời gian thấm đúng","proper developer application / áp developer đúng","correct temperature / nhiệt độ đúng"],"c":0,"e":"Bề mặt không sạch sẽ ngăn penetrant đi vào khuyết tật."},{"q":"What is the recommended lighting for visible dye penetrant inspection? / Ánh sáng yêu cầu cho PT màu là gì?","a":["dark room / phòng tối","adequate white light / ánh sáng trắng đầy đủ","UV light only / chỉ dùng UV","laser light / ánh sáng laser"],"c":1,"e":"PT màu yêu cầu đủ ánh sáng trắng để quan sát chỉ thị."},{"q":"The penetrant removal process should: / Quá trình loại bỏ penetrant cần phải:","a":["remove all penetrant including inside discontinuities / loại bỏ toàn bộ penetrant kể cả trong khuyết tật","remove only excess penetrant from surface / chỉ loại bỏ penetrant dư trên bề mặt","remove developer / loại bỏ developer","increase penetrant dwell time / tăng thời gian thấm"],"c":1,"e":"Chỉ loại bỏ penetrant trên bề mặt, không được rửa mất penetrant trong khuyết tật."},{"q":"Which developer form is applied dry? / Loại developer nào được áp dụng ở dạng khô?","a":["dry powder developer / developer bột khô","aqueous developer / developer dạng nước","solvent developer / developer dung môi","foam developer / developer bọt"],"c":0,"e":"Dry powder developer được áp dụng dưới dạng bột khô."},{"q":"The temperature of the test surface is important because: / Nhiệt độ bề mặt kiểm tra quan trọng vì:","a":["it affects penetrant performance / ảnh hưởng hiệu quả penetrant","it changes weld size / thay đổi kích thước mối hàn","it changes metal color / đổi màu kim loại","it affects magnetism / ảnh hưởng từ tính"],"c":0,"e":"Nhiệt độ không phù hợp sẽ ảnh hưởng khả năng mao dẫn của penetrant."},{"q":"What is a false indication? / Chỉ thị giả là gì?","a":["a real crack / vết nứt thật","an irrelevant indication not caused by discontinuity / chỉ thị không do khuyết tật gây ra","a deep defect / khuyết tật sâu","a subsurface crack / nứt dưới bề mặt"],"c":1,"e":"Chỉ thị giả xuất hiện do bề mặt bẩn, hình dạng hoặc penetrant dư."},{"q":"Which penetrant family has the highest sensitivity? / Loại penetrant n cessive developer thickness undesirable? / Vì sao lớp developer quá dày là không mong muốn?","a":["it may mask indications / có thể che mất chỉ thị","it increases penetrant dwell time / tăng thời gian thấm","it improves crack visibility too much / làm chỉ thị quá rõ","it hardens the surface / làm cứng bề mặt"],"c":0,"e":"Developer quá dày sẽ che khuất hoặc làm mờ chỉ thị."},{"q":"Which penetrant process generally requires the most precise control? / Quy trình PT nào thường yêu cầu kiểm soát chính xác nhất?","a":["post-emulsifiable process / quy trình hậu nhũ hóa","solvent removable process / quy trình dùng dung môi","visible dye process / quy trình PT màu","dry powder process / quy trình bột khô"],"c":0,"e":"PT hậu nhũ hóa yêu cầu kiểm soát chặt chẽ thời gian nhũ hóa."},{"q":"What is the effect of contaminated penetrant materials? / Ảnh hưởng của vật tư PT bị nhiễm bẩn là gì?","a":["unreliable inspection results / kết quả kiểm tra không tin cậy","stronger indications / chỉ thị mạnh hơn","improved sensitivity / tăng độ nhạy","better developer action / developer hoạt động tốt hơn"],"c":0,"e":"Nhiễm bẩn có thể gây sai lệch hoặc mất chỉ thị."},{"q":"Which condition is most important for accurate PT evaluation? / Điều kiện nào quan trọng nhất để đánh giá PT chính xác?","a":["proper lighting and viewing conditions / điều kiện ánh sáng và quan sát phù hợp","high weld temperature / nhiệt độ hàn cao","heavy developer coating / lớp developer dày","rough surface finish / bề mặt nhám"],"c":0,"e":"Ánh sáng và điều kiện quan sát quyết định khả năng đánh giá chính xác."},{"q":"What is the primary purpose of post-cleaning after PT inspection? / Mục đích chính của làm sạch sau PT là gì?","a":["remove residual chemicals from the part / loại bỏ hóa chất còn dư trên chi tiết","improve penetrant sensitivity / tăng độ nhạy","change material structure / thay đổi cấu trúc vật liệu","increase magnetic properties / tăng tính từ"],"c":0,"e":"Làm sạch sau kiểm tra giúp tránh ăn mòn và nhiễm bẩn."},{"q":"Which factor affects the visibility of fluorescent indications? / Yếu tố nào ảnh hưởng đến khả năng nhìn thấy chỉ thị huỳnh quang?","a":["UV intensity / cường độ UV","ambient white light / ánh sáng trắng môi trường","dark adaptation of the eyes / sự thích nghi tối của mắt","all of the above / tất cả các đáp án trên"],"c":3,"e":"Tất cả các yếu tố trên đều ảnh hưởng đến khả năng quan sát."},{"q":"Which discontinuity is most likely to produce a continuous sharp indication? / Khuyết tật nào thường tạo chỉ thị liên tục sắc nét?","a":["crack / vết nứt","porosity / rỗ khí","surface stain / vết bẩn","oxide inclusion / tạp chất oxit"],"c":0,"e":"Vết nứt thường tạo chỉ thị đường sắc nét và liên tục."},{"q":"Why should penetrant systems be periodically checked? / Vì sao hệ PT cần được kiểm tra định kỳ?","a":["to ensure system reliability / đảm bảo độ tin cậy hệ thống","to reduce metal thickness / giảm chiều dày kim loại","to increase UV output permanently / tăng UV vĩnh viễn","to remove discontinuities / loại bỏ khuyết tật"],"c":0,"e":"Kiểm tra định kỳ giúp xác nhận hệ PT hoạt động ổn định."},{"q":"What is the most likely cause of weak indications? / Nguyên nhân có khả năng nhất gây chỉ thị yếu là gì?","a":["insufficient penetrant dwell time / thời gian thấm không đủ","proper cleaning / làm sạch đúng","adequate UV intensity / UV đủ","correct developer layer / lớp developer đúng"],"c":0,"e":"Penetrant không đủ thời gian để thấm sâu vào khuyết tật."},{"q":"Which penetrant characteristic improves defect detectability? / Đặc tính nào của penetrant giúp tăng khả năng phát hiện khuyết tật?","a":["high contrast visibility / độ tương phản cao","high electrical resistance / điện trở cao","low capillary action / mao dẫn thấp","high density only / chỉ khối lượng riêng cao"],"c":0,"e":"Độ tương phản cao giúp nhận biết chỉ thị dễ hơn."},{"q":"What type of developer is suspended in volatile solvent? / Loại developer nào được phân tán trong dung môi bay hơi?","a":["nonaqueous wet developer / developer ướt không nước","dry powder developer / developer bột khô","water soluble developer / developer hòa tan nước","water suspendable developer / developer huyền phù nước"],"c":0,"e":"Nonaqueous wet developer sử dụng dung môi bay hơi nhanh."},{"q":"What is the most important requirement for PT applicability? / Yêu cầu quan trọng nhất để áp dụng PT là gì?","a":["discontinuity must be open to the surface / khuyết tật phải hở bề mặt","material must be magnetic / vật liệu phải có từ tính","surface must be painted / bề mặt phải sơn","component must be thick / chi tiết phải dày"],"c":0,"e":"PT chỉ phát hiện được khuyết tật thông ra bề mặt."},{"q":"Which factor can produce false fluorescent indications? / Yếu tố nào có thể tạo chỉ thị huỳnh quang giả?","a":["lint or contamination on the surface / xơ vải hoặc nhiễm bẩn trên bề mặt","proper developer application / áp developer đúng","adequate UV intensity / UV đủ","correct rinse pressure / áp lực rửa đúng"],"c":0,"e":"Bụi, xơ vải hoặc nhiễm bẩn có thể phát sáng dưới UV."},{"q":"Which type of PT indication generally requires further evaluation? / Loại chỉ thị PT nào thường cần đánh giá thêm?","a":["relevant indication / chỉ thị liên quan","water stain / vết nước","paint mark / dấu sơn","developer streak / vệt developer"],"c":0,"e":"Chỉ thị liên quan phải được đánh giá theo tiêu chuẩn."},{"q":"Why are acceptance standards necessary in PT inspection? / Vì sao cần có tiêu chuẩn chấp nhận trong PT?","a":["to determine if discontinuities are acceptable / xác định khuyết tật có chấp nhận được hay không","to increase penetrant sensitivity / tăng độ nhạy","to improve developer drying / cải thiện làm khô developer","to reduce UV intensity / giảm UV"],"c":0,"e":"Tiêu chuẩn chấp nhận giúp quyết định đạt hay không đạt."},{"q":"What should be done if excessive background fluorescence is observed? / Cần làm gì nếu thấy nền huỳnh quang quá mạnh?","a":["improve cleaning and penetrant removal / cải thiện làm sạch và loại bỏ penetrant","increase developer thickness / tăng chiều dày developer","reduce dwell time to zero / giảm thời gian thấm về 0","heat the part / gia nhiệt chi tiết"],"c":0,"e":"Nền huỳnh quang mạnh thường do penetrant dư chưa được loại bỏ đúng."},{"q":"Which condition may reduce the effectiveness of fluorescent penetrant inspection? / Điều kiện nào có thể làm giảm hiệu quả của PT huỳnh quang?","a":["high ambient white light / ánh sáng trắng môi trường cao","proper UV intensity / cường độ UV phù hợp","dark adaptation / thích nghi bóng tối","clean surface / bề mặt sạch"],"c":0,"e":"Ánh sáng trắng quá mạnh sẽ làm giảm độ tương phản của chỉ thị huỳnh quang."},{"q":"What is the most likely cause of excessive background in visible dye PT? / Nguyên nhân có khả năng nhất gây nền quá mức trong PT màu là gì?","a":["inadequate removal of excess penetrant / loại bỏ penetrant dư không đủ","correct developer application / áp developer đúng","low dwell time / thời gian thấm thấp","surface polishing / đánh bóng bề mặt"],"c":0,"e":"Penetrant dư còn lại trên bề mặt sẽ tạo nền đỏ quá mức."},{"q":"Which defect is most likely to appear as a fine, continuous line? / Khuyết tật nào thường xuất hiện dưới dạng đường mảnh liên tục?","a":["crack / vết nứt","porosity / rỗ khí","pitting / ăn mòn lỗ","surface stain / vết bẩn bề mặt"],"c":0,"e":"Vết nứt thường tạo chỉ thị mảnh và liên tục."},{"q":"Why should inspection surfaces be protected after final cleaning? / Vì sao cần bảo vệ bề mặt sau khi làm sạch cuối cùng?","a":["to prevent recontamination / ngăn tái nhiễm bẩn","to increase hardness / tăng độ cứng","to improve weld penetration / tăng độ ngấu","to reduce UV intensity / giảm UV"],"c":0,"e":"Bề mặt sạch cần tránh dầu mỡ hoặc bụi bẩn trước PT."},{"q":"Which characteristic is typical of a nonrelevant indication? / Đặc điểm nào điển hình của chỉ thị không liên quan?","a":["associated with geometry changes / liên quan đến thay đổi hình dạng","sharp crack-like appearance / hình dạng giống nứt sắc nét","caused by actual defects / do khuyết tật thật","always rejectable / luôn bị loại"],"c":0,"e":"Chỉ thị không liên quan thường xuất hiện tại góc, ren hoặc thay đổi hình dạng."},{"q":"What is the function of a black light filter in UV lamps? / Chức năng của bộ lọc đèn UV là gì?","a":["block visible light / chặn ánh sáng nhìn thấy","increase white light / tăng ánh sáng trắng","cool the lamp / làm mát đèn","increase penetrant viscosity / tăng độ nhớt penetrant"],"c":0,"e":"Bộ lọc giúp loại bỏ ánh sáng nhìn thấy và cho tia UV-A đi qua."},{"q":"Which type of discontinuity is generally most difficult to detect with PT? / Loại khuyết tật nào thường khó phát hiện nhất bằng PT?","a":["tight crack with little surface opening / nứt kín có độ mở rất nhỏ","wide open crack / nứt mở rộng","large porosity / rỗ khí lớn","surface seam / đường cán bề mặt"],"c":0,"e":"Nứt rất kín khó cho penetrant thấm vào."},{"q":"Why should emulsification time be carefully controlled? / Vì sao thời gian nhũ hóa phải được kiểm soát cẩn thận?","a":["to avoid removing penetrant from discontinuities / tránh làm mất penetrant khỏi khuyết tật","to increase crack size / tăng kích thước nứt","to improve weld hardness / tăng độ cứng mối hàn","to reduce developer sensitivity / giảm độ nhạy developer"],"c":0,"e":"Nhũ hóa quá lâu có thể làm penetrant bị rửa khỏi khuyết tật."},{"q":"Which factor most affects penetrant penetration into discontinuities? / Yếu tố nào ảnh hưởng nhiều nhất đến khả năng thấm của penetrant?","a":["surface cleanliness / độ sạch bề mặt","metal color / màu kim loại","component weight / trọng lượng chi tiết","joint size / kích thước mối nối"],"c":0,"e":"Bề mặt sạch giúp penetrant dễ dàng đi vào khuyết tật."},{"q":"What is the primary purpose of interpretation in PT? / Mục đích chính của việc đánh giá PT là gì?","a":["determine the significance of indications / xác định ý nghĩa của chỉ thị","increase penetrant brightness / tăng độ sáng penetrant","improve UV intensity / tăng UV","change surface roughness / thay đổi độ nhám"],"c":0,"e":"Đánh giá PT nhằm xác định chỉ thị có phải khuyết tật và mức độ chấp nhận."},{"q":"Which penetrant system is easiest to use in field applications? / Hệ PT nào dễ sử dụng nhất ngoài hiện trường?","a":["visible dye solvent removable / PT màu dùng dung môi","fluorescent post-emulsifiable / PT huỳnh quang hậu nhũ hóa","water washable fluorescent / PT huỳnh quang rửa nước","immersion fluorescent / nhúng huỳnh quang"],"c":0,"e":"PT màu dùng dung môi rất thuận tiện cho kiểm tra hiện trường."},{"q":"Which condition may produce excessive developer background? / Điều kiện nào có thể gây nền developer quá mức?","a":["developer applied too heavily / developer được phủ quá dày","proper drying / làm khô đúng","correct penetrant removal / loại bỏ penetrant đúng","adequate lighting / ánh sáng phù hợp"],"c":0,"e":"Lớp developer quá dày sẽ làm nền trắng quá mạnh."},{"q":"Why are PT inspection procedures standardized? / Vì sao quy trình PT được tiêu chuẩn hóa?","a":["to ensure consistent and reliable results / đảm bảo kết quả ổn định và đáng tin cậy","to reduce penetrant color / giảm màu penetrant","to increase weld thickness / tăng chiều dày mối hàn","to eliminate UV light / loại bỏ UV"],"c":0,"e":"Tiêu chuẩn hóa giúp các phép kiểm tra PT cho kết quả đồng nhất."},{"q":"What should inspectors do when uncertain about an indication? / Thanh tra nên làm gì khi không chắc chắn về một chỉ thị?","a":["perform additional evaluation or reinspection / đánh giá thêm hoặc kiểm tra lại","ignore the indication / bỏ qua chỉ thị","remove the developer immediately / loại bỏ developer ngay","increase rinse pressure / tăng áp lực rửa"],"c":0,"e":"Khi nghi ngờ, cần đánh giá bổ sung hoặc thực hiện lại kiểm tra."}]} ;



    // ================= TỪ ĐÂY TRỞ XUỐNG BẠN ĐỪNG CHẠM VÀO NHÉ =================
    let subjects = JSON.parse(localStorage.getItem('pro_subjects')) || {};
    
    // Logic: Nếu khách lạ vào (hoặc bị lỗi trang), hệ thống tự lấy đống F12 đổ ra cho họ xài
    if (Object.keys(subjects).length === 0) {
        subjects = KHO_DU_LIEU;
        localStorage.setItem('pro_subjects', JSON.stringify(subjects));
    }

    let currentSubject =[];
    let currentIdx = 0;
    let selectedOption = null;
    let results =[];

    function showScreen(id) {
        document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'home-screen') renderSubjects();
    }

    function renderSubjects() {
        const list = document.getElementById('subject-list');
        list.innerHTML = '';
        Object.keys(subjects).forEach(name => {
            const div = document.createElement('div');
            div.className = 'bg-card p-5 rounded-xl flex justify-between items-center';
            div.innerHTML = `
                <div>
                    <div class="font-bold text-lg text-blue-300">${name}</div>
                    <div class="text-sm text-slate-400">${subjects[name].length} Câu hỏi</div>
                </div>
                <div class="flex gap-3">
                    <button onclick="startQuiz('${name}')" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">Vào học</button>
                    <button onclick="deleteSub('${name}')" class="text-red-400 p-2"><i class="fas fa-trash"></i></button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function saveSubject() {
        const name = document.getElementById('subject-name').value;
        const json = document.getElementById('json-input').value;
        try {
            subjects[name] = JSON.parse(json);
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            showScreen('home-screen');
        } catch(e) { alert("Lỗi định dạng JSON!"); }
    }

    function startQuiz(name) {
        currentSubject = subjects[name];
        currentIdx = 0;
        results = new Array(currentSubject.length).fill(null);
        showScreen('quiz-screen');
        renderGrid();
        loadQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('question-grid');
        grid.innerHTML = '';
        currentSubject.forEach((q, i) => {
            const box = document.createElement('div');
            let extraClass = '';
            
            if (i === currentIdx) { extraClass = 'active'; } 
            else if (typeof results[i] === 'number') {
                if (results[i] === q.c) { extraClass = 'correct-nav'; } 
                else { extraClass = 'wrong-nav'; }
            } 
            else if (results[i] === 'skipped') { extraClass = 'skipped'; }

            box.className = `nav-box ${extraClass}`;
            box.innerText = (i + 1).toString().padStart(2, '0');
            box.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(box);
        });
    }

    function loadQuestion() {
        selectedOption = null;
        const q = currentSubject[currentIdx];
        document.getElementById('cur-idx-text').innerText = currentIdx + 1;
        document.getElementById('total-idx-text').innerText = currentSubject.length;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('hint-box').classList.add('hidden');
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const hasAnswered = typeof results[currentIdx] === 'number';

        q.a.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item p-4 rounded-lg flex items-center gap-3';
            div.innerHTML = `<div class="w-5 h-5 border-2 border-slate-500 rounded-full flex-shrink-0 flex items-center justify-center"></div> <span>${opt}</span>`;
            
            if (hasAnswered) {
                div.style.cursor = 'default';
                if (i === q.c) {
                    div.classList.add('correct');
                    div.querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
                }
                if (i === results[currentIdx] && i !== q.c) {
                    div.classList.add('wrong');
                    div.querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
                }
            } else {
                div.className += ' cursor-pointer';
                div.onclick = () => selectOption(div, i);
            }
            container.appendChild(div);
        });

        if (hasAnswered) { showHint(); }
        renderGrid();
    }

    function selectOption(el, i) {
        if (typeof results[currentIdx] === 'number') return;
        document.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('div').innerHTML = '';
        });
        el.classList.add('selected');
        el.querySelector('div').innerHTML = '<div class="w-full h-full bg-blue-500 rounded-full scale-75"></div>';
        selectedOption = i;
    }

    function checkAnswer() {
        if(selectedOption === null) return; 
        if(typeof results[currentIdx] === 'number') return; 

        const q = currentSubject[currentIdx];
        const items = document.querySelectorAll('.option-item');
        results[currentIdx] = selectedOption;
        
        if (selectedOption === q.c) {
            items[selectedOption].classList.add('correct');
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        } else {
            items[selectedOption].classList.add('wrong'); 
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
            items[q.c].classList.add('correct'); 
            items[q.c].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        }

        items.forEach(item => item.onclick = null);
        showHint();
        renderGrid();
    }

    function showHint() {
        const box = document.getElementById('hint-box');
        if(currentSubject[currentIdx].e) {
            box.innerText = "Gợi ý: " + currentSubject[currentIdx].e;
            box.classList.remove('hidden');
        }
    }

    function nextQuestion() {
        if(typeof results[currentIdx] !== 'number') { results[currentIdx] = 'skipped'; }

        if(currentIdx < currentSubject.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            let firstSkippedIndex = results.findIndex(r => r === 'skipped' || r === null);
            if(firstSkippedIndex !== -1) {
                currentIdx = firstSkippedIndex;
                loadQuestion();
                alert("🔄 Đã hết 1 lượt! Hệ thống tự động quay lại các câu bạn đã bỏ qua (ô màu vàng).");
            } else {
                alert("🎉 Tuyệt vời! Bạn đã hoàn thành toàn bộ câu hỏi trong bộ đề này.");
            }
        }
        renderGrid();
    }

    function prevQuestion() {
        if(currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function deleteSub(name) {
        if(confirm('Xóa môn này?')) {
            delete subjects[name];
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            renderSubjects();
        }
    }

    renderSubjects();
</script>
</body>
</html>
