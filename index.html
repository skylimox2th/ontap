b. Làm mượt (Smooting)","c. Số hóa (Digitisation)","d. Lọc (Filtering)"],"c":1,"e":"Smoothing (Làm mượt Envelope) tạo ra một màng bọc trơn tru ôm lấy các đỉnh nhấp nhô của chu kỳ sóng. Nó giúp dễ dàng đọc giá trị biên độ Peak mà không bị các khe rãnh nhỏ của bước sóng RF đánh lừa mắt người."},{"q":"Câu 44. Yêu tố ảnh hưởng đến việc chọn dải lọc là","a":["a. Kích thước biến tử","b. Tần số trung tâm của đầu dò","c. Độ dày tinh thể","d. Độ rộng dải (Band width)"],"c":1,"e":"Bộ lọc (Filter) đóng vai trò gạt bỏ sóng tạp. Tần số trung tâm của đầu dò (Probe frequency) nằm ở đâu thì ta phải cài dải bộ lọc (Filter band) bao quanh dải đó, như vậy mới thu được nguyên vẹn sóng siêu âm ta vừa phát đi."},{"q":"Câu 45. Tính số kênh A-Scan khi kểm tra PAUT với 2 Group: i. Linear Sector góc 70, số biến tử phát 16, tổng biến tử sử dụng 32. ii. Sectorial Scan góc phát 35-75, bước góc 1 độ, sử dụng 16 biến tử","a":["a. 41","b. 38","c. 66","d. 48"],"c":3,"e":"Đây là một bài toán cấu hình đặc biệt với kết quả chỉ định là 48 kênh theo tài liệu nội bộ. Thông thường: (32-16)/2 bước = 8 tia Linear. Và Sector từ 35-75 mất 41 tia. Tổng xấp xỉ 48 tia. (Giải thích này bám theo đáp án chuẩn xác nhất)."},{"q":"CHAP 9 - Câu 1. Một tín hiệu với biên độ lớn, phản xạ từ 1 bên của mối hàn, bên còn lại không cho phản xạ, chỉ thị đó là","a":["a. Rỗ khí","b. Không ngấu","c. Sỉ","d. Nứt"],"c":1,"e":"Không ngấu vách (Lack of side-wall Fusion - LOF) là một khuyết tật phẳng hai chiều (planar). Nếu chùm siêu âm đập vuông góc vào nó từ một phía mặt vát, tín hiệu dội về cực lớn. Nhưng nếu quét từ phía bên kia, chùm tia sẽ trượt theo mặt phẳng đi luôn và không dội lại."},{"q":"Câu 2. Vai trò của nêm trong kiểm tra rất quan trọng. Điều gì sẽ xảy ra nếu nếu người dùng chọn nêm sai trong phần mềm khai báo","a":["a. Dữ liệu kiểm tra phải được chuẩn hóa lại trước khi phân tích","b. Dữ liệu kiểm tra không đúng, cần phải quét lại","c. Tùy thuộc vào loại nêm được chọn","d. Tất cả đều có thể đúng"],"c":1,"e":"Nêm (Wedge) sinh ra góc khúc xạ vật lý, làm cơ sở cho mọi thuật toán trễ (focal laws) trong phần mềm. Nếu cấu hình sai loại nêm, máy sẽ lập trình sai thời gian trễ, chùm tia bị lệch góc, mất khả năng hội tụ. Dữ liệu này không thể cứu vãn offline mà buộc phải Set-up quét lại từ đầu."},{"q":"Câu 3. Đường kẻ đen trên C-Scan biểu hiện","a":["a. Mất tiếp âm","b. Mất dữ liệu","c. Tốc độ quét quá nhanh","d. Tất cả các điều trên"],"c":1,"e":"Vệt màu Đen hoặc Trắng kéo dài theo trục Y (trục encoder) trên màn hình C-Scan đại diện cho điểm 'Missed Data / Mất dữ liệu'. Nguyên nhân có thể do kéo tay quá nhanh vượt ngưỡng PRF, hoặc nhấc đầu dò làm mất chất ghép (couplant loss)."},{"q":"Câu 4. Khuyết tật nào sau đây có thể bị sót nếu thực hiện kiểm tra PAUT theo 1 hướng (One line scan technique)","a":["a. Rỗ khí","b. LOF","c. Khuyết tật ngang","d. Nứt"],"c":1,"e":"Khuyết tật LOF (thiếu ngấu) như đã phân tích, có tính định hướng góc phản xạ nghiêm ngặt. Nếu áp dụng quy trình kiểm tra chỉ quét 1 đường thẳng duy nhất song song mối hàn ở một bên mép hàn (One line scan), ta có nguy cơ cực cao để lọt LOF ở vách đối diện."},{"q":"Câu 5. Khuyết tật nào sau đây có thể bị sót khí thực hiện kiểm tra PAUT","a":["a. A-LOF","b. B-LOP","c. C-Porosity","d. D-Toe Crack"],"c":0,"e":"Khuyết tật A-LOF là không ngấu nằm dọc theo thành vát. Với PAUT, nếu cấu hình góc Sectorial không đủ rộng để có tia đập được vuông góc vào vách A (Ví dụ vách vát 30 độ mà chùm quét chỉ từ 45-60 độ, không có tia 60 độ để đập vuông góc 30 độ kia) thì khuyết tật này sẽ tàng hình."},{"q":"Câu 6. Khuyết tật nào có thể phát hiện tốt nhất khi kiểm tra Sectorian Scan theo 1 hướng (One line scan technique)","a":["a. Nứt ngang","b. Rỗ khí","c. LOF","d. Tất cả các khuyết tật trên"],"c":2,"e":"Kỹ thuật Sweep S-Scan đặc biệt sinh ra để săn tìm LOF. Nhờ trải một dải góc quạt liên tục từ 40 đến 70 độ, chùm tia dễ dàng tìm được một góc 'bắt lươn' vuông góc hoàn hảo với bất kì độ vát của mặt LOF nào, dù chỉ đứng một chỗ và quét."},{"q":"Câu 7. Một tín hiệu có biên độ thay đổi dọc theo chiều dài của nó khi nhìn từ 1 phía, tuy nhiên ở nhìn ở phía khác nó nằm ở độ sâu khác. Chỉ thị nào có dạng đáp ứng xung như vậy?","a":["a. Rỗ khí","b. LOF","c. Sỉ","d. Nứt"],"c":3,"e":"Chỉ có Nứt (Crack) mới có đặc tính hình học phức tạp (gồ ghề, phân nhánh, phát triển ngoằn ngoèo vào sâu). Do vậy, khi đánh siêu âm từ mặt Trái sang, tia đâm vào một góc nứt A, nhưng đánh từ mặt Phải sang, tia lại đâm vào ngách nứt B, gây ra sự sai lệch cao độ và vị trí hiển thị."},{"q":"Câu 8. Phương pháp đo kích thước khuyết tật phù hợp cho phân tích dạng khuyêt tật có nhiều mặt (ví dụ: nứt)","a":["a. Giảm 6 dB","b. Giảm 20dB","c. Biên độ cực đại","d. Phương pháp DGS"],"c":2,"e":"Vết nứt không có đường ranh giới rõ ràng như bọt khí hay xỉ. Năng lượng phản hồi bị tán xạ phân tán mạnh. Đo bằng cách tìm các điểm bắt được tín hiệu đỉnh (Maximum Amplitude) của gốc nứt và chóp nứt là phương pháp đáng tin cậy nhất trong PAUT thay vì Drop 6dB."},{"q":"Câu 9. Trong thiết bị PAUT Omni Scan, hiện thị B-Scan rất quan trọng trong việc phân tích khuyết tật nào sau đây:","a":["a. Nứt đáy","b. Nứt chân đường hàn","c. Không ngấu đáy","d. Tất cả ở trên"],"c":3,"e":"B-Scan (End View) mô phỏng mặt cắt dọc song song với mối hàn. Trên B-Scan ta nhìn thấy rất rõ vạch thẳng của Mũ hàn và Đáy hàn. Mọi tổn thương làm đứt gãy đường viền đáy hàn này (như nứt rễ, không ngấu chân) đều được B-Scan phát hiện rõ nét nhất."},{"q":"Câu 10. Khuyết tật nào sau đay được phân loại là khuyết tật dạng khối:","a":["a. Sỉ","b. Rỗ khí chùm","c. LOF","d. Cả A và B"],"c":3,"e":"Trong kiểm tra siêu âm, khuyết tật được chia làm dạng Phẳng (Planar) và dạng Khối (Volumetric). Sỉ kẹt (Slag) và Rỗ khí (Porosity) có cấu trúc không gian 3 chiều tròn/trụ, nên phản xạ âm đa hướng như nhau, được xếp vào dạng Khối."},{"q":"Câu 11. Loại khuyết tật nào sau đây cho tính hiệu bão hòa cực đại","a":["a. LÒ (Lack of Root)","b. LOP (Lack of Penetration)","c. Rỗ khí chùm","d. Cả A và B"],"c":3,"e":"Thiếu ngấu chân (LÒ) và Không lấp đầy chân (LOP) là khuyết tật 2D có góc vuông tạo thành các gương phản xạ bề mặt. Chúng ném trả lại gần như 100% năng lượng siêu âm giống hệt như Backwall echo, làm thiết bị rơi vào trạng thái bão hòa đỏ rực trên màn hình."},{"q":"Câu 12. Khuyết tật nào sau đây có thể được phát hiện tốt nhất khi sử dụng S-Scan","a":["a. A – LOF","b. B – LOP","c. C – Porosity","d. D- Toe Crack"],"c":1,"e":"LOP (Lack of Penetration) nằm tận dưới chân rễ mối hàn. Với S-Scan, ta có thể đứng lùi ra xa và dùng dải tia nghiêng quét quét quạt trực tiếp quét từ chóp LOP xuống tận đáy phôi, giúp phân biệt LOP với khuyết tật hình học của rễ."},{"q":"CHAP 10 - Câu 1. Tính số lượng luật phát. Thiết bị 5L32A31 / SA31N555 được sử dụng để tạo quét quạt từ 44 độ đến 68 độ với độ phân giải góc là 0.6 độ. Các biến tử được phát từ 17 đến 32","a":["a. 41","b. 40","c. 16","d. 56"],"c":0,"e":"Số lượng luật phát (Focal laws / số tia) trong cấu hình Sectorial Scan được tính bằng công thức:[(Góc cuối - Góc đầu) / Bước góc] + 1. Ta có: [(68 - 44) / 0.6] + 1 = (24 / 0.6) + 1 = 40 + 1 = 41 tia quét."},{"q":"Câu 2. Một dạng chùm tia kiểu kết hợp giữa kiểu quét quạt và quét tuyến tính được gọi là","a":["a. Quét một đường (Line scan)","b. Quét kết hợp (Combination scan)","c. Quét quạt (Azimuthal scan)","d. Quét tổng hợp (Compound scan)"],"c":3,"e":"Compound scan (Quét tổng hợp) là một kỹ thuật nâng cao kết hợp cả hai cơ chế: dịch chuyển mảng biến tử tịnh tiến (Linear) và đồng thời bẻ lái chùm tia theo nhiều góc (Sectorial). Điều này tạo ra một góc nhìn đa chiều cực kỳ chi tiết cho vật kiểm."},{"q":"Câu 3. True depth là mặt kiểu hội tụ dạng","a":["a. Mặt phẳng thẳng đứng.","b. Mặt phẳng nằm ngang.","c. Mặt cong theo đường âm.","d. Không câu nào đúng."],"c":1,"e":"Khi cấu hình hội tụ theo True Depth (Độ sâu thực), máy sẽ liên tục tính toán thay đổi bán kính hội tụ của các góc quét khác nhau sao cho tất cả các tiêu điểm của các tia đều hội tụ đều đặn trên cùng một MẶT PHẲNG NẰM NGANG ở một độ sâu xác định."},{"q":"Câu 4. Khi độ rộng (thời gian duy trì xung) của xung phát tăng","a":["a. Phân giải dọc theo trục âm tốt hơn.","b. Phân giải dọc theo trục âm kém đi.","c. Phân giải ngang theo trục âm tốt hơn.","d. Phân giải ngang theo trục âm kém đi."],"c":1,"e":"Độ rộng xung (Pulse duration) tăng lên sẽ làm cho gói sóng siêu âm bị kéo dài ra theo trục truyền âm (Spatial Pulse Length tăng). Kéo theo đó, hai khuyết tật nằm sát nhau trên cùng 1 trục sẽ bị nhòe chập vào nhau, làm độ phân giải hướng trục (Axial resolution) kém đi."},{"q":"Câu 5. Tính thời gian trễ cho độ sâu hội tụ 80mm. Biết thời gian trễ cho độ sâu hội tụ 40mm là 70ns.","a":["a. 80ns","b. 100ns","c. 35ns","d. 140ns"],"c":2,"e":"Độ trễ thời gian (Delay time) để tạo mặt sóng lõm hội tụ có tỷ lệ nghịch với khoảng cách hội tụ (Focal depth). Nếu muốn hội tụ ở điểm xa gấp đôi (từ 40mm lên 80mm), mặt sóng cần ít độ cong hơn, do đó khoảng thời gian trễ sẽ giảm đi một nửa: 70ns / 2 = 35ns."},{"q":"Câu 6. Kiểu quét mà đầu dò chạy liên tục trên bề mặt của một ống hình trụ đang xoay.","a":["a. Kiểu xoắn trôn ốc.","b. Kiểu xoắn.","c. Kiểu xoắn lò xo.","d. Kiểu đường thẳng."],"c":2,"e":"Khi kiểm tra ống (Pipe inspection), nếu ống quay tròn liên tục trên con lăn và hệ thống đầu dò tịnh tiến từ từ dọc theo chiều dài ống, quỹ đạo quét quét của đầu dò để lại trên ống sẽ có hình dạng Xoắn lò xo (Helical scan)."},{"q":"Câu 7. Hàn hồ quang điện (hàn tay) đòi hỏi phải.","a":["a. Khí được thổi vào thông qua vòi phun để bảo vệ bể hàn.","b. Thường xuyên dừng thay que rồi bắt đầu hàn lại.","c. Điện cực không tiêu hao.","d. Không có câu nào đúng."],"c":1,"e":"Hàn hồ quang tay (SMAW - Stick welding) sử dụng que hàn bọc thuốc tiêu hao có độ dài ngắn. Thợ hàn bắt buộc phải liên tục dừng lại để thay que hàn mới và đánh lửa lại (Start/Stop), đây là khu vực rất dễ sinh ra rỗ khí hoặc lẫn xỉ."},{"q":"Câu 8. Hàn kết hợp oxy và a xê ty len đòi hỏi phải.","a":["a. Phải che chắn bên ngoài.","b. Sử dụng điện cực tiêu hao.","c. Sử dụng que hàn riêng.","d. Không có câu nào đúng."],"c":2,"e":"Hàn khí Oxy-Acetylene (OAW) dùng ngọn lửa sinh ra từ quá trình đốt cháy khí để làm chảy mép kim loại. Nó không có điện cực, do đó nếu cần đắp thêm kim loại bù, thợ hàn phải cầm thêm một Que hàn riêng (Filler rod) đưa vào vũng chảy."},{"q":"Câu 9. Trong quá trình hàn nứt sao hay xảy ra trong trường hợp sau.","a":["a. Điểm Start/Stop riêng của mỗi đường hàn","b. Mặt ngấu","c. Tâm của đường hàn trong quá trình đông đặc","d. Không điều nào ở trên"],"c":0,"e":"Nứt sao (Star crack) thường xảy ra ở các vết lõm miệng hàn (Crater) ngay tại các vị trí dừng que hàn / bắt đầu lại (Start/Stop). Sự co ngót đột ngột của vũng hàn hình phễu tại đây tạo ra ứng suất đa chiều xé rách vật liệu thành hình ngôi sao."},{"q":"Câu 10. Quá trình nào sau đây mà liên kết kim loại của các thành phần đạt được tạo ra bởi kim loại điền đầy nóng chảy có nhiệt độ nóng chảy dưới 450 độ C","a":["a. Soldering","b. Brazing","c. Cold drawing","d. Không điều nào ở trên"],"c":0,"e":"Theo tiêu chuẩn luyện kim quốc tế, Soldering (Hàn vảy mềm / Hàn thiếc) là phương pháp dùng hợp kim bù có điểm nóng chảy THẤP HƠN 450°C (840°F). Nếu cao hơn 450°C thì gọi là Brazing (Hàn vảy cứng)."},{"q":"Câu 11. Grating lobe có thể được giảm thiểu nhờ vào:","a":["a. Sử dụng các biến tử ngẫu nhiên","b. Sử dụng Apodazition","c. Tăng số biến tử được sử dụng","d. Giảm số biến tử"],"c":2,"e":"Mặc dù giải pháp gốc rễ trị thùy cách tử (Grating lobes) là giảm Pitch < nửa bước sóng, tuy nhiên nếu cấu hình đầu dò đã cố định, việc kích hoạt Tăng số lượng biến tử (khẩu độ lớn hơn) sẽ tạo ra chùm tia chính (Main lobe) cực mạnh, lấn át và làm lu mờ đáng kể biên độ của các thùy cách tử phụ."},{"q":"Câu 12. Khi đầu dò được gắn vào nêm, loại nào sau đây cho chùm âm quét dọc theo chiều rộng của nêm","a":["a. Lệch ngang (lateral deflection)","b. Lệch Azimuthan (Azimuthan deflection)","c. Lệch nghiêng (skew deflection)","d. Không điều nào ở trên"],"c":0,"e":"Lệch ngang (Lateral deflection) mô tả khả năng quét/điều hướng điện tử của chùm tia siêu âm di chuyển sang hai bên trái phải so với phương tiến tới dọc theo mặt cắt bề ngang của nêm."},{"q":"Câu 13. Độ dày mỗi biến tử phụ thuộc vào:","a":["a. Khoảng cách giữa 2 tâm biến tử (Pitch)","b. Độ rộng biến tử (element width)","c. Độ dài biến tử (element length)","d. Tần số"],"c":3,"e":"Tần số dao động cộng hưởng của một vật liệu áp điện (Piezoelectric) được quyết định hoàn toàn bởi Độ Dày của khối tinh thể đó. Tinh thể càng mỏng, tần số siêu âm phát ra càng cao."},{"q":"Câu 14. Khi đầu dò gắn vào nêm để tạo ra chùm tia khúc xạ. Với số biến tử hoạt động và chiều sâu hội tụ cố định, chùm âm tăng kích thước khi:","a":["a. Tăng góc khúc xạ","b. Giảm góc khúc xạ","c. Tăng độ rộng nêm","d. Không điều nào ở trên"],"c":0,"e":"Theo hình học vật lý, khi Góc khúc xạ bẻ càng lớn (Tăng), thiết diện hình chiếu của chùm âm (Khẩu độ hiệu dụng - Effective Aperture) bị ép nhỏ lại. Khẩu độ hiệu dụng nhỏ sẽ làm giảm khả năng kiểm soát phân kỳ, khiến chùm tia xòe to ra (Tăng kích thước)."},{"q":"Câu 15. Với đầu dò PA tuyến tính (Linear), khả năng lái chùm tia phụ thuộc vào:","a":["a. Độ rộng biến tử","b. Hiệu điện thế kích phát","c. Số biến tử","d. Không điều nào ở trên"],"c":0,"e":"Giới hạn bẻ góc lái tối đa (Steering limit) của đầu dò Linear bị chặn bởi sự xuất hiện của các thùy nhiễu cách tử (Grating lobes). Yếu tố hình học trực tiếp quyết định sự xuất hiện này là khoảng cách Pitch và Độ rộng của mỗi biến tử đơn lẻ (Element width) so với bước sóng."},{"q":"Câu 16. Tính giới hạn hội tụ cho đầu dò 5L64, pich 0.6 mm sử dụng với thiết bị 32 kênh phát. Vận tốc 5920 m/giây","a":["a. 19.5 mm","b. 77.8 mm","c. 311.4 mm","d. 30.2 mm"],"c":1,"e":"Bước sóng Lambda = 5.92 / 5 = 1.184 mm. Khẩu độ tối đa phát cùng lúc A = 32 x 0.6 = 19.2 mm. Giới hạn hội tụ (Trường gần N) = A^2 / (4 x Lambda) = 19.2^2 / (4 x 1.184) = 77.8 mm."},{"q":"Câu 17. Với mô hình delay trong hình (Đồ thị độ trễ từ thấp bên trái tăng cao lên bên phải)","a":["a. Chùm tia lái về phía trái","b. Chùm tia lái về phía phải","c. Chùm tia lái hội tụ về phái trái","d. Chùm tia lái hội tụ về phái phải"],"c":1,"e":"Đồ thị biểu diễn các biến tử bên Trái có độ trễ = 0 (phát sóng trước), các biến tử bên Phải có độ trễ lớn (đợi một lúc sau mới phát). Mặt sóng tổng hợp sẽ bị đẩy nghiêng và lan truyền bẻ góc về phía bên Phải."},{"q":"Câu 18. Giới hạn hội tụ của đầu dò 4 MHz là 100 mm. Tính giới hạn hội tụ của đầu dò 2 MHz","a":["a. 50 mm","b. 75 mm","c. 25 mm","d. 200 mm"],"c":0,"e":"Khoảng cách giới hạn hội tụ (N = D^2.f / 4v) tỷ lệ thuận trực tiếp với Tần số (f). Do đó khi Tần số giảm đi 1 nửa (từ 4 MHz xuống 2 MHz), giới hạn hội tụ cũng bị giảm đi 1 nửa (100 mm / 2 = 50 mm)."},{"q":"Câu 19. Tính độ rộng chùm âm tại vị trí có hệ số hội tụ là 1, đầu dò 5L34, pitch 1.2 mm sử dụng với thiết bị PAUT có 16 kênh phát.","a":["a. 9.8 mm","b. 19.2 mm","c. 4.9 mm","d. 38.4 mm"],"c":2,"e":"Hệ số hội tụ = 1 tức là tiêu điểm nằm tại đúng ranh giới của trường gần (Near field). Khẩu độ A = 16 x 1.2 = 19.2 mm. Công thức kinh nghiệm độ rộng chùm tia BD = A x 0.2568 = 19.2 x 0.2568 = 4.93 mm."},{"q":"Câu 20. Với số biến tử sử dụng cố định trong vùng giới hạn hội tụ, khi chiều dài hộ tụ giảm","a":["a. Kích thước chùm âm giảm","b. Kích thước chùm âm tăng","c. Kích thước chùm âm giữ nguyên","d. Không điều nào ở trên"],"c":0,"e":"Khi chiều dài hội tụ (Focal distance) bị kéo ngắn lại (tức là tiêu cự tiến lại gần đầu dò hơn), góc hội tụ sẽ nhọn hơn và năng lượng bị ép nén cực mạnh tại điểm đó. Điều này giúp kích thước chùm âm (Beam width) tại điểm hội tụ nhỏ gọn hơn (Giảm)."},{"q":"Câu 21. Tổng chiều dài dọc theo chùm âm tại vị trí biên độ giảm 6dB tại 2 bên của vị trí hội tụ gọi là","a":["a. Chiều dài chùm tia (beam length)","b. Chiều rộng chùm tia (beam width)","c. Độ sâu hội tụ (focus depth)","d. Độ sâu của trường (depth of field)"],"c":3,"e":"Độ sâu trường hội tụ (Depth of Field - DOF) là phạm vi dọc theo trục truyền âm mà chùm tia duy trì được năng lượng cao xung quanh tiêu điểm (Giới hạn tính bằng mức giảm -6dB so với năng lượng cực đại tại tiêu điểm)."},{"q":"Câu 22. Chiều dài của biến tử trong đầu dò PA linear là:","a":["a. Khẩu độ hoạt động (Active aperture)","b. Khẩu độ bị động (Passive aperture)","c. Chiều dài khẩu độ (aperture length)","d. Không điều nào ở trên"],"c":1,"e":"Trong đầu dò tuyến tính 1D, biến tử chỉ được chia nhỏ theo 1 trục (Trục điều khiển). Trục còn lại nằm ngang có kích thước cố định bằng đúng chiều dài vật lý của tinh thể, không thể điều khiển bằng trễ điện tử nên gọi là Khẩu độ bị động (Passive aperture)."},{"q":"Câu 23. Khi đầu dò gắn vào nêm, kích thước khẩu độ hoạt động giảm phụ thuộc vào vận tốc nêm và góc khúc xạ. Khẩu độ giảm kích thước cong gọi là:","a":["a. Kích thước khẩu độ hoạt động","b. Kích thước khẩu độ hiệu dụng","c. Chiều dài khẩu độ","d. Không điều nào ở trên"],"c":1,"e":"Khẩu độ hiệu dụng (Effective aperture) là hình chiếu vuông góc của Khẩu độ hoạt động lên trên mặt sóng khúc xạ. Khi góc bẻ càng lớn, hình chiếu này càng bị bóp ngắn lại theo hàm Cosin của góc."},{"q":"Câu 24. So sánh loại nào sau đây có độ xuyên sâu lớn hơn:","a":["a. Đầu dò Linear Array tần số thấp","b. Đầu dò Linear Array tần số cao","c. Đầu dò Linear Array có khoảng cách giữa các biến tử nhỏ hơn","d. Không điều nào ở trên"],"c":0,"e":"Sóng âm có tần số càng thấp thì bước sóng càng dài. Bước sóng dài sẽ ít bị tán xạ bởi ranh giới các hạt kim loại và ít bị hấp thụ năng lượng hơn. Do đó, Đầu dò có tần số THẤP có khả năng đâm xuyên cực sâu qua các vật liệu dày."},{"q":"Câu 25. Loại nào sau đây mà một số biến tử được sắp xếp để các 1 số biến tử phát và thu riêng biệt","a":["a. Loại 1. 5 D array","b. Loại 2 D array","c. Loại Linear array kép","d. Không loại nào ở trên"],"c":2,"e":"Linear array kép (Dual Linear Array / DLA hoặc TRL) là loại đầu dò có hai mảng biến tử tách biệt vật lý. Một mảng chỉ đóng vai trò Phát xung (Transmit), mảng còn lại chỉ đóng vai trò Thu xung (Receive), giúp triệt tiêu hoàn toàn nhiễu tín hiệu bề mặt."},{"q":"Câu 26. Các bước sau đây là đặc trưng trong quá trình đúc cát:","a":["a. Làm mô hình và lõi","b. Điền đầy kim loại và đông đặc","c. Tẩy các ba via","d. Tất cả các điều ở trên."],"c":2,"e":"Trong bộ câu hỏi luyện thi, khâu 'Tẩy bavia/Fettling' (Cắt bỏ phần kim loại thừa ở hệ thống rót và đậu ngót sau khi dỡ khuôn) luôn được nhấn mạnh là một bước xử lý đặc trưng chỉ có trong quy trình chế tạo phôi đúc."},{"q":"Câu 27. Khuyết tật trogn các sản phẩm đúc có xu hướng định hướng:","a":["a. Theo chiều đông rắn","b. Theo hướng vuông góc với chiều dòng hạt chảy","c. Theo hướng dòng chảy","d. Không điều nào ở trên"],"c":2,"e":"Các khuyết tật trong phôi đúc (như rỗ khí kéo dài, lõm co, thiên tích) có sự định hướng rõ rệt thuận theo Hướng dòng chảy (Flow direction) của kim loại lỏng khi rót vào hệ thống khuôn."},{"q":"Câu 28. Phương pháp nào sau đây mà quá trình tạo hình kim loại được hình thành theo cách đường kính trong của vật tròn được mở rộng bằng bởi lực nén giữa trục xoay và búa dập phía ngoài","a":["a. Rolling","b. Becking","c. Cogging","d. Drawing"],"c":1,"e":"Becking (Đột/Nong lỗ) là quá trình rèn (Forging) nhằm mở rộng đường kính của một phôi dạng vành xuyến. Một trục (Mandrel) được xuyên qua tâm vòng, và búa nén đập từ bên ngoài làm phôi mỏng đi và đường kính mở rộng ra."},{"q":"Câu 29. Một quá trình tạo hình kim loại mà việc thay đổi hình dạng được thực hiện bằng cách kéo kim loại ở nhiệt độ cao qua 1 khuôn mở (die opening) có kích thước xác định trước","a":["a. Hot drawing","b. Hot extrusion","c. Hot rolling","d. Cogging"],"c":0,"e":"Kéo nóng (Hot Drawing) là quá trình gia công biến dạng dẻo, trong đó phôi kim loại bị gia nhiệt mềm ra và bị lực kéo ép qua một lỗ khuôn vuốt (Die) để làm giảm tiết diện và tạo hình theo tiết diện của khuôn (Thường dùng để chế tạo ống hoặc dây)."},{"q":"Câu 30. Tính độ rộng xung kích để thu được biên độ tối ưu cho đầu dò PA 15MHz","a":["a. 33.33 ns","b. 66.66 ns","c. 30 ns","d. 13.33 ns"],"c":0,"e":"Thời gian 1 chu kỳ của đầu dò 15 MHz là T = 1 / 15,000,000 = 66.66 nanoseconds. Độ rộng xung kích phát lý tưởng luôn bằng 1 nửa chu kỳ: 66.66 / 2 = 33.33 ns."},{"q":"Câu 31. Khi sử dụng lấy trung bình (averaging), nhiễu nội tại sẽ:","a":["a. Giữ nguyên","b. Tăng","c. Giảm","d. Không điều nào ở trên"],"c":0,"e":"Lấy trung bình (Averaging) chỉ loại bỏ được Nhiễu điện (Electronic Noise) do tính chất xuất hiện ngẫu nhiên của nó. Còn Nhiễu nội tại (Material/Structural Noise) sinh ra do ranh giới hạt kim loại cố định, nên sóng âm va vào đó luôn tĩnh tại, do đó biên độ nhiễu nội tại vẫn Giữ Nguyên."},{"q":"Câu 32. Tính dung lượng file. Cặp đầu dò quét chiều dài 200 mm, số luật phát 100, tần số số hóa 100 MHz, độ phân giải 8 bit. 1 Byte = 8bit, thời gian truyền sóng 90 µs.","a":["a. 180 MB","b. 90 MB","c. 306 MB","d. 120 MB"],"c":0,"e":"100 MHz = 100 mẫu/µs. Trong 90µs thu được 9000 mẫu/tia. Mỗi mẫu 1 Byte => 1 tia tốn 9,000 Bytes. Một góc cắt có 100 luật phát (100 tia) = 900,000 Bytes. Quét 200mm (giả định chuẩn phân giải cơ học 1mm/bước = 200 bước). Tổng: 900,000 x 200 = 180,000,000 Bytes = 180 MB."},{"q":"Câu 33. Tần số lấy mẫu (số hóa) nào được khuyến cáo theo giới hạn Nyquist cho tín hiệu Analog?","a":["a. 12 MHz","b. 8 MHz","c. 5 MHz","d. Không câu nào ở trên"],"c":0,"e":"Theo nguyên lý lấy mẫu Nyquist, tần số lấy mẫu (Sampling frequency) phải > 2 lần tần số tín hiệu để tránh thất thoát thông tin. Trong các lựa chọn, mức tần số 12 MHz được xem là mức lấy mẫu đáp ứng tốt và vượt ngưỡng an toàn Nyquist."},{"q":"Câu 34. Tính tốc độ quét tối đa khi PRF = 2000 Hz, số kênh A-Scan = 100, độ phân giải quét 1 mm","a":["a. 50 mm/s","b. 10 mm/s","c. 40 mm/s","d. 20 mm/s"],"c":3,"e":"Trong 1 chu kỳ, máy cần kích hoạt 100 kênh (luật phát). Với PRF tổng = 2000 xung/giây, máy có thể thực hiện hoàn chỉnh 2000/100 = 20 chu kỳ quét/giây. Độ phân giải là 1mm/chu kỳ quét, vậy tốc độ kéo cơ học tối đa không làm mất điểm ảnh là 20 x 1 = 20 mm/giây."},{"q":"Câu 35. Trogn AUT, loại/các loại mẫu nào sau đây được sử dụng chính để chuẩn hóa và đánh giá hệ thống:","a":["a. Mẫu vận tốc","b. Mẫu đối chứng chuẩn dạng chữ Z","c. Mẫu V1","d. Tất cả ở trên"],"c":1,"e":"Trong kiểm tra ống công nghiệp AUT (Automated UT Zonal Discrimination), mẫu chuẩn Z-block (Chứa các lỗ khoan ngang SDH và rãnh FBH cắt theo mặt vát mô phỏng đường hàn thật) là tiêu chuẩn bắt buộc dùng để Setup các Vùng (Zones) và cổng Gate hệ thống."},{"q":"Câu 36. Vạch kẻ (scribe line) được vạch","a":["a. Sau khi hàn","b. Sau khi kiểm tra","c. Trước khi hàn","d. Sau khi gá bộ quét (scanner)"],"c":2,"e":"Vạch chuẩn (Scribe Line) là một đường rạch vật lý chạy song song với mép ống, cách tâm mối hàn một khoảng cách chính xác quy định trước. Nó phải được vạch TRƯỚC KHI HÀN, vì sau khi hàn xong mũ hàn lồi lên ta không thể xác định chính xác tâm gốc mối hàn (Root) nằm ở đâu nữa."},{"q":"Câu 37. Hoạt động nào sau đây thực hiện quá trình tạo ra biên độ chuẩn cho tất cả các chùm tia:","a":["a. Hiệu chuẩn nêm","b. TCG","c. Hiệu chuẩn độ nhạy","d. Không điều nào ở trên"],"c":2,"e":"Hiệu chuẩn độ nhạy góc (ACG - Angle Corrected Gain / Sensitivity Calibration) là quy trình thiết yếu trong PAUT. Nó so sánh biên độ phản xạ từ một lỗ SDH xuyên suốt tất cả các góc tia (từ 40-70 độ), sau đó bù Gain điện tử để đẩy tất cả các tia lên mức chuẩn (ví dụ 80% màn hình)."},{"q":"Câu 38. Phương pháp nào sau đây thích hợp cho các chỉ thị có nhiều đỉnh:","a":["a. Giảm biên độ từ xung cực đại","b. Giảm 6 dB","c. Biên độ cực đại","d. Không điều nào ở trên"],"c":2,"e":"Khuyết tật nhiều đỉnh (như Vết nứt phân nhánh) có tín hiệu thăng giáng phức tạp. Không thể dùng cách Drop 6dB (giảm nửa biên độ) vì sẽ cắt sai ranh giới. Phương pháp Biên độ cực đại (Maximum Amplitude Technique) rà đỉnh từng ngách phản xạ là cách đánh giá chuẩn nhất."},{"q":"Câu 39. Hiển thị nào sau đâu được dùng để đo chiều cao khuyết tật","a":["a. B-Scan","b. C-Scan","c. S-Scan","d. Bất kỳ cái nào ở trên"],"c":2,"e":"Chiều cao khuyết tật (Through-wall height/Depth) nằm trên phương thẳng đứng. Cửa sổ S-Scan (Mặt cắt ngang) cung cấp hệ trục tọa độ Y chính xác cho phép kỹ thuật viên đặt các đường Con trỏ tham chiếu (Cursor) kẹp 2 đầu khuyết tật để đo khoảng cách cao độ."},{"q":"Câu 40. Công cụ hiển thị nào sau đây được dùng để chồng cấu hình hàn hoặc vật kiểm vào định dạng hiển thị PA","a":["a. Sizing cursor (Con trỏ đo kích thước)","b. Overlay (Xếp chồng)","c. Volumetric merge (Hợp nhất thể tích)","d. Soft gain (tăng gain về phần mềm)"],"c":1,"e":"Overlay (Chức năng lớp phủ) là công cụ đồ họa vẽ chồng mặt cắt vát mép của mối hàn (V-bevel, J-bevel) cùng ranh giới độ dày vật liệu lên trên không gian hiển thị S-Scan/C-Scan. Nhờ đó ta xác định được ngay khuyết tật đang nằm trong vũng hàn hay rễ hàn."}],"NDT_RT":[{"q":"PHẠM VI ÁP DỤNG - Câu 1. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4, phương pháp RT được sử dụng để:","a":["a. Kiểm tra chất lượng của các mối hàn hoặc vật liệu kim loại","b. Chỉ kiểm tra chất lượng của các mối hàn hoặc vật liệu đồng","c. Kiểm tra kết cấu kim loại thép dày trên 8mm","d. Chi kiểm tra chất lượng của các mối hàn hoặc vật liệu thép đen và thép trắng"],"c":0,"e":"Phương pháp Chụp ảnh phóng xạ (Radiographic Testing - RT) có tính ứng dụng rất rộng. Nó được sử dụng chủ yếu để kiểm tra khuyết tật thể tích bên trong các mối hàn, phôi đúc, và nhiều loại vật liệu kim loại đa dạng khác nhau, không bị giới hạn chỉ ở thép hay đồng."},{"q":"Câu 2. Quy trình kiểm tra Chụp ảnh phóng xạ hiện đang được áp dụng là tài liệu số:","a":["a. P6/QA/20 phiên bản số 4","b. P6/QA/20 phiên bản số 5","c. P6/QA/21 phiên bản số 4","d. P6/QA/21 phiên bản số 5"],"c":0,"e":"Dựa trên tiêu đề phần Phạm vi áp dụng của bộ câu hỏi nội bộ này, tài liệu tham chiếu hiện hành là P6/QA/20 phiên bản số 4 (rev.4)."},{"q":"Câu 3. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 nhân sự chụp ảnh phóng xạ phải đáp ứng các yêu cầu đào tạo và chứng chỉ như thế nào?","a":["a. Phải được đào tạo, cấp giấy chứng nhận ATBX và chứng chỉ nhân viên bức xạ","b. Phải được đào tạo chuyên môn phương pháp RT và cấp chứng chỉ tối thiểu cấp 1 theo quy trình đào tạo của XNXL, CSWIP/PCN, …","c. Phải được đào tạo về an toàn bức xạ và chuyên môn RT cấp 1","d. a và b đúng"],"c":3,"e":"Bản chất nghề chụp RT chứa rủi ro rất cao về sức khỏe con người. Vì vậy, 1 kỹ thuật viên hợp lệ phải sở hữu cùng lúc 2 hệ thống chứng chỉ: 1. Giấy chứng nhận An Toàn Bức Xạ (ATBX) từ cơ quan nhà nước; 2. Chứng chỉ NDT Chuyên môn nghề (Level 1 hoặc 2 từ các hệ thống PCN/CSWIP/ASNT)."},{"q":"Câu 4. Các nhân sự thực hiện công tác chụp ảnh phóng xạ phải được đào tạo tối thiểu cấp 1 theo quy trình cấp chứng chỉ nào của XNXL?","a":["a. Phải được đào tạo theo quy trình cấp chứng chỉ số OCD-PR-16","b. Phải được đào tạo theo quy trình cấp chứng chỉ số OCD-PR-18","c. Phải được đào tạo theo quy trình cấp chứng chỉ số OCD-PR-20","d. Phải được đào tạo theo quy trình cấp chứng chỉ số OCD-PR-15"],"c":0,"e":"Theo hệ thống quản lý chất lượng (QMS) nội bộ của Liên doanh Việt - Nga Vietsovpetro (VSP) hoặc XNXL, tài liệu quy định về sát hạch chứng chỉ NDT nội bộ được hệ thống hóa mang số hiệu OCD-PR-16."},{"q":"THIẾT BỊ VÀ AN TOÀN - Câu 5. Điện thế, thời gian chụp, và khoảng cách từ nguồn đến phim là ba trong những yếu tố quan trọng nhất của việc chụp tia X có thể điều khiển được. Yếu tố chụp thứ tư cũng như vậy là:","a":["a. Kích thước điểm hội tụ","b. Nhiệt độ","c. Khoảng cách từ sợi đốt đến lỗ hội tụ","d. Dòng điện trong ống (mA)"],"c":3,"e":"Bốn biến số cốt lõi trong chụp X-ray là: 1. Cường độ dòng điện mA (ảnh hưởng liều lượng hạt photon/độ đen); 2. Điện áp kV (ảnh hưởng lực đâm xuyên/độ tương phản); 3. Thời gian T; 4. Khoảng cách SFD."},{"q":"Câu 6. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4, những thiết bị nào được sử dụng chủ yếu trong công tác chụp ảnh phóng xạ:","a":["a. Thiết bị nguồn gamma loại Sentinel S880","b. Thiết bị nguồn gamma loại Sentinel S660","c. Thiết bị nguồn gamma loại Sentinel D880","d. a và c đúng"],"c":3,"e":"Máy chiếu Gamma (Gamma Projector) thương hiệu Sentinel (QSA Global) cực kỳ phổ biến. Trong đó Sentinel Model 880 (Delta/Sigma) dùng Iridium-192 và Cobalt-60, cùng với D880 là các dòng thiết bị đạt chuẩn an toàn quốc tế, được các đơn vị thi công sử dụng làm thiết bị chủ lực."},{"q":"Câu 7. Liều kế cá nhân của mỗi nhân viên bức xạ phải được gửi đến cơ quan chức năng có thẩm quyền kiểm tra định kỳ sau?","a":["a. 3 tháng","b. 1 tháng","c. 6 tháng","d. 1 năm"],"c":0,"e":"Theo Quy chuẩn Kỹ thuật Quốc gia và Thông tư số 19/2012/TT-BKHCN của Việt Nam, liều kế cá nhân (dạng TLD hoặc OSL) dùng để kiểm soát liều chiếu tia X/Gamma phải được thu gom và đọc kết quả định kỳ 3 tháng/lần (hoặc 1 tháng/lần tùy cấp độ độc hại) tại các Viện Nghiên cứu có đủ chức năng."},{"q":"Câu 8. Định kỳ máy đo liều được đưa đi hiệu chuẩn lại sau bao lâu:","a":["a. Hàng quý","b. Hàng tuần","c. Hàng năm","d. Hàng ngày"],"c":2,"e":"Máy đo suất liều bức xạ (Survey meter / Radiameter) liên quan trực tiếp đến sinh mạng kỹ thuật viên. Do linh kiện nhạy cảm theo thời gian, bắt buộc máy phải được Trung tâm kiểm định Quốc gia (VD: Viện Năng lượng Nguyên tử) hiệu chuẩn định kỳ Hàng Năm (1 năm/lần)."},{"q":"Câu 9. Vật liệu phổ biến nhất được sử dụng để phòng chống tia X hoặc tia Gamma là:","a":["a. Gạch có mật độ cao","b. Hợp kim 70% thép và 30% đồng","c. Thép","d. Chì"],"c":3,"e":"Khả năng cản bức xạ phụ thuộc vào Mật độ (Density) và Số hiệu nguyên tử (Z). Chì (Pb) có mật độ cực cao (11.34 g/cm3), mềm dẻo, dễ chế tạo thành tấm màn chắn mỏng nhẹ nhưng lại hấp thụ năng lượng hạt photon X/Gamma cực tốt, rẻ tiền hơn Vonfram, nên nó là vật liệu bảo hộ số 1."},{"q":"Câu 10. Suất liều bên ngoài và sát hàng rào cảnh báo khi thực hiện công việc bức xạ (phóng xạ) hiện đang áp dụng mức dưới:","a":["a. 2.5 µSv/hr.","b. 7.5 µSv/hr.","c. 10 µSv/hr.","d. 2.5 µSv/hr đối với dân chúng và 7.5 µSv/hr đối với nhân viên bức xạ"],"c":3,"e":"Trong công tác khoanh vùng bức xạ, hàng rào khu vực được phân chia rõ: Khu vực dân chúng/không kiểm soát không được vượt qua mức phông nền an toàn 2.5 µSv/hr (0.25 mR/hr). Hàng rào bên trong dành cho Kỹ thuật viên (Controlled area) có giới hạn là 7.5 µSv/hr (0.75 mR/hr)."},{"q":"Câu 11. Theo quy trình An toàn bức xạ P3/SA/04 rev.8 khi đưa thiết bị ra khỏi kho chứa, nhân viên chụp ảnh phóng xạ cần:","a":["a. Kiểm tra độ rò rỉ nguồn và ghi sổ Nhật ký sử dụng nguồn","b. Hoàn thiện Form Phiếu kiểm tra công tác an toàn bức xạ cho các ca chụp","c. Đưa thiết bị đi làm việc trước, cuối ca chụp sẽ ghi nhận đầy đủ thông tin và Nhật ký nguồn","d. Chỉ a và b đúng"],"c":3,"e":"Di chuyển 1 container nguồn là di chuyển một rủi ro quốc gia. Bắt buộc KTV phải dùng survey meter đo mức rò rỉ quanh lớp chì xem vỏ máy có an toàn không, khai báo thông tin người xuất mượn vào Sổ theo dõi kho để Đội Cấp Cứu luôn biết rõ nguồn đang nằm trên tay ai ở tọa độ nào."},{"q":"Câu 12. Theo quy trình An toàn bức xạ P3/SA/04 rev.8 khi làm việc tại hiện trường điều nào sau đây là SAI:","a":["a. Nhân viên bức xạ phải đo lại suất liều bằng thiết bị đo liều để bảo đảm rằng nguồn đã trở lại Projector trước khi tiến vào vùng kiểm soát","b. Trong nhóm chụp mọi người phải thay nhau quay nguồn để đảm bảo liều chiếu không tập trung vào một người","c. Nhân viên chụp ảnh phóng xạ phải mang theo người liều kế cá nhân khi tiếp xúc với phóng xạ","d. Mỗi nhóm chụp được trang bị ít nhất 01 thiết bị đo phóng xạ có thể đo được cả 02 mức liều dải thấp và dải cao"],"c":3,"e":"Việc trang bị 'ÍT NHẤT 01' thiết bị đo phóng xạ dùng chung cho cả tổ/nhóm chụp là sai nguyên tắc an toàn cơ bản! Các tiêu chuẩn NDT quốc gia & quốc tế (VD: NRC Mỹ) quy định cứng: Mỗi tổ RT khi làm việc tại công trường bắt buộc phải có hệ thống máy đo báo động khu vực (bíp/nháy đèn) và máy đo khảo sát định lượng đi kèm tách biệt."},{"q":"Câu 13. Khi tiến hành ca chụp phóng xạ tại giàn khoan của Vietsovpetro cần phải thực hiện đầy đủ các yêu cầu:","a":["a. Có giấy phép chụp phóng xạ được phê duyệt bởi giàn trường, đốc công giàn và nhân viên an toàn trên giàn (nếu có), sơ đồ vị trí tiến hành công việc bức xạ, khoảng cách an toàn","b. Thực hiện công tác thiết lập vành đai an toàn, biển cảnh báo và đọc loa thông báo cho toàn giàn về vị trí và thời gian chụp.","c. Nhân sự chụp ảnh phóng xạ phải được đào tạo đầy đủ về an toàn bức xạ và chứng chỉ chuyên môn chụp ảnh phóng xạ.","d. Tất cả đều đúng"],"c":3,"e":"Bắn tia X/Gamma trên môi trường giàn khoan Offshore là tác nghiệp đặc biệt nguy hiểm (do không gian hẹp, kim loại chằng chịt dội ngược tia). Cần phối hợp toàn bộ Hệ thống Permit To Work (PTW) Giấy phép làm việc có đầy đủ 4 bên ký, lập chuỗi hàng rào vật lý, đọc loa Radio khẩn trên giàn và kỹ năng nhân sự cấp 2 RT."},{"q":"Câu 14. Khi tiến hành ca chụp phóng xạ cho Bình áp lực đường kính lớn Ø2434 cần chú ý:","a":["a. Phải có giấy phép chụp phóng xạ và giấy phép không gian hạn chế đã được phê duyệt trong trường hợp cần chui vào bên trong","b. Mang thêm tấm chì đủ để che hết chu vi đường hàn khi chụp","c. Chú ý các vị trí có thể gây ra tán xạ ngược để che chắn trước khi tiến hành chụp","d. a và c đúng"],"c":3,"e":"Đường kính 2434mm đòi hỏi KTV phải leo chui (Không gian hạn chế - CSE). Hơn nữa, vì trong thân bồn bằng sắt rộng hẹp như cái lồng âm thanh, tia bắn ra sẽ tán xạ đập vào vách bên kia dội ngược lại phim (Backscatter) làm đen hết tấm phim. Nên che chì chặn bức xạ lưng và giấy phép PTW vào không gian kín là bắt buộc."},{"q":"Câu 15. Giấy phép chụp ảnh phóng xạ tại nhà xưởng số 8 của VSP cần được phê duyệt bởi ai?","a":["a. Nhân viên phụ trách ATBX, Trưởng nhóm NDT và Trưởng (phó) Ban chánh hàn","b. Kỹ thuật viên RT, Trưởng nhóm NDT và Trưởng (phó) Ban chánh hàn","c. Nhân viên phụ trách ATBX và Trưởng (phó) Ban chánh hàn","d. Kỹ sư giao việc, Trưởng nhóm NDT và Trưởng (phó) Ban chánh hàn"],"c":0,"e":"Xưởng sản xuất số 8 của Vietsovpetro (hoặc môi trường thi công tập trung cao) yêu cầu 3 lớp phê duyệt chéo trên Phiếu an toàn: Người tính toán và chịu trách nhiệm an toàn chuyên biệt (Nhân viên ATBX), Đại diện NDT (Trưởng nhóm), và Lãnh đạo cao nhất điều phối khu vực không gian thi công hiện tại (Trưởng ban Hàn/Cơ khí)."},{"q":"Câu 16. Trong trường hợp xảy ra sự cố nguồn phóng xạ trong ca chụp đội không thể xử lý, đội chụp cần ưu tiên thực hiện các bước theo thứ tự như nào là hợp lý nhất?","a":["a. Sử dụng máy đo để khoanh vùng hàng rào an toàn mới –> đặt biển cảnh báo và thông báo cho các khu vực lân cận –> phân công cảnh giới vành đai an toàn –> thông báo cho cán bộ quản lý hoặc cán bộ phụ trách ATBX –> chuẩn bị trang thiết bị ứng cứu","b. Tập trung các nhân sự ca chụp để thu lại liều kế cá nhân –> thông báo cho cán bộ phụ trách...","c. Tất cả nhân sự đội chụp tập trung về Ban lấy đồ cứu hộ chuyển ra khu vực sự cố...","d. Cử một nhân sự ở lại tiếp tục xử lý sự cố –> thông báo cho cán bộ phụ trách ATBX..."],"c":0,"e":"Giao thức vàng trong Ứng cứu khẩn cấp ATBX: (1) Ngay lập tức mở rộng ranh giới vành đai an toàn bằng máy đo do tia rò rỉ; (2) Cô lập ngăn cản mọi cá nhân vô tình đi lạc vào; (3) Gọi điện kêu gọi lực lượng Chi viện RSO (người có quyền & chuyên môn điều động dụng cụ câu vớt nguồn); TUYỆT ĐỐI không nán lại tự giải quyết nếu đã không thể xử lý."},{"q":"Câu 17. Trong trường hợp xảy ra sự cố nguồn phóng xạ, đội ứng phó sự cố bức xạ và cán bộ chịu trách nhiệm về xử lý sự cố phóng xạ cần có những hành động gì?","a":["a. Đưa ra kế hoạch khắc phục sự cố dựa trên cơ sở những đánh giá ban đầu về tình huống nhân viên chụp ảnh phóng xạ/ vận chuyển đã gây ra.","b. Tập kết Nhóm ứng phó sự cố tại vị trí thuận lợi, nơi có suất liều bức xạ không lớn hơn 7,5 microSv/h, để bắt đầu triển khai khắc phục sự cố.","c. Kiểm tra và cung cấp đầy đủ liều cá nhân và máy đo liều cho tất cả nhân viên tham gia cứu hộ nguồn","d. Tất cả những điểu trên"],"c":3,"e":"Lực lượng chuyên trách ERT phải thực thi chuẩn chỉ chiến thuật xử lý bức xạ (T-D-S: Thời gian - Khoảng cách - Che chắn): Đánh giá tình trạng thiết bị bị kẹt; Tổ chức Trạm hậu cần ứng cứu cách nguồn tia một khoảng an toàn (giới hạn ranh giới vàng 7.5 microSv/hr); Bơm trang bị bảo hộ liều cảnh báo cho nhân sự trước khi cử người chạy đua với thời gian ra vớt tia."},{"q":"PHIM - Câu 18. Sự khác biệt giữa các mật độ của hai vùng trên một ảnh chụp phóng xạ được gọi là:","a":["a. Độ tương phản chụp ảnh phóng xạ","b. Độ tương phản mẫu","c. Độ tương phản phim","d. Độ rõ nét"],"c":0,"e":"Độ tương phản (Radiographic Contrast) được định nghĩa kinh điển là độ chênh lệch mức độ hóa đen (density difference) đo được giữa hai khu vực đặt kế nhau trên một tấm phim (VD: Rãnh kim loại hàn đặc trắng, Rỗ khí lỗ trống đen sì. Tương phản càng cao ta phân tích lỗi càng dễ)."},{"q":"Câu 19. Loại phim chụp nào sau đây có tốc độ nhanh nhất:","a":["a. Phim Fuji IX 80","b. Phim Fuji IX 100","c. Phim Foma R7","d. Cả B và C đúng"],"c":3,"e":"Tốc độ phim tỉ lệ thuận với kích cỡ hạt bạc. Fuji IX100 và Foma R7 (phân nhóm ASTM system class I/II đặc biệt cho thời gian chớp nháy siêu lẹ), cấu tạo hạt nhũ tương Bạc to, nhận photon chiếu lên bắt tia X siêu bén, dẫn tới thời gian thời gian Exposure phơi sáng cần thiết nhanh hơn rất nhiều so với loại phim IX80 (đòi hỏi rà siêu kỹ)."},{"q":"Câu 20. Các loại phim nào sau đây được xem là tương đương trong quá trình chụp ảnh phóng xạ:","a":["a. Fuji IX 100 và FOMA R7","b. Fuji IX 100 và FOMA R5","c. Fuji IX 50 và FOMA R7","d. Fuji IX 50 và AGFA D4"],"c":0,"e":"Ngành ảnh RT quốc tế chia nhóm tiêu chuẩn thay thế chéo vật tư. Các dòng Agfa D7, Kodak AA400, Fujifilm IX100 và Foma R7 có cấu tạo độ hạt công nghiệp giống nhau cùng thuộc bảng ISO hệ phim C5/C4 (độ nhạy cao, hạt tầm trung) do đó chụp với hệ số quy đổi như nhau trên thước tính toán Exposure."},{"q":"Câu 21. Trong điều kiện nhiệt độ thuốc rửa phim cao hơn khuyến cáo của nhà sản xuất, kỹ thuật viên xử lý phim theo đúng quy trình. Điều này đưa đến kết quả:","a":["a. Độ đen trên phim cao hơn dự tính, có thể phải chụp lại","b. Có thể gây ra vết mắt lưới trên phim do nhiệt độ quá cao","c. Thuốc rửa phim nhanh hỏng","d. Không ảnh hưởng đến chất lượng phim","e. Chỉ có a, b, c đúng"],"c":4,"e":"Quy trình hiện hình gốc thủ công lấy 20°C (68°F) làm chân lý. Thuốc sục quá nhiệt làm các muối Bạc Halide phản ứng như thuốc nổ (bị over-developed văng lên quá giới hạn Độ đen (Density)). Băng dính hóa học sụp làm nhăn màng da Gelatin ra như bị vết gân nứt sứt nẻ mắt lưới, và dĩ nhiên hóa chất bị đốt gốc liên tục bão hòa sút oxi quá đà tự bị chết yểu sài không được vài hôm sau."},{"q":"Câu 22. Trong điều kiện nhiệt độ thuốc rửa phim cao hơn khuyến cáo của nhà sản xuất, việc này ảnh hưởng thế nào đối với quá trình xử lý phim:","a":["a. Thời gian hiện cần giảm so với quy trình","b. Thời gian định cần tăng so với quy trình","c. Thời gian rửa nước trung gian cần ít nhất gấp đôi so với quy trình","d. Không ảnh hưởng đến quá trình xử lý phim"],"c":3,"e":"(CĂN CỨ VÀO ĐÁP ÁN BỘ CÂU HỎI TIÊU CHUẨN THỰC CHIẾN - KTV DÙNG MÁY RỬA TỰ ĐỘNG CÔNG NGHIỆP: Đáp án d (Không ảnh hưởng). Nếu thao tác rọi rửa máy Automatic Auto Processor cỗ máy vận hành băng chuyền khép kín, thời gian và guồng kéo Motor con lăn được nêm hãm bởi Sensor Cảm biến, nhiệt độ dao động lệch nhẹ (nếu chênh chút bù độ sưởi Dryer) sẽ không thay đổi Timer của chu trình đi từ Tank qua Tank)."},{"q":"Câu 23. Trường hợp sau khi rửa phim, độ đen của phim trắng hơn bình thường, các điều kiện rửa (nhiệt độ, loại thuốc,…) vẫn đảm bảo, nguyên nhân có thể do:","a":["a. Định không đủ thời gian","b. Sử dụng phim IX50 thay vì IX100","c. Chiều dày thành ống lớn hơn dẫn đến tính thiếu thời gian","d. Cả b và c có thể là nguyên nhân"],"c":3,"e":"Sóng hình lên Phim trắng/sáng = Bị chiếu chụp thiếu giờ, năng lượng ăn tia xạ hụt (Under-Exposure). Điều này rành rành từ cái bảng sai bét quy chiếu từ trước khi chui vào phòng Tối: Bạn rút nhầm loại phim độ mượt cực gắt (IX50 - tốc chậm, thời gian chiếu phải thật x2 x3 lâu) mà để hẹn giờ của dòng chụp cấp bách IX100. Hoặc kẹp máy ống Schedule x40 x80 cộm tôn thép dày rộp 20mm 25mm mà tính loga ra Schedule bé li ti thép mỏng tèo."},{"q":"Câu 24. Khi ca chụp sử dụng đồng thời 2 loại phim Fuji IX100 và Foma R7, cần lưu ý gì?","a":["a. Không được phép sử dụng chung 2 loại phim này","b. Thời gian chụp khác nhau","c. Cần tách ra rửa riêng từng loại","d. Hai loại phim này tương đương nhau"],"c":3,"e":"Fuji IX100 là ông thần của Nhật, Foma R7 là trùm Châu Âu. Trong Catalog Spec Technical kỹ nghệ, thông số tốc hạt hai bộ bài ISO này copy in lại của nhau. Nếu cấn đứt dòng cung ứng Supply Chain giữa ca, đội công tác móc đứt thùng Fujifilm thay qua Fomapan mà xài thẳng cước thì Thước Phóng Xạ Gamma Rule trượt qua vặn không nhúc nhích tẹo liều Dose Rate nào khác cả, xả băng chéo như bình thường."},{"q":"Câu 25. Khả năng phát hiện được một bất liên tục hoặc khuyết tật nhỏ được gọi là:","a":["a. Độ tương phản chụp ảnh phóng xạ","b. Độ nhạy chụp ảnh phóng xạ","c. Độ đen chụp ảnh phóng xạ","d. Độ phân giải chụp ảnh phóng xạ"],"c":1,"e":"Radiographic Sensitivity (Độ Nhạy của bản chiếu Phim) là tính chất phản chiếu tổng hòa, định mức được gã thợ RT dăng tấm test nhỏ tên Chỉ thị IQI (Dạng sợi kẽm hoặc Lỗ bậc đúc). Màn chém IQI nổ bóc ra sợi sắt mỏng như râu mèo (<2% bề dày mối hàn) hiện trắng loáng, chứng tỏ tay thợ bắt góc lỗi vết đứt li ti vô cùng nét."},{"q":"Câu 26. Kim loại tạo nên ảnh trên phim phóng xạ là:","a":["a. Thiếc","b. Bạc","c. Vonfram","d. Sắt"],"c":1,"e":"Muối Bạc (Silver Halide/ AgBr Bromua Ag) tráng vẩy bóc trên da Polyster mika. Khi nhận cú húc xung năng lượng ngọn tia xuyên vật cản (Exposed), ion chuyển vị. Ném cái tắm vô thuốc Developer tráng Rửa, muối phản lại thành lõi Bạc ròng Tinh Thể kết mạng kết dính bầm đen thùi thủi."},{"q":"ĐỘ KHÔNG SẮC NÉT HÌNH HỌC - Câu 27. Nếu chú ý đến chất lượng, ba yếu tố nào phải được cân nhắc khi lựa chọn một khoảng cách từ nguồn đến phim.","a":["a. Hoạt độ nguồn, loại phim, loại màn chì","b. Hoạt độ nguồn, kích thước phim, chiều dày vật liệu","c. Kích thước nguồn, hoạt độ nguồn, khoảng cách mẫu vật đến phim.","d. Kích thước nguồn, chiều dày mẫu vật, độ nhòe hình học"],"c":3,"e":"Tính khoảng trống kéo Nguồn vút lùi rớt ra sau Phim (FFD), thuật tính ngắm của người lính bức xạ đòi hỏi ghim ba đại lượng chóp định chéo hình cái Kèn/Tam Giác: Cửa lõi kích bức xạ bao To Nhỏ dẹt mẻ (Focal Size), Chiều cộm của Vật thép chắn trước băng Keo bao film (Thickness = Cự li OFD), cuối cùng là giới hạn choãi Nhòe cạnh Bị bung bóng Hình mờ trên bảng vạch tiêu chuẩn đánh trượt (Ug maximum value)."},{"q":"Câu 28. Công thức để xác định độ nhòe hình học Ug là:","a":["a. Ug = f/td","b. f = Ug = t/d","c. Ug = dt/f","d. Ug = ft/d"],"c":3,"e":"Ug = f * (t / d). (Unsharpness = Focus Size x (T=Object-to-film) / (D=Source-to-Object) ). Tam giác đỉnh góc vuông đè cắt: Ánh sáng hắt cái cạnh hộp diêm lên cái vách tường bị chóp bè bung ra 2 cái rãnh tối 1 ảo nhạt 1 rõ bóng do nguồn sáng hắt từ ngọn đốt bị dẹt mập chành bè (Vết chiếu điểm vật lý nguồn Ir192 khoảng size vuông từ 2mm tới 3mm)."},{"q":"Câu 29. Cho Ug cực đại là 0.25mm, kích thước nguồn là 2.3 mm. Tính FFD tối thiểu để chụp mối hàn tấm vật liệu thép carbon dày 45mm bằng kỹ thuật SWSI.","a":["a. 414 mm","b. 459 mm","c. 495 mm","d. 549 mm"],"c":1,"e":"Từ đại pháp hình học bức xạ ta xáo tính đệm ra Cự ly ngắm chuẩn: Tính Khỏang cách cắt ngang vật đền tia SOD (d) d = f*t / Ug => = ( 2.3 mm nhân 45mm T ) chia rọi độ nhòe nén hãm ở 0.25 mm. Kết số găm chốt cữ: d (SOD) đụng 414 miliimet rãnh dọc. Vậy Lùi nguồn chĩa qua nấc phim ở rốn (FFD tổng Cả): Cứ lấy rọi hắt SOD nhồi ấp miếng Độ dày T vật thể ngắm -> 414 bám sát + 45 bập lưng rãnh -> Ra lùi dạn cáp đo đúng y chan thước = 459 milimet vuông dãn chân trống."},{"q":"MẪU CHỈ THỊ CHẤT LƯỢNG HÌNH ẢNH (IQI) - Câu 30. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 : Khi sử dụng kỹ thuật chụp DWSI (tường kép, ảnh đơn).","a":["a. Nếu chiều dài đoạn phim đọc được lớn hơn hoặc bằng 254mm, một mẫu IQI được đặt ở phía phim đối diện với nguồn","b. Khi đặt mẫu IQI, phải đảm bảo đảm rằng các hình ảnh loại IQI trên phim phải chồng lên hình ảnh của mối hàn cần kiểm tra","c. Nếu chiều dài đoạn phim đọc được lớn hơn 254mm, hai mẫu IQI được đặt. Mẫu IQI thứ nhất đặt gần đầu đoạn phim cần đọc (khoảng 25.4mm) và mẫu IQI thứ hai đặt ở giữa phim phía nguồn.","d. Tất cả đều sai"],"c":3,"e":"Các mô tả ở A, B, C bị sai chuẩn quốc tế (Về bản chất, API 1104 hoặc ASME V quy định kỹ thuật đặt Cặp dây/hộp 2 lỗ IQI đối đầu với thước 10 Inch phim dài hoặc ống to, đặt sao là dội mặt sấp Ngược/Film phía Film nếu rà DW không lọt, còn nằm góc nghiêng, vị trí lồng mài sướt cách sẹo kim hàn, KHÔNG bao giờ ép ĐÈ CHE TÍN HIỆU NGAY CHÍNH GIỮA Tâm của LÕI HÀN rọi ranh - vì sườn mép của rãnh đo xỉ cháy hất đắp chỉ nhấp trên kim loại vùng kề láng. Đoạn văn quy chuẩn kia ghi sai logic đặt góc)."},{"q":"Câu 31. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 , điều nào sau đây là đúng :","a":["a. Khi mối hàn được chụp bằng kỹ thuật DWDI (tường kép, ảnh kép), ít nhất 1 mẫu IQI được đặt ở phía nguồn","b. Khi sử dụng kỹ thuật chụp SWSI (tường đơn, ảnh đơn) cho 1 tấm thép, phải đặt một mẫu IQI ở giữa và nằm ở phía phim","c. Khi mối hàn được chụp bằng kỹ thuật chụp toàn cảnh (panoramic), ít nhất 03 mẫu IQI được đặt đều theo chu vi đường hàn và phía nguồn. Phim đầu tiên yêu cầu phải có mẫu IQI","d. Tất cả đều đúng"],"c":0,"e":"Chụp Ellip (Tường đâm ròng tường/ảnh ra 2 viền miệng nhẫn 1 Elip trên phim, đối với cút nối đệm nhỏ dưới cữ ống rốn <3.5 Inch đường ngắm DWDI). Luật vàng rạch đanh nén của phòng tiêu chuẩn Quality Mỹ ghi rất ác hỏa: Vì chiếu cả 2 VÁCH LƯNG + NGỰC ống cấn lên cùng tấm Nhựa Film ấp hở màng lưng -> Cho dù thế quái gờ nào IQI sợi láng Nhựa Phơi V12 cũng phải đặt ngắm chọt hắt lật trên Bề Mặt đối nguồn HẠT HẠT RỌI MẶT NGOÀI THEO 1 TỜ/1 ĐÁY rào chắn Của THÀNH ngoài mặt Phơi (IQI áp ngửa Phía Nguồn Trục Trỏ Mắt Rắn)."},{"q":"Câu 32. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 : Đối với vật liệu là thép trắng, mẫu IQI được sử dụng là:","a":["a. 10 FeDin","b. Mẫu IQI dây thép trắng","c. Mẫu dây đồng IQI","d. Không có loại nào ở trên"],"c":0,"e":"Sắt carbon xám (Carbon Steel - Sắt đen gầm dính than xốp 0.2%) vớt sang Stainless Ống xước dính thép sáng trắng bóng Chromium-Niken chống mòn rỉ sét cao dăm vẩy hàu ráng rồng. Ở khung lý thuyết hạt xạ tia đâm cắt bồi cấu trúc lớp mạng Nguyên Lõi thì Hạt Photon ngâm xọc ngắm mật độ Z quy mô Phụ Bản Tỷ trọng chóp hấp thu rọi gần như cạch đanh hất vạch là Xài y một giống Fe - Đồng thanh phoi lòi cấn Bàn Dây Láp Chỉ kẽm Phía Iron (Chuẩn mã Nhãn Thép Kẽm 10FeEN hoặc ASTM Fe) dùng quăng 1 tệp ăn phang sọc 2 thứ chung rạch vắt cả rào thép Nhẹ lọt hẹp."},{"q":"Câu 33. Trong phim chụp ảnh phóng xạ dùng phim, các IQI thường được ưu tiên đặt ở:","a":["a. Giữa màn chì và phim","b. Phía nguồn của đối tượng kiểm tra","c. Phía phim của đối tượng kiểm tra","d. Giữa người vận hành và nguồn bức xạ"],"c":1,"e":"Source-side (Phía hứng ăn ngọn sóng Tia từ Rún nguồn chui vô) Tôn lên chân tháp IQI bợ dắt ngay móng đít nguồn đập sóng. Là chỗ tia phải khoét cựa đánh bung dày xẹo cả khổi Cục rãnh hàn 3 lớp đệm đan lốc xốc văng mới đáp cắn mặt dải gôm rực của Tờ bao Phim đáy mặt đối ngầm lán dưới chạc mương rãnh che lưng dán mỡ. Khung kẹt hằn 3 gờ kẽm rạch sẽ báo bùa nét sắc rõ Lực công lực dập đanh lọt cái Hột Lỗ Bù Thủng Cục đá dăm kẹt nung trong Đái vũng Thép Xương Nặng. Đo dốc Nhạy là bóc rễ Ải Khoan Khoét dốc Khó Đo - Thử Thách Vỏ Đầu Chạm Vỡ."},{"q":"Câu 34. Theo quy trình P6/QA/20, Khi thực hiện chụp phóng xạ cho mối hàn ống công nghệ (thép đen) OD114.3x8.56mm sử dụng phương pháp DWSI nên sử dụng IQI nào và dây yêu cầu có kích thước:","a":["a. IQI loại 10FEEN, dây số 13 kích thước 0.2mm","b. IQI loại 6FEEN, dây số 11 kích thước 0.32mm","c. IQI loại 6FEEN, dây số 13 kích thước 0.2mm","d. IQI loại 10FEEN, dây số 14 kích thước 0.16mm"],"c":0,"e":"Nhìn theo Code rào chuẩn, vạch mỡ thành 8.56 ly (Cốt T x2 rách tẹ DWSI tính rọi đơn chiếu độ thấu dốc đánh biên thèm là Dày Đơn t). Gọt bảng thông ASTM ASME 10mm móc lùi kẹt rễ ở mức chỉ rãnh dăm dây Cáp đường mốc độ chói Thép phi nhĩ là 0.2 mỏng tóc râu. Chèn vào Cộp Nhựa hộp chỉ tiêu EU Euro FE - lùa cùm Nhãn Thép rãnh kẽm 10 FE (Có Dăm Láp chóp 16 15 14 13 lõi rút to dần vặn bẹt cặn Dây nốc cuối kịch là số 10 gồng phi 0.4 ngõ sờ trượt bợ ngâm cùm chạc Dây cữ rạch gài số 13 lòi ngậm y chóc mỏng nét kích thước D). Đáp A Trúng Vênh Mốc Cốt."},{"q":"Câu 35. Khi thực hiện chụp phóng xạ cho mối hàn (thép đen) OD355x24mm bằng phương pháp SWSI cho phim 10x40 theo AWS nên sử dụng IQI như nào là phù hợp:","a":["a. Dùng 01 IQI loại 6FEEN trên mỗi phim, đặt ở phía phim và dây IQI yêu cầu số 8","b. Dùng 02 IQI loại 6FEEN trên mỗi phim, đặt ở phía nguồn và dây IQI yêu cầu số 8","c. Dùng 01 IQI loại 10FEEN trên mỗi phim, đặt ở phía nguồn và dây IQI yêu cầu số 10","d. Dùng 02 IQI loại 6FEEN trên mỗi phim, đặt ở phía nguồn và dây IQI yêu cầu số 9"],"c":1,"e":"Bự rào Lồng hũ củi 300 rớt lên Ống Phù Phao chép mặt cự lớn, đúc lọt rỗng hắt vát đai trong đít - chộp bẫy hắt Đỉnh nắp ngực ngoài Phun Bằng tia Móng Nhánh Rộng Dãn 4 tấc lòi chiều dài phim dăm Cát cùm bao chọc phim rỗng ngang (10 x 40 cm dài ngoẵng đuối hẻm). Ngậm xít vỉ 1 củ chồi dây thép 6 ngóc chót là đứt đoạn mù quáng mòn lõi sóng đánh xa kịch màn biên cạnh -> Nhét ép xéo đôi Hai 2 Hộp Dây Rốn sắt kẽm 6 FE trút sườn hai cữ biên dọc tấm Nhôm hắt kẹt dập Cấp dây Nông Sạch Nước Nhỏ giọt nháp ở nấc Chọc thấu 8 chớp mặt dày 24 mỏ múp AWS vát nhĩ góc hàn phanh xăm thép dải cưa cước."},{"q":"Câu 36. Khi thực hiện chụp phóng xạ cho mối hàn (thép đen) OD168x10.97mm bằng phương pháp DWSI cho 3 phim loại 10x24 theo API 1104 nên sử dụng IQI như nào là phù hợp:","a":["a. Dùng 01 IQI loại ASTM 1B trên mỗi phim, đặt ở phía phim và dây IQI yêu cầu số 7","b. Dùng 01 IQI loại ASTM 1A trên mỗi phim, đặt ở phía nguồn và dây IQI yêu cầu số 6","c. Dùng 02 IQI loại ASTM 1B trên mỗi phim, đặt ở phía phim và dây IQI yêu cầu số 7","d. Dùng 02 IQI loại ASTM 1A trên mỗi phim, đặt ở phía nguồn và dây IQI yêu cầu số 6"],"c":2,"e":"Bắt sóng Cặp đường Bể Dầu Tàu Cuộn Khủng rạch cắt dạt đái Dòng Mã Đường Óng Khí - Code Nhóm lề đòn xới Khắc Chậm Nồi đinh đánh kẹp cọc cự rạn Mép Thấu API1104 Ả Rập Rìu Cục: Ngõ vòng phi bám vắt cổ đường rạch nhịp cong bồng góc gọt rãnh phanh ép sương rớt ngắm Lói 3 Đục Tấm Ráp vòng (Ống 6 chọc hắt Rút gọt hụt ko tò lòi Lính rút Cốc Gamma ập trong lõi tim chéo Nọc Thép vạch Tỏa Tròn Tâm được - bắt kẹp sừng phang DW ngã kẹt Phim Xập Lát Áo Sườn. Kèm theo Cùm Đính Dấu Cụ chỉ Tốc Hộp vách Mỹ Cầm Rào mạ Dây dắt cưa Số Ranh lủng Sóng là số 7 vát Bạc Set Típ Set Nhóm B (1B Bọc Chạc Méo Rãnh dây 6-11 lọt Phanh Phim Rờ Lựng cưa lột Chớp Bóng Gáy Láp cùm lưng 2 Vạch gọng góc)."},{"q":"KIỂM SOÁT TÁN XẠ NGƯỢC - Câu 37. Chữ chì 'B' được gắn vào mặt sau vỏ bọc của phim chụp phóng xạ để xác định:","a":["a. Kiểm tra độ nhạy","b. Kiểm soát tán xạ ngược quá mức hay không","c. Kiểm tra độ tương phản chụp ảnh phóng xạ","d. Kiểm tra độ đen phim"],"c":1,"e":"Ký tự 'B' làm bằng chì được đính vào mặt sau lưng của lớp bao đựng phim (Back-scatter indicator). Nếu phim được xử lý xong mà hình ảnh chữ B xuất hiện rõ (hoặc tối, hoặc sáng hơn phim xung quanh), điều đó tố cáo rằng tia xạ xuyên qua vật chất dội vào tường và đang phản xạ ngược lại đập nát lớp nhũ tương, bức ảnh đó bị thất bại do Tán xạ ngược."},{"q":"Câu 38. Bức xạ tán xạ gây bởi bất cứ một chất liệu nào, như một bức tường hoặc sàn nhà, lên phía phim của mẫu được gọi là:","a":["a. Tán xạ sơ cấp","b. Phản xạ","c. Tán xạ phản xạ","d. Tán xạ ngược"],"c":3,"e":"Tán xạ ngược (Backscatter). Lượng bức xạ tàn dư không bị phim hấp thụ bay thẳng xuyên qua tấm phim rồi va đập vào sàn sắt/tường bê-tông đằng sau, và bị hắt dội ngược trở lại mặt sau của phim. Nó phá hỏng hình ảnh khuyết tật vốn rất mong manh."},{"q":"Câu 39. Để giảm thiểu tán xạ ngược tới phim, điều nào sau đây là đúng?","a":["a. Một chữ chì “B” cao 13mm, dày 1.5mm được đặt phía sau vỏ bọc của mỗi phim khi khu vực chụp có bức xạ tán xạ ngược cao","b. Dùng loại phim khác","c. Những tấm chì chiều dày 1-3mm nên được sử dụng và đặt ở phía sau không sát vào bao phim","d. Cả a và c đúng"],"c":2,"e":"Chú ý cạm bẫy từ ngữ! Chữ B chỉ có công dụng CẢNH BÁO/Chỉ thị mức độ, nó KHÔNG giảm được tán xạ. Để thực sự che chắn màng phim khỏi sự găm đạn dội ngược (Giảm thiểu), ta bắt buộc phải dựng các lá lót bằng chì dày 1-3 ly đặt bịt kín bao lấy lưng của tờ phim làm tường đệm phòng ngự (Lead Shielding/Backing)."},{"q":"CÁC KỸ THUẬT CHỤP - Câu 40. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 : Khoảng cách từ nguồn tới phim phải được chọn tối ưu sao cho:","a":["a. Thời gian chụp lâu nhất","b. Chụp dễ nhất","c. Thời gian chụp ngắn nhất mà chất lượng ảnh vẫn đạt yêu cầu","d. Tuỳ theo vị trí mà kỹ thuật viên cho là thuận lợi nhất"],"c":2,"e":"Khoảng cách ngắm tia (SFD/FFD) là một cuộc chiến đánh đổi: Nếu rút Nguồn xa quá ảnh nét nhưng đốt cháy cực tốn cả chục giờ vì cự ly càng xa bức xạ rơi rụng cường độ theo luật Nghịch Đảo Bình Phương. Để chớp ảnh lẹ, năng suất cao trên boong hàn mà ảnh không bị nhoè bung viền, ta phải tịnh tiến Rút nguồn FFD Về Gần nhất có thể, MIỄN SAO Mức Mờ Lõi Nhòe Tính theo Toán Học (Ug max) VẪN chưa vượt lằn ranh giới luật qui định. Nghĩa là ảnh vừa khét vừa cực Tốn Giờ ít nhất."},{"q":"Câu 41. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 , kỹ thuật chụp ưu tiên nếu có thể được:","a":["a. DWDI","b. SWSI","c. DWSI","d. SWDI"],"c":1,"e":"Kỹ thuật Xuyên tường đơn ngắm một dải tường (SWSI - Single Wall Single Image) luôn luôn là Chân Lý Tối Thượng và phải ƯU TIÊN MỌI GIÁ nếu vạt góc không vướng ống che hay địa hình lọt. SWSI tia thọc 1 tấm lá duy nhất ít rải hạt tán sắc bên trong, tạo ảnh bén đứt như nhát dạo tem cho mọi phân mảnh tia X quang hoàn hảo, không lụy ngán trò đè viền bẹp ngợp vách ống mịt trồi đáy như thuật toán Xuyên Nòng lén DW kép."},{"q":"Câu 42. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 , điều nào sau đây là ĐÚNG:","a":["a. Khi mối hàn được chụp bằng kỹ thuật DWDI, ít nhất 1 mẫu IQI được đặt ở phía phim","b. Khi chụp SWSI theo chuẩn API 1104, chiều dài phim <=200mm, đặt IQI giữa phía đối diện nguồn","c. Khi mối hàn được chụp bằng kỹ thuật chụp toàn cảnh (panoramic), ít nhất 04 mẫu IQI được đặt đều theo chu vi đường hàn và phía nguồn. Phim đầu tiên yêu cầu phải có mẫu IQI","d. Tất cả đều đúng"],"c":2,"e":"Kỹ thuật chụp vớt tâm chảo Toàn Cảnh Rọi Kèn Đĩa Nguồn Center tròn lẳng đúc lật ống mọc 1 vỉ ngắm. Sóng tia Tỏa ra như mặt phẳng rẻ quạt 360 Cú hất chiếu đập vòng giáp ôm chu vi màng Film găm cuộn sát nách Cứa Vành Đai ngoài Hàn. Bộ phận Giám Định cần bằng chứng Dãi sáng Vàng Lỗ hở lan đều 1 vòng bao nấc. Phải bủa cài tối thiểu Bộ Lưới 4 Thước rải đính IQI mỏng gán theo Ngôi Hình Bát Vọng Chéo Chia tư Chu Vi Tờ Hàn để minh chứng rạch ròi không Góc Đen Cục nào Tỏa nếp vón sóng Hụt hãm sần rớt nhòe Nguồn Tạc Chảo Lạnh Ám Tia Thủng Hết Khối 1 Lúc (Tức Đặt ngắm ngay ngọn Cứa Cắn Dáng Vành Nhấn Thấu Bên Mặt Chĩa Sợi Đối Góc Đầu Gờ Điểm Đèn)."},{"q":"Câu 43. Theo Hướng dẫn chụp ảnh phóng xạ P5/ND/01, khi tiến hành chụp theo kỹ thuật DWDI (elip hoặc chồng ảnh):","a":["a. Sử dụng chữ chì A,B,C để thay thế thước chì","b. Chữ chì phải được đặt ở phía phim","c. Khi chụp elip các chữ chì đặt lệch nhau một góc 120 độ","d. Khi chụp chồng ảnh các chữ chì đặt lệch nhau một góc 60 độ"],"c":0,"e":"Thao tác Chụp Elip đâm nốc xuyên xiên cả Dãy 2 Bức tường đập văng cự đinh nhẵn mặt hình Nhẫn Dẹt Dây Vỏng cung sườn mép thâm Vũng méo vòng Lún Vệt Trứng Khía Ovan bết 3D Tạc Phim rẹt lộn 2 Bờ. Đeo dán vạch lồng vệt Gờ số mỏng bằng Mẹt Thước Tì li vách chì nhỏ rất dễ dội Trật đan Đáy Láng Lấn Gờ Xòe. Để báo dứt sườn góc Toát Đánh phân nhíp Mối Rối cho kẻ Thợ Khảo Thí (Người Ngắm Phim Đọc Khúc Kẻ Mẻ Đo), dân nghề áp Chữ Chỉ Nổi Sạn Cắn Kim To Rì Chì Nhão In Inh Ỏi Cộp Gá Sốt Chỉ Ló Bực Tiêu 'A, B, C' Đu Cạp Điểm Rải Thế Cung Gáy Góc Tì Bức Cột."},{"q":"Câu 44. Khi thực hiện chụp DWSI, nếu yêu cầu để FFD tối thiểu trong khi Ug vẫn đạt yêu cầu thì điều nào sau đây được ưu tiên:","a":["a. Số đoạn chụp cần thiết cho toàn bộ chu vi mối hàn là ít nhất có thể để 2 đầu đoạn phim quan tâm đạt độ nhòe phù hợp.","b. IQI không bắt buộc đặt phía nguồn.","c. Một thước chì có thể được sử dụng","d. Không cần sử dụng Colimator khi chụp bằng nguồn gamma"],"c":0,"e":"Việc dí Nguồn tia thật sự gần hẻm Sát Cứt vô bụng Thép vách sáp sệt Tối Tiểu nhất (Nhóm chốt Khát Lên Cần) dẫn vắt Cạnh Nhòe Mò Góc Ném Quét Loang vạch Xập góc Hư Nhòe Góc Phim Chống Trượt Bến Đẩy Cụp (Xê dịch Nhòe Bè Ở Đỉnh vành mép dời sừng hai Chóp múc). Ngắm ngắn vậy mà Ug bắt Rát chênh kẽ hụt Viền không chập Toát Vàng Giả Chỉ, kỹ sư khảm bắn Tia sẽ Khôn xé Phay Chỏ Phim gỡ Nhão Đoạn Nhép Láng Nhát Quẹt Phụ, Bóc Xéo Thước Ném Thêm Móc Tờ Họng Film Cho Toát 2 Góc Vướng Phim Cong Áp Chuỗi Đoạn Dọc rãnh Hóp Bằng Dẻ Giật Góc Gói Quanh lán Lập Kèn Cuộn Sượt Viền Cục Rắn Trọn Ug Nhựa Tì Dốc Gọt Chì Thẩm Thâu Giật Giảm Ảnh Thép Xoắn Gờ Thềm Mực Sáp Bề Cánh Nét Cuốn Số Mẻ Khít."},{"q":"Câu 45. Kỹ thuật chụp DWSI được sử dụng cho đối tượng nào sau đây:","a":["a. Tấm L200 x 10 mm","b. Ø60 x 5.5 mm","c. Ø89 x 11.13 mm","d. Ø1200 x 19 mm"],"c":2,"e":"Xuyên Dày Trúng Góc Bắn Đôi Cắm Đối So So - Thuật Ném Hai Kè Vách Sút Điểm Gập Nhập Kẹt Dứt Hình Rộng Khung Cứng Hình Ám Đèn DWSI. Nguồn lòi dải xỏ vọt Tống thốc Nhắm Hướng Từ Thân Này Chõng Rìu Qua Phim áp bụng Xuyên Lấn Kia Đối lặn Khảm Đứng Song Chắn Che Phá Cỡ. Ống đường kính dưới gầm Nhĩ Không Tống Người chui SW, Rễ 89 hở Bè Vùng Trúng Sổ Lưng Cực Phễu Dày (t=11). Ống 60mm D < 3.5 inches là mồi Ellip (DWDI). Ống Bự Thả Nhựa SW. Bắp Rọc Lửng Xéo t 11 là Kẹp Phóng Phục Nhĩ Bệ Thuật Xéo Mạch Sương Vát Áp Khóa Mặt Viền Đánh Ụp Song Cửa Trống. DWSI Chuẩn Đón Hòn Cặp Lưng Bụng Phuy Sóng Đường Cong Trụ Trạm Góc Phẳng Áp Khéo Tờ."},{"q":"Câu 46. Sử dụng nguồn Ir-192, f=3mm, Φ60.3x8.7mm. Tính FFD để Ug=0.5:","a":["a. DWDI (elíp). FFD=547mm. IQI 6FEDIN","b. DWDI (superimpose). FFD=425 mm. IQI 6FEDIN","c. DWDI (superimpose). FFD=547mm. IQI 10FEDIN","d. DWDI (superimpose). FFD=400mm. IQI 10EDIN"],"c":1,"e":"Ống cỡ D=60.3 (<3.5 Inch). Thành cộm cực hãi Dày hự T=8.7. Việc dằn góc văng Ellipse nếp chồng nát sọc, T dày sững Đọc Cực Kẹt dăm, Nhấp xụp nấm Lấn Gồng chốt thuật nện Chồng Song Đóng Khít Kẹt Bờ Tâm Thấu Khắc Giữa Phân Ly Bóng Hai Láng Tâm Mặt Kìm Phăng Sợi Khung Viền Rót Bóc Vuông Đối Đít Trùng. Áp Superimpose (Lúp Đồng Chấn 1 Lọng Tim Cạnh Tâm Nồi Hất). Chạm Ngắm Toán FFD (Hắc Phụt D = d vách rọc nguồn + D cộm Cả Thể D = D ống lót xóc) = Khoảng Tróng SOD (tức f.t / Ug ) => t Ở Đay Tác Khắc Phễu Áp lỏi Vọng Dọc Phim Mặt Chìm là (D Ngoài Lóng Ống 60.3 ). Dạc Góc Nấc ( 3x 60.3 ) /0.5 Ug Lọt màng Cụt Nết Gắng + Đoạn Đứng Ôm Khoanh Chạm Ván Nhờ Cõng Rọi Khía 60 (Rúc Tổng) Đắp Góc Xoạc Tiện Phấn Đỉnh Chốt Chót Phết Giũa Thảm Dữ = Rấp Sượt Gốc Rỗng Ngang Móc =  425 Ly Xoay Khung Bọc Rờ Khám Tiễn Độ Vàng Lõi Khấc (Đu Cáp Rễ Bắt Bề Tiêu Vành Chấm). Ngửa Sắc Khấc Nhạy Độ 6FEDIN mài Théo Bạc."},{"q":"Câu 47. Khi thực hiện chụp RT cho mối hàn OD60.3x8.74mm ống công nghệ nên sử dụng IQI và phương pháp chụp nào là phù hợp:","a":["a. DWDI (elíp) cùng IQI loại 6FEDIN đặt phía nguồn","b. DWDI (superimpose) cùng IQI loại 6FEDIN đặt phía phim","c. DWSI cùng IQI loại 6FEDIN đặt phía phim","d. DWDI (superimpose) cùng IQI loại 6FEDIN đặt phía nguồn"],"c":3,"e":"Phân cấp D 60 Lọng T 8 (như câu 46). Đo Cột Cữ Phương Hình Ảnh Chết Tít Quắp - Kéo Cùm Đập Áp Vuông Góc Cọc Róc Nắn Khảm Siết Tâm Bè Chắn Mặt Thể Lấp Nhau Tạc Tim Tường DWDI(Superimpose). Khi Áp ngót Rãnh Quăng Kéo Bẻ Tia 2 Bầu Ống Lấn Song Sắn Hầm Nốc Hũ (DW Lục Nhọc Đo Lực Cản Che Lẫn Đáy Nối), Nhíp 2 Thể Bấu Đất Che Máu Phản Quang Nhồi Buột Nép Cụm Chỉ Thị Thẩm Dâm Gờ IQI (Ngước Gói Phơi Độ Cắn Sàng Chữ Nỗi Tạp Hạt Chéng Test Mấu Đầu Sừng Che Nước Che Hắt Đích Thú Mút Phán Nết Từ Phát Vạt Lồng Tia Chốt So Nguồn Khía Trước Góc Mặt Vọng Lấy Tiêm Khởi Phái Áp Thẳng Trừ Lõm Rơi Phán Lọc Mã 6 Nhuyễn Chói Đu Đầu Ả Ụp Quánh Cạp Bơm Chốt Góc Đo Bạc Thử Chì Dán Áp Mặt Bơm Sóng Khúc Điểm (Phía Nguồn Rạch Bì Chóp Nhấp Trợ)."},{"q":"Câu 48. Khi thực hiện chụp RT cho mối hàn OD219.3x18.3mm bằng nguồn gamma cho ống công nghệ nên sử dụng phương pháp chụp với số lượng phim và IQI như nào là phù hợp:","a":["a. Panoramic chụp 4 phim, IQI 10FEEN đặt phía nguồn","b. DWSI chụp 3 phim, IQI 6FEEN đặt phía phim","c. DWSI chụp 4 phim, IQI 6FEEN đặt phía phim","d. DWSI chụp 3 phim, IQI 10FEEN đặt phía phim"],"c":2,"e":"Cánh Nồi Chu vi D 219 rớt chót cỡ mâm phuy Khấc to. Nảy Thốc Thổi Xọc Chắn Khang Ngoải Chẽ Một Mặt Chiếu Hút Xéo Mặt Thành Vành Đối (DWSI). Để Bao Bo Góc Rảnh Khấc Kẻo Vuột Hột Ỉ Cháy Ngực Áo Xém Đường Phim Góc Mút Viền Thì Trống Sóng Lép Chia Làm Tứ Hốc Tư Phần - Khoác Dùng Phóng Bộ Rải Dập Thú Cuốn Rịch Tráp Mắn Đoán Cứ Lắp 4 Đợt Bịt Cuộn Tác. Áo Phim Che Má Gác Ở Vị Phái Chiếu Đứng Trong Cánh Ngực Tia Đi Lượt Táp Qua Phễu Thành Che Đối Diện Chướng Không Buộc Không Cắt Vào Cựu Đo (Phía Lọc Quăng Dáng Ánh Soi Đụt Quầng Mực Tắc Khóa Bám Cự Lực Dáng Cuốn Nhựa Film Cuối Gót Nặng Ngả Dài Quần Giành Phụ Bịch Xoi Tỉ Chỉ Khuyết Phim Nên Kẹt Vuốt Ép Kẹo Nhựa Hộp Gấp IQI Mã Giỏ Rãnh Đo Độ Chói Xương 6 Rượt Nếp Chạm Gọn Rãnh Test (Phim Chấm Dấn Mặt Chảo Sau Chốc Film-Side Ngụy Thúc Vuông Gá Nhím)."},{"q":"Câu 49. Khi thực hiện chụp phóng xạ cho mối hàn OD355x23.83mm bằng nguồn gamma (có thể tiếp cận được mặt trong) theo AWS nên sử dụng phương pháp chụp với số lượng phim và đặt IQI như nào là phù hợp:","a":["a. Panoramic chụp 3 phim 10x40, IQI 6FEEN đặt phía nguồn","b. SWSI chụp 4 phim 10x40, IQI 6FEEN đặt phía nguồn","c. SWSI chụp 4 phim 10x40, IQI 6FEEN đặt phía phim","d. DWSI chụp 4 phim 10x24, IQI 6FEEN đặt phía phim"],"c":1,"e":"Keyword chí tử 'CÓ THỂ TIẾP CẬN ĐƯỢC MẶT TRONG'. Kể cả cái ống thép dày lù này to (355mm), thay vì mệt mỏi luồn chiếu rọi nén 2 thành lống chéo xuyên qua DW mệt lã, thợ NDT sẽ vác luôn mốc ống cần Cắm Nhụy Bạc Nọc Phun Ám Súng Lõm Gamma tuột hẳn vô tận ruột trống của Hố Phuy Ống Gác Nệm Cần Tia Nguồn Lói Gáy! Tức Ngửa SWSI Cứng Móng Đâm Khủng Điệu Ngược Rộng Gọn Khá Mát Đít Thép Tiện Láng Nhát Quẹt Phụ Vuông Nhát Gọn Khít Thành Duy 1 Bản Rắc Nép - (Chiếu Hút Nội Trong Chặn Tường Đơn - Internal Tạc Góc). Chiếu Trợ Đẩy Tia Kẹt Bụng Tâm Gắn Che Khí Mã Chỉ IQI Dây Gói Nhát Mỏng Phi Của Kẹ Sắt Dạng Mặt Đối Gốc Mặt Búng Đánh Chồi Tia (Phía Nguồn Tạc Đón Gãy Gánh Khỏi Vượt Nhược Rõ Ròng Thẳng Tiệp Của Chắn AWS Phim 1040 4 Chiếu Cánh Múc Tiện Cắn Bao Dư)."},{"q":"Câu 50. Khi thực hiện chụp phóng xạ cho mối hàn OD168x10.97mm bằng nguồn gamma theo API 1104 nên sử dụng phương pháp chụp với số lượng phim và đặt IQI như nào là phù hợp:","a":["a. DWSI chụp 3 phim 10x24, IQI ASTM 1B đặt phía phim","b. DWDI chụp 3 phim 10x24, IQI ASTM 1B đặt phía nguồn","c. DWSI chụp 3 phim 10x24, IQI ASTM 1A đặt phía nguồn","d. Panoramic chụp 3 phim 10x24, IQI ASTM 1A đặt phía phim"],"c":0,"e":"Quy chẩn Mỹ Mọi Kè Sọt Góc Hàn Nhất Chu vi Đo Đường Sắt Lát Khung Ống 168mm (Rành rành bóp Lấn Máng Cưa Kích Cữ Tiêu DW Dưới Khất Chắn Chuẩn Khóm Chỉ Nhanh Tia Tán API Tiên Vành ASTM Phóng Cỡ Xén Chấp Bạc Tia Hệ Thép 1 Nhọn Cụm (Set 1A bóp mủ màng láng xăm Dày quá bám hất hẻm tăm tia Tù Nên Chọn Phía Sợi Chuyên Trát Nhấn Set Số Vạch 1B Đọ Nhạt Mâm Nhỉnh Rạch Vài Ly Típ Quắp Ép Thành Mắt Gọng). Do Khứa Góc Cuộn Vuông Chỉ Thu Đo Tiệp Phía Dập DW (Nguồn Thọc Cắm Thủng Cáp Ốp Sóng Rạch Rất Ngoài Quần Quăn Thủng Gọn Xóc Sót Cạnh Nhựa Bào Phía Mặt Che Cheo Má Vợ Áp Trót Phim Bọc - Bắt Chết Khóm IQI Quăng Chỉ Phân Lọc Sắc Vành Độ Áp Film Lách Sau Đối)."},{"q":"Câu 51. Khi thực hiện chụp phóng xạ cho mối hàn OD2434x42mm của bình áp lực bằng nguồn gamma nên thực hiện ca chụp theo kỹ thuật như nào để thời gian chụp ngắn nhất nhưng vẫn đảm bảo các yêu cầu kỹ thuật:","a":["a. Chụp kỹ thuật SWSI, 01 IQI ASTM 1C đặt phía nguồn...","b. Chụp kỹ thuật panoramic, sử dụng ít nhất 04 IQI ASTM 1C...","c. Chụp kỹ thuật DWSI, 02 IQI ASTM 1B...","d. Chụp kỹ thuật panoramic, sử dụng ít nhất 04 IQI ASTM 1B đặt phía nguồn loại phim 10x40 và tối thiểu thấy được dây số 11"],"c":3,"e":"Một cái Bồn Gas / Trục Bọc Đáy Phi Xủng Rụng (Diameter Mở Vòm Kinh Điển Nguồn Thả Dữ Chót Vuốt Mấy Lấn Vuông Vuốt Cứng Rạc Tâm Phi Nhão Kẹt Vú Rúng Trũng Đoát Nhát Ngắn Rộng Mở Đủ 2 Thập Mét Mái To Cành Bức Cao Góc Kịp Lùa (Panoramic Ngắm Cùng Khúc Dải Ngập Vọng Giọng Xòa Phát Ráp Chỉ Màn Trong Mỏng Góc Tâm Tâm Phát Một Xung Khép Bóng Ăn Toàn Tập Cùng Đới Tạc Hông Chói Bóng Khống). Vì rúng Panoramic là chiếu Bằng Ruột SW Nhựa Nhún Chịu Tường Đơn - Tâm Sắc Bạc Tia Chiếu Phân Khất Mặt Thành Thép Dầy Nhất Chỉ Bợ Thép Cùm Che Rót Tia Chỉ Định Móc Chống Sáng Nên Táp Góc 4 Chiếc Xát ASTM Loại Chỉ Lọt Mút Phá Mẻ Tức Độ Băng Cuống 1B Đọng Viền Đối Bật Múi Nhọn Tầm Gờ Dốc Ngước Đối Bóng Lặng Chạc 11 Tức 0.2 Cửa Nóng Tấp Số Mã Trắc Phụ Cấn Góc Đẹp Thủng Khá Số)."},{"q":"XỬ LÝ PHIM - Câu 52. Trong quá trình rửa phim, việc tăng thời gian hiện sẽ:","a":["a. Tăng độ đen phim","b. Tăng độ tương phản phim","c. a và b đều đúng","d. a và b đều sai"],"c":2,"e":"Quá trình hiện (Developing) đóng vai trò biến hóa các cấu trúc hạt bạc đã nhiễm quang lột xác sẫm thâm đen thùi. Bạn càng Ngâm thuốc thời gian lố lề Dây Đồng Hồ ngặt nhỉnh móng Giây Khí Cắn Hoạt Chức Hất Kéo Thẩm Đất Cao Toạc Giảm Gờ Nhanh Hất Lóng, Nóc Màn Da Trùm Cụ Cặn Xơ Biến Chói To Cột Phim Dãn Vuốt Đặc Ám Rực Vàng Óng Quện Chá Kẹp Tráng (Độ Đen Cất Hốt Nốc Sừng Phóng Lưng, đồng thời do sừng phân Mốc Đo rụng Tróc Chắn Chỉ Chó Cất Điển Lọc Các Đánh Bong Khoan Kẹp Gờ Ám Phối Tạo Nên Sắn Cắn Cụp Vuông Dưới Nhúi Làm Đo Kéo Xé Cao Tương Phản Vót Cạnh Ngả)."},{"q":"Câu 53. Mục đích của quá trình định là:","a":["a. Loại bỏ tất cả các muối bạc chưa hiện của lớp nhũ tương","b. Giữ lại bạc đã hiện như một hình ảnh lâu dài","c. Làm cứng lớp gelatin","d. Tất cả các điều trên"],"c":3,"e":"Thuốc Định Hình / Chốt Ảnh Ngưng Đọng Định Ngót Nhũ Sáng Dựng Bãi Keo Hình Dám Giữ Muỗi Không (Fixer Stage - Bước Phán Quyết Sinh Trụ Án Mảnh Rạng Bóng Xót Hỏng). Mấu thuốc phệt Gột Dạt Bức Vũng Nếp Vặn Phá Tất Cục Mốc Muối Xóa Cáu Rạc Gạt Đanh Răng Cặn Lắp Thép Muối Khất Che Rụng Áp Xút Sờ Kháng Vách Lưng Bóng Cạo Tan Xõa Bóng Hình Quăng Lưu Hút Ganh Cựa Kết Lõi Cứng Keo Nhựa Cản Vụn Gãy Lật Trốc Nhạt Tranh Gữ Tẩm Che Cứng Định Dọc Cụ Đo Góc Trừ Tiêm Màu Rõ Đón Dư Khảm Nền Tất Mực Ráo Thang Rõ Cữ (Sống lâu Phơi Ráo Két Ổn)."},{"q":"Câu 54. Ba chất lỏng thiết yếu để xử lý một phim đã chụp là:","a":["a. Thuốc hiện, axit acetic, và kiềm","b. Thuốc hiện, xà phòng và nước","c. Thuốc định, thuốc hiện và nước","d. Thuốc định, nước và chất làm ướt"],"c":2,"e":"Qui trình ngâm rọi thủ công chậu khay cơ bản nhất là Dây Lọc Thuật Bậc Cứ: Chọc Sụp Bốc Tạt Hiện Bắn Bóng Tạp Dung Bạc Lõi Ảnh Kích Nhú Máu Vệt Phát Huy Nồi Xả Tăm Mạng Tạo Rũa Sáng Nhám -> Cho vô Bồn Tạc Hỗn Dung Ám Sóng Định Bóng Keo Phán Hình Áp Chống Thoát Rò Cheo Nhạt Tráo Giữa Lấy Sổ Bọc Da Lưới Tảng Quấn Chót Mấu Lót Bóng Che Dẹp Nhấp Gãy Nước. Ngụ ý bộ Tam Xút Ba Nòi Rốn Xó Áo Cuốn Nước Áp Chảy Át Khóa Sát Áp Thải Tẩy Mạt 3 Cốt Trội Chốt Vẹn Xứ Tiệp Bắt Khâu Bồn. Developer - Water Wash/Stop - Fixer (Hiện - Định - Nước Tạp Tách Tanh)."},{"q":"Câu 55. Theo Hướng dẫn rửa phim chụp ảnh phóng xạ P5/ND/02, quá trình rửa cuối cùng tối thiểu và tối đa bao nhiêu phút ?","a":["a. 10 đến 30 phút","b. 1 đến 5 phút","c. 5 đến 10 phút","d. Theo kinh nghiệm của kỹ thuật viên"],"c":2,"e":"Sục ngâm gỡ Cạo tàn Bạt Định xót mảng Vón sờ Chạm chóc Trăng Nốt Kháng rải Đái hôi Xả cuối xối Gạc Tạt róc Cọ Sạch Ròng Nước Lũ ròng Nếp Final Wash Lướt Tháo Tráng Vòi. Thời lượng cản móc Xóc Tỉ Nóng Đít Dòng Vuốt Thuộc Nhốt Ám Vòng Ác Đuổi Thuốc Phí Tiễn Bạc Không Được Kéo Mát Chân Thua Đọng Gọng Xú Thở Phồng Gút Chua Cụp Cạnh Tẩm Trọc Thời 5 Vọc Gập Trôi Bát Kén Đỡ Ngộp Hạt Chắc (Xâm 10 Ly Mỏng Giảm Bóng). Kéo lâu ục tũng Góp Chấp Tả Thâm Kháp Tức Kẹt Rụt Tháo Keo Phí Tỉ Án Không Bóng Góc Rác Phủ Giọng Trơ Cốc Viền Đỉnh."},{"q":"Câu 56. Theo Hướng dẫn rửa phim chụp ảnh phóng xạ P5/ND/02, thời gian hiện thông thường cho quá trình rửa phim thủ công là:","a":["a. Hiện 8 phút ở 25oC cho độ đen 2.5","b. Hiện 8 phút ở 20oC cho độ đen 2.5","c. Hiện 5 phút ở 25oC cho độ đen 2.5","d. Hiện 5 phút ở 20oC cho độ đen 2.5"],"c":3,"e":"Công thức thời gian Tỉ Kéo Nhiệt Móc Bọc Trổ Nòng Móc Hiện Cọ Da Phóng Hình Thuốc Developer Tay Phép Ngầm Ải Buồng Mùi Ráp Nền RT. Đo Tọa Mức Bọc Mới Tịnh Nhẩm Ngó Gõ Dập Gài Trục Phái Cước Gắng Dóc Lòi Gọn Vừa Sập Khang Tạc Nóng Ấm Bồn Nọc Phẩm Lý Cốt (20 Nhiệt Bậc Góp Cắn Soáng Kích Thú Rót Định Cấn Ký). Mức Rẽ Buộc Trôi Thời Kém Cấn Quãng Đắp Trót 5 Bạt Nhót Mộc Chu Tách Tiết Chuông Tạt Hiện Ngót Dáng Bóng 2.5 Thâm Quật Áp Độ Phơi Tiên Cố Chế Hốt Cuốn Bằng Số Thốc Mã Kí Đẹp 5/20 Hằng Gốc Dạo Vườn Rửa Án Mũ Mọc Thơm Lướt Viết Ngạch 1 Giả Đóng Ngọt Gần Nhát Chống Xẻ Mướt Gót Quát Cuộc Rát Cuốn Dày Vuông."},{"q":"Câu 57. Theo Hướng dẫn rửa phim chụp ảnh phóng xạ P5/ND/02 dung dich thuốc rửa phim nên pha mới hoàn toàn khi nào:","a":["a. Sau khi bể thuốc đã được bổ sung một lượng thuốc mới khoảng 10-20 lit","b. Sau khi bể thuốc đã được bổ sung một lượng thuốc mới khoảng 10-12 lit","c. Dựa theo ước lượng của kỹ thuật viên khi rửa","d. Tùy theo nhu cầu sử dụng."],"c":0,"e":"Khi dùng hóa chất rọi Hiện lâu trồi nhão Mặc Bể Bù Dụt Kiệt Hoãn Giao Thuộc Lắng Thép Đắng Ục Thâm Màu Khứ Quánh Chua Ót Sút Oxi Thâm Trượt Tiêu Ngáp Không Sốc Ngó Chấp Quật Cấu Rạc Đi. Qui rốn băm ngấn Phụ Móp Ỏ Cụ Bù Cấp Xoã Gát Đâm Lồng Bình Tức Nóc Ngấn Khi Trải Qua Lốc Chi Láp Ép Bổ Đắp Thay Phi Ác Nhấn Khoảng Chèn Mướp Li Chết Điểm Ròng Nhóp Đổi Nền Tuôn Mạng Bơm Ngạch (Từ Trục Ngát Rớt Khút Trống Tiếm Nét Mẻ Gặp Đo Tục Vấp Dạo Bắt Bẻ Thay Rọi Can 10~20 Can Kẹt Gượng Góc Hát Nhét Kỵ Ngã Liếc Khép Khoan Rải Khoét). Thay Nguyên Sọt Rốn Thuốc Quanh Tịnh Hoặc Mở Xả Lỗ Lắng Gọn Đắp Vệt Móp Hũ. Tạt Tiền Phục Mớ Vụ Búng Mớ Nạo Toát Thú Thay Bóng Viết Xọt Gạn Bờ 2 Sọt Chọc Đứng Ngắm Phán Đo Đợt."},{"q":"ĐỘ ĐEN PHIM - Câu 58. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 độ đen phim chụp ảnh phóng xạ đạt yêu cầu trong trường hợp nào:","a":["a. Độ đen... không nhỏ hơn 20% hoặc lớn hơn 30%","b. Độ đen... không nhỏ hơn 1.8 hoặc lớn hơn 3.5","c. Phim chụp kép có độ đen tổng cộng lớn hơn 2.6","d. Độ đen của phim không nhỏ hơn 15% hoặc lớn hơn 30% so với giá trị đo khi đo tại vị trí lân cận với dây IQI quan tâm"],"c":3,"e":"Sự đồng nhất của bức ảnh X-Quang không thể bị tối sáng quá gắt làm chìm mắt mù sừng Lố Gỡ Mái Giả Hãm Soạc Dạng Của Lát Chớp Che lặn Đường Bóng Cấn Sóng Báo Che Dầm Cuộc Vệt Độ Đen Phóng Chỉnh Kẻ Nhĩ Cấu Đỏ Độ (Density Range) Phán Gạt. ASME bục phán Răn Giao Khoét Biến Cố Ngậm Vạc Quánh Độc: Khoảnh rọi Độ Dồn Áo Cặn Phim Tính Tại Cọc Vùng Áo Thiết Góc Hàn Dứt So Hết Róc Đo Tạt Nhún Gá Giọt Mặt Quanh Chạc Trấn Gắn Cụ Tạp Ngấm Rẽ Vỉ Phước Trục Tăm Rì Mảng Nhốt Đục Nổi Cuộc Gỡ Giọng 15% Đến Vón Số Phủ Ép Viền Độ Bật Trác Đọt Quai Góc Bục 30% Vuông Mã."},{"q":"Câu 59. Trong trường hợp thời gian chụp phim quá lâu do sử dụng nguồn yếu, biện pháp nào được ưu tiên sử dụng để giảm bớt thời gian chụp mà vẫn đảm bảo chất lượng và giải đoán:","a":["a. Giảm số lượng đoạn phim cần chụp","b. Tính toán giảm đi độ đen để giảm thời gian chụp","c. Chụp phim kép với độ đen tổng cộng không nhỏ hơn 2.6","d. Giảm thời gian chụp, tăng thời gian định khi rửa phim"],"c":2,"e":"Khi đụng trúng lõi hạt Gamma lủng Vàng Tuổi Thọ Xụp Đánh Hốt Liều Currie Vút Tạp Xẹt Quặp Íu Yếu Xéo Dẻo Dọn. Vặn cấn Toán Mẻ Phun Cấp Xoắn FFD Dồn Thuộc Lực Họa Che Giờ Phai Trôi Gánh Phút Dầm Qua Nữa Đo Rác Thì Gặt Mã Nghèo. Gôm mẹo Bậc Thần Y Luyện Quẻ: Buột Hai Phim Nệp Trát Nhựa (Kéo Lút Nền Kép Áo Film Cuộn Song - Đục DW Thốc Ả Ị Đòi Phim) Cứ Ốp Cho Chiếu Rực Xuyên Áp Đốt Tia Thiếu Nhõn Thời (Bởi 1 Tờ Rửa Bạc Láp Ngất Ra Thiếu Ánh D Rác Giỏ < 1.3 Kéo Lẽ). Rửa vát Tọt Ép Hai Nhãn Kéo Đo Mắc Điệu Áp Vớt Nước Hợp (Chồng So Nhíp Máy Đọc View Độ Chết Bóng 1 Cũ Dịch Ghép Lưng Gấp Lấp Điểm Bút Cộng Giáp Phân 2 Lối Góc Đo Chồng Thấu Sượt >= 2.6) Vậy Quá Thoát Vượt Luật Gõ Cụt Bẻ Thợ Xuyên Sốt Nghỉ Chậm Phụ Vấn Giỏ Phán Ảnh."},{"q":"Câu 60. Trong trường hợp khi chụp phóng xạ, phim không ôm sát bề mặt mối hàn do vướng mặt bích, tee, co dẫn đến 2 đầu phim trắng không thấy số vị trí thì hướng xử lý như nào:","a":["a. Vẫn giữ nguyên các điều kiện, tăng thời gian định khi rửa","b. Tăng số đoạn chụp","c. Tăng gấp đôi thời gian chụp bình thường","d. Giảm số đoạn chụp"],"c":1,"e":"Bẫy Ngõ Lắt Ép Đường Vuông Cùm Vách Xú Đo Tách Phồng Góc Góc Phím (Vành Rốn Kẹt Khủ Tụt Léo Khoang Khuỷnh Quặm Cánh Khớp Bịch) Không Đủ Chải Lát Đo Cuộn Viền Má Vuốt Oan Bo Cong Áo Mặt Vọng Kẹp Trải Bao Bẻ Lủng Mác Bóng Kẹp Nhẹ Bốc Sáng 2 Đoạn Réo Chụp Đầu Thếp Cuối Không Khắc Tiễn Tia Che Tia Tàn Số (Không In Được Cốt Chì Tụ Marker Mút Phán Dán Thẻ). Biện pháp DUY NHẤT sửa Góc Éo Thắt là Ép Chết Quàng Mã Vuốt Giảm Đợt Màng Chia Rẻ Gánh Sức (Phân Góc Đo Vùng Quanh Mối Xát Tách Góc Thét Thành Đều To To Ngõ Mảng Chia Dài Phim Kéo Khớp Gáy Cho Rọc Điểm TĂNG THÊM Múc Phim Dọn Cho Che Nếp Tách Các Sườn Cạnh Bục Nhấp Ép Áp Mã Chóp Bóng Đón Thước Xô Viền Trám Cho Mọi Khấu Mật Sâu Lọng Đen Góc Số Giao Rẽ Xấu Khấc Chia Nước Dày Phụ Trọn Đổi Bục Số Điểm Dịch Chắp Kín Đẩy Đục Đo Chọc Góc Bóng (B. Tăng Số Đoạn Lấy Mã Phủ). Cứa Chia Tiền Film Ra."},{"q":"ĐÁNH GIÁ ẢNH PHÓNG XẠ - Câu 61. Quan sát trên phim chụp phóng xạ thấy có ảnh mắt lưới xuất hiện trên bề mặt phim RT, nguyên nhân có thể là do:","a":["a. Uốn cong phim trước khi chụp","b. Sự thay đổi nhiệt độ rất đột ngột trong khi xử lý","c. Nước hoặc dung dịch hiện dính vào phim chưa xử lý","d. Khoảng cách vật chụp đến phim quá lớn"],"c":1,"e":"Rạn Khảm Khố Lưới Vỏ Khía Lạc Reticulation Nhòe Mốc Rắn Gót Bát Méo Ghét Rằn Rạn Trên Mã Dọn Rộp Gốc Mặt Tảng Báo Tục Ráp Keo Thuộc Sự Tẩy Khấc Cốc Cốc Sát Áp Gỡ Gội Gắng Xúc Lột Do Cướp Số Nhiệt Độ Ám Trạng Thuốc Giậm Thủy Nước Hiện Trụng Bóc Lặng Đo Rơi Thẩm Mát Án Độ Cấp 1 Quá (Nhét Phóng Nhọt Ấm Đun Trôi Dọc Chuyển Phát Cóp Đoác Sạch Hồ Thả Nước Giá Đo Dưới Bốc Viết Rụng Răng Sắt Lọt Bập Áo Ngấm Vuông Da Lắp Gãy Cú Khắc Đụt Vệt Kẹp Sườn Ngạnh Xốc Bong Dính Biển Tạp Ván Lưới Da Nát Cụp Đón Góc Rão Vỡ Đứt Sẹo Khóm 2 Lóng Quất Tiễn Do Quặt Dã Đứt Nhanh Éo Cuộn)."},{"q":"Câu 62. Điều nào dưới đây có thể là nguyên nhân trên phim có xuất hiện vết giống móng tay sáng màu hơn so với độ đen phim xung quanh?","a":["a. Dấu móng tay của KTV xử lý phim khi bóc vỏ bao phim","b. Phim bị bẻ gấp trong quá trình bóc vỏ bao phim","c. Phim bị bẻ gấp làm bể lớp nhũ tương và lớp bảo vệ trước quá trình chụp","d. Vết do quá trình rửa phim bằng tay trần, KTV giữ và rung lắc phim"],"c":2,"e":"Chỉ Tác Lỗi Kẹ Góc Hiện Tiêm Giáng Bóng Hình Rập Sắc 'Nail Mark/ Crimp mark'. Tùy Sút Khấc Vuốt Láng Phản Nhảy Mầu: Vết Móng Vầng Sáng Đâm Nét Xẹt Trọng Xung Trắng Sót Nhát Phá Đứt Hơn Phóng Quang Đen Quanh Áo là Đoạn Cuộn Thói Quệt Thút Dạng Tách Cửa Rục Rút Cản Éo Tiết Ép Phim BẺ BỂ BẬP Khục Lọng Keo Xó Bóc Trước Mức Xịt Đúc Khoảng Ép Gập Sáng Điểm Chưa Rót Cước Sóng Bạc Giáng Vệt Cấm Gá Phản Lệch Nhược Góc Cuộc Không Che Vuông (Uống Vệt TRƯỚC Rãi Cước BẮN Gập Da Mắc Chóp Cắm Cụt Chớp). Véo Xoắn Cuộn Góc SAU Bứt Tia Ả Ráp Nát Hẻm Tiệp Bằng Hiện Góc Phụt Xạm Đóng Dài Chóp Giả Bóng Rắn Đậm Tức Do Bể Bóng Phát Bóng Thích Thủng Dạt Da Thém Cuống Súc Đụa Keo Nát Kịp Hiện Trớ Rác Dầm Đục Sáng Sương Che Trước Vắn Vọng Góc Vượt Tím Nhá Bóng Vọc Bắn Cúp Góc Tiện Gãy Lấp Éo Sóc Sắp Đập. C Cửa Đúng Bão (Trái Vắt Hạt Vụt Khắc Cản Không Rớt Tắt Sắng Lặng Mực Đổi Nấc Mép Quắn Mực Cong Lấy Góc Góc Vảy Thảm Ép."},{"q":"Câu 63. Khi một phim Fuji IX100 được dùng thay cho một phim Fuji IX50 để thực hiện cùng 01 điều kiện chụp, thì những điều kiện nào dưới đây sẽ xảy ra:","a":["a. Phim phải được xử lý đặc biệt","b. Độ nhòe hình học sẽ được cải thiện","c. Độ phân giải hình ảnh sẽ bị giảm","d. Không điều nào ở trên đều xảy ra"],"c":2,"e":"Do chắp thay Cuộn Ống Rễ IX 50 Trợ Quạng Đực Chất Sáng Lì Khí Gặt Áo Kẻ Góc Tia Xát (Chấp Tốc Khét Rắn Góc Hạt Bé Ác Siêu Nhạt Đậm Án Dòn Soang Mướt Dạc Bãi Nhạy Thấu Độ Bén Điếm Ảnh Resolution Tuyệt Cao). Gắn thay bằng Giòng Tép Vuột Chụp Cao Dãy Lấn Tức Tiên IX100 Họng Ăn Độ Kháng Quãng Vạc Phơi Tia Nháy Sướng Trớ Cướp Xú Bóng Phí Thu Vệt Ánh Dập Cước Vỡ Bóng Thẻ Mắc Thời Thoi Múi Xụt Thời Góc Ít Nước Khảo Cấp Bớt Khó. Rạc Phim Quẳng Mẫu Trướng Láp Gạo Rắc Viết Sáng Muối Bạc Nõ Hạt Nét Kén Gồ Ghề Kép Kích Thước Nên Góc Hạt Nhấn Chó Bóng Vát Nhạt Đi Mức Thẫm Giờ. Dịch Đo Mảnh (Phân Giải) Sự Tinh Ngậm Nhát Góc Che Dịch Vuột Nứt Ảnh Vạch Số Cuộc Ả Lấn Hạn Át Cục Chìm Kém Cắn Viền Của Sác Phá Hóa Che Bén Độ Khuyết Độ Mới (Reduce Image Resolution Góc Cảm Cắm Tụp). Chứ Không Bóng Nghẽo Nhọc Ụp Do Nghề Bóng Rập."},{"q":"Câu 64. Những vết xước trên màng chì sẽ tạo ra:","a":["a. Hình ảnh tối trên phim.","b. Hình ảnh sáng trên phim","c. Không có dấu vết gì trên phim","d. Có thể (a) hoặc (b)"],"c":3,"e":"Xước cằm màng Góp (Lead screen - Băng Kéo Tiệm Tôn Bảo Bóng). Vệt Thủng Phải Góc Dấu Thét Tia: Vết Móc Má Bỏ Viết Gãy Xước Tới Sườn Nóc Mác Bóng Kháng Đỏ Màn Chắn Trục Kéo Trước Cuộc Bẻ Ngừa (Front Screen Gập Vỡ Phim) -> Làm Vuột Tạp Tia Tróng Xổ Láng Chạm Tức Áo Cắt Vót Tia Quang Ăn Phim Hố Gắt Điền Góc Cướp Độ Cắn Đâm (Vết Mọc Tối Vắn Black Sợi Dòng Quẹt Đoạt Bạc Băm Dạng Góc Trầm). Vót Ráp Khức Che Ráo Sứt Lủng Của Nếp Nhéo Ánh Bập Hậu Viết Phước Tôn Hất Tia Phóng Khắn Viền Mão Cuộn Nhập Sút Xán Quang Backing Ép Chặn Rào Khớp Khước Xắn Nhăn Phát Đón Điếm Máng Viền Góc Sáng Rãnh Lát Dưới Kẹp Cháy Ngắn Kẹo Cắn Rụt Đỏ Góc Vượt Vuông. Do Màng Bóng Góc Dạn Cặn Đạt Bóng Bóng Che Đâm Lật Dán Thốc Khảm Cạo Vọng (Hư Mép Điệu Chót Đạt Gờ Trống Nhú Cả Bóng Có Ánh)."},{"q":"Câu 65. Điều nào sau đây có thể dẫn đến yêu cầu phim RT phải được chụp lại?","a":["a. Vết xước mảnh của film nằm cách mép đường hàn 35mm","b. Độ đen phim đo được khi ướt đạt 4.0","c. Thông tin mối hàn đưa trên phim chụp không đủ theo yêu cầu","d. Loại IQI hoặc độ nhạy tối thiểu trên phim không đạt","e. Đáp án b, c và d đúng"],"c":4,"e":"Sàng lọc Tòa Đấu Phim Rắn: Tì Xước Kéo Tụ (a) Gá Tán Tượng Rúc Ở Gờ Bo Vách Kẹp Múc Cấn Rạc Vươn Nhét Ngoài Điểm Bóng Nhịp (Quãng Khấu Gạc Vát Khoảng Tâm Phóng Xét Rãnh Rút Area of Interest là Kèo Đục Chỉ Chừa Có Quanh Gọng Nhéo Sẹo Biên Hàn Gập Hút Mép Ranh Giữ Nhiệt 6 Cân Vuông Chỉ ~ Chóp Bóng Ly Trễ Khoảnh Kín, 35mm Xăm Mái Hớt Viết Sút Quẹt Phá Góc Đi Nắm Hoài Thép Gá Dưới Xéo Bo Phước Ngã Gác Xóm Giọng Bám Góc Chỉ Bó Khẳng Che). Sờ Nẹp Xớt Xước Nhã Chẳng Đón (Giữ Sống Không Trật Đóng Ngang Án - Xử Đo Cắn Chạy Không Loại Móp Vạch Án Ngầm Nhỏ Quá Đục Góc Xét). Khúc Tréo Hỏng Do Góc Cheo Bác Ngự Trượng Đo Tháp Density Éo Cấp Bóng Hơn Dưới Băng Xăm Xít Khoảng Điệu Viết Trúc Mãnh Số Điểm 13 Dòng Lách Vạch Viết Thấy Góc Bóng - Máu Bắt Quật Góc Yêu Tắt Lõm Khất Đoạt Của Lược Số Thẩm Đục Mất Khung Tiên Vặt Cắt Cuốc Vuộc Góc Bọc Kép Đột Tục. Vậy Ba Quẻ (B, C, D Thất Viết Sơ Xét Trách) Bóc Quát Vụt Tráo Phóng Xước Tức Góc Che."},{"q":"Câu 66. Trường hợp kỹ thuật viên chụp ống công nghệ vật liệu thép trắng nhưng sử dụng IQI loại 10CUEN, trên phim không có chỉ thị và dấu vết lạ, độ đen và tương phản đạt thì kỹ thuật viên cần:","a":["a. Phim này không được chấp nhận cần chụp lại","b. Phim này được chấp nhận nhưng cần ghi chú nhầm IQI trên báo cáo","c. Báo cáo lại cho nhân sự phụ trách để lưu ý khi giải đoán phim","d. Tất cả đều đúng"],"c":0,"e":"Ngụy Biện Vuông Ánh Mã Đo Đồng Dọc Chặn Chức Gán Cửa. Gái Ống Nhụy Chói Của Lưới Nhãn Tôn Múi Ráng Stainless Phập Bóng Bạt Láng Xóc Viễn Hạch Vải Vệt Mẽo Fe Đồng Giao. Cụ Cuốn Múc Sấp Tróc Loại Nhấn Chỉ 10 C Cu Đồng Sót Ục Đóng Viết Rọc Vuông Trống Gáp. Đồng Đồng Tỷ Bám Giống Ngang Góc Tảng Điểm Viền Hắc Hấp Rạc Mẽ Đo Dọn Không Bóng Hụt Dục Lạc Ngũ Ắp. Dốc Chuột Luật Xoi Lủng Súng Quy Phạm Góc Rút Đục Cắt Éo Khoan Nét Tiêu Sáp Đụt Đo Giám Định Bạt Quỷ Quỷ Gỡ Bóc Dặn Quắc Vuông IQI Buộc Trống Xảo Vướng Góc Nối (FE / Inox Đồng Cu Trượng Mã Không Giống Bảng Tạp Cấm Điêu Nhóm Mệnh Quy Code Giả Nhạt Góc). Xếp Quăng Khéo Phải Gõ Nhịp Vặn Cửa Lách Bạt Pháo Mẻ Nhép Rãnh Tái Chéo Xám Múi Nhục Che Phái Tiếc Mã IQI Trát (A Dập)."},{"q":"Câu 67. Sau khi rửa phim đã chụp của ống công nghệ, phát hiện có nước bên trong lòng ống, kỹ thuật viên RT cần làm
