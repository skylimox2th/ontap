ánh sáng tự nhiên","Tất cả các ý trên"],"c":0,"e":"Góc nghiêng giúp dòng nước lướt ngang qua bề mặt để cuốn đi chất thấm dư, tránh xối thẳng góc $90^{\\circ}$ vào khuyết tật."},{"q":"Theo quy trình OCD-PR-12, nhiệt độ trong quá trình kiểm tra thẩm thấu được quy định như thế nào?","a":["Chỉ được tiến hành kiểm tra trong khoảng nhiệt độ từ 500C to 1250C","Tiến hành kiểm tra trong khoảng nhiệt độ từ 50C to 520C nhưng cũng có thể thấp hoặc cao hơn tùy theo điều kiện áp dụng","Chỉ tiến hành thực hiện kiểm tra ở khoảng nhiệt độ cho phép 50C đến 520C","Không có quy định cụ thể trong quy trình"],"c":0,"e":"Nước quá nóng sẽ làm giảm độ nhớt và hòa tan nhanh chất thấm, khiến nó dễ bị trôi ra khỏi lòng khuyết tật trong lúc rửa."},{"q":"According to the procedure P6/QA/22, the test surface should be cleaned by / Theo qui trình P6/QA/22, bề mặt \nkiểm tra phải được làm sạch bằng cách:","a":["Use an iron brush to brush it and use a lint cloth to clean it / dùng chổi sắt đánh qua và dùng vải xơ để lau lại.","Blotting paper can be used to dry the surface/ Có thể dùng giấy thấm để làm khô bề mặt","Under no circumstances should a grinding wheel be used to clean the surface/ trong mọi trường hợp không được sử dụng đá mài để làm sạch bề mặt","In most cases, surface cleaning is done using a wire brush or an organic solvent/ Trong hầu hết các trường hợp, việc làm sạch bề mặt được thực hiện bằng cách dùng chổi sắt hoặc dung môi hữu cơ"],"c":0,"e":"Lớp bột mịn của chất hiện hình tạo màng vi mao quản để hút ngược lượng chất thấm từ trong khe nứt loang lên bề mặt tạo độ tương phản."},{"q":"According to the procedure P6/QA/22, cleaning the residual penetrant on the surface / Theo qui trình kiểm tra \nchất lỏng thẩm thấu P6/QA/22, việc làm sạch chất thấm dư trên bề mặt:","a":["Normally using iron broom is satisfactory/ thông thường sử dụng chổi sắt là đạt yêu cầu","Use a few solvent-soaked fibers to clean / sử dụng vài xơ tẩm dung môi để lau","After cleaning, wait at least 5 minutes before spraying the development / sau khi làm sạch, chờ ít nhất 5 phút trước khi phun chất hiện","Do not spray solvent directly onto the test surface / không được phun trực tiếp dung môi lên bề mặt kiểm tra e. All of the above is possible / tất cả ở trên đều có thể"],"c":0,"e":"Đây là loại bình xịt bột mịn trắng pha dung môi hữu cơ bay hơi nhanh, cho độ nhạy phát hiện khuyết tật cao nhất tại công trường."},{"q":"According to the procedure P6/QA/22, the developer is sprayed onto the surface by / Theo qui trình kiểm tra \nchất lỏng thẩm thấu P6/QA/22, chất hiện được phun lên bề mặt bằng cách:","a":["Developer must be sprayed before the cleaning agent evaporates / Việc áp chất hiện phải được thực hiện trước khi chất làm sạch bay hơi","Spray into a thin and even film on the test surface / Phun thành màng mỏng và đều lên bề mặt kiểm tra","If possible, it would be better to have the currently watered developer spread evenly over the surface / Nếu có thể, chất hiện được tưới tràn đều lên bề mặt sẽ tốt hơn","Both b and c / Cả b và c e. All of above / Tất cả đáp án trên"],"c":0,"e":"Tránh việc các hạt bột hiện hình bị lắng đọng xuống đáy bình sau thời gian dài lưu kho, đảm bảo khi phun ra tỷ lệ bột và dung môi đồng đều."},{"q":"According to the procedure P6/QA/22, the test and evaluation of the indication is carried out / Theo qui trình \nkiểm tra chất lỏng thẩm thấu P6/QA/22, việc kiểm tra và đánh giá chỉ thị được thực hiện:","a":["Final test results will be assessed after a minimum of 20 minutes./ Kết quả kiểm tra sau cùng sẽ được đánh giá sau thời gian tối thiểu 20 phút.","The inspection should be carried out while spraying the penetrant / Việc kiểm tra cần được tiến hành trong lúc phun chất thấm","When the test surface is too large, the application of developer must be separated into small parts, but the application of the penetrant and the cleaning of the residual penetrant can be done once initially / Khi bề mặt kiểm tra quá lớn thì việc áp chất hiện phải được thực hiện từng phần, nhưng việc áp chất thấm và làm sạch chất thấm dư có thể được thực hiện một lần ban đầu","None of the above / Không có điều nào ở trên"],"c":0,"e":"Khoảng cách này giúp dung môi kịp bay hơi bớt một phần trên đường đi, giúp màng bột đáp xuống mối hàn mịn và mỏng đều, không bị đọng vũng."},{"q":"Which of the following information is required by the staff performing the liquid penetrant test before \ninterpreting penetrant indicators?/ Thông tin nào sau đây, nhân viên thực hiện kiểm tra thấm cần phải có trước \nkhi giải đoán các chỉ thị thấm?","a":["Review before the manufacturing process performed on the product / Xem xét trước quá trình chế tạo thực hiện trên sản phẩm","Techniques used in the process of applying and rinsing the penetrant / Kỹ thuật được sử dụng trong quá trình áp và rửa chất thấm","Method of cleaning before performing the test / Phương pháp làm sạch trước khi thực hiện kiểm tra","All of the above / Tất cả điều kể trên"],"c":0,"e":"Lớp bột quá dày tạo thành một bức tường ngăn chặn lượng chất thấm ít ỏi từ các vết nứt mịn lộ lên bề mặt màng hiện hình."},{"q":"Which requirements will mainly affect to determine the time needed to correct the quality of the discontinuity / \nYếu tố nào sau đây ảnh hưởng chính đến việc xác định thời gian cần thiết giải đoán bản chất bất liên tục","a":["The type of discontinuity to look for/ Loại bất liên tục cần tìm","Shape of test piece / Hình dạng của chi tiết kiểm tra","Dimensions of test piece / Kích thước của chi tiết kiểm tra","Surface roughness / Độ nhám của bề mặt"],"c":0,"e":"Giúp kỹ thuật viên nhận diện hướng loang và hình thái gốc của khuyết tật trước khi nó bị khuếch tán loang rộng và nhòe ra."},{"q":"Developer currently used in the procedure P6/QA/22 can be applied to the test surface by / Các chất hiện được \nsử dụng trong qui trình P6/QA/22 có thể được áp dụng lên bề mặt kiểm tra bằng cách:","a":["spray on the surface/ phun lên bề mặt","Irrigation on the surface/ tưới tràn lên bề mặt","pour or spill over the surface/ rót hay đổ tràn lên bề mặt","all of above/ tất cả ở trên"],"c":0,"e":"Theo quy trình Vietsovpetro, mốc 20 phút đảm bảo chất thấm từ các khuyết tật sâu và mịn nhất có đủ thời gian loang ra rõ ràng hoàn toàn."},{"q":"The issue related to retesting a sample that has previously been tested using the liquid penetrant method is:/ Vấn \nđề liên quan đến việc kiểm tra lại một mẫu trước đó đã được kiểm tra sử dụng phương pháp thấm lỏng là:","a":["The penetrant can produce convex droplets on the surface/ Chất thấm có thể tạo ra các giọt lồi trên bề mặt","The amount of dried penetrant remaining in the discontinuity may be insoluble and the driving test may be misleading / Lượng chất thấm đã khô còn trong bất liên tục có thể không hoà tan được và việc kiểm tra lại có thể bị sai lệch.","The penetrant will lose most of its color brightness / Chất thấm sẽ mất phần lớn độ sáng màu sắc của nó","All of above correct / Tất cả đều đúng"],"c":0,"e":"Để qua nhiều tiếng, chất thấm tiếp tục khuếch tán rộng ra màng bột xung quanh, làm phóng đại kích thước chỉ thị và sai lệch kích thước thực tế."},{"q":"According to procedure OCD-PR-12, post-cleaning shall be / Theo quy trình OCD-PR-12, mối hàn sau khi được \nkiểm tra thẩm thấu cần làm sạch:","a":["Phải được làm sạch các chất thấm / Penetrant shall be cleaned","Phải được làm sạch các chất hiện / Developer shall be cleaned","Cả a và b / Both a and b","Phải được làm sạch các chất thấm, chất hiện, chất làm sạch nếu có / Penetrant, developer and remover shall be cleaned if any"],"c":0,"e":"Tẩy sạch màng bột hiện hình trắng và thuốc thấm đỏ bám trên mối hàn kết cấu sau khi đã hoàn thành việc đánh giá."},{"q":"Khi chuẩn bị bề mặt để kiểm tra mối hàn theo quy trình phải làm sạch một khoảng rộng ra ở hai bên mối hàn, \nmỗi bên tối thiểu là:","a":["10 mm","20 mm","25 mm","50mm"],"c":0,"e":"Bột hiện có tính hút ẩm cao, nếu để lại trên công trình biển sẽ hấp thụ hơi muối gây ăn mòn kim loại và làm giảm độ bám dính của lớp sơn phủ sau này."},{"q":"Theo quy trình P6/QA/22, bề dày của lớp chất hiện không được vượt quá:","a":["10 µm","20 µm","Phụ thuộc vào kết quả thực nghiệm","Không có quy định về chiều dày lớp chất hiện"],"c":0,"e":"Theo các bộ tiêu chuẩn ASME B31.3 và ASME VIII Div 2, các vết $\\le 1.5mm$ thường do độ nhám bề mặt, biên hạt mịn không ảnh hưởng kết cấu nên được xếp vào nhóm không quan tâm."},{"q":"Which of the following discontinuities is most likely to be missed due to improper rinse techniques? / Bất liên \ntục nào sau đây dễ bị bỏ sót nhất do các kỹ thuật tảy rửa không phù hợp?","a":["a forging lap / Một vết chồng - lấp (vết gấp) trong quá trình rèn","deep pitting / Rỗ sâu","shallow and broad discontinuities / Các bất liên tục nông và rộng trên bề mặt","the rinse technique will not affect the detection of discontinuities / Kỹ thuật tẩy rửa không ảnh hưởng đến việc phát hiện các bất liên tục VII. TIÊU CHUẨN CHẤP NHẬN"],"c":0,"e":"Các biên hình học này giữ lại chất thấm cơ học trong lúc lau rửa, khi hiện hình vẫn tạo vết đỏ nhưng bên dưới không hề có nứt gãy cơ học."},{"q":"In the absence of an official evaluation standard, rejection or acceptance of penetrant product should be based \non: / Khi không có một tiêu chuẩn đánh giá chính thức thì việc loại bỏ hoặc chấp nhận sản phẩm kiểm tra thẩm \nthấu nên dựa trên:","a":["Technical qualifications of the technician/ Trình độ chuyên môn của kỹ thuật viên","Design of the product and its intended use/ Thiết kế của sản phẩm và việc sử dụng dự kiến của nó","Appropriate penetrant standards/ Tiêu chuẩn chất thấm thích hợp","Appropriate development standards/ Tiêu chuẩn chất hiện thích hợp"],"c":0,"e":"Tiêu chuẩn yêu cầu phải kiểm tra lại để khẳng định chính xác đó là chỉ thị thật (khuyết tật) hay chỉ thị không liên quan."},{"q":"According to AWS D1.1 2020, table 8.1, undercut depth on main structure subjected to dynamic loads \n(Cyclically loaded) / Theo tiêu chuẩn AWS D1.1 2020, bảng 8.1, độ sâu cháy cạnh (undercut) trên kết cấu chính \nchịu tải trọng động (Cyclically loaded):","a":["Should not exceed 0.25mm in any direction of stress/ Không được vượt quá 0.25mm với hướng ứng suất bất kỳ","Should not exceed 1mm/ Không được vượt quá 1mm","Should not exceed 2mm/ Không được vượt quá 2mm","This criterion does not apply/ Không áp dụng tiêu chí này"],"c":0,"e":"Do tính chất loang thấm (bleeding action) của chất lỏng khuếch tán rộng ra màng bột hiện xung quanh."},{"q":"Theo tiêu chuẩn AWS D1.1 2020, bảng 8.1, độ sâu cháy cạnh (undercut) trên chi tiết dày 20mm chịu tải trọng \nđộng (Cyclically loaded) được đánh giá:/ According to the AWS D1.1 2020 standard, table 8.1, the undercut \ndepth on a 20mm thick part that is dynamically loaded is assessed:","a":["Should not exceed 1mm/ Không được vượt quá 1mm","Not to exceed 2mm for 50mm length on any 300mm weld/ Không được vượt quá 2mm cho chiều dài 50mm trên đoạn mối hàn 300mm bất kỳ","Not to exceed 2mm on any part of the weld length/ Không được vượt quá 2mm trên đoạn bất kỳ của chiều dài mối hàn","This criterion does not apply/ Không áp dụng tiêu chí này"],"c":0,"e":"Mọi Code quốc tế đều quy định kích thước vết loang đỏ đo được thực tế trên màng bột trắng chính là căn cứ pháp lý để chấp nhận hay loại bỏ."},{"q":"According to AWS D1.1 2020 standard, table 10.15 for porosity / Theo tiêu chuẩn AWS D1.1 2020, bảng 10.15 \nđối với rỗ khí:","a":["CJP groove welds in butt joints transverse to the direction of computed tensile stress shall have no piping porosity / Các mối hàn đối đầu vát mép thấu hoàn toàn, nằm ngang so với hướng ứng suất kéo phải không có rỗ khí dạng ống","The density of piping porosity in fillet welds should not exceed 1 per 4 in. (100 mm) weld length and maximum diameter should not exceed 3/32 in. (2.5 mm)/ Mật độ của các rỗ khí dạng ống trong các mối hàn fillet không vượt quá 1 cái trên mỗi 4 in. (100 mm) độ dài mối hàn và đường kính cực đại không vượt quá 3/32 in. (2.5 mm)","Both a and b are all correct/ Cả a và b đều đúng","This criterion does not apply/ Không áp dụng tiêu chí này"],"c":0,"e":"Định nghĩa hình học chuẩn hóa áp dụng cho các khuyết tật dạng sắc nhọn nguy hiểm như vết nứt, không ngấu, không thấu."},{"q":"According to the AWS D1.1 2020 standard, table 10.15 / Theo tiêu chuẩn AWS D1.1 2020, bảng 9.16:","a":["Any crack is not acceptable regardless of size and location/ bất kỳ vết nứt nào đều không được chấp nhận bất chấp kích thước và vị trí","complete penetration between the weld layers, between the weld metal and the base metal is required / cần phải ngấu hòan toàn giữa các lớp hàn, giữa kim loại hàn và kim loại cơ bản.","Undercut does not exceed 1/32 in. (1 mm) for the main structure / Cháy cạnh không vượt quá 1/32 in. (1 mm) đối với kết cấu chính.","All of above correct/ Tất cả đều đúng"],"c":0,"e":"Định nghĩa hình học chuẩn hóa áp dụng cho khuyết tật dạng cầu, elip như rỗ khí, ngậm xỉ nhỏ."},{"q":"Theo qui trình kiểm tra chất lỏng thẩm thấu P6/QA/22, tiêu chuẩn chấp nhận đối với mối hàn ống công nghệ áp \ndụng:","a":["ASME B31.3:","ASME VIII","AWS D1.1","Hoặc các tiêu chuẩn khác theo yêu cầu khách hàng e. Cả a. và d."],"c":0,"e":"Nếu các chỉ thị nằm thẳng hàng và khoảng cách giữa chúng nhỏ hơn hoặc bằng 1.5mm, chúng phải được tính toán gộp lại thành một chỉ thị dài liên tục."},{"q":"Theo ASME B 31.3 2022, chỉ thị nào sau đây đánh giá là loại bỏ bất kể chiều dài?","a":["Nứt","Không ngấu","Không thấu","Tất cả câu trên đều sai"],"c":0,"e":"Dùng để kiểm soát mật độ phân bổ của rỗ khí; nếu có quá nhiều chỉ thị tròn thẳng hàng trong một khoảng khoảng cách quy định sẽ bị loại bỏ."},{"q":"Theo ASME B 31.3 2022, chỉ thị có kích thước lớn hơn 1.5 mm sẽ được đánh giá là:","a":["Chấp nhận.","Chỉ thị không thích hợp","Chỉ thị liên quan.","Loại bỏ."],"c":0,"e":"Theo Bảng 6.1 AWS D1.1, vết nứt là nguồn gốc gây tập trung ứng suất cao và dẫn tới nứt gãy giòn thảm họa kết cấu, do đó dung sai bằng không."},{"q":"Theo tiêu chuẩn ASME B31.3 2022, chỉ thị nào sau đây đánh giá là không đạt:","a":["Cháy cạnh vượt quá 1mm","Cháy cạnh có chiều dài 1.5 mm","Chỉ thị tròn có chiều dài 5 mm","Cháy cạnh rộng 1mm có chiều dài 6 mm."],"c":0,"e":"Đường ống chịu áp lực cao vận hành dầu khí tuyệt đối cấm các khuyết tật sắc nhọn dạng đường (nứt, không ngấu) nhằm tránh nguy cơ rách ống dưới áp lực làm việc."},{"q":"Theo ASME B31.3 2022, các mối hàn có chỉ thị với kích thước sau đây sẽ được đánh giá là không đạt:","a":["Chỉ thị không thích hợp theo dạng đường thẳng","Chỉ thị thích hợp theo dạng đường hoặc chỉ thị tròn có kích thước 4.5 mm","Có 5 chỉ thị tròn thích hợp trên cùng 1 đường thẳng cách nhau 1.4 mm (tính từ cạnh của chỉ thị)","Tất cả các chỉ thị có kích thước 1.6 mm."],"c":0,"e":"Chỉ thị tròn (rỗ khí) có dung sai nới lỏng hơn chỉ thị đường, chỉ bị loại bỏ khi kích thước quá lớn làm hao hụt chiều dày thành ống hiệu dụng."},{"q":"Theo tiêu chuẩn ASME B31.1 chỉ thị liên quan nào sau đây đánh giá là không đạt?","a":["Nứt","Cháy cạnh","Thủng đáy","Tất cả các câu trên đều không đạt VIII. KHUYẾT TẬT – HÌNH DẠNG KHUYẾT TẬT"],"c":0,"e":"Xỉ hàn nóng chảy bị kẹt lại có hình thái bất định hình, không thẳng nét và sắc bén như vết nứt cơ học hay không ngấu."},{"q":"The term used to define a defect is / Thuật ngữ được sử dụng để định nghĩa một khuyết tật là:","a":["Any discontinuity with a volume greater than 2 cm3/ Bất kỳ bất liên tục có thể tích lớn hơn 2 cm3","Any abnormal condition in the product / Bất kỳ điều kiện bất thường trong sản phẩm","Any change in material structure / Bất kỳ thay đổi nào trong cấu trúc vật liệu","Their size exceeds the allowed standard./ Kích thước của chúng vượt quá tiêu chuẩn cho phép."],"c":0,"e":"Rỗ khí dạng hốc bong bóng tròn chứa lượng chất thấm lớn nên khi hút ngược lên tạo ra vết chỉ thị tròn, đậm đặc."},{"q":"Which of the following discontinuities could be classified as a finishing processing discontinuity?/ Loại bất liên \ntục nào dưới đây có thể được phân loại là một bất liên tục trong quá trình hoàn thành.","a":["fatigue crack/ Nứt mỏi","stress corrosion crack/ Nứt do mài mòn","Lamination/ Tách lớp","heat treat crack/ Nứt do xử lý nhiệt"],"c":0,"e":"Phát sinh do nhiệt lượng không đủ hoặc thao tác mỏ hàn không đều khiến kim loại lỏng không nóng chảy bám dính vào vách rãnh hàn, tạo khe hở chạy dọc biên."},{"q":"Which of the following discontinuities could be classified as a service induced discontinuity? /Loại bất liên tục \nnào dưới đây có thể  được phân loại là một bất liên tục phát sinh trong quá trình sử dụng?","a":["fatigue crack/ Nứt mỏi","porosity/ Rỗ","machining ten/ Xé do gia công","lap/ Gấp"],"c":0,"e":"Cháy cạnh tạo thành rãnh khuyết hở dọc biên hàn, dễ bẫy chất thấm dư nếu bước lau rửa không kỹ."},{"q":"The penetrant indication of a overlap will be normally a / Chỉ thị thẩm thấu của một vết chườm mép thông \nthường là:","a":["round or nearly round indication/ Chỉ thị tròn hoặc gần tròn","cluster of indications/ Một đám các chỉ thị","continuous line/ Đường liên tục","dotted line/ đường đứt quãng"],"c":0,"e":"Nứt mỏi phát triển chậm dưới tải trọng lặp (sóng biển), đường nứt chạy len lỏi qua biên thớ kim loại nên rất khít và ngoằn ngoèo."},{"q":"When conducting a penetrant test, spherical indications on the surface of a part could be indicative of / khi thực \nhiện kiểm tra thẩm thấu, các chỉ thị có hình dạng tròn trên bề mặt được xem là gì","a":["fatigue cracks/ Nứt mỏi","porosity/ Rỗ","weld laps/ Các vết gấp do hàn","hot tears/ Xé nóng"],"c":0,"e":"Bản chất bề mặt kim loại hoàn toàn không có khuyết tật, vết đỏ xuất hiện hoàn toàn do lỗi chủ quan của con người."},{"q":"Which of the following is a discontinuity that might be found in a welded fabrication? /Điều nào sau đây là sự \ngián đoạn có thể được tìm thấy trong chế tạo hàn?","a":["Shrinkage/ co ngót","lack of fusion/ không ngấu","seam/ đường khâu","laps/ chồng lấp"],"c":0,"e":"Làm nhẵn bề mặt giúp gạt bỏ các \"bẫy hình học\" tự nhiên, giúp thao tác lau chất thấm dư đạt hiệu quả tối đa."},{"q":"Which of the following is a discontinuity that might be found in rolled bar stock?/ Điều nào sau đây là sự gián \nđoạn có thể được tìm thấy trong thanh cuốn?","a":["Shrinkage/ co ngót","Bleedout/ khuyết","Laps/ chồng lấp","Undercut/ cháy cạnh"],"c":0,"e":"Thép không gỉ dòng Austenitic nhạy cảm với ion Clo và Lưu huỳnh. Nếu dùng hóa chất chứa các chất này sẽ gây ăn mòn rỗ gỉ và nứt giòn dưới ứng suất (SCC) phá hủy thiết bị."},{"q":"Which of  the following is a discontinuity that might be found in rolled plate?/ Điều nào sau đây là sự gián đoạn \ncó thể được tìm thấy trong tấm cuốn?","a":["laminations/ tách lớp","shrinkage/ co ngót","lack of fusion/ không đồng nhất","undercut/ cháy cạnh"],"c":0,"e":"Thường xuất hiện do ứng suất nhiệt cục bộ quá cao khi mài quá tay hoặc nhiệt luyện sai quy trình, làm rách bề mặt kim loại thành nhiều hướng dạng mạng nhện."},{"q":"Which  of  the  following  is  a  discontinuity that might be found in rolled plate stock?/ Điều nào sau đây là sự \ngián đoạn có thể được tìm thấy trong ống dạng tấm cuộn?","a":["shrinkage cracks/ vết nứt co ngót","inclusions/ ngậm tạp chất","forging laps/ khuyết tật tách lớp rèn","blow holes/ lỗ thủng"],"c":0,"e":"Khi ngắt hồ quang đột ngột, vũng hàn nguội quá nhanh bị co ngót thể tích mạnh, sinh ra ứng suất kéo xé rách tâm vũng hàn."},{"q":"When improper processing causes inspection difficulties, what should the inspector do? /Khi xử lý không đúng \ncách gây khó khăn cho việc kiểm tra thì kiểm định viên phải làm gì?","a":["Swab parts with a solvent/ lau các bộ phận bằng dung môi","Use a correct bleedback procedure/ sử dụng một quy trình rỉ chất hiện chính xác","Erase nonrelevant fluorescence/ xóa chỉ thị huỳnh quang không liên quan","Reprocess the part/ xử lý lại vật kiểm"],"c":0,"e":"Lực co ngót thể tích hướng tâm kéo đều ra xung quanh tạo nên hình dáng chỉ thị nứt chân vịt hay hình sao đặc trưng."},{"q":"The part is a 13 mm (0.5 in.) thick aluminum plate with a V weld. Description — the indication appears in an \narea that is somewhat dish shaped. The indication extends out from the center in a spoke formation. The \nindication is:/ Bộ phận này là một tấm nhôm dày 13 mm (0,5 in.) với mối hàn chữ V. Mô tả - dấu hiệu xuất hiện \ntrong khu vực có hình dạng giống như dạng đĩa. Dấu hiệu kéo dài ra từ trung tâm theo hình nan hoa. Dấu hiệu \nlà:","a":["shrinkage/ co ngót","nonrelevant/ không liên quan","a quench crack/ một vết nứt dập tắt","a crater crack/ vết nứt sao"],"c":0,"e":"Thể tích hốc khuyết tật càng lớn thì lượng thuốc thấm tích tụ bên trong càng nhiều, khi chạm vào bột hiện sẽ liên tục phun trào ra tạo vết loang rộng nhanh chóng."},{"q":"A continuous linear indication can be caused by which of the following type of discontinuities? /Một dấu hiệu \ntuyến tính liên tục có thể được gây ra bởi loại bất liên tục nào dưới đây?","a":["Porosity/ Rỗ","slag inclusions/ Ngậm xỉ","pitting/ Rỗ ăn mòn.","Cracks/ vết nứt"],"c":0,"e":"Vết nứt tạo thành một khe rách cơ học chạy dài liên tục trên bề mặt. Khi thuốc thấm được hút ngược lên sẽ hiển thị chính xác một dấu hiệu tuyến tính liên tục."},{"q":"A crack type discontinuity will generally appear as:/ Bất liên tục nứt nhìn chung sẽ xuất hiện dưới dạng:","a":["a round indication/ Một dấu hiệu tròn","a continuous line, either straight or jagged/ một đường liên tục, thẳng hoặc lởm chởm","a straight, single solid line/ một đường thẳng, nét liền","random round or elongated holes / lỗ tròn hoặc dài ngẫu nhiên IX. HỒ SƠ"],"c":0,"e":"Đây là hình thái phản chiếu trực quan đặc trưng của vết nứt vật liệu dọc theo đường ứng suất phá hủy trên nền chất hiện trắng."},{"q":"According to procedure OCD-PR-12, When discontinuities are detected and judged to be eliminated, the \ntechnician shall perform a sketch of defects in any form? / Theo quy trình OCD-PR-12, khi phát hiện bất liên \ntục và được đánh giá cần loại bỏ, kỹ thuật viên phải thực hiện vẽ sơ đồ khuyết tật (sketch of defects) theo form \nmẫu nào?","a":["QF-20 Rev.1","QF-20 Rev.0","QF-16 Rev.1","QF-16 Rev.2"],"c":0,"e":"Theo quy trình hệ thống quản lý chất lượng tại Xí nghiệp Xây lắp Vietsovpetro, form mẫu QF-16 là biểu mẫu biên bản chuẩn hóa bắt buộc dùng để vẽ sơ đồ vị trí (sketch) và ghi nhận thông số khuyết tật phục vụ lưu trữ hồ sơ hoàn công (As- built)."},{"q":"According to procedure P6/QA/22, report the results of the penetrant test in formated form /Theo quy trình \nP6/QA/22, báo cáo kết quả kiểm tra chất lỏng thẩm thấu lập theo form mẫu nào:","a":["QF-16 Rev.2","QF-16 Rev.1","QF-20 Rev.1","QF-13 Rev.0"],"c":0,"e":"Việc sử dụng mã ký hiệu chuẩn hóa dựa theo thuật ngữ tiếng Anh chuyên ngành NDT quốc tế giúp đảm bảo tính nhất quán dữ liệu, giúp các kỹ sư giám sát và các bên đăng kiểm quốc tế (VR, DNV, Lloyd's) đọc hiểu báo cáo ngay lập tức mà không bị nhầm lẫn ngôn ngữ."}]} ;

    // BẠN CÓ THỂ ĐỔI MẬT KHẨU VÀO WEB Ở ĐÂY NHÉ:
    const MAT_KHAU_TRUY_CAP = "2026"; 
    // =========================================================================

    let subjects = JSON.parse(localStorage.getItem('pro_subjects')) || {};
    
    // Nạp dữ liệu mặc định
    if (Object.keys(subjects).length === 0) {
        subjects = KHO_DU_LIEU;
        localStorage.setItem('pro_subjects', JSON.stringify(subjects));
    }

    let currentSubject =[];
    let currentIdx = 0;
    let selectedOption = null;
    let results =[];
    let pendingSubjectToLaunch = "";

    function showScreen(id) {
        document.querySelectorAll('#app > div:not(#password-modal)').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'home-screen') renderSubjects();
    }

    function renderSubjects() {
        const list = document.getElementById('subject-list');
        list.innerHTML = '';
        Object.keys(subjects).forEach(name => {
            const div = document.createElement('div');
            div.className = 'bg-card p-5 rounded-xl flex justify-between items-center';
            div.innerHTML = `
                <div>
                    <div class="font-bold text-lg text-blue-300">${name}</div>
                    <div class="text-sm text-slate-400">${subjects[name].length} Câu hỏi</div>
                </div>
                <div class="flex gap-1 md:gap-3 items-center">
                    <button onclick="requestQuizAccess('${name}')" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold transition">Vào học</button>
                    <!-- NÚT SỬA (MÀU VÀNG) -->
                    <button onclick="openEditor('${name}')" title="Sửa dữ liệu môn này" class="text-yellow-400 hover:bg-yellow-400/20 p-2 md:p-3 rounded-lg transition"><i class="fas fa-edit"></i></button>
                    <!-- NÚT XÓA (MÀU ĐỎ) -->
                    <button onclick="deleteSub('${name}')" title="Xóa môn này" class="text-red-400 hover:bg-red-400/20 p-2 md:p-3 rounded-lg transition"><i class="fas fa-trash"></i></button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    // ====== HỆ THỐNG MẬT KHẨU ======
    function requestQuizAccess(name) {
        // Kiểm tra xem trình duyệt đã nhập pass trong phiên này chưa
        if (sessionStorage.getItem('isUnlocked_PAUT')) {
            startQuiz(name);
        } else {
            pendingSubjectToLaunch = name;
            document.getElementById('pass-input').value = "";
            document.getElementById('password-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('pass-input').focus(), 100);
        }
    }

    function verifyPass() {
        const p = document.getElementById('pass-input').value;
        if(p === MAT_KHAU_TRUY_CAP) {
            sessionStorage.setItem('isUnlocked_PAUT', 'true');
            document.getElementById('password-modal').classList.add('hidden');
            startQuiz(pendingSubjectToLaunch);
        } else {
            alert("❌ Mật khẩu không chính xác! Vui lòng thử lại.");
            document.getElementById('pass-input').value = "";
            document.getElementById('pass-input').focus();
        }
    }

    function closePassModal() {
        document.getElementById('password-modal').classList.add('hidden');
    }

    // Bắt sự kiện phím Enter cho ô mật khẩu
    document.getElementById('pass-input').addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            verifyPass();
        }
    });

    // ====== HỆ THỐNG BIÊN SOẠN / CẬP NHẬT ======
    function openEditor(editName) {
        if(editName !== "") {
            // Trường hợp BẤM NÚT SỬA: Lôi dữ liệu ra để cập nhật
            document.getElementById('editor-title').innerText = "Cập nhật Môn Học / Đề Thi";
            document.getElementById('subject-name').value = editName;
            // Ép chuỗi JSON hiển thị đẹp để người dùng dễ nhìn
            document.getElementById('json-input').value = JSON.stringify(subjects[editName], null, 4);
        } else {
            // Trường hợp BẤM NÚT THÊM MỚI
            document.getElementById('editor-title').innerText = "Thêm Môn Học Mới";
            document.getElementById('subject-name').value = "";
            document.getElementById('json-input').value = "";
        }
        showScreen('editor-screen');
    }

    function saveSubject() {
        const name = document.getElementById('subject-name').value;
        const json = document.getElementById('json-input').value;
        if(name.trim() === "") { alert("Vui lòng nhập tên môn học!"); return; }
        
        try {
            subjects[name] = JSON.parse(json);
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            showScreen('home-screen');
            alert("✅ Đã lưu môn học thành công!");
        } catch(e) { alert("❌ Lỗi định dạng JSON! Hãy kiểm tra lại dấu ngoặc và dấu phẩy."); }
    }


    // ====== HỆ THỐNG THI TRẮC NGHIỆM ======
    function startQuiz(name) {
        currentSubject = subjects[name];
        currentIdx = 0;
        results = new Array(currentSubject.length).fill(null);
        showScreen('quiz-screen');
        renderGrid();
        loadQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('question-grid');
        grid.innerHTML = '';
        currentSubject.forEach((q, i) => {
            const box = document.createElement('div');
            let extraClass = '';
            
            if (i === currentIdx) { extraClass = 'active'; } 
            else if (typeof results[i] === 'number') {
                if (results[i] === q.c) { extraClass = 'correct-nav'; } 
                else { extraClass = 'wrong-nav'; }
            } 
            else if (results[i] === 'skipped') { extraClass = 'skipped'; }

            box.className = `nav-box ${extraClass}`;
            box.innerText = (i + 1).toString().padStart(2, '0');
            box.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(box);
        });
    }

    function loadQuestion() {
        selectedOption = null;
        const q = currentSubject[currentIdx];
        document.getElementById('cur-idx-text').innerText = currentIdx + 1;
        document.getElementById('total-idx-text').innerText = currentSubject.length;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('hint-box').classList.add('hidden');
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const hasAnswered = typeof results[currentIdx] === 'number';

        q.a.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item p-4 rounded-lg flex items-center gap-3';
            div.innerHTML = `<div class="w-5 h-5 border-2 border-slate-500 rounded-full flex-shrink-0 flex items-center justify-center"></div> <span>${opt}</span>`;
            
            if (hasAnswered) {
                div.style.cursor = 'default';
                if (i === q.c) {
                    div.classList.add('correct');
                    div.querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
                }
                if (i === results[currentIdx] && i !== q.c) {
                    div.classList.add('wrong');
                    div.querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
                }
            } else {
                div.className += ' cursor-pointer';
                div.onclick = () => selectOption(div, i);
            }
            container.appendChild(div);
        });

        if (hasAnswered) { showHint(); }
        renderGrid();
    }

    function selectOption(el, i) {
        if (typeof results[currentIdx] === 'number') return;
        document.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('div').innerHTML = '';
        });
        el.classList.add('selected');
        el.querySelector('div').innerHTML = '<div class="w-full h-full bg-blue-500 rounded-full scale-75"></div>';
        selectedOption = i;
    }

    function checkAnswer() {
        if(selectedOption === null) return; 
        if(typeof results[currentIdx] === 'number') return; 

        const q = currentSubject[currentIdx];
        const items = document.querySelectorAll('.option-item');
        results[currentIdx] = selectedOption;
        
        if (selectedOption === q.c) {
            items[selectedOption].classList.add('correct');
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        } else {
            items[selectedOption].classList.add('wrong'); 
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
            items[q.c].classList.add('correct'); 
            items[q.c].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        }

        items.forEach(item => item.onclick = null);
        showHint();
        renderGrid();
    }

    function showHint() {
        const box = document.getElementById('hint-box');
        if(currentSubject[currentIdx].e) {
            box.innerText = "Gợi ý: " + currentSubject[currentIdx].e;
            box.classList.remove('hidden');
        }
    }

    function nextQuestion() {
        if(typeof results[currentIdx] !== 'number') { results[currentIdx] = 'skipped'; }

        if(currentIdx < currentSubject.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            let firstSkippedIndex = results.findIndex(r => r === 'skipped' || r === null);
            if(firstSkippedIndex !== -1) {
                currentIdx = firstSkippedIndex;
                loadQuestion();
                alert("🔄 Đã hết 1 lượt! Hệ thống tự động quay lại các câu bạn đã bỏ qua (ô màu vàng).");
            } else {
                alert("🎉 Tuyệt vời! Bạn đã hoàn thành toàn bộ câu hỏi trong bộ đề này.");
            }
        }
        renderGrid();
    }

    function prevQuestion() {
        if(currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function deleteSub(name) {
        if(confirm(`⚠️ Bạn có chắc chắn muốn xóa khóa học "${name}" không?`)) {
            delete subjects[name];
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            renderSubjects();
        }
    }

    renderSubjects();
</script>
</body>
</html>
