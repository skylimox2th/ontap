<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Thi Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .bg-card { background: #1e293b; border: 1px solid #334155; }
        .option-item { background: rgba(30, 41, 59, 0.5); border: 1px solid #475569; transition: 0.3s; }
        .option-item:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .option-item.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        .nav-box { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #475569; font-size: 13px; }
        .nav-box.active { background: #3b82f6; border-color: #3b82f6; font-weight: bold; }
        .nav-box { border-radius: 4px; }
        .nav-box.correct-nav { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .nav-box.wrong-nav { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .nav-box.skipped { border-color: #eab308; color: #eab308; background: rgba(234, 179, 8, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto">
    <!-- MÀN HÌNH CHÍNH -->
    <div id="home-screen">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center"><i class="fas fa-graduation-cap mr-2"></i>KHO KHÓA HỌC</h1>
        <div id="subject-list" class="grid gap-4 mb-8"></div>
        <button onclick="showScreen('editor-screen')" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition shadow-lg">+ Thêm Môn Học Mới</button>
    </div>

    <!-- MÀN HÌNH TRÌNH BIÊN SOẠN -->
    <div id="editor-screen" class="hidden">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Cấu hình môn học</h2>
        <div class="bg-card p-6 rounded-xl">
            <input type="text" id="subject-name" placeholder="Tên môn học (Ví dụ: Cơ khí AWS)" class="w-full bg-slate-800 border border-slate-600 p-3 rounded mb-4 focus:outline-none focus:border-blue-500">
            <textarea id="json-input" rows="12" placeholder='Dán JSON câu hỏi vào đây...' class="w-full bg-slate-800 border border-slate-600 p-3 rounded text-sm font-mono focus:outline-none focus:border-blue-500"></textarea>
            <div class="flex gap-4 mt-6">
                <button onclick="saveSubject()" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Lưu lại</button>
                <button onclick="showScreen('home-screen')" class="flex-1 bg-slate-600 p-3 rounded-lg font-bold">Hủy</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="hidden">
        <div class="mb-4 text-yellow-500 font-bold uppercase tracking-wider">Câu hỏi <span id="cur-idx-text">1</span> / <span id="total-idx-text">10</span></div>
        <div class="bg-card p-6 rounded-lg mb-6 border-l-4 border-blue-500">
            <div id="question-text" class="text-xl leading-relaxed"></div>
        </div>
        <div id="options-container" class="space-y-3 mb-8"></div>
        <div class="flex flex-wrap gap-2 justify-between border-t border-slate-700 pt-6">
            <div class="flex gap-2">
                <button onclick="prevQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">← Trước</button>
                <button onclick="showHint()" class="bg-yellow-600/20 text-yellow-500 border border-yellow-500/50 px-6 py-2 rounded text-sm font-medium hover:bg-yellow-600 hover:text-white transition">💡 Gợi ý</button>
            </div>
            <button onclick="checkAnswer()" class="bg-blue-600 px-10 py-2 rounded font-bold shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:bg-blue-500">Trả lời</button>
            <div class="flex gap-2">
                <button onclick="showScreen('home-screen')" class="bg-slate-700 px-4 py-2 rounded text-sm font-medium">Dừng làm bài</button>
                <button onclick="nextQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">Tiếp →</button>
            </div>
        </div>
        <div id="hint-box" class="hidden mt-6 p-4 bg-blue-900/30 border border-blue-500/30 rounded-lg text-blue-200 italic text-sm"></div>
        <div class="mt-10">
            <div class="text-sm font-bold mb-4 uppercase text-slate-400">Danh sách câu</div>
            <div id="question-grid" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // DỮ LIỆU F12 ĐỂ ĐÂY
    // Hãy bôi đen toàn bộ chữ DÁN_CHỖ_NÀY và bấm Ctrl + V (hoặc chuột phải Paste)
    // Chú ý: Đừng xóa dấu chấm phẩy ; ở phía sau cùng nhé
    // =========================================================================
    
    const KHO_DU_LIEU = {"ngan hang cau hoi PT":[{"q":"Điều kiện nào sẽ ảnh hưởng đến tốc độ và phạm vi mà chất thấm lỏng đi vào các vết nứt, nẻ và các khe mở nhỏ khác?","a":["Độ cứng của mẫu vật kiểm tra","Điều kiện, tình trạng của bề mặt mẫu vật kiểm tra","Màu sắc của chất thấm","Độ dẫn điện của mẫu kiểm tra"],"c":1,"e":""},{"q":"Đâu là một phân loại được dùng phổ biến cho chất thấm?","a":["Chất thấm có thể nhũ tương sau","Chất thấm phi sắt","Chất thấm tẩm thực hoá học","Chất thấm phi nước"],"c":0,"e":""},{"q":"Một phương pháp được chấp nhận chung để loại bỏ chất thấm dư có thể rửa sạch - không phải bằng nước là :","a":["Nhúng đi nhúng lại mẫu kiểm tra trong một chất làm sạch","Nhúng kỹ mẫu kiểm tra trong nước tẩy rửa nóng","Thổi sạch chất thấm dư khỏi bề mặt của bộ phận bằng khí nén","Lau và làm sạch cẩn thận mẫu kiểm tra bằng một rẻ thấm ẩm chất làm sạch"],"c":3,"e":""},{"q":"Tất cả các bộ phận sau đây có thể kiểm tra được bằng phương pháp thấm lỏng, ngoại trừ :","a":["Một sản phẩm sắt đúc","Một sản phẩm nhôm rèn","Một bộ phận làm bằng một vật liệu chất dẻo xốp","Một bộ phận làm bằng một vật liệu không xốp"],"c":2,"e":""},{"q":"Bất liên tục nào sau đây có thể tìm thấy bằng phương pháp kiểm tra thấm?","a":["Một vết nứt bề mặt","Một vết nứt nằm dưới bề mặt","Một ngậm xỉ bên trong","Không phải các loại trên"],"c":0,"e":""},{"q":"Cách nào sau đây, nói chung, là một phương pháp dễ được chấp nhận hơn cho việc làm sạch bộ phận trước khi kiểm tra thấm?","a":["Bắn cát (Phun cát)","Chải bằng sợi cứng","Mài","Giảm mỡ bằng hơi"],"c":3,"e":""},{"q":"Tất cả các phương pháp sau đây được dùng phổ biến để làm sạch bộ phận trước khi kiểm tra thấm, ngoại trừ ;","a":["Giảm mỡ bằng hơi","Dung môi lỏng","Chải bằng sợi cứng","Chất làm sạch có tính kiềm"],"c":2,"e":""},{"q":"Các chất dầu dùng cho quá trình cắt có thể được loại bỏ một cách hiệu quả khỏi bộ phận trước khi kiểm tra thấm bằng :","a":["Nung nóng trước","Giảm mỡ bằng hơi","Rửa sạch bằng nước","Tất cả các cách trên"],"c":1,"e":""},{"q":"Loại chất gây bẩn phổ biến trong chất lỏng thấm huỳnh quang là :","a":["Các chất hàn kim loại","Dầu","Các chất tẩy rửa ( từ quá trình làm sạch)","Nước"],"c":3,"e":""},{"q":"Ánh sáng đen, với một màng lọc có chức năng phù hợp đặt đúng chỗ, được dùng cho kiểm tra thấm huỳnh quang, có thể gây ra hư hỏng vĩnh viễn đến :","a":["Các mô của cơ thể người","Mắt người","Các tế bào máu người","Không điều nào ở trên cả"],"c":3,"e":""},{"q":"Tất cả các nguyên lý kiểm tra cơ bản sau đây áp dụng cho các phương pháp thấm, ngoại trừ :","a":["Chất thấm phải đi vào bất liên tục để tạo thành chỉ thị","Các chỉ thị phát sáng khi được chiếu bằng ánh sáng đen","Một thời gian thấm dài hơn được yêu cầu cho bất liên tục nhỏ hơn","Nếu chất thấm bị rửa sạch khỏi bất liên tục, một chỉ thị sẽ không được tạo ra bởi bất liên tục này"],"c":1,"e":""},{"q":"Các bất liên tục nằm dưới bề mặt có thể được phát hiện tốt nhất bởi :","a":["Phương pháp thấm nhũ tương sau","Phương pháp thấm màu có thể nhìn thấy được","Phương pháp thấm huỳnh quang có thể rửa được bằng nước","Không phương pháp nào ở trên"],"c":3,"e":""},{"q":"Chất thấm màu nhìn thấy được có thể được áp dụng bằng :","a":["Chải, quét","Phun, xịt","Nhúng","Tất cả các cách trên"],"c":3,"e":""},{"q":"Bước đầu tiên khi tiến hành kiểm tra thấm lỏng trên một bề mặt đã được sơn phủ là :","a":["áp dụng cẩn thận chất thấm lên khắp bề mặt","Loại bỏ hoàn toàn lớp sơn phủ","Rửa kỹ lưỡng bề mặt này bằng một chất tẩy rửa","Chải quét bằng sợi cứng bề mặt để tạo độ nhám (xù xì) cho lớp sơn trơn nhẵn của bề mặt"],"c":1,"e":""},{"q":"Khi sử dụng một chất thấm nhũ tương - sau, cần áp dụng chất tạo nhũ tương :","a":["Trước khi áp dụng chất thấm","Sau quá trình rửa nước","Sau khi thời gian thấm kết thúc","Sau khi thời gian hiện kết thúc"],"c":2,"e":""},{"q":"Khi tiến hành một kiểm tra thấm lỏng dạng rửa được bằng nước, chất hiện ướt được áp dụng :","a":["Ngay sau khi chất thấm vừa mới được áp dụng","Ngay trước khi chất thấm được áp dụng","Sau khi loại bỏ chất thấm","Sau khi loại bỏ chất tạo nhũ tương"],"c":2,"e":""},{"q":"Khái niệm mô tả tác dụng của một chất hiện cụ thể khi hút chất thấm từ trong một bất liên tục lên, nhằm cho chất thấm loang ra nhiều nhất để tăng độ tương phản và độ nhạy, được biết như là :","a":["Quá trình thấm hút","Tác dụng mao dẫn","Sự tập trung","Sự hút"],"c":1,"e":""},{"q":"Việc sử dụng một đèn ánh sáng đen với màn lọc bị rạn nứt hoặc không có màn lọc, có thể gây ra hư hại đến mắt người vì đèn này phát ra :","a":["ánh sáng đen","ánh sáng cực tím","ánh sáng hồng ngoại","Không phải những lý do trên"],"c":1,"e":""},{"q":"Khái niệm dùng để định nghĩa khoảng thời gian mà bộ phận kiểm tra được bao phủ chất thấm là","a":["Thời gian chờ","Thời gian hút (ráo)","Thời gian thấm","Thời gian chảy vào"],"c":2,"e":""},{"q":"Thường thường, phương pháp được ưa thích nhất để loại bỏ chất thấm dư rửa được bằng nước sau khi kết thúc thời gian thấm là bằng cách dùng :","a":["Nước phun giọt to, áp suất thấp","Nước và bàn chải","Tia nước mạnh","Nước và các dẻ lau sạch"],"c":0,"e":""},{"q":"Khi tiến hành một kiểm tra thấm lỏng sử dụng chất thấm màu nhìn thấy được nhũ tương - sau, phương pháp thường được chấp nhận để áp dụng chất hiện ướt là :","a":["Chải, quét","Dùng rẻ tẩm ướt","Nhúng","Phun xịt"],"c":3,"e":""},{"q":"Đặc trưng nào sau đây không áp dụng cho kiểm tra thấm lỏng?","a":["Phương pháp này có thể xác định một cách chính xác chiều sâu của một vết nứt hoặc bất liên tục","Phương pháp này có thể được dùng để kiểm tra tại chỗ - ngoài hiện trường các bộ phận lớn","Phương pháp này có thể được dùng để phát hiện các bất liên tục nông trên bề mặt","Phương pháp này có thể được thực hiện với các độ nhạy cao hoặc thấp tuỳ thuộc vào việc dùng các chất liệu thấm khác nhau"],"c":0,"e":""},{"q":"Bất liên tục nào sau đây dễ bị bỏ sót nhất do các kỹ thuật tẩy rửa không phù hợp?","a":["Một vết chồng - lấp (vết gấp) trong quá trình rèn","Rỗ sâu","Các bất liên tục nông và rộng trên bề mặt","Kỹ thuật tẩy rửa không ảnh hưởng đên việc phát hiện các bất liên tục"],"c":2,"e":""},{"q":"Khi tiến hành một kiểm tra thấm lỏng huỳnh quang, một kỹ thuật được dùng phổ biến để đảm bảo rằng chất thấm dư đã được loại bỏ trước khi áp dụng một chất hiện, là :","a":["Thổi khí nén lên khắp bề mặt này","Tẩm thực ăn mòn bề mặt bằng hoá chất","Thấm khô bề mặt bằng giấy thấm hút","Dò - quét bề mặt bằng một đèn ánh sáng đen"],"c":3,"e":""},{"q":"Điều kiện bề mặt nào sau đây có thể có ảnh hưởng xấu đối với kiểm tra thấm lỏng?","a":["Một bề mặt ướt","Một mối hàn xù xì, thô ráp","Một bề mặt có chất dầu mỡ bám","Tất cả các điều kiện trên"],"c":3,"e":""},{"q":"Kiểm tra thấm lỏng có khả năng phát hiện :","a":["Các bất liên tục của quá trình nứt do ăn mòn - ứng suất xuyên (cấu trúc) hạt","Các bất liên tục mở ra trên bề mặt","Các bất liên tục nằm dưới bề mặt","Tất cả các loại trên"],"c":1,"e":""},{"q":"Thiết bị ánh sáng đen được yêu cầu khi kiểm tra thấm bởi :","a":["Phương pháp thấm huỳnh quang","Phương pháp thấm màu nhìn thấy được","Phương pháp thấm phi - huỳnh quang","Tất cả các phương pháp trên"],"c":0,"e":""},{"q":"Khái niệm dùng để định nghĩa xu hướng của các chất lỏng nào đó thấm xuyên vào các khe mở nhỏ như một vết nứt chẳng hạn, là :","a":["Sự bão hoà","Tác dụng mao dẫn","Quá trình thấm hút","Chất làm ướt"],"c":1,"e":""},{"q":"Chất thấm dư (tất cả các chất thấm ngoại trừ chất thấm trong bất liên tục) được loại bỏ ra khỏi mẫu vật :","a":["Sau khi thời gian thấm được yêu cầu đã kết thúc","Trước khi áp dụng một chất tạo nhũ tương nếu chất thấm nhũ tương - sau được sử dụng","Bằng một chất làm sạch dưới dạng tia phun","Chỉ khi các chất thấm rửa được bằng nước được sử dụng"],"c":0,"e":""},{"q":"Khi dùng một chất thấm có thể nhũ tương - sau, thời gian nhũ tương hoá nên :","a":["Dài bằng thời gian thấm","Bằng một nửa thời gian thấm","Giống như thời gian hiện","Chỉ dài vừa đủ để loại bỏ lớp nền gây nhiễu"],"c":3,"e":""},{"q":"Khi một kiểm tra viên đang làm việc trong một vùng được che tối, anh / chị đó nên quen với vùng "Hỗ trợ cung cấp một hình ảnh của một bất liên tục","Thêm tính huỳnh quang cho chất thấm","Giúp kiểm soát sự chảy rộng ra"],"c":2,"e":""},{"q":"Điều nào sau đây là giới hạn chủ yếu của kiểm tra thấm lỏng?","a":["Kiểm tra thấm không thể sử dụng trên vật liệu sắt từ","Kiểm tra thấm không thể định vị các bất liên tục nông trên bề mặt","Kiểm tra thấm không thể sử dụng trên các bề mặt phi kim","Kiểm tra thấm không thể định vị các bất liên tục nằm dưới bề mặt"],"c":3,"e":""},{"q":"Trong kiểm tra thấm, khoảng thời gian từ khi áp dụng chất hiện cho đến lúc kiểm tra (quan sát) thường được gọi là :","a":["Thời gian nhũ tương hoá","Thời gian hiện","Thoời gian thấm","Không phải các khái niệm trên"],"c":1,"e":""},{"q":"Kiểm tra thấm lỏng là một kiểm tra không phá huỷ có thể sử dụng để :","a":["Định vị và đánh giá tất cả các loại bất liên tục trong một mẫu kiểm tra","Định vị và xác định chiều dài, chiều rộng, và độ sâu của các bất liên tục trong một mẫu kiểm tra","Xác định độ bền kéo của một mẫu kiểm tra","Định vị các bất liên tục mở ra trên bề mặt"],"c":3,"e":""},{"q":"Khi tiến hành một kiểm tra thấm sử dụng chất thấm huỳnh quang, thiết bị ánh sáng đen được yêu cầu để :","a":["Làm chất thấm phát sáng (huỳnh quang)","Hỗ trợ các đặc trưng quá trình mao dẫn của một chất thấm","Trung hoà chất thấm dư trên bề mặt","Giảm sức căng bề mặt của bộ phận này"],"c":0,"e":""},{"q":"Phương pháp được dùng để loại bỏ chất thấm dư màu nhìn thấy được ra khỏi một bề mặt kiểm tra được xác định chủ yếu bởi :","a":["Độ xù xì thô ráp của bề mặt mẫu vật","Loại vật liệu được kiểm tra","Độ dài thời gian thấm","Tất cả các điều kiện trên"],"c":3,"e":""},{"q":"Loại nào sau đây là một loại chất hiện được dùng trong kiểm tra thấm :","a":["Khô","Hạt ướt","Hạt phi nước","d. Hoà tan trong nước","Not of all"],"c":0,"e":""},{"q":"Khi kiểm tra thấm các bộ phận, nhiệt độ của các chúng nên gần với nhiệt độ phòng. Nếu các bộ phận có nhiệt độ thấp hơn khi kiểm tra, thì","a":["Chất thấm có thể trở nên nhớt nhầy","Chất thấm có thể bốc hơi rất nhanh","Cường độ màu của chất thấm sẽ giảm","Chất thấm có xu hướng dính chặt vào bề mặt của bộ phận"],"c":0,"e":""},{"q":"Nếu một bộ phận được kiểm tra thấm, lúc đầu được làm nóng lên một nhiệt độ cao, thì chất thấm :","a":["Có thể trở nên nhớt nhầy","Có thể bốc cháy hoặc bốc hơi rất nhanh","Có thể mất một phần độ sáng màu sắc của nó","Sẽ thể hiện bất liên tục tốt hơn"],"c":1,"e":""},{"q":"Các chất thấm có thể được phân loại hoặc chia nhỏ thành các nhóm theo phương pháp được dùng để loại bỏ chất thấm dư. Loại nào sau đây là một cách phân loại phù hợp với lời tuyên bố này?","a":["Có thể loại bỏ bằng chất phi - dung môi","Được giảm mỡ bằng bốc hơi","Có thể loại bỏ bằng bàn chải","Có thể rửa được bằng nước"],"c":3,"e":""},{"q":"Vấn đề liên quan đến việc kiểm tra lại một mẫu trước đó đã được kiểm tra sử dụng chất thấm lỏng là :","a":["Chất thấm có thể tạo thành các giọt lồi trên bề mặt","Dư lượng chất thấm đã khô còn trong bất liên tục có thể không hoà tan được và việc kiểm tra lại có thể bị sai lạc","Chất thấm sẽ mất phần lớn độ sáng màu sắc của nó","Những điều trên không phải là những phát biểu đúng"],"c":1,"e":""},{"q":"Điều kiện nào sau đây sẽ làm giảm tuổi thọ của bóng đèn ánh sáng đen?","a":["Sự thăng giáng (trồi sụt) của điện áp","Bụi bẩn bám trên bề mặt bóng","Sự thay đổi của nhiệt độ phòng","Tất cả những điều kiện trên"],"c":3,"e":""},{"q":"khi một chất thấm được áp dụng lên một bộ phận bằng cách nhúng bộ phận vào trong một bể chứa chất thấm, bộ phận này phải :","a":["Để trong bể chứa chất thấm trong suốt thời gian thấm","Để trong bể chứa chất thấm trong ít nhất một nửa thời gian thấm","Để trong bể chứa chất thấm chỉ trong một thời gian vừa đủ để đảm bảo rằng bề mặt được bao phủ chất thấm","Không để trong bể chứa chất thấm quá thời gian 5 phút"],"c":2,"e":""},{"q":"Tuyên bố nào sau đây không áp dụng cho chất hiện dùng trong kiểm tra thấm?","a":["Các chất hiện thường có độ phát sáng cao (huỳnh quang)","Các chất hiện thường cung cấp một nền tương phản trong qóa trình kiểm tra (quan sát)","Các chất hiện hấp thụ hoặc hút chất thấm còn lưu trong bất liên tục sau khi quá trình dội rửa đã hoàn tất","Các chất hiện có thể là loại khô hoặc ướt"],"c":0,"e":""},{"q":"Phát biểu nào sau đây là đúng?","a":["Việc bắn (phun) cát là một phương pháp được chấp nhận chung để làm sạchk bề mặt được kiểm tra thấm lỏng","Các bộ phận nên được làm nóng trước khi áp dụng một chất thấm","Nếu việc làm khô quá mức, nhiệt có thể làm giảm tính hiệu dụng của chất thấm","Thời gian hiện nên ít nhất bằng với thời gian thấm"],"c":2,"e":""},{"q":"Khi sử dụng một chất hiện ướt :","a":["Một lớp dày chất hiện là tốt hơn một lớp mỏng để thể hiện các vết nứt rất mảnh","Khí nén nên được dùng để loại bỏ chất hiện dư","Một chất hiện màu đen sẽ thể hiện độ tương phản tốt hơn một chất hiện màu trắng","Một lớp mỏng chất hiện là tốt hơn một lớp dày để thể hiện các vết nứt rất mảnh"],"c":3,"e":""},{"q":"Tuyên bố nào sau đây là sai?","a":["Việc bắn cát không phải là một phương pháp được khuyên dùng để chuẩn bị cho một kiểm tra thấm","Không cần thiết phải loại bỏ một lớp dầu mỏng ra khỏi một bộ phận trước khi kiểm tra thấm bởi vì chất thấm về cơ bản là một chất dầu","Giảm mỡ bằng hơi là một phương pháp rất tốt để loại bỏ dầu ra khỏi bề mặt của bộ phận được kiểm tra thấm","Một thiết bị điều chỉnh điện áp nên được sử dụng với đèn ánh sáng đen nếu điện áp thăng giáng"],"c":1,"e":""},{"q":"Một hình ảnh bất liên tục màu đỏ trên nền tương phản màu trắng rất có thể được nhìn thấy khi :","a":["Các chất hiện khô được dùng","Các chất thấm màu nhìn thấy được, được dùng","Các chất thấm huỳnh quang có thể nhũ tương - sau được dùng","Các chất hiện ướt được dùng"],"c":1,"e":""},{"q":"Loại nào sau đây có thể được loại bỏ khỏi bề mặt của một mẫu vật bởi quá trình giảm mỡ bằng hơi?","a":["Dầu","Sơn","Các lớp phủ bằng hợp chất phốt pho","Các loại ôxít"],"c":0,"e":""},{"q":"Mục đích của việc dùng một chất hiện trên một mẫu vật là để :","a":["Thúc đẩy sự xuyên thấm của chất thấm","Hấp thụ các dư lượng chất tạo nhũ tương","Hấp thụ chất thấm từ trong các bất liên tục và cung cấp một bề mặt tạo tương phản","Hỗ trợ làm khô bề mặt để quan sát tốt hơn"],"c":2,"e":""},{"q":"Phát biểu nào sau đây là một cách sử dụng không đúng các tấm (khối) nứt?","a":["Để thiết lập một kích thước tiêu chuẩn của nứt có thể tái tạo được khi có nhu cầu","Để xác định độ nhạy tương đối của hai chất thấm khác nhau","Để xác định xem liệu một chất thấm đã mất hoặc suy giảm độ sáng trên các chất thấm huỳnh quang do nhiễm bẩn hay không","Để xác định mức độ hoặc phương pháp làm sạch cần thiết để loại bỏ chất thấm trên bề mặt mà không loại bỏ nó ra khỏi các vết nứt"],"c":0,"e":""},{"q":"Điều nào sau đây thường được chấp nhận như một chú ý quan trọng nhất khi dùng các chất thấm có thể rửa được bằng nước?","a":["Phải đảm bảo rằng bộ phận được rửa kỹ trong quá trình dội rửa","Phải đảm bảo rằng thời gian thấm đã được đề xuất không bị vượt quá","Tránh dội rửa quá mức","Tránh áp dụng quá mức chất tạo nhũ tương"],"c":3,"e":""},{"q":"Điều nào sau đây thường được chấp nhận như một chú ý quan trọng nhất khi dùng các chất thấm có thể loại bỏ được bằng dung môi?","a":["Không áp dụng quá nhiếu chất tạo nhũ tương","Không áp dụng quá nhiếu dung môi","Không dùng áp suất rửa xả không đủ","Đảm bảo sử dụng một đèn ánh sáng đen để xác định liệu chất thấm dư đã được dội rửa sạch hay chưa"],"c":3,"e":""},{"q":"Việc rửa xả không đầy đủ các chất thấm huỳnh quang sẽ tạo ra :","a":["Sự ăn mòn bề mặt sau đó","Khó khăn trong việc áp dụng chất hiện","Quá trình chảy loang quá mức","Sự phát sáng (huỳnh quang)của bề mặt nền quá mức"],"c":1,"e":""},{"q":"Lưu ý về an toàn nào sau đây không áp dụng khi cầm, mang các chất liệu thấm?","a":["Việc tiếp xúc trong một thời gian dài của da thịt với chất thấm nên tránh vì các gốc dầu hoặc dung môi có thể gây tổn thương da","Không nên hít phải quá nhiều các bột chất hiện","Phải đeo khẩu trang và mặc quần áo bảo vệ toàn thân mọi lúc","Do các chất dung môi được dùng với quá trình thấm màu nhìn thấy được là có khả năng cháy, nên chất liệu này nên được giữ gìn cách xa nguồn lửa hở."],"c":2,"e":""},{"q":"Một bộ phận phải được duy trì ướt trong bao lâu với chất thấm trước khi quá trình loại bỏ bắt đầu?","a":["Nó thay đổi phụ thuộc vào loại chất thấm sử dụng, loại vật liệu được kiểm tra, độ nhạy mong muốn, và loại bất liên tục cần phát hiện","Bởi vì chất thấm sẽ thấm xuyên vào một bất liên tục có kích thước bất kỳ trong thời gian một vài giây, quá trình loại bỏ nên bắt đầu càng sớm càng tốt ngay sau khi chất thấm vừa được áp dụng","3 phút","10 phút"],"c":0,"e":""},{"q":"Yếu tố nào sau đây sẽ ảnh hưởng đến độ phân giải các chỉ thị thấm?","a":["Độ nhạy của chất liệu thấm được dùng","Điều kiện bề mặt của bộ phận","Nhiệt độ của bộ phận và/ hoặc chất thấm","Tất cả các yếu tố trên"],"c":3,"e":""},{"q":"Một sự mất nước nghiêm trọng trong một hỗn hợp chất hiện ướt hoặc hàm lượng bột chất hiện quá mức có thể gây ra :","a":["Một sự mất phát sáng huỳnh quang trong khi quan sát kiểm tra","Các chỉ thị không liên quan","Sự rạn nứt các lớp phủ chất hiện trong quá trình làm khô","Không phải điều nào ở trên"],"c":2,"e":""},{"q":"Điều gì sẽ xảy ra nếu một người nhìn trực tiếp thẳng vào một đèn ánh sáng đen?","a":["Nó sẽ làm hư hỏng vĩnh viễn mắt anh ta","Nó có thể làm mất khả năng nhìn của người này trong một khoảng thời gian ngắn","Nó sẽ gây ra tình trạng mù toàn phần tạm thời","Không phải những điều trên"],"c":1,"e":""},{"q":"Khi sử dụng chất hiện khô, quá trình làm khô được thực hiện :","a":["Ngay sau khi loại bỏ chất thấm dư","Trước bước kiểm tra quan sát","Kỹ lưỡng","Tất cả các điều trên"],"c":3,"e":""},{"q":"Sai sót trong việc loại bỏ hoàn toàn các chất axít ra khỏi một bộ phận trước khi chất thấm huỳnh quang được áp dụng, sẽ gây ra :","a":["Giảm độ phát sáng huỳnh quang của chất thấm","Cần phải tăng gấp đôi thời gian thấm lên","Các vệt vĩnh viễn trên bộ phận","Tất cả các điều trên"],"c":3,"e":""},{"q":"Chất thấm được áp dụng lên một bộ phận bằng quá trình nhúng. Bộ phận sau đó được đặt lên một cái giá trong khi chất thấm ngấm vào các bất liên tục. Nếu thời gian thấm quá dài, sẽ là khó khăn cho việc rửa xả chất thấm ra khỏi bộ phận. Nếu điều này xảy ra, việc rửa xả bình thường có thể phục hồi bằng cách nào?","a":["Làm lạnh bộ phận xuống nhiệt độ 40C (400F)","Làm nóng bộ phận lên nhiệt độ 540C (1300F)","Nhúng lại bộ phận","áp dụng một chất hiện ướt trước khi cố gắng rửa xả bộ phận"],"c":1,"e":""},{"q":"Khi làm khô các bộ phận trong một kiểm tra thấm, các bộ phận :","a":["Thường khô tại nhiệt độ phòng","Thường được làm khô bằng một máy làm khô dùng khí nóng đối lưu","Nên được làm khô trong một tủ sấy được đặt ở nhiệt độ 540 (1300)","Nên được làm khô bằng khí lạnh cưỡng bức"],"c":1,"e":""},{"q":"Sự nhiễm bẩn với một lượng nước quá mức của chất thấm có thể rửa được bằng nước, sẽ :","a":["Giảm chất lượng thấm của chất thấm","ảnh hưởng xấu đến tính tẩy rửa được của chất thấm","Cả a và b đều đúng","Cả a và b đều không đúng"],"c":2,"e":""},{"q":"Phương pháp nào sau đây (không) yêu cầu một nguồn điện?","a":["Phương pháp thấm huỳnh quang có thể rửa được bằng nước","Phương pháp thấm huỳnh quang nhũ tương-sau","Phương pháp thấm màu nhìn thấy được","Không phải các phương pháp trên"],"c":2,"e":""},{"q":"Khi dùng một chất thấm huỳnh quang, việc kiểm tra thực tế phải được thực hiện :","a":["Trong một phòng được chiếu sáng mạnh","Với một bộ phận có nhiệt độ từ 10 đến 700C (125 đến 1750C)","Ngay sau khi chất hiện được áp dụng","Trong một khu vực được che tối, dưới ánh sáng đen"],"c":3,"e":""},{"q":"Chất thấm nào sau đây có thể được dùng khi việc kiểm tra phải tiến hành dưới điều kiện ánh sáng thông thường?","a":["Chất thấm màu nhìn thấy được","Chất thấm huỳnh quang có thể rửa được bằng nước","Chất thấm huỳnh quang nhũ tương-sau","Bất kỳ loại nào ở trên"],"c":0,"e":""},{"q":"Tất cả những vật liệu sau đây có thể được kiểm tra một cách hiệu quả với chất thấm lỏng, ngoại trừ :","a":["Nhôm","Gốm trần (không tráng men)","Thuỷ tinh","Manhê"],"c":1,"e":""},{"q":"Điều nào sau đây là một nhược điểm của việc dùng phương pháp kiểm tra thấm lỏng?","a":["Phương pháp kiểm tra thẩm thấu lỏng có khả năng kiểm tra các chi tiết nhỏ","Phương phám kiểm tra thẩm thấu lỏng có thể phát hiện được các vết nứt nhỏ","pp PT là phương pháp đơn giản","pp PT có hiệu quả tại bất cứ nhiệt độ nào"],"c":3,"e":""},{"q":"Một chất thấm tốt phải thực hiện được tất cả các công việc, ngoại trừ:","a":["có khả năng thấm nhanh vào các khe hở rất nhỏ","bay hơi nhanh","có khả năng lưu lại trong các khe hở tương đối thô","dễ loại bỏ khỏi bề mặt sau khi kiểm tr"],"c":1,"e":""},{"q":"Điều nào sau đây không phải là một đặc điểm của chất hiện trong pp PT:","a":["vật liệu phải có khả năng hấp thụ","vật liệu phải tạo được lớp phủ mỏng và đồng đều trên toàn bộ bề mặt","vật liệu phải phát quang nếu sử dụng với chất thấm huỳnh quang","vật liệu không được chứa các thành phần độc hại cho người sử dụng"],"c":2,"e":""},{"q":"Chất hiện, nếu sử dụng không đúng có thể:","a":["che lấp các chỉ thị","khó loại bỏ","làm nhiễm bẩn vật kiểm tra","tất cả các điều trê"],"c":3,"e":""},{"q":"Chất thấm màu tương phản trên thị trường dưới dạng nào sau đây?","a":["tẩy rửa bằng dung môi","rửa nước","nhũ tương hoá","tất cả"],"c":3,"e":""},{"q":"Những điều nào sau đây có thể là nguồn gốc gây ra các chỉ thị sai?","a":["chất thấm trên bàn kiểm tra","chất thấm trên tay người kiểm tra","có sự nhiễm bẩn từ chất hiện khô hoặc ướt vào chất thấm","tất cả"],"c":3,"e":""},{"q":"Làm sạch trước khi kiểm tra thấm:","a":["không được yêu cầu","quan trong vì nếu không làm sạch đầy đủ thì chất hiện không áp vào được","cần thiết vì bề mặt bị nhiễm bẩn có thể ngăn cản chất thấm đi vào bất liên tục","được yêu cầu để có thể chỉ ra được chỉ thị không phù hợp"],"c":2,"e":""},{"q":"Tính chất vật lý nào sau đây, hơn là các tính chất khác, xác định một vật liệu có là một chất thấm tốt hay không?","a":["Độ nhớt","Sức căng bề mặt","Khả năng làm ướt","Không có một tính chất riêng lẻ nào xác định liệu một vật liệu là hay không là một chất thấm tốt"],"c":3,"e":""},{"q":"Tốc độ mà một chất thấm thấm xuyên vào một khiếm khuyết bề mặt chịu ảnh hưởng nhiều nhất bởi tính chất nào sau đây?","a":["Mật độ","Sức căng bề mặt và khả năng làm ướt","Độ nhớt","Khối lượng tương đối"],"c":1,"e":""},{"q":"Tuyên bố nào sau đây liên quan đến sự vận hành của các bóng đèn ánh sáng đen loại hồ quang thuỷ ngân là sai?","a":["Bóng đèn cần khoảng 5 phút để sấy nóng tới công suất phát đầy đủ của nó khi được bật lên lúc đầu","Đèn có thể tắt nếu điện áp mạng tụt xuống dưới 90 V","Những thay đổi điện áp trên 120 V sẽ ít hoặc không có ảnh hưởng lên bóng đèn","Nếu vì một lý do nào đó mà ánh sáng hồ quang được tắt đi, bóng đèn sẽ không đáp ứng ngay nếu đèn được bật lên liền sau khi nó vừa mới được tắt đi"],"c":2,"e":""},{"q":"Điều nào được liệt kê dưới đây là một nhược điểm khi dùng phương pháp kiểm tra thấm lỏng?","a":["Phương pháp này có thể tìm thấy tất cả các loại bất liên tục","Phương pháp này là đơn giản về nguyên lý và tương đối dễ hiểu","Về cơ bản, phương pháp này là đơn giản trong áp dụng","Phương pháp này ít bị hạn chế bởi kích thước và hình dạng của đối tượng được kiểm tra"],"c":3,"e":""},{"q":"Tuyên bố nào dưới đây áp dụng được cho phương pháp kiểm tra thấm lỏng?","a":["Phương pháp kiểm tra thấm kém mềm dẻo linh động hơn so với phương pháp kiểm tra dòng xoáy","Phương pháp kiểm tra thấm kém tin cậy hơn so với phương pháp hạt từ để tìm các khuyết tật bề mặt trong các vật liệu sắt từ","Phương pháp kiểm tra thấm sẽ không phát hiện được các vết nứt mỏi","Phương pháp kiểm tra thấm là tin cậy hơn so với phương pháp chụp ảnh phóng xạ trong nỗ lực phát hiện các bất liên tục nhỏ trên bề mặt"],"c":3,"e":""},{"q":"Loại bất liên tục nào sau đây không thể phát hiện được bằng phương pháp kiểm tra thấm lỏng?","a":["Các phân lớp bề mặt","Các nứt nổ bên trong sản phẩm rèn","Các vết nứt bề mặt","Các vết gấp về mặt"],"c":1,"e":""},{"q":"Loại bất liên tục nào sau đây có thể được phân loại như một bất liên tục của quá trình chế tạo ban đầu thường thấy trong vật liệu đúc?","a":["Nứt mỏi","Nứt ăn mòn-ứng suất","Rỗ","Không thấu"],"c":2,"e":""},{"q":"Loại bất liên tục nào sau đây có thể được phân loại như một bất liên tục của quá trình hoàn thiện?","a":["Nứt mỏi","Nứt ăn mòn-ứng suất","Tách lớp","Nứt do xử lý nhiệt"],"c":3,"e":""},{"q":"Loại bất liên tục nào sau đây có thể được phân loại như một bất liên tục phát sinh trong quá trính sử dụng?","a":["Nứt mỏi","Rỗ","Rách toạc do gia công","Gấp (chồng lấp)"],"c":0,"e":""},{"q":"Đặc trưng nào của bộ phận kiểm tra được liệt kê dưới đây thường được cân nhắc trước khi lựa chọn một phương pháp kiểm tra thấm lỏng cụ thể?","a":["Loại và kích thước của bất liên tục dễ xảy ra nhất","Mục đích sử dụng của bộ phận","Bề mặt hoàn thiện (sau cùng) của bộ phận","Tất cả các điều trên"],"c":3,"e":""},{"q":"Mẫu kiểm tra bằng hợp kim nhôm đã được kiểm tra bằng phương pháp thấm lỏng, nên được làm sạch kỹ lưỡng sau khi kiểm tra, bởi vì :","a":["Thành phần axít trong chất thấm có thể gây ra sự ăn mòn nghiêm trọng","Hàm lượng kiềm của các chất hiện ướt và phần lớn chất tạo nhũ tương có thể làm rỗ bề mặt, đặc biệt trong không khí ẩm","Dư lượng độc từ quá trình kiểm tra sẽ cản trở nghiêm trọng việc áp dụng lớp sơn phủ lên các hợp kim nhôm","Một phản ứng hoá học giữa chất thấm và nhôm có thể gây ra hoả hoạn do sự bùng cháy bên trong"],"c":1,"e":""},{"q":"Loại chất lạ nào sau đây có thể che lấp các khe mở của các bất liên tục nếu bề mặt của mẫu kiểm tra không được làm sạch một cách phù hợp?","a":["Sơn","Xỉ","Vật liệu lõi và khuôn","Tất cả các loại trên"],"c":3,"e":""},{"q":"Tất cả các phương pháp sau đây được khuyên dùng để loại bỏ mỡ ra khỏi bề mặt của một mẫu kiểm tra thấm, ngoại trừ :","a":["Giảm mỡ bằng bay hơi","Làm sạch bằng chất kiềm","Làm sạch bằng chất liệu dung môi","Rửa xả bằng nước nóng"],"c":3,"e":""},{"q":"Chỉ thị thấm đối với một vết ngậm nguội trên bề mặt một sản phẩm đúc sẽ là một :","a":["Đường trơn nhẵn liên tục hoặc đứt quãng","Một đám các chỉ thị nhỏ","Chỉ thị sâu và thô","Chỉ thị phồng to"],"c":0,"e":""},{"q":"Chỉ thị thấm của một vết gấp của quá trình rèn thường sẽ là một :","a":["Chỉ thị tròn hoặc gần như tròn","Một đám các chỉ thị","Đường liền nét","Đường đứt quãng (lấm chấm)"],"c":2,"e":""},{"q":"Khi tiến hành một kiểm tra thấm, các chỉ thị hình cầu trên bề mặt của một bộ phận có thể là dấu hiện của :","a":["Các vết nứt mỏi","Rỗ","Các vết gấp do hàn","Các vết rách nóng"],"c":1,"e":""},{"q":"Chất hiện của phương pháp thấm thường có sẵn trong mọi dạng, ngoại trừ","a":["Chất hiện khô","Chất hiện phi - nước","Chất hiện ướt","Chất hiện có độ nhớt cao"],"c":3,"e":""},{"q":"Điều nào sau đây là một nguyên nhân có thể gây ra các chỉ thị thấm sai?","a":["Rửa sạch quá mức","áp dụng không đủ các chất hiện","Chất thấm hoặc bộ phận quá lạnh trong thời gian thấm","Sợi tơ mảnh hoặc vết bẩn"],"c":3,"e":""},{"q":"Các dư lượng chất thấm có thể bị giữ lại bới các đường rãnh-gờ, các chốt xiết, đinh tán, vv. Hiệu ứng nào sau đây rất dễ xảy ra do một dư chất như vậy gây ra?","a":["Sự ăn mòn gây bởi độ ẩm bị hút bởi dư chất này","Sự long tróc lớp sơn phủ","Quá trình nứt mỏi","Sự đứt gãy cấu trúc ô mạng"],"c":0,"e":""},{"q":"Các chất hiện trợ giúp việc phát hiện các chất thấm lưu lại trong bất liên tục bằng cách tăng thêm :","a":["Quá trình làm sạch sau khi kiểm tra","Quá trình nhũ tương hoá","Quá trình chảy loang ra","Quá trình làm khô"],"c":2,"e":""},{"q":"Các chất hiện trợ giúp việc phát hiện các chỉ thị kiểm tra màu nhìn thấy được bằng cách :","a":["Cung cấp một bề mặt sạch","Cung cấp một bề mặt nền tương phản","Cung cấp một bề mặt khô","Nhũ tương hoá chất thấm đã được làm loang rộng ra"],"c":1,"e":""},{"q":"Khi dùng các chất thấm nhũ tương - sau, các khó khăn nảy sinh trong quá trình rửa sạch có thể khắc phục bằng cách :","a":["áp dụng lại một lớp phủ tạo nhũ tương","Tăng áp lực nước dùng cho quá trình rửa sạch","Xử lý lại hoàn toàn bộ phận bắt đầu từ việc chuẩn bị bề mặt trở đi và dùng một thời gian nhũ tương hoá dài hơn","Nhúng bộ phận vào trong nước sôi"],"c":2,"e":""},{"q":"Phương pháp nào sau đây áp dụng cho chất hiện phi - nước thường được xem như hiệu quả nhất?","a":["Phun xịt","Lau ướt bằng giẻ","Chải quét","Nhúng"],"c":0,"e":""},{"q":"Phương pháp nào được liệt kê dưới đây, là cách thức hiệu quả nhất cho việc làm sạch ban đầu một hạng mục kiểm tra trước khi tiến hành một kiểm tra thấm?","a":["Giảm mỡ bằng bay hơi","Làm sạch bằng chất tẩy rửa","Làm sạch bằng hơi nước","Lau chùi bằng dung môi"],"c":0,"e":""},{"q":"Các chất liệu huỳnh quang dùng trong các chất thấm huỳnh quang đáp ứng mạnh nhất phát ra các năng lượng bức xạ khi được chiếu với một chiều dài sóng bằng khoảng :","a":["7 00 nm (7000Å)","250 kV","365 nm (3650 Å)","1 klx (100ftc)"],"c":2,"e":""},{"q":"Khi thực hiện một kiểm tra thấm lỏng dùng chất thấm màu nhìn thấy được có thể loại bỏ bằng dung môi, có một vài cách để loại bỏ chất thấm dư ra khỏi bề mặt của bộ phận. Phương pháp nào được liệt kê dưới đây thường được xem như phù hợp nhất để cho kết quả chính xác?","a":["Phun dung môi lên khắp bề mặt với áp lực không lớn hơn 276 kPa (40psi)","Lau chùi bằng một khăn thấm ướt đẫm, sau đó lau tiếp bằng một khăn khô","Lau bằng một khăn thấm ẩm dung môi, sau đó lau tiếp bằng các khăn khô","Lau bằng khăn giấy khô, sau đó lau tiếp bằng một khăn thấm ẩm chất dung môi, và cuối cùng lau bằng một khăn khô"],"c":3,"e":""},{"q":"Thời gian nhũ tương hoá :","a":["Là quan trọng nhưng thường không phải có tính quyết định","Là khoảng thời gian cần thiết để rửa xả chất tạo nhũ tương và chất thấm dư ra khỏi bề mặt","Là cực kỳ quan trọng và sẽ ảnh hưởng lớn đến các kết quả kiểm tra","Nên kéo dài theo như thực tiễn kinh tế cho phép"],"c":2,"e":""},{"q":"Trước khi kiểm tra thấm một bộ phận làm bằng kim loại mềm đã được gia công máy trước đó, phương pháp làm sạch nào được liệt kê dưới đây sẽ là tốt nhất để loại bỏ bất kỳ chỗ kim loại mẻ ra có thể che lấp các bất liên tục?","a":["Tẩm thực (ăn mòn bằng axít)","Xử lý bằng quá trình phun bắn (hạt rắn)","Làm sạch bằng chất kiềm","Làm sạch bằng nước với các chất tẩy rửa"],"c":0,"e":""},{"q":"Tại sao quá trình làm khô được dùng trong kiểm tra thấm?","a":["Quá trình làm khô được dùng để đảm bảo rằng mọi chất thấm dư sẽ bay hơi hết","Quá trình làm khô đảm bảo rằng sự làm khô đồng nhất chất hiện khô đã được áp dụng trên một chất tạo nhũ tương ướt","Quá trình làm khô giảm thời gian thấm xuống","Sau khi áp dụng một chất hiện ướt, quá trình làm khô hỗ trợ tạo ra một lớp phủ chất hiện đồng đều"],"c":3,"e":""},{"q":"Lý do nào sau đây giải thích tốt nhất tại sao việc làm khô quá mức một bộ phận là điều nên tránh?","a":["Thời gian tăng thêm theo yêu cầu là lãng phí vô ích","Chất hiện có thể mất khả năng thấm hút của nó","Khả năng phân giải có thể giảm","Chất hiện dư có thể khó bị loại bỏ"],"c":2,"e":""},{"q":"Điều nào sau đây là lý do tốt nhất giải thích tại saokiểm tra viên nên tránh áp dụng chất nhũ tương bằng một bàn chải quét?","a":["Thao tác chải quét sẽ trộn lẫn chất tạo nhũ tương với chất thấm một cách thô thiển và không đều, làm cho việc kiểm soát chính xác thời gian nhũ tương hoá là bất khả thi","Việc chải quét thường không bao phủ hết được bộ phận, do đó để lại một phần bộ phận khó rửa sạch được","Việc chải quét tự nó không có hại, nhưng nhiều loại chất liệu của bàn chải kết hợp với các thành phần chất tạo nhũ tương làm nhiễm bẩn chất thấm và bộ phận","Việc chải quét tạo ra hình ảnh các sọc, vệt trong khi kiểm tra"],"c":0,"e":""},{"q":"Thời gian hiện phụ thuộc vào :","a":["Loại chất thấm được dùng","Loại chất hiện được dùng và loại bất liên tục cần phát hiện","Nhiệt độ của vật liệu được kiểm tra","Tất cả các điều trên"],"c":3,"e":""},{"q":"Khi dùng chất thấm huỳnh quang có thể nhũ tương-sau, khoảng thời gian chất tạo nhũ tương được lưu giữ trên bộ phận là rất quan trọng khi phát hiện các bất liên tục nông như dạng một vết xước. Khoảng thời gian này tốt nhất nên là :","a":["10 giây","5 giây","2-3 giây","Được xác định bằng thực nghiệm"],"c":3,"e":""},{"q":"Tuyên bố nào sau đây liên quan đến các chất gây bẩn bề mặt của một mẫu kiểm tra thấm là sai?","a":["Chất bẩn có thể có một thành phần tác động vào chất thấm và làm giảm tính phát sáng huỳnh quang hoặc màu sắc của chất thấm","Chất bẩn có thể làm giảm hoặc thậm chí ngăn cản tác dụng mao dẫn của chất thấm","Chất bẩn có thể lưu giữ được chất thấm và do đó tăng độ nhạy của kiểm tra","Chất bẩn có thể lấp kín vết nứt và ngăn cản chất thấm đi vào"],"c":2,"e":""},{"q":"Các chất thấm lỏng có thể rửa được bằng nước khác với các chất thấm nhũ tương-sau ở chỗ, chất thấm rửa được bằng nước :","a":["Chỉ có thể được sử dụng trên các mẫu kiểm tra bằng nhôm","Không cần phải loại bỏ trước quá trình hiện","Có gốc xà phòng","Không cần phải áp dụng một chất tạo nhũ tương trước khi rửa xả"],"c":3,"e":""},{"q":"Chức năng của chất tạo nhũ tương trong phương pháp nhũ tương sau là để :","a":["Đưa chất thấm vào nhanh hơn các vết nứt sâu và hẹp","Tác dụng với chất thấm trên bề mặt để làm cho chất thấm này có thể rửa được bằng nước","Thêm màu huỳnh quang hoặc các màu sắc vào chất thấm","Cung cấp một lớp phủ để chất hiện bột khô bám dính vào"],"c":1,"e":""},{"q":"Khi kiểm tra thấm để phát hiện các bất liên tục nông trên dùng một chất thấm nhũ tương-sau, thời gian nhũ tương nên đủ dài để :","a":["Trộn chất tạo nhũ tương chỉ với chất thấm dư trên bề mặt","Trộn chất tạo nhũ tương với toàn bộ chất thấm trên bề mặt và trong các bất liên tục","Trộn chất tạo nhũ tương với chất thấm trong các bất liên tục","Để cho chất tạo nhũ tương khô thành một lớp bột trắng"],"c":0,"e":""},{"q":"Cách nào sau đây nên tránh dùng khi thực hiện một kiểm tra thấm?","a":["áp dụng chất tạo nhũ tương bằng cách nhúng bộ phận vào trong chất này","áp dụng chất hiện bằng cách phun xịt chất hiện vào bộ phận","Loại bỏ chất thấm rửa được bằng nước bằng phun xịt nước","áp dụng chất tạo nhũ tương bằng một bàn chải quét"],"c":3,"e":""},{"q":"Một phương pháp được sử dụng phổ biến để kiểm tra tính năng tổng thể của một hệ thống vật liệu thấm là bằng :","a":["Xác định độ nhớt của chất thấm","Đo khả năng làm ướt của chất thấm","So sánh hai phần của các mẫu được gây nứt nhân tạo","Tất cả các cách trên"],"c":2,"e":""},{"q":"Sự khác biệt quan trọng giữa các chất thấm rửa được không phải bằng nước và các chất thấm rửa được bằng nước là ở chỗ :","a":["Các chất thấm rửa được bằng nước có chứa một chất tạo nhũ tương trong khi các chất thấm loại kia không có","Độ nhớt của hai loại chất thấm này là khác nhau","Màu sắc của hai chất thấm này là khác nhau","Các chất thấm rửa được không phải bằng nước dễ được loại bỏ hơn so với các chất thấm rửa được bằng nước."],"c":0,"e":""},{"q":"Đặc trưng nào sau đây thường được xem xét khi lựa chọn loại chất thấm được dùng trong một kiểm tra thấm?","a":["Tính chất loại bỏ được của chất thấm","Điểm bốc cháy của chất thấm","Giá thành của chất thấm","Tất cả các điều trên"],"c":3,"e":""},{"q":"Những chất liệu nào nên tránh trong hệ thống chất thấm khi kiểm tra các hợp kim titan?","a":["Các bon hoặc dầu","Các dung môi chứa các nguyên tố nhóm halôgien","Chất tạo nhũ tương hoặc dầu","Các chất huỳnh quang"],"c":1,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong các sản phẩm đúc bằng khuôn cát?","a":["Không thấu","Undercut","Rỗ hình ống","Co ngót"],"c":3,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong một quá trình chế tạo bằng hàn?","a":["Co ngót","Không ngấu","Đường khâu","Các vết gấp"],"c":1,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong các sản phẩm cán dạng thanh thỏi?","a":["Co ngót","Chảy loang","Các vết gấp","Undercut"],"c":2,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong sản phẩm tấm cán?","a":["Các tách lớp","Co ngót","Không ngấu","Undercut"],"c":0,"e":""},{"q":"Loại chất bẩn nào sau đây có thể ảnh hưởng đến độ nhạy của một chất thấm?","a":["Axít","Nước","Các loại muối","Tất cả các loại trên"],"c":3,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong một sản phẩm rèn?","a":["Các lỗ thoát khí","Các vết gấp (chồng lấp)","Các vết ngậm nguội","Không thấu"],"c":1,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong các sản phẩm cán dạng thanh thỏi?","a":["Các lỗ thoát khí","Các vết gấp co ngót","Các vết nứt hoặc đường khâu","Không thấu"],"c":2,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong sản phẩm tấm cán?","a":["Các vết nứt do co ngót","Ngậm xỉ","Các vết gấp trong quá trình rèn","Các lỗ thoát khí"],"c":0,"e":""},{"q":"Điều nào sau đây là một ưu điểm của các chất thấm huỳnh quang vượt hơn so với các chất thấm dạng nhìn thấy được?","a":["Việc kiểm tra - quan sát có thể được tiến hành trong một khu vực được chiếu sáng tốt","Các chỉ thị nhỏ được nhìn thấy dễ dàng hơn","Chúng có thể được dùng khi việc tiếp xúc với nước là một điều kiện khách quan","Chúng ít nhạy cảm với sự nhiễm bẩn trong các bất liên tục"],"c":1,"e":""},{"q":"Điều nào sau đây là một ưu điểm của các chất thấm màu nhìn thấy được vượt hơn so với các chất thấm huỳnh quang?","a":["Các chỉ thị nhỏ được nhìn thấy dễ dàng hơn","Chúng có thể được dùng trên các bề mặt được anốt hóa và mạ crôm","Chúng tạo ít bề mặt nền hơn trên các bề mặt xù xì thô ráp","Không yêu cầu ánh sáng đặc biệt"],"c":3,"e":""},{"q":"Điều nào sau đây là một ưu điểm của các phương pháp lau chùi bằng giẻ thấm dung môi so với rữa bằng nước?","a":["Không cần ánh sáng đặc biệt trong quá trình kiểm tra","Chúng cung cấp một khả năng thấm xuyên nhanh hơn vào các khe mở nhỏ","Các chỉ thị nhỏ được nhìn thấy dễ dàng hơn","Chúng có thể dễ dàng được tiến hành tại hiện trường và những vùng xa xôi hẻo lánh"],"c":3,"e":""},{"q":"Xu hướng của một chất thấm đi vào một bất liên tục là liên quan chủ yếu đến:","a":["Độ nhớt của chất thấm","Các lực mao dẫn","Tính trơ về hoá học của chất thấm","Trọng lực riêng của chất thấm"],"c":1,"e":""},{"q":"Chất tạo nhũ tương được dùng :","a":["Để rửa sạch chất thấm ra khỏi các bất liên tục","Để trợ giúp việc rửa sạch bề mặt của các bộ phận khi dùng các chất thấm nước hoặc tan trong dầu","Để nhũ tương hoá chất thấm tan trong dầu, do đó làm chúng có thể rửa được bằng nước","Để làm sạch ban đầu các bộ phận trước khi áp dụng chất thấm"],"c":2,"e":""},{"q":"Mục đích chính của ánh sáng đen cho kiểm tra thấm huỳnh quang là để :","a":["Khuyếch đại các chỉ thị","Làm cho các chỉ thị có thể nhìn thấy được","Phát triển các chỉ thị","Làm nhanh quá trình kiểm tra"],"c":1,"e":""},{"q":"Tại sao đèn ánh sáng đen được khuyên nên lắp đặt tại trạm rửa?","a":["Để việc kiểm tra có thể được thực hiện mà không cần làm khô các bộ phận","Làm nhanh quá trình chảy loang của chất thấm ra từ các khuyết tật","Để kiểm tra hiệu quả của chu trình rửa","Để xác định liệu các bộ phận có được bao phủ với chất thấm hay không"],"c":2,"e":""},{"q":"Bột chất hiện luôn luôn nên là :","a":["Có độ phát sáng huỳnh quang cao","Được áp dụng ở dạng ướt","Không màu","Được áp dụng đều"],"c":2,"e":""},{"q":"Khi quan sát các bộ phận, một bề mặt nền phát sáng huỳnh quang là dấu hiệu của :","a":["Quá trình rửa sạch kém","Thời gian nhũ tương hoá chưa đủ (phương pháp nhũ tương-sau)","Vật liệu xốp và được sơn phủ","Việc làm sạch không phù hợp trước chu trình thấm","Tất cả các điều trên"],"c":0,"e":""},{"q":"Khi không có một tiêu chuẩn chấp nhận bằng văn bản, việc loại bỏ hoặc chấp nhận các bộ phận nên dựa trên :","a":["Trình độ giáo dục của kỹ thuật viên","Thiết kế của bộ phận và việc sử dụng dự định của nó","Tiêu chuẩn chất thấm thích hợp","Việc lựa chọn chất thấm"],"c":1,"e":""},{"q":"Khi quá trình xử lý không phù hợp gây khó khăn cho việc kiểm tra, người kiểm tra viên nên lamg gì?","a":["Cọ rửa bộ phận bằng dung môi","Sử dụng một quy trình chảy ngược đúng đắn","Xoá bỏ các phát sáng huỳnh quang không liên quan","Thực hiện quá trình kiểm tra lại từ đầu"],"c":3,"e":""},{"q":"Điều nào sau đây có khả năng nhất làm cho quá trình kiểm tra nhũ tương-sau mất tác dụng?","a":["Thời gian thấm quá dài","Thời gian hiện quá dài","Thời gian nhũ tương hoá quá dài","Không phải các điều ở trên"],"c":2,"e":""},{"q":"Chất hiện khô nên được áp dụng :","a":["Sao cho một lớp dày chất hiện bao phủ toàn bộ bề mặt","Sao cho một lớp bột rắc mỏng bao phủ toàn bộ bề mặt kiểm tra","Bằng một bàn chải quét sơn khô","Bằng cách nhúng"],"c":1,"e":""},{"q":"Yếu tố nào sẽ áp dụng cho việc xác định thời gian thấm cần cho chất thấm có hiệu lực?","a":["Loại bất liên tục cần tìm","Hình dạng của bộ phận","Kích thước của bộ phận","Độ xù xì thô ráp của bề mặt"],"c":0,"e":""},{"q":"Bộ phận là một sản phẩm nhôm rèn. Mô tả : Chỉ thị sắc nét, có hình bán nguyệt, không sâu. Nó được gọi là :","a":["Một vết gấp","Rỗ tại đường trung tâm","Nứt do xử lý nhiệt","Một chỉ thị sai"],"c":0,"e":""},{"q":"Một bộ phận là một tấm nhôm dày13mm (0,5in.) có một mối hàn chữ V. Mô tả : Chỉ thị xuất hiện trong một vùng có dạng hơi giống hình đĩa. Chỉ thị lan toả từ tâm ra thành hình nan hoa (rẻ quạt). Chỉ thị này là :","a":["Co ngót","Không liên quan","Một vết nứt do tôi (vật nóng nhúng lạnh đột ngột)","Một nứt rạn"],"c":3,"e":""},{"q":"Bộ phận là một sản phẩm nhôm đúc. Mô tả : Sản phẩm đúc có một thiết kế rất phức tạp. Trong một phần, có một vùng phẳng dày 32mm (1,3in.). Tại chính giữa của vùng này có một phần tròn dày 51mm (2in.) và đường kính 25mm (1in.). Có các chỉ thị dạng đường khoảng giữa xung quanh phần nền gốc nơi nó nối với phần mỏng. Chỉ thị này được gọi là","a":["Xỉ sắt","Rách nóng","Co ngót vi mô","Rỗ"],"c":1,"e":""},{"q":"Các vết nứt co ngót thường được tìm thấy trong những vùng nào của một vật đúc?","a":["Chỉ ở các vùng mỏng","Chỉ ở các vùng dày","Tại nơi có sự thay đổi đột ngột về chiều dày","Không phải là một vấn đề"],"c":2,"e":""},{"q":"Bất liên tục nào sau đây có thể tìm thấy trong một vật rèn?","a":["Nứt co ngót","Vết gấp","Rách nóng","Tách lớp"],"c":1,"e":""},{"q":"Bất liên tục nào sau đây có thể tìm thấy trong các thanh thỏi cán?","a":["Lỗ thoát khí","Gấp co ngót","Nứt hoặc đường khâu","Không thấu"],"c":2,"e":""},{"q":"Khái niệm “chỉ thị không liên quan” được dùng để mô tả một số loại nào đó các chỉ thị kiểm tra thấm. Cái nào sau đây là một “chỉ thị không liên quan” điển hình?","a":["Chỉ thị do hình học của cấu hình thiết kế của bộ phận","Các chỉ thị phi từ tính","Chuỗi các chỉ thị","Các chỉ thị không phải dạng đường"],"c":0,"e":""},{"q":"Tuyên bố nào dưới đây nói đến sự nguy hại của việc dùng quá trình bắn cát để làm sạch các bề mặt được kiểm tra thấm?","a":["Các bất liên tục có thể bị khép - đóng lại","Các chất bẩn dạng dầu có thể gắn kín các bất liên tục lại","Cát dùng trong quá trình phun bắn có thể chui vào trong bất liên tục","Quá trình bắn cát có thể tạo ra bất liên tục trong bộ phận"],"c":0,"e":""},{"q":"Một chỉ thị dạng đường liền nét có thể là do bất liên tục nào sau đây gây ra?","a":["Rỗ","Các ngậm xỉ","Rỗ lỗ chỗ","Các vết nứt"],"c":3,"e":""},{"q":"Điều nào sau đây có thể là một nguồn gốc gây ra các chỉ thị sai trên một mẫu kiểm tra?","a":["Chất thấm trên bàn kiểm tra","Chất thấm trên các tay người kiểm tra","Chất thấm bị nhiễm bẩn bởi các chất hiện khô hoặc ướt","Tất cả các điều trên"],"c":3,"e":""},{"q":"Một bất liên tục dạng nứt sẽ thường xuất hiện như :","a":["Một chỉ thị tròn","Một đường liền nét, thẳng hoặc lượn sóng - gấp khúc","Một đường thẳng tắp","Các chỉ thị tròn ngẫu nhiên hoặc các lỗ kéo dài"],"c":1,"e":""},{"q":"Bất liên tục nào sau đây sẽ không thể phát hiện được bằng một kiểm tra thấm lỏng?","a":["Một vết gấp trong quá trình rèn","Một nứt rạn","Các vết nứt do quá trình mài","Các ngậm xỉ phi kim bên trong"],"c":3,"e":""}],"ASNT_MT LEVEL 1&2 (CẤP 1)":[{"q":"Câu 1. \" Hạt từ \" là một phương pháp kiểm tra không phá huỷ được dùng để","a":["Định vị các bất liên tục bề mặt","Định vị các bất liên tục nằm gần bề mặt","Cả a và b","Phát hiện sự phân tách của vật liệu"],"c":2,"e":"Phương pháp kiểm tra hạt từ (MT) được thiết kế đặc biệt để phát hiện cả khuyết tật mở ra trên bề mặt và các bất liên tục nằm ở cận bề mặt."},{"q":"Câu 2. Vật liệu sắt từ là :","a":["Bị hút mạnh bởi một nam châm","Có khả năng từ hoá được","Cả a và b","Không có khả năng từ hoá được"],"c":2,"e":"Vật liệu sắt từ có đặc tính bị hút mạnh vào nam châm và có khả năng bị từ hóa cao, đây là đối tượng duy nhất áp dụng được phương pháp MT."},{"q":"Câu 3. Tính thấm (từ) của một vật liêu mô tả :","a":["Sự dễ dàng từ hoá nó","Độ sâu của từ trường trong bộ phận","Độ dài thời gian được yêu cầu để khử từ vật liệu","Khả năng lưu giữ từ trường"],"c":0,"e":"Tính từ thẩm (permeability) biểu thị mức độ dễ dàng hay khó khăn khi thiết lập một từ trường bên trong vật liệu."},{"q":"Câu 4. Tính lưu từ của vật liệu mô tả :","a":["Sự dễ dàng từ hoá nó","Độ sâu của từ trường trong bộ phận","Độ dài thời gian được yêu cầu để khử từ vật liệu","Khả năng lưu giữ từ trường"],"c":3,"e":"Tính lưu từ (retentivity) là khả năng của vật liệu giữ lại một phần từ trường dư sau khi đã ngắt bỏ lực từ hóa bên ngoài."},{"q":"Câu 5. Tại sao các hạt từ lại có sẵn trong các màu sắc khác nhau ?","a":["Vì sự tương phản màu sắc với bề mặt của bộ phận","Để nâng cao khả năng phát hiện các chỉ thị","Cả a và b","Các màu sắc khác nhau được sử dụng ứng với các giá trị thông lượng từ khác nhau"],"c":2,"e":"Việc đa dạng màu sắc giúp tối ưu độ tương phản hình ảnh đối với các màu sắc bề mặt kiểm tra khác nhau, từ đó giúp kỹ thuật viên dễ phát hiện chỉ thị khuyết tật hơn."},{"q":"Câu 6. Loại nào sau đây có thể từ hoá được ?","a":["Sắt","Kền (Nikel)","Côban (Cobalt)","Tất cả các loại trên"],"c":3,"e":"Sắt, kền và côban đều thuộc nhóm các kim loại sắt từ cơ bản có khả năng bị từ hóa mạnh."},{"q":"Câu 7. Từ trường mạnh nhất là khi :","a":["Điện áp từ hoá chạy qua","Dòng điện từ hoá chạy qua","Vật liệu thể hiện có các lực cưỡng bức cao","Dòng điện từ hoá không chạy qua"],"c":1,"e":"Đối với phương pháp kiểm tra liên tục, cường độ từ trường đạt giá trị cực đại khi dòng điện từ hóa đang trực tiếp chạy qua vật kiểm tra."},{"q":"Câu 8. Nếu một vết nứt tồn tại trong một nam châm hình tròn, các hạt từ bị hút vào vết nứt này là do một :","a":["Lực cưỡng bức","Trường rò rỉ","Hiệu ứng Doppler","Từ trở cao tại vết nứt"],"c":1,"e":"Sự đứt gãy cơ học tại vết nứt làm gián đoạn các đường lực từ, sinh ra trường rò rỉ từ tính (leakage field) trên bề mặt hút các hạt từ bám vào."},{"q":"Câu 9. Đơn vị thường được dùng để biểu thị mật độ thông lượng là :","a":["Gauss","Henry","Farad","Ampere"],"c":0,"e":"Trong hệ đo lường đơn vị Gauss (hoặc Tesla) là đơn vị tiêu chuẩn dùng để biểu thị mật độ thông lượng từ (mật độ đường sức từ)."},{"q":"Câu 10. Phát biểu nào liên quan đến các đường lực từ là đúng ?","a":["Chúng không cắt nhau","Chúng tập trung nhiều nhất tại các cực của một nam châm","Chúng tìm kiếm đường đi có sự cản trở ít nhất","Tất cả các điều trên đều đúng"],"c":3,"e":"Đường lực từ có các tính chất: tạo thành vòng kín không cắt nhau, có mật độ cao nhất ở các cực và luôn đi theo đường có từ trở thấp nhất (ít cản trở nhất)."},{"q":"Câu 11. Các đường từ thông, song song với một bất liên tục, tạo ra :","a":["Các chỉ thị mạnh","Các chỉ thị yếu","Không chỉ thị nào cả","Các chỉ thị mờ ảo"],"c":2,"e":"Để tạo ra trường rò rỉ đủ mạnh nhằm thu hút hạt từ, đường lực từ phải cắt ngang bất liên tục. Nếu đi song song, từ trường sẽ không bị rò rỉ ra ngoài và không tạo ra chỉ thị."},{"q":"Câu 12. Một bộ phận có thể thích hợp cho việc kiểm tra hạt từ, nếu :","a":["Nó bị hút vào một trường điện tĩnh","Vật liệu là loại sắt từ","Vật liệu là kim loại màu","Vật liệu là một vật dẫn điện"],"c":1,"e":"Điều kiện tiên quyết và bắt buộc của phương pháp kiểm tra hạt từ là vật liệu cấu tạo nên chi tiết phải thuộc nhóm sắt từ."},{"q":"Câu 13. Quy tắc nào mô tả hướng của dòng điện ( chạy từ + sang - ) khi các đường lực từ bao quanh một vật dẫn ?","a":["Quy tắc bàn tay trái","Quy tắc bàn tay phải","Quy tắc thông lượng","Quy tắc từ trở"],"c":1,"e":"Quy tắc bàn tay phải được sử dụng để xác định mối quan hệ giữa chiều dòng điện chạy trong vật dẫn thẳng và chiều của các đường sức từ vòng bao quanh nó."},{"q":"Câu 14. Độ lớn của từ trường dư trong một mẫu vật phụ thuộc vào :","a":["Tỷ số L/D (chiều dài trên đường kính)","Độ lớn của lực từ hoá áp dụng lên mẫu vật","Quy tắc bàn tay phải","Quy tắc bàn tay trái"],"c":1,"e":"Độ lớn của từ trường còn lưu lại (từ dư) phụ thuộc trực tiếp vào cường độ của lực từ hóa lớn nhất đã tác dụng trước đó lên vật kiểm tra (và đặc tính từ trễ của vật liệu)."},{"q":"Câu 15. Giá trị ampere - vòng phù hợp với một mẫu vật kiểm tra cho trước được xác định bằng :","a":["Độ dài của mẫu vật","Loại vật liệu","Cả a và b","Đường kính của mẫu vật"],"c":2,"e":"Khi tính toán thông số ampere-vòng (NI) cho cuộn dây kích từ dọc, thông số phụ thuộc chặt chẽ vào kích thước hình học (độ dài, đường kính để tính tỷ số L/D) nhằm tránh hiện tượng khử từ đầu mút, đồng thời phụ thuộc vào tính chất của loại vật liệu."},{"q":"Câu 16. Một từ trường vòng có thể được cảm ứng vào trong một mẫu vật bằng :","a":["Cảm ứng trực tiếp (đầu kẹp)","Cảm ứng trực tiếp (que châm)","Vật dẫn trung tâm","Tất cả các phương pháp trên"],"c":3,"e":"Tất cả các phương pháp trên đều tạo ra một đường sức từ khép kín bao quanh dòng điện đi qua, hình thành một từ trường vòng bên trong vật kiểm tra."},{"q":"Câu 17. Một Yoke điện tạo ra :","a":["Một trường dọc","Một trường vòng","Các trường xoay chiều","Một trường dao động"],"c":0,"e":"Gông từ (Yoke) tạo ra từ trường dọc chạy từ cực này sang cực kia qua vật kiểm tra."},{"q":"Câu 18. Một cuộn dây quấn xung quanh bộ phận tạo ra :","a":["Một trường vòng","Một trường dọc","Hoặc là a, hoặc là b tuỳ theo loại dòng điện áp dụng","Một trường gián đoạn, đứt quãng"],"c":1,"e":"Một cuộn dây (coil) khi có dòng điện chạy qua sẽ tạo ra một từ trường dọc chạy song song với trục của cuộn dây."},{"q":"Câu 19. Trong việc từ hoá dọc, đại lượng phù hợp để tính lực từ hoá là :","a":["Số Ampere","Số Ampere - vòng","Số Watt","Số Ohm"],"c":1,"e":"Lực từ hoá của cuộn dây phụ thuộc vào cường độ dòng điện (Ampere) và số vòng dây của cuộn (Ampere-turns, kí hiệu là NI)."},{"q":"Câu 20. Các đường lực từ :","a":["Đi theo đường thẳng","Tạo ra một vòng kín","Định hướng ngẫu nhiên","Nằm chồng lên nhau trong các vật liệu sắt từ"],"c":1,"e":"Đường lực từ luôn luôn là những đường cong khép kín không bao giờ cắt nhau."},{"q":"Câu 21. Một sự tích tụ hạt từ gây bởi một bất liên tục là mạnh nhất khi bất liên tục này định hướng :","a":["180° so với hướng của từ trường","45° so với hướng của từ trường","90° so với hướng của từ trường","90° so với hướng của dòng điện"],"c":2,"e":"Bất liên tục vuông góc (90°) với đường sức từ sẽ tạo ra từ trường rò rỉ mạnh nhất, thu hút hạt từ tốt nhất."},{"q":"Câu 22. Một mẫu vật có thể được khử từ bằng :","a":["Chế độ xử lý nhiệt trên nhiệt độ Curie","Một cuộn dây AC","Đảo chiều các trường DC","Tất cả các phương pháp trên"],"c":3,"e":"Tất cả các phương pháp trên đều có thể dùng để làm mất định hướng của các miền từ trường (khử từ)."},{"q":"Câu 23. Điều nào sau đây là một ưu điểm của kiểm tra hạt từ so với kiểm tra thấm lỏng ?","a":["Nó có thể phát hiện các bất liên tục bề mặt với các chất lạ bị gắn kẹt trong đó","Nó nhanh hơn trên các bộ phận riêng lẻ","Nó có thể phát hiện được các bất liên tục nằm gần bề mặt","Tất cả các điều trên"],"c":3,"e":"Kiểm tra hạt từ có khả năng phát hiện khuyết tật dưới bề mặt (gần bề mặt) và dung thứ tốt hơn cho các khuyết tật bị bám bẩn nhẹ so với kiểm tra thấm lỏng."},{"q":"Câu 24. Số ampere được sử dụng cho kiểm tra hạt từ dùng phương pháp que châm được xác định từ :","a":["Loại vật liệu","Khoảng cách giữa các que châm","Đường kính của bộ phận","Chiều dài tổng cộng của bộ phận"],"c":1,"e":"Dòng điện sử dụng khi dùng que châm (prods) được tính toán dựa trên khoảng cách giữa các điểm châm (thường từ 90 đến 110 Ampere trên mỗi inch khoảng cách)."},{"q":"Câu 25. Dòng thông lượng bên trong và xung quanh một bộ phận được từ hoá hoặc xung quanh một vật dẫn có dòng điện chạy qua được biết như là :","a":["Điểm bão hoà","Từ trường","Tính sắt từ","Tính thuận từ"],"c":1,"e":"Từ trường là không gian xung quanh dòng điện hoặc vật từ hóa có lực từ tác dụng."},{"q":"Câu 26. Các khu vực của bộ phận được từ hoá mà từ đó từ trường đi ra hay quay về bộ phận này được gọi là :","a":["Các điểm nhô ra","Các khuyết tật","Các cực từ","Các điểm nút"],"c":2,"e":"Khu vực đường sức từ đi ra là cực Bắc, nơi đường sức từ đi vào là cực Nam; chúng được gọi chung là các cực từ."},{"q":"Câu 27. Một kim loại khó bị từ hoá được nói là có :","a":["Tính thấm cao","Tính thấm thấp","Độ cản trở cao","Tính lưu giữ thấp"],"c":1,"e":"Tính từ thấm (permeability) là thước đo độ dễ dàng từ hóa của vật liệu. Vật liệu khó từ hóa có tính từ thấm thấp."},{"q":"Câu 28. Từ tính còn lưu lại trong một miếng vật liệu có khả năng từ hoá được sau khi lực từ hoá đã được loại bỏ, được gọi là :","a":["Trường bẫy","Trường dư","Trường dập","Trường vĩnh cửu"],"c":1,"e":"Từ trường còn sót lại sau khi ngắt lực từ hóa bên ngoài được gọi là từ trường dư (residual field)."},{"q":"Câu 29. Tại sao nên tháo rời các bộ phận trước khi kiểm tra hạt từ ?","a":["Việc tháo rời làm cho có thể nhìn thấy được tất cả các bề mặt","Các bề mặt phân cách sẽ tạo ra các trường rò rỉ gây nhầm lẫn cho việc kiểm tra","Mang xách các bộ phận đã tháo rời thường dễ dàng hơn","Tất cả các điều trên đều đúng"],"c":3,"e":"Tháo rời giúp bộc lộ hết diện tích bề mặt tiếp xúc và tránh hiện tượng trường rò rỉ giả tại giao diện kết nối giữa các chi tiết."},{"q":"Câu 30. Các chỉ thị bất liên tục nằm dưới bề mặt thường thể hiện :","a":["Sắc nét và phân tách rõ ràng","Sắc nét và rộng","Rộng và mờ ảo","Cao và được giữ một cách lỏng lẻo"],"c":2,"e":"Từ trường rò rỉ từ khuyết tật dưới bề mặt lan rộng ra khi lên tới bề mặt, khiến chỉ thị hạt từ thu được có dạng rộng và mờ ảo (fuzzy)."},{"q":"Câu 31. Trường dư nào là khó khử từ nhất ?","a":["Dọc","Vòng","Vector","Lưỡng nút"],"c":1,"e":"Trường dư dạng vòng nằm khép kín hoàn toàn bên trong vật liệu, không tạo ra cực từ bên ngoài nên rất khó triệt tiêu bằng các phương pháp khử từ thông thường."},{"q":"Câu 32. Kỹ thuật nào có độ nhạy cao nhất ?","a":["Liên tục","Trường dư","Gián đoạn","Dòng - ống đếm"],"c":0,"e":"Phương pháp liên tục (áp dụng hạt từ khi dòng từ hóa đang chạy) cho độ nhạy cao nhất vì cường độ trường luôn ở mức tối đa."},{"q":"Câu 33. Loại dòng nào làm bộc lộ các chỉ thị bề mặt rõ ràng nhất ?","a":["AC","DC","DC xung","DC với sự tăng đột ngột"],"c":0,"e":"Dòng xoay chiều (AC) có hiệu ứng bề mặt (skin effect) tập trung từ trường ở lớp nông và tạo ra sự rung động cơ học giúp hạt từ chuyển động linh hoạt bám vào khuyết tật bề mặt."},{"q":"Câu 34. Các chỉ thị hạt từ huỳnh quang nên được kiểm tra dưới :","a":["ánh sáng huỳnh quang","Bất kỳ ánh sáng nào","ánh sáng đen","ánh sáng Neon"],"c":2,"e":"Hạt từ huỳnh quang hấp thụ tia cực tím UV-A từ ánh sáng đen (black light) và phát xạ ra ánh sáng xanh sáng để người kiểm tra dễ quan sát."},{"q":"Câu 35. Việc kiểm tra một bộ phận bằng cách từ hoá, ngắt bỏ dòng điện, và sau đó áp dụng chất liệu, được gọi là :","a":["Phương pháp liên tục","Phương pháp ướt","Phương pháp từ dư","Phương pháp khô"],"c":2,"e":"Đây là định nghĩa của phương pháp từ dư (residual method), tận dụng tính lưu từ của vật liệu."},{"q":"Câu 36. Các chỉ thị sai do các hạt từ bị giữ lại trên bộ phận bởi điều kiện nào trong những cái sau đây ?","a":["Trọng lực","Cơ học","Cả a và b","Không phải điều kiện nào ở trên"],"c":2,"e":"Hạt từ bị kẹt lại ở các rãnh thô, hốc sâu do lực cơ học hoặc lắng đọng do trọng lực tạo ra các chỉ thị giả/sai."},{"q":"Câu 37. Phương pháp nào sau đây là phương pháp hiệu quả nhất để phát hiện các khuyết tật nằm rất sâu ?","a":["Phương pháp từ dư khô sử dụng dòng DC với sự tăng đột ngột","Phương pháp liên tục ướt sử dụng dòng chỉnh lưu nửa sóng","Phương pháp từ dư ướt","Phương pháp liên tục khô sử dụng dòng chỉnh lưu nửa sóng với các que châm"],"c":3,"e":"Sự kết hợp giữa phương pháp liên tục, hạt từ khô (linh động tốt trong khoảng trống) và dòng chỉnh lưu nửa sóng HWDC (khả năng đâm xuyên sâu nhất) là tối ưu cho khuyết tật nằm sâu dưới bề mặt."},{"q":"Câu 38. Một đường cong đôi khi được vẽ để thể hiện về mặt đồ thị mối quan hệ của lực từ hoá đối với độ lớn từ trường được tạo ra trong một vất liệu nào đó. Đường cong này được biết đến như là :","a":["Đường cong lực từ","Đường cong trễ","Đường cong bão hoà","Đường cong cảm ứng"],"c":1,"e":"Đường cong trễ từ (Hysteresis loop) thể hiện mối quan hệ giữa cảm ứng từ B và lực từ hóa H."},{"q":"Câu 39. Phương pháp nào cho độ nhạy lớn hơn, đặc biệt là trong việc định vị các bất liên tục nằm dưới bề mặt ?","a":["Liên tục","Từ dư","Từ trường vòng","Từ trường dọc"],"c":0,"e":"Phương pháp liên tục duy trì từ trường cường độ lớn trong suốt quá trình rải hạt, có độ nhạy vượt trội so với phương pháp từ dư."},{"q":"Câu 40. Khi từ hoá một mối hàn theo hai hướng, nếu dòng sử dụng trong hướng thứ nhất là 750 Amp. Và dòng trong hướng thứ hai là 450 Amp., thì điều nào sau đây là đúng ?","a":["Bộ phận nên được kiểm tra để xem liệu việc khử từ giữa các lần thao tác có cần thiết hay không","Không có gì cần lưu ý trước khi thao tác lần hai","Đây không phải là một kỹ thuật có giá trị","Không cần thiết phải từ hoá mối hàn theo hai hướng"],"c":0,"e":"Do dòng từ hóa bước sau nhỏ hơn nhiều bước trước, từ trường dư mạnh của bước trước có thể làm nhiễu hoặc sai lệch hướng từ trường bước sau, cần xem xét khử từ giữa 2 bước."},{"q":"Câu 41. Khi tuyệt đối không có một hình mẫu hay phân bố các hạt từ nào, nguyên nhân có thể là do :","a":["Vật liệu không có từ tính","Cường độ dòng được đặt quá thấp","Không có dòng chạy qua","Bất kỳ lý do nào ở trên có thể cũng đúng"],"c":3,"e":"Tất cả các nguyên nhân trên đều dẫn tới việc không thể tạo lập được từ trường đủ mạnh (hoặc hoàn toàn không có) để thu hút hạt từ."},{"q":"Câu 42. Đâu là ba nguyên nhân gây ra các chỉ thị không liên quan ?","a":["Không ngấu ( thiếu nóng chảy), thay đổi chiều dày tiết diện, các vết nứt do mài","Thay đổi chiều dày tiết diện, cường độ dòng rất cao, lỗ khoan nằm gần bề mặt","Cường độ dòng rất cao, lỗ khoan nằm gần bề mặt, các lỗ rỗ khí","Lỗ khoan nằm gần bề mặt, cường độ dòng rất cao, không ngấu"],"c":1,"e":"Chỉ thị không liên quan (non-relevant) gây ra bởi cấu trúc hình học của chi tiết hoặc dòng điện quá lớn chứ không phải do khuyết tật nứt, rỗ hay thiếu ngấu."},{"q":"Câu 43. Khi dùng phương pháp từ dư, một số lượng các bộ phận được từ hoá và đặt lên giá trước khi áp dụng các hạt từ. Việc giữ cho các bộ phận không cọ xát hoặc va chạm vào nhau là quan trọng, vì sao ?","a":["Có khả năng mất mát từ trường","It có thể gây ra nhiễu từ","Nó có thể làm hư hỏng bộ phận","Nó có thể làm các bộ phận khó mang xách được."],"c":1,"e":"Sự cọ xát giữa các bộ phận đã nhiễm từ tạo ra các cực cục bộ giả dọc theo vết xước cọ xát, hiện tượng này gọi là nhiễu từ viết (magnetic writing)."},{"q":"Câu 44. Một điểm, mà tại đó từ trường trong một vật liệu không thể tăng được nữa dù lực từ hoá tiếp tục tăng lên, được biết như là :","a":["Cực lồi","Điểm bão hoà","Điểm dư","Điểm tàn dư"],"c":1,"e":"Tại trạng thái bão hòa từ (saturation), tất cả các miền từ nhỏ đã xếp thẳng hàng, tăng lực từ hóa H cũng không làm tăng cảm ứng từ B thêm nữa."},{"q":"Câu 45. Loại dòng nào có một \"hiệu ứng lớp da \"?","a":["AC","DC","Chỉnh lưu nửa sóng","Chỉnh lưu toàn sóng"],"c":0,"e":"Dòng xoay chiều (AC) có xu hướng chạy tập trung ở sát bề mặt ngoài của vật dẫn, gọi là hiệu ứng da (skin effect)."},{"q":"Câu 46. Tiếp theo sau việc ngắt bỏ dòng từ hoá, dòng dung dịch của phương pháp tưới ướt chảy với lưu lượng quá nhanh có thể gây ra :","a":["Một chỉ thị mảnh hoặc bám giữ yếu, dễ bị rửa trôi đi","Không có vấn đề gì","Các hạt từ bắn vào mắt","Không phải các điều trên"],"c":0,"e":"Vận tốc dòng chất lỏng tưới quá mạnh sẽ cuốn trôi các hạt từ bám lỏng lẻo ở các khuyết tật có trường rò rỉ yếu."},{"q":"Câu 47. Kiểm tra hạt từ bằng phương pháp từ dư có thể được dùng khi :","a":["Các bộ phận có hình dạng bất thường","Các bộ phận có độ lưu giữ từ cao","Các bộ phận bị nén áp cao","Đánh giá các chỉ thị của phương pháp liên tục"],"c":1,"e":"Vật liệu bắt buộc phải có độ lưu giữ từ cao (retentivity) thì mới lưu lại đủ từ trường dư để giữ hạt từ sau khi ngắt dòng."},{"q":"Câu 48. Kiểm tra hạt từ là một phương pháp tin cậy để phát hiện tất cả các chỉ thị sau đây, ngoại trừ :","a":["Các vết chồng lấp","Các lỗ rỗng nằm sâu bên trong","Các vết nứt","Các đường khâu ( Các vết nứt ban đầu rộng nhưng bị hẹp hoặc đóng lại như các đường khâu - may do các quá trình chế tạo tiếp theo)"],"c":1,"e":"Phương pháp MT bị giới hạn độ sâu, hoàn toàn không thể phát hiện các khuyết tật nằm sâu hẳn bên trong lõi (internal cavities/voids)."},{"q":"Câu 49. Phương pháp kiểm tra hạt từ huỳnh quang ướt giống như phương pháp kiểm tra hạt từ ướt thông thường ngoại trừ yêu cầu cần có :","a":["ánh sáng đen","Dòng cao hơn","Một máy khác","Loại dòng"],"c":0,"e":"Kiểm tra hạt từ huỳnh quang yêu cầu môi trường tối và sử dụng nguồn ánh sáng đen (UV-A) để kích hoạt sự phát quang của hạt."},{"q":"Câu 50. Một khuyết tật mở ra trên bề mặt sẽ tạo ra một chỉ thị :","a":["Sắc nét và phân tách rõ ràng","Rộng và không xác định","Hình hoa văn đan xen","Cao và mờ ảo"],"c":0,"e":"Khuyết tật hở bề mặt tạo ra trường rò rỉ rất hẹp và tập trung, kết quả là chỉ thị sắc nét, rõ ràng."},{"q":"Câu 51. Cách nào sau đây sẽ tạo ra từ trường vòng ?","a":["Cho dòng chạy qua một cuộn dây","Đặt bộ phận kiểm tra trong một cuộn dây","Cho dòng chạy qua các que châm","Dùng các Yoke"],"c":2,"e":"Cho dòng điện chạy trực tiếp qua vật liệu thông qua các điểm tiếp xúc que châm (prods) tạo ra một từ trường vòng bao quanh trục dòng điện."},{"q":"Câu 52. Khi sử dụng phương pháp liên tục ướt, dòng chảy dung dịch chứa hạt từ từ vòi tưới nên được đóng ngắt :","a":["Ngay sau khi áp dụng dòng điện","Ngay trước khi áp dụng dòng điện","Trong khi dòng điện chạy qua","30 giây trước khi áp dụng dòng điện"],"c":1,"e":"Ngắt dòng chất lỏng ngay trước khi ngắt dòng điện từ hóa để dung dịch không rửa trôi các hạt đang bám tụ lại xung quanh khuyết tật."},{"q":"Câu 53. Từ trường mạnh nhất trong một cuộn dây là tại :","a":["Mặt ngoài","Mặt trong","Tâm","Các đầu cuộn dây"],"c":1,"e":"Từ trường dọc của cuộn dây có cường độ mạnh nhất tại khu vực sát thành bề mặt bên trong của cuộn dây."},{"q":"Câu 54. Để phát hiện các khuyết tật chạy dọc theo chiều dài nằm trên bề mặt phía trong của một bộ phận rỗng, bạn nên :","a":["Cho dòng điện chạy qua nó","Từ hoá nó bằng một cuộn dây","Cho dòng điện chạy qua một vật dẫn trung tâm","Tăng cường độ dòng điện sử dụng"],"c":2,"e":"Vật dẫn trung tâm (central conductor) tạo ra từ trường vòng lý tưởng để phát hiện khuyết tật chạy dọc ở cả bề mặt trong lẫn bề mặt ngoài chi tiết dạng ống/vòng rỗng."},{"q":"Câu 55. Thiết bị nào được sử dụng để xác định liệu một bộ phận đã được khử từ hay chưa ?","a":["Một nam châm đặt trên bộ phận","Một đồng hồ đo từ trường","Một khảo sát kế","Quan sát kỹ lưỡng xem có sự bám dính của các hạt từ trên bề mặt hay không"],"c":1,"e":"Một đồng hồ đo từ trường dư (magnetic field indicator/gaussmeter) được sử dụng để định lượng độ lớn từ trường sót lại."},{"q":"Câu 56. Kỹ thuật nào sau đây thường hay được dùng nhất cho kiểm tra hạt từ khô?","a":["Dòng một chiều trọn chu trình","Dòng xoay chiều chỉnh lưu nửa sóng","Điện áp cao, dòng có cường độ thấp","Dòng một chiều từ pin điện phân"],"c":1,"e":"Dòng chỉnh lưu nửa sóng (HWDC) cung cấp cả khả năng đâm xuyên sâu lẫn độ nhấp nhô của dòng điện giúp hạt từ khô chuyển động linh hoạt."},{"q":"Câu 57. Một dòng điện chạy qua một sợi dây đồng :","a":["Tạo ra một từ trường xung quanh sợi dây này","Tạo ra các cực từ trong sợi dây","Từ hoá sợi dây","Không tạo ra một từ trường"],"c":0,"e":"Dù đồng là vật liệu phi từ tính nhưng khi dòng điện chạy qua, bản thân dòng điện vẫn tạo ra một từ trường vòng xung quanh dây dẫn."},{"q":"Câu 58. Tại sao nên làm sạch các bộ phận sau khi khử từ ?","a":["Để đảm bảo rằng các hạt từ đã được loại bỏ","Để ngăn ngừa các chỉ thị sai","Để tiết kiệm các chất rắn trong dung dịch chứa hạt từ","Để phòng tránh nút trong khi xử lý nhiệt"],"c":0,"e":"Làm sạch sau quy trình để loại bỏ triệt để các hạt từ bám dính dính bẩn, tránh gây mài mòn chi tiết khi hoạt động sau này."},{"q":"Câu 59. Trong kỹ thuật từ hoá vòng, lực từ hoá được đo bằng đơn vị ampere. Đại lượng nào được dùng để đo lực từ hoá trong kỹ thuật từ hoá dọc ?","a":["Ampere","Ampere - vòng","Các cực tạo ra","Volt"],"c":1,"e":"Từ hóa dọc sử dụng cuộn dây nên lực từ hóa đặc trưng bằng tích số Ampere-vòng (NI)."},{"q":"Câu 60. Một vết nứt dọc trên bề mặt của một bộ phận được từ hoá vòng sẽ làm :","a":["Từ trường tắt giảm hẳn","Giảm độ thấm (từ)","Sinh ra một từ trường rò rỉ","Sinh ra một dòng điện chạy"],"c":2,"e":"Từ hóa vòng tạo ra đường sức đi vuông góc với vết nứt dọc, sinh ra hiện tượng rò rỉ từ trường tại vị trí khuyết tật."},{"q":"Câu 61. Trong một kiểm tra hạt từ, giả thiết rằng tất cả các khuyết tật sau đây đều có vị trí tương đối giống nhau trong một bộ phận nhỏ, loại nào là khó phát hiện nhất ?","a":["Một vết nứt trên bề mặt","Một vết nứt nằm gần bề mặt","Một vết xước","Một đường khâu"],"c":3,"e":"Đường khâu (seams) bản chất là khuyết tật nông, ép rất chặt và song song bện sát mặt nên lượng trường rò cực nhỏ, khó phát hiện nhất trong số các khuyết tật bề mặt."},{"q":"Câu 62. Nếu dung dịch chứa hạt từ không đồng nhất, thì :","a":["Độ lớn chỉ thị có thể biến đổi, và việc giải đoán nó có thể sai sót","Dòng từ thông sẽ không đồng nhất","Cần độ linh động hơn","Không thể từ hoá bộ phận được"],"c":0,"e":"Nồng độ hạt từ trong bồn kiểm tra không đồng đều dẫn đến kích thước hiển thị của cùng một kích thước khuyết tật bị sai lệch."},{"q":"Câu 63. Loại nào sau đây sẽ phát hiện các vết nứt mảnh trên bề mặt tốt nhất ?","a":["Dòng AC chỉnh lưu nửa sóng","DC","AC","Dòng tăng đột ngột"],"c":2,"e":"Dòng xoay chiều (AC) cho độ nhạy khuyết tật mảnh bề mặt cao nhất do hiệu ứng da và sự linh động hạt rất cao."},{"q":"Câu 64. Khi một từ trường được cảm ứng trong một bộ phận bằng các que châm đặt cách nhau 152 mm (6in.), từ trường sẽ là loại :","a":["Xoáy tròn","Vòng","Dọc","Tứ giác méo"],"c":1,"e":"Phương pháp que châm (prods) truyền dòng điện đi trực tiếp xuyên qua chi tiết, hình thành một mạng lưới từ trường vòng xung quanh điện cực châm."},{"q":"Câu 65. Khi áp dụng lý thuyết \"Quy tắc Bàn tay Phải\", một khuyết tật dọc trên bề mặt của một thanh tròn được phát hiện bằng cách cho dòng điện chạy theo phương song song với phương của các khuyết tật dự đoán, là nhờ :","a":["Phương của dòng điện thẳng hàng với khuyết tật","Từ trường vuông góc với khuyết tật","Nó không tạo ra sự khác biệt","Từ trường song song với khuyết tật"],"c":1,"e":"Theo quy tắc bàn tay phải, dòng điện chạy dọc thẳng sẽ sinh ra từ trường dạng vòng tròn bao quanh, tức là vuông góc với khuyết tật dọc. Điều này tối ưu cho việc phát hiện."},{"q":"Câu 66. Nếu một dòng chạy qua một vật dẫn điện, cái gì sẽ bao quanh vật đó :","a":["Một trường dòng xoáy","Dòng điện","Một từ trường","Một trường dư"],"c":2,"e":"Dòng điện di chuyển trong vật dẫn luôn sinh ra từ trường (magnetic field) đồng tâm bao quanh nó."},{"q":"Câu 67. Với dòng chạy từ + sang - trong một cuộn dây, một từ trường dọc được tạo ra. Điều nào sau đây có thể dùng để thiết lập hướng của từ trường ?","a":["Quy tắc bàn tay trái","Quy tắc bàn tay phải","Định luật Ohm","Không có quy luật liên quan"],"c":1,"e":"Quy tắc bàn tay phải đối với cuộn dây (khum các ngón tay theo chiều dòng điện, ngón cái choãi ra chỉ hướng đường sức từ) dùng để xác định cực Bắc - Nam."},{"q":"Câu 68. Khi vật liệu từ được đặt vào một cuộn dây, các đường từ thông sẽ tập trung trong vật liệu và :","a":["Tạo ra một từ trường dọc","Tạo ra một từ trường vòng","Tạo ra một từ trường dọc - vòng","Không có hiệu ứng gì cả"],"c":0,"e":"Từ thông chạy dọc lõi cuộn dây tập trung vào vật liệu sắt từ đặt bên trong tạo thành phương pháp từ hóa dọc."},{"q":"Câu 69. Dạng từ hoá nào là dễ kiểm soát nhất trong phần lớn các bộ phận :","a":["Từ hoá dọc","Từ trường vĩnh cửu","Từ hoá vòng","Từ hoá song song"],"c":2,"e":"Từ hóa vòng dễ kiểm soát hơn vì từ trường khép kín hoàn toàn bên trong chi tiết, không tạo các cực từ tự do gây hút hạt hỗn loạn ở các góc cạnh ngoài chi tiết."},{"q":"Câu 70. Khi kiểm tra một sản phẩm ống để phát hiện các khuyết tật bề mặt nằm dọc theo chiều dài, loại từ trường tốt nhất để dùng là một :","a":["Từ trường dọc","Từ trường vòng","Từ trường dao động","Từ hoá bằng Yoke"],"c":1,"e":"Khuyết tật chạy dọc thân ống yêu cầu từ trường cắt ngang nó (tức là từ trường vòng)."},{"q":"Câu 71. Vùng có độ lớn từ trường cảm ứng lớn nhất khi dùng một Yoke, là :","a":["Tại cực Bắc của Yoke","Tại cực Nam của Yoke","Vùng nằm giữa hai cực","Trên phía ngoài của các chân cực"],"c":2,"e":"Đường sức từ tập trung dày đặc nhất và có hướng đi thẳng kết nối ngắn nhất tại khoảng không gian thẳng hàng nằm giữa hai chân cực của gông từ."},{"q":"Câu 72. Độ lớn của từ trường được cảm ứng trong một bộ phận thường được nói đến như là :","a":["Mật độ dòng","Điện áp","Mật độ thông lượng","Độ lưu giữ từ"],"c":2,"e":"Mật độ thông lượng từ (magnetic flux density), ký hiệu là B (đơn vị Gauss hoặc Tesla), biểu thị độ mạnh yếu của cảm ứng từ trong vật tư."},{"q":"Câu 73. Yếu tố chủ yếu xác định sự thành công của quá trình kiểm tra hạt từ là :","a":["Độ lớn của từ trường","Điện áp trên cuộn dây từ hoá","Dòng điện chạy qua cuộn dây","Thời gian từ hoá"],"c":0,"e":"Bản chất hạt từ bám tụ được là dựa trên lực hút của trường rò rỉ, do đó độ lớn (cường độ) từ trường tại vùng kiểm tra là yếu tố cốt lõi quyết định."},{"q":"Câu 74. Loại dòng điện phù hợp nhất để phát hiện các bất liên tục bề mặt là :","a":["DC","AC","DC xung","Nửa sóng"],"c":1,"e":"Dòng xoay chiều (AC) đem lại hiệu ứng da ưu việt giúp tập trung tối đa mật độ thông lượng tại bề mặt chi tiết."},{"q":"Câu 75. Khi chuẩn bị một dung dịch tưới chứa hạt từ, điều quan trọng là độ mạnh hay hàm lượng dung dịch đạt đến một mức phù hợp, bởi vì lượng hạt từ quá nhiều có thể :","a":["Giảm cường độ dòng điện kiểm tra","Cần thiết phải tăng dòng từ hoá","Che lấp các chỉ thị","Không phải các điều trên"],"c":2,"e":"Nồng độ quá cao khiến hạt lắng đọng bừa bãi trên bề mặt phông nền, gây nhiễu và che khuất đi các chỉ thị thực của khuyết tật."},{"q":"Câu 76. Một ưu điểm của việc dùng các hạt từ huỳnh quang là :","a":["Yêu cầu ít thiết bị","Tốc độ kiểm tra cao","Giá thành","Chúng trông hấp dẫn hơn nhiều"],"c":1,"e":"Độ tương phản cực cao dưới đèn UV giúp mắt người nhận biết chỉ thị ngay lập tức, đẩy nhanh tiến độ và tốc độ đánh giá chi tiết."},{"q":"Câu 77. Khi sử dụng hạt từ dạng bột khô, phương pháp phù hợp để áp dụng chúng lên bộ phận là :","a":["Áp dụng nó thật mạnh bằng khí","Xoay - lăn vật liệu trong bình chứa bột từ","Áp dụng nó từ phía đáy bộ phận","Rắc các hạt lên bề mặt kiểm tra một cách nhẹ nhàng nhất có thể được"],"c":3,"e":"Hạt khô cần được thổi nhẹ nhàng tạo dạng đám mây bụi lắng dần xuống bề mặt để chúng có cơ hội bị bắt giữ bởi trường rò thay vì bị thổi bay đi."},{"q":"Câu 78. Khi sử dụng các hạt từ dạng ướt trong chất lỏng chứa là nước, chất làm ẩm được thêm vào để :","a":["Ngăn cản sự đông cứng","Ngăn cản sự ăn mòn thiết bị kiểm tra","Đảm bảo tưới ướt bộ phận một cách phù hợp","Giảm lượng nước cần dùng"],"c":2,"e":"Chất làm ẩm (wetting agent) làm giảm sức căng bề mặt của nước, giúp dung dịch phủ đều và bám ướt hoàn toàn lên bề mặt kim loại không bị co cụm thành giọt."},{"q":"Câu 79. Khi chuẩn bị một dung dịch kiểm tra chứa hạt từ, số lượng hạt trong một đơn vị thể tích chất lỏng được gọi là :","a":["Thang đo","Số hạt","Độ mạnh hay hàm lượng","Các giới hạn hữu ích"],"c":2,"e":"Nồng độ hạt trong bể dung dịch được định nghĩa bằng độ mạnh hay hàm lượng hạt từ (bath strength/concentration)."},{"q":"Câu 80. Lực kháng từ :","a":["Mô tả các phương tiện mà nhờ đó các hạt từ được hoà trộn lơ lửng trong chất lỏng khi dùng phương pháp ướt","Mô tả lực từ hoá được dùng với phương pháp liên tục","Đại diện cho lực từ hoá ngược chiều cần thiết để loại bỏ được từ trường dư trong một vật liệu","Không phải là một đại lượng được dùng trong kiểm tra hạt từ"],"c":2,"e":"Lực kháng từ (coercive force) là giá trị lực từ trường ngược chiều cần áp vào để khử hoàn toàn cảm ứng từ dư đưa về mức bằng không."},{"q":"Câu 81. Sự khử từ :","a":["Có thể được thực hiện bằng cách nung nóng một vật liệu lên trên điểm Curie của nó","Luôn luôn là cần thiết","Có thể được thực hiện chỉ với dòng AC","Có thể được thực hiện chỉ với dòng DC"],"c":0,"e":"Nung nóng vượt nhiệt độ Curie phá hủy hoàn toàn trật tự sắp xếp từ tính bên trong, đưa vật liệu về trạng thái phi từ tính hoàn toàn."},{"q":"Câu 82. Độ lưu giữ từ :","a":["Đại diện cho khả năng cảm ứng từ trường trong một vật thể sắt từ bởi một lực từ hoá bên ngoài","Đại diện cho khả năng của một vật liệu chống lại việc thiết lập một từ trường / từ thông ở trong nó","Đại diện cho khả năng của một vật liệu lưu giữ một phần từ trường đã được thiết lập trong nó sau khi lực từ hoá đã được ngắt bỏ","Không phải là một đại lượng được dùng trong kiểm tra hạt từ"],"c":2,"e":"Tính lưu từ (retentivity) đo lường khả năng giữ lại từ trường dư của vật liệu sắt từ sau khi cắt bỏ nguồn sinh từ trường."},{"q":"Câu 83. Độ cản trở việc khử từ là :","a":["Lớn hơn trong các vật liệu cứng so với trong các vật liệu mềm","Lớn hơn trong các vật liệu mềm so với trong các vật liệu cứng","Như nhau đối với cả vật liệu cứng cũng như mềm","Không tồn tại"],"c":0,"e":"Thép cứng (hard materials) thường có lực kháng từ rất lớn nên chống lại việc bị khử từ mạnh hơn nhiều so với thép mềm."},{"q":"Câu 84. Khử từ :","a":["Có thể dễ dàng hay khó khăn tuỳ thuộc vào loại vật liệu","Là dễ dàng đối với các vật liệu có một lực cưỡng bức cao","Luôn luôn là một công việc khó khăn nhất trong các vật liệu lưu giữ một từ trường dư cao","Tất cả các điều trên đều đúng"],"c":0,"e":"Độ khó hay dễ của việc khử từ phụ thuộc trực tiếp vào bản chất lực kháng từ và đặc tính cơ lý của từng loại vật liệu cụ thể."},{"q":"Câu 85. Độ mạnh của dung dịch chứa hạt từ dạng ướt nên được duy trì với một mức độ cho trước là vì :","a":["Một mức độ thấp có thể cho một chỉ thị yếu","Một mức độ cao có thể
