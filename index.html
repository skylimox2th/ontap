<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Thi Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .bg-card { background: #1e293b; border: 1px solid #334155; }
        .option-item { background: rgba(30, 41, 59, 0.5); border: 1px solid #475569; transition: 0.3s; }
        .option-item:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .option-item.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        .nav-box { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #475569; font-size: 13px; }
        .nav-box.active { background: #3b82f6; border-color: #3b82f6; font-weight: bold; }
        .nav-box { border-radius: 4px; }
        .nav-box.correct-nav { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .nav-box.wrong-nav { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .nav-box.skipped { border-color: #eab308; color: #eab308; background: rgba(234, 179, 8, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto">
    <!-- MÀN HÌNH CHÍNH -->
    <div id="home-screen">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center"><i class="fas fa-graduation-cap mr-2"></i>KHO KHÓA HỌC</h1>
        <div id="subject-list" class="grid gap-4 mb-8"></div>
        <button onclick="showScreen('editor-screen')" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition shadow-lg">+ Thêm Môn Học Mới</button>
    </div>

    <!-- MÀN HÌNH TRÌNH BIÊN SOẠN -->
    <div id="editor-screen" class="hidden">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Cấu hình môn học</h2>
        <div class="bg-card p-6 rounded-xl">
            <input type="text" id="subject-name" placeholder="Tên môn học (Ví dụ: Cơ khí AWS)" class="w-full bg-slate-800 border border-slate-600 p-3 rounded mb-4 focus:outline-none focus:border-blue-500">
            <textarea id="json-input" rows="12" placeholder='Dán JSON câu hỏi vào đây...' class="w-full bg-slate-800 border border-slate-600 p-3 rounded text-sm font-mono focus:outline-none focus:border-blue-500"></textarea>
            <div class="flex gap-4 mt-6">
                <button onclick="saveSubject()" class="flex-1 bg-green-600 p-3 rounded-lg font-bold">Lưu lại</button>
                <button onclick="showScreen('home-screen')" class="flex-1 bg-slate-600 p-3 rounded-lg font-bold">Hủy</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="hidden">
        <div class="mb-4 text-yellow-500 font-bold uppercase tracking-wider">Câu hỏi <span id="cur-idx-text">1</span> / <span id="total-idx-text">10</span></div>
        <div class="bg-card p-6 rounded-lg mb-6 border-l-4 border-blue-500">
            <div id="question-text" class="text-xl leading-relaxed"></div>
        </div>
        <div id="options-container" class="space-y-3 mb-8"></div>
        <div class="flex flex-wrap gap-2 justify-between border-t border-slate-700 pt-6">
            <div class="flex gap-2">
                <button onclick="prevQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">← Trước</button>
                <button onclick="showHint()" class="bg-yellow-600/20 text-yellow-500 border border-yellow-500/50 px-6 py-2 rounded text-sm font-medium hover:bg-yellow-600 hover:text-white transition">💡 Gợi ý</button>
            </div>
            <button onclick="checkAnswer()" class="bg-blue-600 px-10 py-2 rounded font-bold shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:bg-blue-500">Trả lời</button>
            <div class="flex gap-2">
                <button onclick="showScreen('home-screen')" class="bg-slate-700 px-4 py-2 rounded text-sm font-medium">Dừng làm bài</button>
                <button onclick="nextQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">Tiếp →</button>
            </div>
        </div>
        <div id="hint-box" class="hidden mt-6 p-4 bg-blue-900/30 border border-blue-500/30 rounded-lg text-blue-200 italic text-sm"></div>
        <div class="mt-10">
            <div class="text-sm font-bold mb-4 uppercase text-slate-400">Danh sách câu</div>
            <div id="question-grid" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // DỮ LIỆU F12 ĐỂ ĐÂY
    // Hãy bôi đen toàn bộ chữ DÁN_CHỖ_NÀY và bấm Ctrl + V (hoặc chuột phải Paste)
    // Chú ý: Đừng xóa dấu chấm phẩy ; ở phía sau cùng nhé
    // =========================================================================
    
    const KHO_DU_LIEU = {"ngan hang cau hoi PT":[{"q":"Điều kiện nào sẽ ảnh hưởng đến tốc độ và phạm vi mà chất thấm lỏng đi vào các vết nứt, nẻ và các khe mở nhỏ khác?","a":["Độ cứng của mẫu vật kiểm tra","Điều kiện, tình trạng của bề mặt mẫu vật kiểm tra","Màu sắc của chất thấm","Độ dẫn điện của mẫu kiểm tra"],"c":1,"e":""},{"q":"Đâu là một phân loại được dùng phổ biến cho chất thấm?","a":["Chất thấm có thể nhũ tương sau","Chất thấm phi sắt","Chất thấm tẩm thực hoá học","Chất thấm phi nước"],"c":0,"e":""},{"q":"Một phương pháp được chấp nhận chung để loại bỏ chất thấm dư có thể rửa sạch - không phải bằng nước là :","a":["Nhúng đi nhúng lại mẫu kiểm tra trong một chất làm sạch","Nhúng kỹ mẫu kiểm tra trong nước tẩy rửa nóng","Thổi sạch chất thấm dư khỏi bề mặt của bộ phận bằng khí nén","Lau và làm sạch cẩn thận mẫu kiểm tra bằng một rẻ thấm ẩm chất làm sạch"],"c":3,"e":""},{"q":"Tất cả các bộ phận sau đây có thể kiểm tra được bằng phương pháp thấm lỏng, ngoại trừ :","a":["Một sản phẩm sắt đúc","Một sản phẩm nhôm rèn","Một bộ phận làm bằng một vật liệu chất dẻo xốp","Một bộ phận làm bằng một vật liệu không xốp"],"c":2,"e":""},{"q":"Bất liên tục nào sau đây có thể tìm thấy bằng phương pháp kiểm tra thấm?","a":["Một vết nứt bề mặt","Một vết nứt nằm dưới bề mặt","Một ngậm xỉ bên trong","Không phải các loại trên"],"c":0,"e":""},{"q":"Cách nào sau đây, nói chung, là một phương pháp dễ được chấp nhận hơn cho việc làm sạch bộ phận trước khi kiểm tra thấm?","a":["Bắn cát (Phun cát)","Chải bằng sợi cứng","Mài","Giảm mỡ bằng hơi"],"c":3,"e":""},{"q":"Tất cả các phương pháp sau đây được dùng phổ biến để làm sạch bộ phận trước khi kiểm tra thấm, ngoại trừ ;","a":["Giảm mỡ bằng hơi","Dung môi lỏng","Chải bằng sợi cứng","Chất làm sạch có tính kiềm"],"c":2,"e":""},{"q":"Các chất dầu dùng cho quá trình cắt có thể được loại bỏ một cách hiệu quả khỏi bộ phận trước khi kiểm tra thấm bằng :","a":["Nung nóng trước","Giảm mỡ bằng hơi","Rửa sạch bằng nước","Tất cả các cách trên"],"c":1,"e":""},{"q":"Loại chất gây bẩn phổ biến trong chất lỏng thấm huỳnh quang là :","a":["Các chất hàn kim loại","Dầu","Các chất tẩy rửa ( từ quá trình làm sạch)","Nước"],"c":3,"e":""},{"q":"Ánh sáng đen, với một màng lọc có chức năng phù hợp đặt đúng chỗ, được dùng cho kiểm tra thấm huỳnh quang, có thể gây ra hư hỏng vĩnh viễn đến :","a":["Các mô của cơ thể người","Mắt người","Các tế bào máu người","Không điều nào ở trên cả"],"c":3,"e":""},{"q":"Tất cả các nguyên lý kiểm tra cơ bản sau đây áp dụng cho các phương pháp thấm, ngoại trừ :","a":["Chất thấm phải đi vào bất liên tục để tạo thành chỉ thị","Các chỉ thị phát sáng khi được chiếu bằng ánh sáng đen","Một thời gian thấm dài hơn được yêu cầu cho bất liên tục nhỏ hơn","Nếu chất thấm bị rửa sạch khỏi bất liên tục, một chỉ thị sẽ không được tạo ra bởi bất liên tục này"],"c":1,"e":""},{"q":"Các bất liên tục nằm dưới bề mặt có thể được phát hiện tốt nhất bởi :","a":["Phương pháp thấm nhũ tương sau","Phương pháp thấm màu có thể nhìn thấy được","Phương pháp thấm huỳnh quang có thể rửa được bằng nước","Không phương pháp nào ở trên"],"c":3,"e":""},{"q":"Chất thấm màu nhìn thấy được có thể được áp dụng bằng :","a":["Chải, quét","Phun, xịt","Nhúng","Tất cả các cách trên"],"c":3,"e":""},{"q":"Bước đầu tiên khi tiến hành kiểm tra thấm lỏng trên một bề mặt đã được sơn phủ là :","a":["áp dụng cẩn thận chất thấm lên khắp bề mặt","Loại bỏ hoàn toàn lớp sơn phủ","Rửa kỹ lưỡng bề mặt này bằng một chất tẩy rửa","Chải quét bằng sợi cứng bề mặt để tạo độ nhám (xù xì) cho lớp sơn trơn nhẵn của bề mặt"],"c":1,"e":""},{"q":"Khi sử dụng một chất thấm nhũ tương - sau, cần áp dụng chất tạo nhũ tương :","a":["Trước khi áp dụng chất thấm","Sau quá trình rửa nước","Sau khi thời gian thấm kết thúc","Sau khi thời gian hiện kết thúc"],"c":2,"e":""},{"q":"Khi tiến hành một kiểm tra thấm lỏng dạng rửa được bằng nước, chất hiện ướt được áp dụng :","a":["Ngay sau khi chất thấm vừa mới được áp dụng","Ngay trước khi chất thấm được áp dụng","Sau khi loại bỏ chất thấm","Sau khi loại bỏ chất tạo nhũ tương"],"c":2,"e":""},{"q":"Khái niệm mô tả tác dụng của một chất hiện cụ thể khi hút chất thấm từ trong một bất liên tục lên, nhằm cho chất thấm loang ra nhiều nhất để tăng độ tương phản và độ nhạy, được biết như là :","a":["Quá trình thấm hút","Tác dụng mao dẫn","Sự tập trung","Sự hút"],"c":1,"e":""},{"q":"Việc sử dụng một đèn ánh sáng đen với màn lọc bị rạn nứt hoặc không có màn lọc, có thể gây ra hư hại đến mắt người vì đèn này phát ra :","a":["ánh sáng đen","ánh sáng cực tím","ánh sáng hồng ngoại","Không phải những lý do trên"],"c":1,"e":""},{"q":"Khái niệm dùng để định nghĩa khoảng thời gian mà bộ phận kiểm tra được bao phủ chất thấm là","a":["Thời gian chờ","Thời gian hút (ráo)","Thời gian thấm","Thời gian chảy vào"],"c":2,"e":""},{"q":"Thường thường, phương pháp được ưa thích nhất để loại bỏ chất thấm dư rửa được bằng nước sau khi kết thúc thời gian thấm là bằng cách dùng :","a":["Nước phun giọt to, áp suất thấp","Nước và bàn chải","Tia nước mạnh","Nước và các dẻ lau sạch"],"c":0,"e":""},{"q":"Khi tiến hành một kiểm tra thấm lỏng sử dụng chất thấm màu nhìn thấy được nhũ tương - sau, phương pháp thường được chấp nhận để áp dụng chất hiện ướt là :","a":["Chải, quét","Dùng rẻ tẩm ướt","Nhúng","Phun xịt"],"c":3,"e":""},{"q":"Đặc trưng nào sau đây không áp dụng cho kiểm tra thấm lỏng?","a":["Phương pháp này có thể xác định một cách chính xác chiều sâu của một vết nứt hoặc bất liên tục","Phương pháp này có thể được dùng để kiểm tra tại chỗ - ngoài hiện trường các bộ phận lớn","Phương pháp này có thể được dùng để phát hiện các bất liên tục nông trên bề mặt","Phương pháp này có thể được thực hiện với các độ nhạy cao hoặc thấp tuỳ thuộc vào việc dùng các chất liệu thấm khác nhau"],"c":0,"e":""},{"q":"Bất liên tục nào sau đây dễ bị bỏ sót nhất do các kỹ thuật tẩy rửa không phù hợp?","a":["Một vết chồng - lấp (vết gấp) trong quá trình rèn","Rỗ sâu","Các bất liên tục nông và rộng trên bề mặt","Kỹ thuật tẩy rửa không ảnh hưởng đên việc phát hiện các bất liên tục"],"c":2,"e":""},{"q":"Khi tiến hành một kiểm tra thấm lỏng huỳnh quang, một kỹ thuật được dùng phổ biến để đảm bảo rằng chất thấm dư đã được loại bỏ trước khi áp dụng một chất hiện, là :","a":["Thổi khí nén lên khắp bề mặt này","Tẩm thực ăn mòn bề mặt bằng hoá chất","Thấm khô bề mặt bằng giấy thấm hút","Dò - quét bề mặt bằng một đèn ánh sáng đen"],"c":3,"e":""},{"q":"Điều kiện bề mặt nào sau đây có thể có ảnh hưởng xấu đối với kiểm tra thấm lỏng?","a":["Một bề mặt ướt","Một mối hàn xù xì, thô ráp","Một bề mặt có chất dầu mỡ bám","Tất cả các điều kiện trên"],"c":3,"e":""},{"q":"Kiểm tra thấm lỏng có khả năng phát hiện :","a":["Các bất liên tục của quá trình nứt do ăn mòn - ứng suất xuyên (cấu trúc) hạt","Các bất liên tục mở ra trên bề mặt","Các bất liên tục nằm dưới bề mặt","Tất cả các loại trên"],"c":1,"e":""},{"q":"Thiết bị ánh sáng đen được yêu cầu khi kiểm tra thấm bởi :","a":["Phương pháp thấm huỳnh quang","Phương pháp thấm màu nhìn thấy được","Phương pháp thấm phi - huỳnh quang","Tất cả các phương pháp trên"],"c":0,"e":""},{"q":"Khái niệm dùng để định nghĩa xu hướng của các chất lỏng nào đó thấm xuyên vào các khe mở nhỏ như một vết nứt chẳng hạn, là :","a":["Sự bão hoà","Tác dụng mao dẫn","Quá trình thấm hút","Chất làm ướt"],"c":1,"e":""},{"q":"Chất thấm dư (tất cả các chất thấm ngoại trừ chất thấm trong bất liên tục) được loại bỏ ra khỏi mẫu vật :","a":["Sau khi thời gian thấm được yêu cầu đã kết thúc","Trước khi áp dụng một chất tạo nhũ tương nếu chất thấm nhũ tương - sau được sử dụng","Bằng một chất làm sạch dưới dạng tia phun","Chỉ khi các chất thấm rửa được bằng nước được sử dụng"],"c":0,"e":""},{"q":"Khi dùng một chất thấm có thể nhũ tương - sau, thời gian nhũ tương hoá nên :","a":["Dài bằng thời gian thấm","Bằng một nửa thời gian thấm","Giống như thời gian hiện","Chỉ dài vừa đủ để loại bỏ lớp nền gây nhiễu"],"c":3,"e":""},{"q":"Khi một kiểm tra viên đang làm việc trong một vùng được che tối, anh / chị đó nên quen với vùng "Hỗ trợ cung cấp một hình ảnh của một bất liên tục","Thêm tính huỳnh quang cho chất thấm","Giúp kiểm soát sự chảy rộng ra"],"c":2,"e":""},{"q":"Điều nào sau đây là giới hạn chủ yếu của kiểm tra thấm lỏng?","a":["Kiểm tra thấm không thể sử dụng trên vật liệu sắt từ","Kiểm tra thấm không thể định vị các bất liên tục nông trên bề mặt","Kiểm tra thấm không thể sử dụng trên các bề mặt phi kim","Kiểm tra thấm không thể định vị các bất liên tục nằm dưới bề mặt"],"c":3,"e":""},{"q":"Trong kiểm tra thấm, khoảng thời gian từ khi áp dụng chất hiện cho đến lúc kiểm tra (quan sát) thường được gọi là :","a":["Thời gian nhũ tương hoá","Thời gian hiện","Thoời gian thấm","Không phải các khái niệm trên"],"c":1,"e":""},{"q":"Kiểm tra thấm lỏng là một kiểm tra không phá huỷ có thể sử dụng để :","a":["Định vị và đánh giá tất cả các loại bất liên tục trong một mẫu kiểm tra","Định vị và xác định chiều dài, chiều rộng, và độ sâu của các bất liên tục trong một mẫu kiểm tra","Xác định độ bền kéo của một mẫu kiểm tra","Định vị các bất liên tục mở ra trên bề mặt"],"c":3,"e":""},{"q":"Khi tiến hành một kiểm tra thấm sử dụng chất thấm huỳnh quang, thiết bị ánh sáng đen được yêu cầu để :","a":["Làm chất thấm phát sáng (huỳnh quang)","Hỗ trợ các đặc trưng quá trình mao dẫn của một chất thấm","Trung hoà chất thấm dư trên bề mặt","Giảm sức căng bề mặt của bộ phận này"],"c":0,"e":""},{"q":"Phương pháp được dùng để loại bỏ chất thấm dư màu nhìn thấy được ra khỏi một bề mặt kiểm tra được xác định chủ yếu bởi :","a":["Độ xù xì thô ráp của bề mặt mẫu vật","Loại vật liệu được kiểm tra","Độ dài thời gian thấm","Tất cả các điều kiện trên"],"c":3,"e":""},{"q":"Loại nào sau đây là một loại chất hiện được dùng trong kiểm tra thấm :","a":["Khô","Hạt ướt","Hạt phi nước","d. Hoà tan trong nước","Not of all"],"c":0,"e":""},{"q":"Khi kiểm tra thấm các bộ phận, nhiệt độ của các chúng nên gần với nhiệt độ phòng. Nếu các bộ phận có nhiệt độ thấp hơn khi kiểm tra, thì","a":["Chất thấm có thể trở nên nhớt nhầy","Chất thấm có thể bốc hơi rất nhanh","Cường độ màu của chất thấm sẽ giảm","Chất thấm có xu hướng dính chặt vào bề mặt của bộ phận"],"c":0,"e":""},{"q":"Nếu một bộ phận được kiểm tra thấm, lúc đầu được làm nóng lên một nhiệt độ cao, thì chất thấm :","a":["Có thể trở nên nhớt nhầy","Có thể bốc cháy hoặc bốc hơi rất nhanh","Có thể mất một phần độ sáng màu sắc của nó","Sẽ thể hiện bất liên tục tốt hơn"],"c":1,"e":""},{"q":"Các chất thấm có thể được phân loại hoặc chia nhỏ thành các nhóm theo phương pháp được dùng để loại bỏ chất thấm dư. Loại nào sau đây là một cách phân loại phù hợp với lời tuyên bố này?","a":["Có thể loại bỏ bằng chất phi - dung môi","Được giảm mỡ bằng bốc hơi","Có thể loại bỏ bằng bàn chải","Có thể rửa được bằng nước"],"c":3,"e":""},{"q":"Vấn đề liên quan đến việc kiểm tra lại một mẫu trước đó đã được kiểm tra sử dụng chất thấm lỏng là :","a":["Chất thấm có thể tạo thành các giọt lồi trên bề mặt","Dư lượng chất thấm đã khô còn trong bất liên tục có thể không hoà tan được và việc kiểm tra lại có thể bị sai lạc","Chất thấm sẽ mất phần lớn độ sáng màu sắc của nó","Những điều trên không phải là những phát biểu đúng"],"c":1,"e":""},{"q":"Điều kiện nào sau đây sẽ làm giảm tuổi thọ của bóng đèn ánh sáng đen?","a":["Sự thăng giáng (trồi sụt) của điện áp","Bụi bẩn bám trên bề mặt bóng","Sự thay đổi của nhiệt độ phòng","Tất cả những điều kiện trên"],"c":3,"e":""},{"q":"khi một chất thấm được áp dụng lên một bộ phận bằng cách nhúng bộ phận vào trong một bể chứa chất thấm, bộ phận này phải :","a":["Để trong bể chứa chất thấm trong suốt thời gian thấm","Để trong bể chứa chất thấm trong ít nhất một nửa thời gian thấm","Để trong bể chứa chất thấm chỉ trong một thời gian vừa đủ để đảm bảo rằng bề mặt được bao phủ chất thấm","Không để trong bể chứa chất thấm quá thời gian 5 phút"],"c":2,"e":""},{"q":"Tuyên bố nào sau đây không áp dụng cho chất hiện dùng trong kiểm tra thấm?","a":["Các chất hiện thường có độ phát sáng cao (huỳnh quang)","Các chất hiện thường cung cấp một nền tương phản trong qóa trình kiểm tra (quan sát)","Các chất hiện hấp thụ hoặc hút chất thấm còn lưu trong bất liên tục sau khi quá trình dội rửa đã hoàn tất","Các chất hiện có thể là loại khô hoặc ướt"],"c":0,"e":""},{"q":"Phát biểu nào sau đây là đúng?","a":["Việc bắn (phun) cát là một phương pháp được chấp nhận chung để làm sạchk bề mặt được kiểm tra thấm lỏng","Các bộ phận nên được làm nóng trước khi áp dụng một chất thấm","Nếu việc làm khô quá mức, nhiệt có thể làm giảm tính hiệu dụng của chất thấm","Thời gian hiện nên ít nhất bằng với thời gian thấm"],"c":2,"e":""},{"q":"Khi sử dụng một chất hiện ướt :","a":["Một lớp dày chất hiện là tốt hơn một lớp mỏng để thể hiện các vết nứt rất mảnh","Khí nén nên được dùng để loại bỏ chất hiện dư","Một chất hiện màu đen sẽ thể hiện độ tương phản tốt hơn một chất hiện màu trắng","Một lớp mỏng chất hiện là tốt hơn một lớp dày để thể hiện các vết nứt rất mảnh"],"c":3,"e":""},{"q":"Tuyên bố nào sau đây là sai?","a":["Việc bắn cát không phải là một phương pháp được khuyên dùng để chuẩn bị cho một kiểm tra thấm","Không cần thiết phải loại bỏ một lớp dầu mỏng ra khỏi một bộ phận trước khi kiểm tra thấm bởi vì chất thấm về cơ bản là một chất dầu","Giảm mỡ bằng hơi là một phương pháp rất tốt để loại bỏ dầu ra khỏi bề mặt của bộ phận được kiểm tra thấm","Một thiết bị điều chỉnh điện áp nên được sử dụng với đèn ánh sáng đen nếu điện áp thăng giáng"],"c":1,"e":""},{"q":"Một hình ảnh bất liên tục màu đỏ trên nền tương phản màu trắng rất có thể được nhìn thấy khi :","a":["Các chất hiện khô được dùng","Các chất thấm màu nhìn thấy được, được dùng","Các chất thấm huỳnh quang có thể nhũ tương - sau được dùng","Các chất hiện ướt được dùng"],"c":1,"e":""},{"q":"Loại nào sau đây có thể được loại bỏ khỏi bề mặt của một mẫu vật bởi quá trình giảm mỡ bằng hơi?","a":["Dầu","Sơn","Các lớp phủ bằng hợp chất phốt pho","Các loại ôxít"],"c":0,"e":""},{"q":"Mục đích của việc dùng một chất hiện trên một mẫu vật là để :","a":["Thúc đẩy sự xuyên thấm của chất thấm","Hấp thụ các dư lượng chất tạo nhũ tương","Hấp thụ chất thấm từ trong các bất liên tục và cung cấp một bề mặt tạo tương phản","Hỗ trợ làm khô bề mặt để quan sát tốt hơn"],"c":2,"e":""},{"q":"Phát biểu nào sau đây là một cách sử dụng không đúng các tấm (khối) nứt?","a":["Để thiết lập một kích thước tiêu chuẩn của nứt có thể tái tạo được khi có nhu cầu","Để xác định độ nhạy tương đối của hai chất thấm khác nhau","Để xác định xem liệu một chất thấm đã mất hoặc suy giảm độ sáng trên các chất thấm huỳnh quang do nhiễm bẩn hay không","Để xác định mức độ hoặc phương pháp làm sạch cần thiết để loại bỏ chất thấm trên bề mặt mà không loại bỏ nó ra khỏi các vết nứt"],"c":0,"e":""},{"q":"Điều nào sau đây thường được chấp nhận như một chú ý quan trọng nhất khi dùng các chất thấm có thể rửa được bằng nước?","a":["Phải đảm bảo rằng bộ phận được rửa kỹ trong quá trình dội rửa","Phải đảm bảo rằng thời gian thấm đã được đề xuất không bị vượt quá","Tránh dội rửa quá mức","Tránh áp dụng quá mức chất tạo nhũ tương"],"c":3,"e":""},{"q":"Điều nào sau đây thường được chấp nhận như một chú ý quan trọng nhất khi dùng các chất thấm có thể loại bỏ được bằng dung môi?","a":["Không áp dụng quá nhiếu chất tạo nhũ tương","Không áp dụng quá nhiếu dung môi","Không dùng áp suất rửa xả không đủ","Đảm bảo sử dụng một đèn ánh sáng đen để xác định liệu chất thấm dư đã được dội rửa sạch hay chưa"],"c":3,"e":""},{"q":"Việc rửa xả không đầy đủ các chất thấm huỳnh quang sẽ tạo ra :","a":["Sự ăn mòn bề mặt sau đó","Khó khăn trong việc áp dụng chất hiện","Quá trình chảy loang quá mức","Sự phát sáng (huỳnh quang)của bề mặt nền quá mức"],"c":1,"e":""},{"q":"Lưu ý về an toàn nào sau đây không áp dụng khi cầm, mang các chất liệu thấm?","a":["Việc tiếp xúc trong một thời gian dài của da thịt với chất thấm nên tránh vì các gốc dầu hoặc dung môi có thể gây tổn thương da","Không nên hít phải quá nhiều các bột chất hiện","Phải đeo khẩu trang và mặc quần áo bảo vệ toàn thân mọi lúc","Do các chất dung môi được dùng với quá trình thấm màu nhìn thấy được là có khả năng cháy, nên chất liệu này nên được giữ gìn cách xa nguồn lửa hở."],"c":2,"e":""},{"q":"Một bộ phận phải được duy trì ướt trong bao lâu với chất thấm trước khi quá trình loại bỏ bắt đầu?","a":["Nó thay đổi phụ thuộc vào loại chất thấm sử dụng, loại vật liệu được kiểm tra, độ nhạy mong muốn, và loại bất liên tục cần phát hiện","Bởi vì chất thấm sẽ thấm xuyên vào một bất liên tục có kích thước bất kỳ trong thời gian một vài giây, quá trình loại bỏ nên bắt đầu càng sớm càng tốt ngay sau khi chất thấm vừa được áp dụng","3 phút","10 phút"],"c":0,"e":""},{"q":"Yếu tố nào sau đây sẽ ảnh hưởng đến độ phân giải các chỉ thị thấm?","a":["Độ nhạy của chất liệu thấm được dùng","Điều kiện bề mặt của bộ phận","Nhiệt độ của bộ phận và/ hoặc chất thấm","Tất cả các yếu tố trên"],"c":3,"e":""},{"q":"Một sự mất nước nghiêm trọng trong một hỗn hợp chất hiện ướt hoặc hàm lượng bột chất hiện quá mức có thể gây ra :","a":["Một sự mất phát sáng huỳnh quang trong khi quan sát kiểm tra","Các chỉ thị không liên quan","Sự rạn nứt các lớp phủ chất hiện trong quá trình làm khô","Không phải điều nào ở trên"],"c":2,"e":""},{"q":"Điều gì sẽ xảy ra nếu một người nhìn trực tiếp thẳng vào một đèn ánh sáng đen?","a":["Nó sẽ làm hư hỏng vĩnh viễn mắt anh ta","Nó có thể làm mất khả năng nhìn của người này trong một khoảng thời gian ngắn","Nó sẽ gây ra tình trạng mù toàn phần tạm thời","Không phải những điều trên"],"c":1,"e":""},{"q":"Khi sử dụng chất hiện khô, quá trình làm khô được thực hiện :","a":["Ngay sau khi loại bỏ chất thấm dư","Trước bước kiểm tra quan sát","Kỹ lưỡng","Tất cả các điều trên"],"c":3,"e":""},{"q":"Sai sót trong việc loại bỏ hoàn toàn các chất axít ra khỏi một bộ phận trước khi chất thấm huỳnh quang được áp dụng, sẽ gây ra :","a":["Giảm độ phát sáng huỳnh quang của chất thấm","Cần phải tăng gấp đôi thời gian thấm lên","Các vệt vĩnh viễn trên bộ phận","Tất cả các điều trên"],"c":3,"e":""},{"q":"Chất thấm được áp dụng lên một bộ phận bằng quá trình nhúng. Bộ phận sau đó được đặt lên một cái giá trong khi chất thấm ngấm vào các bất liên tục. Nếu thời gian thấm quá dài, sẽ là khó khăn cho việc rửa xả chất thấm ra khỏi bộ phận. Nếu điều này xảy ra, việc rửa xả bình thường có thể phục hồi bằng cách nào?","a":["Làm lạnh bộ phận xuống nhiệt độ 40C (400F)","Làm nóng bộ phận lên nhiệt độ 540C (1300F)","Nhúng lại bộ phận","áp dụng một chất hiện ướt trước khi cố gắng rửa xả bộ phận"],"c":1,"e":""},{"q":"Khi làm khô các bộ phận trong một kiểm tra thấm, các bộ phận :","a":["Thường khô tại nhiệt độ phòng","Thường được làm khô bằng một máy làm khô dùng khí nóng đối lưu","Nên được làm khô trong một tủ sấy được đặt ở nhiệt độ 540 (1300)","Nên được làm khô bằng khí lạnh cưỡng bức"],"c":1,"e":""},{"q":"Sự nhiễm bẩn với một lượng nước quá mức của chất thấm có thể rửa được bằng nước, sẽ :","a":["Giảm chất lượng thấm của chất thấm","ảnh hưởng xấu đến tính tẩy rửa được của chất thấm","Cả a và b đều đúng","Cả a và b đều không đúng"],"c":2,"e":""},{"q":"Phương pháp nào sau đây (không) yêu cầu một nguồn điện?","a":["Phương pháp thấm huỳnh quang có thể rửa được bằng nước","Phương pháp thấm huỳnh quang nhũ tương-sau","Phương pháp thấm màu nhìn thấy được","Không phải các phương pháp trên"],"c":2,"e":""},{"q":"Khi dùng một chất thấm huỳnh quang, việc kiểm tra thực tế phải được thực hiện :","a":["Trong một phòng được chiếu sáng mạnh","Với một bộ phận có nhiệt độ từ 10 đến 700C (125 đến 1750C)","Ngay sau khi chất hiện được áp dụng","Trong một khu vực được che tối, dưới ánh sáng đen"],"c":3,"e":""},{"q":"Chất thấm nào sau đây có thể được dùng khi việc kiểm tra phải tiến hành dưới điều kiện ánh sáng thông thường?","a":["Chất thấm màu nhìn thấy được","Chất thấm huỳnh quang có thể rửa được bằng nước","Chất thấm huỳnh quang nhũ tương-sau","Bất kỳ loại nào ở trên"],"c":0,"e":""},{"q":"Tất cả những vật liệu sau đây có thể được kiểm tra một cách hiệu quả với chất thấm lỏng, ngoại trừ :","a":["Nhôm","Gốm trần (không tráng men)","Thuỷ tinh","Manhê"],"c":1,"e":""},{"q":"Điều nào sau đây là một nhược điểm của việc dùng phương pháp kiểm tra thấm lỏng?","a":["Phương pháp kiểm tra thẩm thấu lỏng có khả năng kiểm tra các chi tiết nhỏ","Phương phám kiểm tra thẩm thấu lỏng có thể phát hiện được các vết nứt nhỏ","pp PT là phương pháp đơn giản","pp PT có hiệu quả tại bất cứ nhiệt độ nào"],"c":3,"e":""},{"q":"Một chất thấm tốt phải thực hiện được tất cả các công việc, ngoại trừ:","a":["có khả năng thấm nhanh vào các khe hở rất nhỏ","bay hơi nhanh","có khả năng lưu lại trong các khe hở tương đối thô","dễ loại bỏ khỏi bề mặt sau khi kiểm tr"],"c":1,"e":""},{"q":"Điều nào sau đây không phải là một đặc điểm của chất hiện trong pp PT:","a":["vật liệu phải có khả năng hấp thụ","vật liệu phải tạo được lớp phủ mỏng và đồng đều trên toàn bộ bề mặt","vật liệu phải phát quang nếu sử dụng với chất thấm huỳnh quang","vật liệu không được chứa các thành phần độc hại cho người sử dụng"],"c":2,"e":""},{"q":"Chất hiện, nếu sử dụng không đúng có thể:","a":["che lấp các chỉ thị","khó loại bỏ","làm nhiễm bẩn vật kiểm tra","tất cả các điều trê"],"c":3,"e":""},{"q":"Chất thấm màu tương phản trên thị trường dưới dạng nào sau đây?","a":["tẩy rửa bằng dung môi","rửa nước","nhũ tương hoá","tất cả"],"c":3,"e":""},{"q":"Những điều nào sau đây có thể là nguồn gốc gây ra các chỉ thị sai?","a":["chất thấm trên bàn kiểm tra","chất thấm trên tay người kiểm tra","có sự nhiễm bẩn từ chất hiện khô hoặc ướt vào chất thấm","tất cả"],"c":3,"e":""},{"q":"Làm sạch trước khi kiểm tra thấm:","a":["không được yêu cầu","quan trong vì nếu không làm sạch đầy đủ thì chất hiện không áp vào được","cần thiết vì bề mặt bị nhiễm bẩn có thể ngăn cản chất thấm đi vào bất liên tục","được yêu cầu để có thể chỉ ra được chỉ thị không phù hợp"],"c":2,"e":""},{"q":"Tính chất vật lý nào sau đây, hơn là các tính chất khác, xác định một vật liệu có là một chất thấm tốt hay không?","a":["Độ nhớt","Sức căng bề mặt","Khả năng làm ướt","Không có một tính chất riêng lẻ nào xác định liệu một vật liệu là hay không là một chất thấm tốt"],"c":3,"e":""},{"q":"Tốc độ mà một chất thấm thấm xuyên vào một khiếm khuyết bề mặt chịu ảnh hưởng nhiều nhất bởi tính chất nào sau đây?","a":["Mật độ","Sức căng bề mặt và khả năng làm ướt","Độ nhớt","Khối lượng tương đối"],"c":1,"e":""},{"q":"Tuyên bố nào sau đây liên quan đến sự vận hành của các bóng đèn ánh sáng đen loại hồ quang thuỷ ngân là sai?","a":["Bóng đèn cần khoảng 5 phút để sấy nóng tới công suất phát đầy đủ của nó khi được bật lên lúc đầu","Đèn có thể tắt nếu điện áp mạng tụt xuống dưới 90 V","Những thay đổi điện áp trên 120 V sẽ ít hoặc không có ảnh hưởng lên bóng đèn","Nếu vì một lý do nào đó mà ánh sáng hồ quang được tắt đi, bóng đèn sẽ không đáp ứng ngay nếu đèn được bật lên liền sau khi nó vừa mới được tắt đi"],"c":2,"e":""},{"q":"Điều nào được liệt kê dưới đây là một nhược điểm khi dùng phương pháp kiểm tra thấm lỏng?","a":["Phương pháp này có thể tìm thấy tất cả các loại bất liên tục","Phương pháp này là đơn giản về nguyên lý và tương đối dễ hiểu","Về cơ bản, phương pháp này là đơn giản trong áp dụng","Phương pháp này ít bị hạn chế bởi kích thước và hình dạng của đối tượng được kiểm tra"],"c":3,"e":""},{"q":"Tuyên bố nào dưới đây áp dụng được cho phương pháp kiểm tra thấm lỏng?","a":["Phương pháp kiểm tra thấm kém mềm dẻo linh động hơn so với phương pháp kiểm tra dòng xoáy","Phương pháp kiểm tra thấm kém tin cậy hơn so với phương pháp hạt từ để tìm các khuyết tật bề mặt trong các vật liệu sắt từ","Phương pháp kiểm tra thấm sẽ không phát hiện được các vết nứt mỏi","Phương pháp kiểm tra thấm là tin cậy hơn so với phương pháp chụp ảnh phóng xạ trong nỗ lực phát hiện các bất liên tục nhỏ trên bề mặt"],"c":3,"e":""},{"q":"Loại bất liên tục nào sau đây không thể phát hiện được bằng phương pháp kiểm tra thấm lỏng?","a":["Các phân lớp bề mặt","Các nứt nổ bên trong sản phẩm rèn","Các vết nứt bề mặt","Các vết gấp về mặt"],"c":1,"e":""},{"q":"Loại bất liên tục nào sau đây có thể được phân loại như một bất liên tục của quá trình chế tạo ban đầu thường thấy trong vật liệu đúc?","a":["Nứt mỏi","Nứt ăn mòn-ứng suất","Rỗ","Không thấu"],"c":2,"e":""},{"q":"Loại bất liên tục nào sau đây có thể được phân loại như một bất liên tục của quá trình hoàn thiện?","a":["Nứt mỏi","Nứt ăn mòn-ứng suất","Tách lớp","Nứt do xử lý nhiệt"],"c":3,"e":""},{"q":"Loại bất liên tục nào sau đây có thể được phân loại như một bất liên tục phát sinh trong quá trính sử dụng?","a":["Nứt mỏi","Rỗ","Rách toạc do gia công","Gấp (chồng lấp)"],"c":0,"e":""},{"q":"Đặc trưng nào của bộ phận kiểm tra được liệt kê dưới đây thường được cân nhắc trước khi lựa chọn một phương pháp kiểm tra thấm lỏng cụ thể?","a":["Loại và kích thước của bất liên tục dễ xảy ra nhất","Mục đích sử dụng của bộ phận","Bề mặt hoàn thiện (sau cùng) của bộ phận","Tất cả các điều trên"],"c":3,"e":""},{"q":"Mẫu kiểm tra bằng hợp kim nhôm đã được kiểm tra bằng phương pháp thấm lỏng, nên được làm sạch kỹ lưỡng sau khi kiểm tra, bởi vì :","a":["Thành phần axít trong chất thấm có thể gây ra sự ăn mòn nghiêm trọng","Hàm lượng kiềm của các chất hiện ướt và phần lớn chất tạo nhũ tương có thể làm rỗ bề mặt, đặc biệt trong không khí ẩm","Dư lượng độc từ quá trình kiểm tra sẽ cản trở nghiêm trọng việc áp dụng lớp sơn phủ lên các hợp kim nhôm","Một phản ứng hoá học giữa chất thấm và nhôm có thể gây ra hoả hoạn do sự bùng cháy bên trong"],"c":1,"e":""},{"q":"Loại chất lạ nào sau đây có thể che lấp các khe mở của các bất liên tục nếu bề mặt của mẫu kiểm tra không được làm sạch một cách phù hợp?","a":["Sơn","Xỉ","Vật liệu lõi và khuôn","Tất cả các loại trên"],"c":3,"e":""},{"q":"Tất cả các phương pháp sau đây được khuyên dùng để loại bỏ mỡ ra khỏi bề mặt của một mẫu kiểm tra thấm, ngoại trừ :","a":["Giảm mỡ bằng bay hơi","Làm sạch bằng chất kiềm","Làm sạch bằng chất liệu dung môi","Rửa xả bằng nước nóng"],"c":3,"e":""},{"q":"Chỉ thị thấm đối với một vết ngậm nguội trên bề mặt một sản phẩm đúc sẽ là một :","a":["Đường trơn nhẵn liên tục hoặc đứt quãng","Một đám các chỉ thị nhỏ","Chỉ thị sâu và thô","Chỉ thị phồng to"],"c":0,"e":""},{"q":"Chỉ thị thấm của một vết gấp của quá trình rèn thường sẽ là một :","a":["Chỉ thị tròn hoặc gần như tròn","Một đám các chỉ thị","Đường liền nét","Đường đứt quãng (lấm chấm)"],"c":2,"e":""},{"q":"Khi tiến hành một kiểm tra thấm, các chỉ thị hình cầu trên bề mặt của một bộ phận có thể là dấu hiện của :","a":["Các vết nứt mỏi","Rỗ","Các vết gấp do hàn","Các vết rách nóng"],"c":1,"e":""},{"q":"Chất hiện của phương pháp thấm thường có sẵn trong mọi dạng, ngoại trừ","a":["Chất hiện khô","Chất hiện phi - nước","Chất hiện ướt","Chất hiện có độ nhớt cao"],"c":3,"e":""},{"q":"Điều nào sau đây là một nguyên nhân có thể gây ra các chỉ thị thấm sai?","a":["Rửa sạch quá mức","áp dụng không đủ các chất hiện","Chất thấm hoặc bộ phận quá lạnh trong thời gian thấm","Sợi tơ mảnh hoặc vết bẩn"],"c":3,"e":""},{"q":"Các dư lượng chất thấm có thể bị giữ lại bới các đường rãnh-gờ, các chốt xiết, đinh tán, vv. Hiệu ứng nào sau đây rất dễ xảy ra do một dư chất như vậy gây ra?","a":["Sự ăn mòn gây bởi độ ẩm bị hút bởi dư chất này","Sự long tróc lớp sơn phủ","Quá trình nứt mỏi","Sự đứt gãy cấu trúc ô mạng"],"c":0,"e":""},{"q":"Các chất hiện trợ giúp việc phát hiện các chất thấm lưu lại trong bất liên tục bằng cách tăng thêm :","a":["Quá trình làm sạch sau khi kiểm tra","Quá trình nhũ tương hoá","Quá trình chảy loang ra","Quá trình làm khô"],"c":2,"e":""},{"q":"Các chất hiện trợ giúp việc phát hiện các chỉ thị kiểm tra màu nhìn thấy được bằng cách :","a":["Cung cấp một bề mặt sạch","Cung cấp một bề mặt nền tương phản","Cung cấp một bề mặt khô","Nhũ tương hoá chất thấm đã được làm loang rộng ra"],"c":1,"e":""},{"q":"Khi dùng các chất thấm nhũ tương - sau, các khó khăn nảy sinh trong quá trình rửa sạch có thể khắc phục bằng cách :","a":["áp dụng lại một lớp phủ tạo nhũ tương","Tăng áp lực nước dùng cho quá trình rửa sạch","Xử lý lại hoàn toàn bộ phận bắt đầu từ việc chuẩn bị bề mặt trở đi và dùng một thời gian nhũ tương hoá dài hơn","Nhúng bộ phận vào trong nước sôi"],"c":2,"e":""},{"q":"Phương pháp nào sau đây áp dụng cho chất hiện phi - nước thường được xem như hiệu quả nhất?","a":["Phun xịt","Lau ướt bằng giẻ","Chải quét","Nhúng"],"c":0,"e":""},{"q":"Phương pháp nào được liệt kê dưới đây, là cách thức hiệu quả nhất cho việc làm sạch ban đầu một hạng mục kiểm tra trước khi tiến hành một kiểm tra thấm?","a":["Giảm mỡ bằng bay hơi","Làm sạch bằng chất tẩy rửa","Làm sạch bằng hơi nước","Lau chùi bằng dung môi"],"c":0,"e":""},{"q":"Các chất liệu huỳnh quang dùng trong các chất thấm huỳnh quang đáp ứng mạnh nhất phát ra các năng lượng bức xạ khi được chiếu với một chiều dài sóng bằng khoảng :","a":["7 00 nm (7000Å)","250 kV","365 nm (3650 Å)","1 klx (100ftc)"],"c":2,"e":""},{"q":"Khi thực hiện một kiểm tra thấm lỏng dùng chất thấm màu nhìn thấy được có thể loại bỏ bằng dung môi, có một vài cách để loại bỏ chất thấm dư ra khỏi bề mặt của bộ phận. Phương pháp nào được liệt kê dưới đây thường được xem như phù hợp nhất để cho kết quả chính xác?","a":["Phun dung môi lên khắp bề mặt với áp lực không lớn hơn 276 kPa (40psi)","Lau chùi bằng một khăn thấm ướt đẫm, sau đó lau tiếp bằng một khăn khô","Lau bằng một khăn thấm ẩm dung môi, sau đó lau tiếp bằng các khăn khô","Lau bằng khăn giấy khô, sau đó lau tiếp bằng một khăn thấm ẩm chất dung môi, và cuối cùng lau bằng một khăn khô"],"c":3,"e":""},{"q":"Thời gian nhũ tương hoá :","a":["Là quan trọng nhưng thường không phải có tính quyết định","Là khoảng thời gian cần thiết để rửa xả chất tạo nhũ tương và chất thấm dư ra khỏi bề mặt","Là cực kỳ quan trọng và sẽ ảnh hưởng lớn đến các kết quả kiểm tra","Nên kéo dài theo như thực tiễn kinh tế cho phép"],"c":2,"e":""},{"q":"Trước khi kiểm tra thấm một bộ phận làm bằng kim loại mềm đã được gia công máy trước đó, phương pháp làm sạch nào được liệt kê dưới đây sẽ là tốt nhất để loại bỏ bất kỳ chỗ kim loại mẻ ra có thể che lấp các bất liên tục?","a":["Tẩm thực (ăn mòn bằng axít)","Xử lý bằng quá trình phun bắn (hạt rắn)","Làm sạch bằng chất kiềm","Làm sạch bằng nước với các chất tẩy rửa"],"c":0,"e":""},{"q":"Tại sao quá trình làm khô được dùng trong kiểm tra thấm?","a":["Quá trình làm khô được dùng để đảm bảo rằng mọi chất thấm dư sẽ bay hơi hết","Quá trình làm khô đảm bảo rằng sự làm khô đồng nhất chất hiện khô đã được áp dụng trên một chất tạo nhũ tương ướt","Quá trình làm khô giảm thời gian thấm xuống","Sau khi áp dụng một chất hiện ướt, quá trình làm khô hỗ trợ tạo ra một lớp phủ chất hiện đồng đều"],"c":3,"e":""},{"q":"Lý do nào sau đây giải thích tốt nhất tại sao việc làm khô quá mức một bộ phận là điều nên tránh?","a":["Thời gian tăng thêm theo yêu cầu là lãng phí vô ích","Chất hiện có thể mất khả năng thấm hút của nó","Khả năng phân giải có thể giảm","Chất hiện dư có thể khó bị loại bỏ"],"c":2,"e":""},{"q":"Điều nào sau đây là lý do tốt nhất giải thích tại saokiểm tra viên nên tránh áp dụng chất nhũ tương bằng một bàn chải quét?","a":["Thao tác chải quét sẽ trộn lẫn chất tạo nhũ tương với chất thấm một cách thô thiển và không đều, làm cho việc kiểm soát chính xác thời gian nhũ tương hoá là bất khả thi","Việc chải quét thường không bao phủ hết được bộ phận, do đó để lại một phần bộ phận khó rửa sạch được","Việc chải quét tự nó không có hại, nhưng nhiều loại chất liệu của bàn chải kết hợp với các thành phần chất tạo nhũ tương làm nhiễm bẩn chất thấm và bộ phận","Việc chải quét tạo ra hình ảnh các sọc, vệt trong khi kiểm tra"],"c":0,"e":""},{"q":"Thời gian hiện phụ thuộc vào :","a":["Loại chất thấm được dùng","Loại chất hiện được dùng và loại bất liên tục cần phát hiện","Nhiệt độ của vật liệu được kiểm tra","Tất cả các điều trên"],"c":3,"e":""},{"q":"Khi dùng chất thấm huỳnh quang có thể nhũ tương-sau, khoảng thời gian chất tạo nhũ tương được lưu giữ trên bộ phận là rất quan trọng khi phát hiện các bất liên tục nông như dạng một vết xước. Khoảng thời gian này tốt nhất nên là :","a":["10 giây","5 giây","2-3 giây","Được xác định bằng thực nghiệm"],"c":3,"e":""},{"q":"Tuyên bố nào sau đây liên quan đến các chất gây bẩn bề mặt của một mẫu kiểm tra thấm là sai?","a":["Chất bẩn có thể có một thành phần tác động vào chất thấm và làm giảm tính phát sáng huỳnh quang hoặc màu sắc của chất thấm","Chất bẩn có thể làm giảm hoặc thậm chí ngăn cản tác dụng mao dẫn của chất thấm","Chất bẩn có thể lưu giữ được chất thấm và do đó tăng độ nhạy của kiểm tra","Chất bẩn có thể lấp kín vết nứt và ngăn cản chất thấm đi vào"],"c":2,"e":""},{"q":"Các chất thấm lỏng có thể rửa được bằng nước khác với các chất thấm nhũ tương-sau ở chỗ, chất thấm rửa được bằng nước :","a":["Chỉ có thể được sử dụng trên các mẫu kiểm tra bằng nhôm","Không cần phải loại bỏ trước quá trình hiện","Có gốc xà phòng","Không cần phải áp dụng một chất tạo nhũ tương trước khi rửa xả"],"c":3,"e":""},{"q":"Chức năng của chất tạo nhũ tương trong phương pháp nhũ tương sau là để :","a":["Đưa chất thấm vào nhanh hơn các vết nứt sâu và hẹp","Tác dụng với chất thấm trên bề mặt để làm cho chất thấm này có thể rửa được bằng nước","Thêm màu huỳnh quang hoặc các màu sắc vào chất thấm","Cung cấp một lớp phủ để chất hiện bột khô bám dính vào"],"c":1,"e":""},{"q":"Khi kiểm tra thấm để phát hiện các bất liên tục nông trên dùng một chất thấm nhũ tương-sau, thời gian nhũ tương nên đủ dài để :","a":["Trộn chất tạo nhũ tương chỉ với chất thấm dư trên bề mặt","Trộn chất tạo nhũ tương với toàn bộ chất thấm trên bề mặt và trong các bất liên tục","Trộn chất tạo nhũ tương với chất thấm trong các bất liên tục","Để cho chất tạo nhũ tương khô thành một lớp bột trắng"],"c":0,"e":""},{"q":"Cách nào sau đây nên tránh dùng khi thực hiện một kiểm tra thấm?","a":["áp dụng chất tạo nhũ tương bằng cách nhúng bộ phận vào trong chất này","áp dụng chất hiện bằng cách phun xịt chất hiện vào bộ phận","Loại bỏ chất thấm rửa được bằng nước bằng phun xịt nước","áp dụng chất tạo nhũ tương bằng một bàn chải quét"],"c":3,"e":""},{"q":"Một phương pháp được sử dụng phổ biến để kiểm tra tính năng tổng thể của một hệ thống vật liệu thấm là bằng :","a":["Xác định độ nhớt của chất thấm","Đo khả năng làm ướt của chất thấm","So sánh hai phần của các mẫu được gây nứt nhân tạo","Tất cả các cách trên"],"c":2,"e":""},{"q":"Sự khác biệt quan trọng giữa các chất thấm rửa được không phải bằng nước và các chất thấm rửa được bằng nước là ở chỗ :","a":["Các chất thấm rửa được bằng nước có chứa một chất tạo nhũ tương trong khi các chất thấm loại kia không có","Độ nhớt của hai loại chất thấm này là khác nhau","Màu sắc của hai chất thấm này là khác nhau","Các chất thấm rửa được không phải bằng nước dễ được loại bỏ hơn so với các chất thấm rửa được bằng nước."],"c":0,"e":""},{"q":"Đặc trưng nào sau đây thường được xem xét khi lựa chọn loại chất thấm được dùng trong một kiểm tra thấm?","a":["Tính chất loại bỏ được của chất thấm","Điểm bốc cháy của chất thấm","Giá thành của chất thấm","Tất cả các điều trên"],"c":3,"e":""},{"q":"Những chất liệu nào nên tránh trong hệ thống chất thấm khi kiểm tra các hợp kim titan?","a":["Các bon hoặc dầu","Các dung môi chứa các nguyên tố nhóm halôgien","Chất tạo nhũ tương hoặc dầu","Các chất huỳnh quang"],"c":1,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong các sản phẩm đúc bằng khuôn cát?","a":["Không thấu","Undercut","Rỗ hình ống","Co ngót"],"c":3,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong một quá trình chế tạo bằng hàn?","a":["Co ngót","Không ngấu","Đường khâu","Các vết gấp"],"c":1,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong các sản phẩm cán dạng thanh thỏi?","a":["Co ngót","Chảy loang","Các vết gấp","Undercut"],"c":2,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong sản phẩm tấm cán?","a":["Các tách lớp","Co ngót","Không ngấu","Undercut"],"c":0,"e":""},{"q":"Loại chất bẩn nào sau đây có thể ảnh hưởng đến độ nhạy của một chất thấm?","a":["Axít","Nước","Các loại muối","Tất cả các loại trên"],"c":3,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong một sản phẩm rèn?","a":["Các lỗ thoát khí","Các vết gấp (chồng lấp)","Các vết ngậm nguội","Không thấu"],"c":1,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong các sản phẩm cán dạng thanh thỏi?","a":["Các lỗ thoát khí","Các vết gấp co ngót","Các vết nứt hoặc đường khâu","Không thấu"],"c":2,"e":""},{"q":"Loại nào sau đây là một bất liên tục có thể tìm thấy trong sản phẩm tấm cán?","a":["Các vết nứt do co ngót","Ngậm xỉ","Các vết gấp trong quá trình rèn","Các lỗ thoát khí"],"c":0,"e":""},{"q":"Điều nào sau đây là một ưu điểm của các chất thấm huỳnh quang vượt hơn so với các chất thấm dạng nhìn thấy được?","a":["Việc kiểm tra - quan sát có thể được tiến hành trong một khu vực được chiếu sáng tốt","Các chỉ thị nhỏ được nhìn thấy dễ dàng hơn","Chúng có thể được dùng khi việc tiếp xúc với nước là một điều kiện khách quan","Chúng ít nhạy cảm với sự nhiễm bẩn trong các bất liên tục"],"c":1,"e":""},{"q":"Điều nào sau đây là một ưu điểm của các chất thấm màu nhìn thấy được vượt hơn so với các chất thấm huỳnh quang?","a":["Các chỉ thị nhỏ được nhìn thấy dễ dàng hơn","Chúng có thể được dùng trên các bề mặt được anốt hóa và mạ crôm","Chúng tạo ít bề mặt nền hơn trên các bề mặt xù xì thô ráp","Không yêu cầu ánh sáng đặc biệt"],"c":3,"e":""},{"q":"Điều nào sau đây là một ưu điểm của các phương pháp lau chùi bằng giẻ thấm dung môi so với rữa bằng nước?","a":["Không cần ánh sáng đặc biệt trong quá trình kiểm tra","Chúng cung cấp một khả năng thấm xuyên nhanh hơn vào các khe mở nhỏ","Các chỉ thị nhỏ được nhìn thấy dễ dàng hơn","Chúng có thể dễ dàng được tiến hành tại hiện trường và những vùng xa xôi hẻo lánh"],"c":3,"e":""},{"q":"Xu hướng của một chất thấm đi vào một bất liên tục là liên quan chủ yếu đến:","a":["Độ nhớt của chất thấm","Các lực mao dẫn","Tính trơ về hoá học của chất thấm","Trọng lực riêng của chất thấm"],"c":1,"e":""},{"q":"Chất tạo nhũ tương được dùng :","a":["Để rửa sạch chất thấm ra khỏi các bất liên tục","Để trợ giúp việc rửa sạch bề mặt của các bộ phận khi dùng các chất thấm nước hoặc tan trong dầu","Để nhũ tương hoá chất thấm tan trong dầu, do đó làm chúng có thể rửa được bằng nước","Để làm sạch ban đầu các bộ phận trước khi áp dụng chất thấm"],"c":2,"e":""},{"q":"Mục đích chính của ánh sáng đen cho kiểm tra thấm huỳnh quang là để :","a":["Khuyếch đại các chỉ thị","Làm cho các chỉ thị có thể nhìn thấy được","Phát triển các chỉ thị","Làm nhanh quá trình kiểm tra"],"c":1,"e":""},{"q":"Tại sao đèn ánh sáng đen được khuyên nên lắp đặt tại trạm rửa?","a":["Để việc kiểm tra có thể được thực hiện mà không cần làm khô các bộ phận","Làm nhanh quá trình chảy loang của chất thấm ra từ các khuyết tật","Để kiểm tra hiệu quả của chu trình rửa","Để xác định liệu các bộ phận có được bao phủ với chất thấm hay không"],"c":2,"e":""},{"q":"Bột chất hiện luôn luôn nên là :","a":["Có độ phát sáng huỳnh quang cao","Được áp dụng ở dạng ướt","Không màu","Được áp dụng đều"],"c":2,"e":""},{"q":"Khi quan sát các bộ phận, một bề mặt nền phát sáng huỳnh quang là dấu hiệu của :","a":["Quá trình rửa sạch kém","Thời gian nhũ tương hoá chưa đủ (phương pháp nhũ tương-sau)","Vật liệu xốp và được sơn phủ","Việc làm sạch không phù hợp trước chu trình thấm","Tất cả các điều trên"],"c":0,"e":""},{"q":"Khi không có một tiêu chuẩn chấp nhận bằng văn bản, việc loại bỏ hoặc chấp nhận các bộ phận nên dựa trên :","a":["Trình độ giáo dục của kỹ thuật viên","Thiết kế của bộ phận và việc sử dụng dự định của nó","Tiêu chuẩn chất thấm thích hợp","Việc lựa chọn chất thấm"],"c":1,"e":""},{"q":"Khi quá trình xử lý không phù hợp gây khó khăn cho việc kiểm tra, người kiểm tra viên nên lamg gì?","a":["Cọ rửa bộ phận bằng dung môi","Sử dụng một quy trình chảy ngược đúng đắn","Xoá bỏ các phát sáng huỳnh quang không liên quan","Thực hiện quá trình kiểm tra lại từ đầu"],"c":3,"e":""},{"q":"Điều nào sau đây có khả năng nhất làm cho quá trình kiểm tra nhũ tương-sau mất tác dụng?","a":["Thời gian thấm quá dài","Thời gian hiện quá dài","Thời gian nhũ tương hoá quá dài","Không phải các điều ở trên"],"c":2,"e":""},{"q":"Chất hiện khô nên được áp dụng :","a":["Sao cho một lớp dày chất hiện bao phủ toàn bộ bề mặt","Sao cho một lớp bột rắc mỏng bao phủ toàn bộ bề mặt kiểm tra","Bằng một bàn chải quét sơn khô","Bằng cách nhúng"],"c":1,"e":""},{"q":"Yếu tố nào sẽ áp dụng cho việc xác định thời gian thấm cần cho chất thấm có hiệu lực?","a":["Loại bất liên tục cần tìm","Hình dạng của bộ phận","Kích thước của bộ phận","Độ xù xì thô ráp của bề mặt"],"c":0,"e":""},{"q":"Bộ phận là một sản phẩm nhôm rèn. Mô tả : Chỉ thị sắc nét, có hình bán nguyệt, không sâu. Nó được gọi là :","a":["Một vết gấp","Rỗ tại đường trung tâm","Nứt do xử lý nhiệt","Một chỉ thị sai"],"c":0,"e":""},{"q":"Một bộ phận là một tấm nhôm dày13mm (0,5in.) có một mối hàn chữ V. Mô tả : Chỉ thị xuất hiện trong một vùng có dạng hơi giống hình đĩa. Chỉ thị lan toả từ tâm ra thành hình nan hoa (rẻ quạt). Chỉ thị này là :","a":["Co ngót","Không liên quan","Một vết nứt do tôi (vật nóng nhúng lạnh đột ngột)","Một nứt rạn"],"c":3,"e":""},{"q":"Bộ phận là một sản phẩm nhôm đúc. Mô tả : Sản phẩm đúc có một thiết kế rất phức tạp. Trong một phần, có một vùng phẳng dày 32mm (1,3in.). Tại chính giữa của vùng này có một phần tròn dày 51mm (2in.) và đường kính 25mm (1in.). Có các chỉ thị dạng đường khoảng giữa xung quanh phần nền gốc nơi nó nối với phần mỏng. Chỉ thị này được gọi là","a":["Xỉ sắt","Rách nóng","Co ngót vi mô","Rỗ"],"c":1,"e":""},{"q":"Các vết nứt co ngót thường được tìm thấy trong những vùng nào của một vật đúc?","a":["Chỉ ở các vùng mỏng","Chỉ ở các vùng dày","Tại nơi có sự thay đổi đột ngột về chiều dày","Không phải là một vấn đề"],"c":2,"e":""},{"q":"Bất liên tục nào sau đây có thể tìm thấy trong một vật rèn?","a":["Nứt co ngót","Vết gấp","Rách nóng","Tách lớp"],"c":1,"e":""},{"q":"Bất liên tục nào sau đây có thể tìm thấy trong các thanh thỏi cán?","a":["Lỗ thoát khí","Gấp co ngót","Nứt hoặc đường khâu","Không thấu"],"c":2,"e":""},{"q":"Khái niệm “chỉ thị không liên quan” được dùng để mô tả một số loại nào đó các chỉ thị kiểm tra thấm. Cái nào sau đây là một “chỉ thị không liên quan” điển hình?","a":["Chỉ thị do hình học của cấu hình thiết kế của bộ phận","Các chỉ thị phi từ tính","Chuỗi các chỉ thị","Các chỉ thị không phải dạng đường"],"c":0,"e":""},{"q":"Tuyên bố nào dưới đây nói đến sự nguy hại của việc dùng quá trình bắn cát để làm sạch các bề mặt được kiểm tra thấm?","a":["Các bất liên tục có thể bị khép - đóng lại","Các chất bẩn dạng dầu có thể gắn kín các bất liên tục lại","Cát dùng trong quá trình phun bắn có thể chui vào trong bất liên tục","Quá trình bắn cát có thể tạo ra bất liên tục trong bộ phận"],"c":0,"e":""},{"q":"Một chỉ thị dạng đường liền nét có thể là do bất liên tục nào sau đây gây ra?","a":["Rỗ","Các ngậm xỉ","Rỗ lỗ chỗ","Các vết nứt"],"c":3,"e":""},{"q":"Điều nào sau đây có thể là một nguồn gốc gây ra các chỉ thị sai trên một mẫu kiểm tra?","a":["Chất thấm trên bàn kiểm tra","Chất thấm trên các tay người kiểm tra","Chất thấm bị nhiễm bẩn bởi các chất hiện khô hoặc ướt","Tất cả các điều trên"],"c":3,"e":""},{"q":"Một bất liên tục dạng nứt sẽ thường xuất hiện như :","a":["Một chỉ thị tròn","Một đường liền nét, thẳng hoặc lượn sóng - gấp khúc","Một đường thẳng tắp","Các chỉ thị tròn ngẫu nhiên hoặc các lỗ kéo dài"],"c":1,"e":""},{"q":"Bất liên tục nào sau đây sẽ không thể phát hiện được bằng một kiểm tra thấm lỏng?","a":["Một vết gấp trong quá trình rèn","Một nứt rạn","Các vết nứt do quá trình mài","Các ngậm xỉ phi kim bên trong"],"c":3,"e":""}]} ;



    // ================= TỪ ĐÂY TRỞ XUỐNG BẠN ĐỪNG CHẠM VÀO NHÉ =================
    let subjects = JSON.parse(localStorage.getItem('pro_subjects')) || {};
    
    // Logic: Nếu khách lạ vào (hoặc bị lỗi trang), hệ thống tự lấy đống F12 đổ ra cho họ xài
    if (Object.keys(subjects).length === 0) {
        subjects = KHO_DU_LIEU;
        localStorage.setItem('pro_subjects', JSON.stringify(subjects));
    }

    let currentSubject =[];
    let currentIdx = 0;
    let selectedOption = null;
    let results =[];

    function showScreen(id) {
        document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'home-screen') renderSubjects();
    }

    function renderSubjects() {
        const list = document.getElementById('subject-list');
        list.innerHTML = '';
        Object.keys(subjects).forEach(name => {
            const div = document.createElement('div');
            div.className = 'bg-card p-5 rounded-xl flex justify-between items-center';
            div.innerHTML = `
                <div>
                    <div class="font-bold text-lg text-blue-300">${name}</div>
                    <div class="text-sm text-slate-400">${subjects[name].length} Câu hỏi</div>
                </div>
                <div class="flex gap-3">
                    <button onclick="startQuiz('${name}')" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">Vào học</button>
                    <button onclick="deleteSub('${name}')" class="text-red-400 p-2"><i class="fas fa-trash"></i></button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function saveSubject() {
        const name = document.getElementById('subject-name').value;
        const json = document.getElementById('json-input').value;
        try {
            subjects[name] = JSON.parse(json);
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            showScreen('home-screen');
        } catch(e) { alert("Lỗi định dạng JSON!"); }
    }

    function startQuiz(name) {
        currentSubject = subjects[name];
        currentIdx = 0;
        results = new Array(currentSubject.length).fill(null);
        showScreen('quiz-screen');
        renderGrid();
        loadQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('question-grid');
        grid.innerHTML = '';
        currentSubject.forEach((q, i) => {
            const box = document.createElement('div');
            let extraClass = '';
            
            if (i === currentIdx) { extraClass = 'active'; } 
            else if (typeof results[i] === 'number') {
                if (results[i] === q.c) { extraClass = 'correct-nav'; } 
                else { extraClass = 'wrong-nav'; }
            } 
            else if (results[i] === 'skipped') { extraClass = 'skipped'; }

            box.className = `nav-box ${extraClass}`;
            box.innerText = (i + 1).toString().padStart(2, '0');
            box.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(box);
        });
    }

    function loadQuestion() {
        selectedOption = null;
        const q = currentSubject[currentIdx];
        document.getElementById('cur-idx-text').innerText = currentIdx + 1;
        document.getElementById('total-idx-text').innerText = currentSubject.length;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('hint-box').classList.add('hidden');
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const hasAnswered = typeof results[currentIdx] === 'number';

        q.a.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item p-4 rounded-lg flex items-center gap-3';
            div.innerHTML = `<div class="w-5 h-5 border-2 border-slate-500 rounded-full flex-shrink-0 flex items-center justify-center"></div> <span>${opt}</span>`;
            
            if (hasAnswered) {
                div.style.cursor = 'default';
                if (i === q.c) {
                    div.classList.add('correct');
                    div.querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
                }
                if (i === results[currentIdx] && i !== q.c) {
                    div.classList.add('wrong');
                    div.querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
                }
            } else {
                div.className += ' cursor-pointer';
                div.onclick = () => selectOption(div, i);
            }
            container.appendChild(div);
        });

        if (hasAnswered) { showHint(); }
        renderGrid();
    }

    function selectOption(el, i) {
        if (typeof results[currentIdx] === 'number') return;
        document.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('div').innerHTML = '';
        });
        el.classList.add('selected');
        el.querySelector('div').innerHTML = '<div class="w-full h-full bg-blue-500 rounded-full scale-75"></div>';
        selectedOption = i;
    }

    function checkAnswer() {
        if(selectedOption === null) return; 
        if(typeof results[currentIdx] === 'number') return; 

        const q = currentSubject[currentIdx];
        const items = document.querySelectorAll('.option-item');
        results[currentIdx] = selectedOption;
        
        if (selectedOption === q.c) {
            items[selectedOption].classList.add('correct');
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        } else {
            items[selectedOption].classList.add('wrong'); 
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
            items[q.c].classList.add('correct'); 
            items[q.c].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        }

        items.forEach(item => item.onclick = null);
        showHint();
        renderGrid();
    }

    function showHint() {
        const box = document.getElementById('hint-box');
        if(currentSubject[currentIdx].e) {
            box.innerText = "Gợi ý: " + currentSubject[currentIdx].e;
            box.classList.remove('hidden');
        }
    }

    function nextQuestion() {
        if(typeof results[currentIdx] !== 'number') { results[currentIdx] = 'skipped'; }

        if(currentIdx < currentSubject.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            let firstSkippedIndex = results.findIndex(r => r === 'skipped' || r === null);
            if(firstSkippedIndex !== -1) {
                currentIdx = firstSkippedIndex;
                loadQuestion();
                alert("🔄 Đã hết 1 lượt! Hệ thống tự động quay lại các câu bạn đã bỏ qua (ô màu vàng).");
            } else {
                alert("🎉 Tuyệt vời! Bạn đã hoàn thành toàn bộ câu hỏi trong bộ đề này.");
            }
        }
        renderGrid();
    }

    function prevQuestion() {
        if(currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function deleteSub(name) {
        if(confirm('Xóa môn này?')) {
            delete subjects[name];
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            renderSubjects();
        }
    }

    renderSubjects();
</script>
