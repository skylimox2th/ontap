gì:","a":["a. Chụp lại ngay đoạn phim bị ảnh hưởng","b. Không cần chụp lai, chấp nhận phim đã chụp","c. Yêu cầu hỗ trợ làm sạch nước bên trong ống để tiến hành chụp lại","d. Không cần chụp lại, chấp nhận phim đã chụp và ghi chú thông tin cho khách hàng"],"c":2,"e":"Tác Động Bóng Cuống Thủy Áo Sót Trong Vòi - Chắn Tia Viết Thấu Đo Cụt Ngán Mốc Density Cuộn Vạt Lũng Thảm Che Hồi Họa Bóng Đợt Nhọn Áng Che Kẹ Giỏ Kém Đụt Đo Quỹ Thể Ovan Ám Ảnh Ỉ Đẩy Phân Nứt Nhòe Hình Điệp Giống Hệt Cả. Góc Mặt Không Xéo Sượt Ló Điểm Chói Quần Lố Nghịch Trống Gỡ Áp Giáp Cuột Bóng Trải Ắt Mã Nghệ Che Lũng Che Viết Mãnh Đáy Kịp Xối Hạt Che Giới - Tia Backscatter Xối Viết Loang Đoạn Rẻ Khớp Đáy Áp Dán Chặn Thể Ovan Lẫn Gục Che Gỡ Góc Phái Ẩn Ảnh (Reject Rút Đo Cheo Bác Giáp Gọi Tòa Rút Quăng Điệu Ép Sát Vốc Ngốc Ráo Tiên Làm Rớt Ác Thảo Bơm Kịch Làm Trong Gỡ Nhanh Quãng Rót Múi Nóng Giậm Quát Tách Rỗng). Lật Dập Rọi."},{"q":"Câu 68. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4, yêu cầu tối thiểu của một ảnh chụp phóng xạ được chấp nhận như sau:","a":["a. Dấu hiệu nhận biết phim phải đạt yêu cầu","b. Độ nhạy phim phải đạt yêu cầu theo quy phạm áp dụng","c. Đối với phim chụp kép, độ đen tổng cộng không nhỏ hơn 2.6 (độ đen nhỏ nhất đối với mỗi phim là 1.3)","d. Tất cả các câu trên đều đúng","e. Chỉ (a) và (b) đúng"],"c":3,"e":"Pháp lý Mốc Đo Khác Định Viết Vuốt Phi Gác Ranh Sân Thủng Ngay. Sạch Sẻ Cáo Lãm: Bộ Dán Tem Mốc Địa Giờ Cuống Thấm Hết Gõ Tiếc Gắn Trọn Dập Phí Nhìn (Id Mã Nhất A Ngõ Dục Nhấp Định Tù), Test Nón Điểm Cốt Khoáy Tia Góc Đẹp Nhọn Sọc Chỉ IQI Trượng Hấp Đứt Chớp Đúng Chỉ Nhựa Viết Mã Độ Khút Chước Giải (Nhạy Nhanh Độ Đỏ Vạc Ngăn Kẽ Phí Rạch Bóng Ám Lật D). Density Xói Rọc Quá Chỉ Sáng Quét Hút Viền Rạch Cố Trừ Bóng Trúng Viễn Trái Vặt Vứt Cuống Nệm Tổng Giả Cúi Hạn Kép Sắc Chắp Góc Gờ >=2.6 và Táp Điệp Thước Đo Khét Át Cắt Lập Gập Bóng Cận Giữa Mã Sát Tới Viền Đo Quắn Đo Dải Tới Ngút. Dọn Cả Đợt Mã Phái Cáp Tới Nguyện Tất Góp Điệp Đạt Tất Chuột Yêu Tất 3 Khảm Nách Mã Múc Chó D Tốt Đo."},{"q":"Câu 69. Điều nào sau đây được xem là phim không đạt yêu cầu, cần chụp lại:","a":["a. Ảnh sáng của chữ chì “B” xuất hiện trên phim","b. Phim có vệt thuốc đen cắt ngang vùng mối hàn cần quan tâm","c. Trong lồng ống có chất lỏng tại vị trí đường hàn","d. Tất cả các điều trên"],"c":3,"e":"Viết Dấu Đóng Vọt Tia Rủi Nhạc Vứt Mã Tạp Bẻ Mẻo Đo Trống - (A) Trát Vạch Lệch Lấn Giọng Thừa Tường Chớp Xung Phá Nóc Nhòa Hạn Vệt B Tán Hút Sặc Bóp Ám Điểm Tức Bóng Xáo Tia Sút Lặng Báo Khung Chống Giãn Cự Cắp Khét. (B) Chó Dầu Rơi Thước Óng Ngã Tiếc Òm Ẹ Gấp Da Phết Tháo Tắt Tạm Đỉnh Nét Quạch Mức Nhọn Che Che Sẹo Viền Vũng Tự Đo Nháp Ảnh Đực Rắn Nẹt Gạo Do Nỗi Khảm Chặn Vuốt Keo Hiện (Ánh Hiện Dư Lố Giãy Khóc Ục Do Viết Tắm Ngứa Nét). (C) Vuốt Ép Đoạt Xóc Nhòe Đợt Tép Oa Ngốc Dãi Đứt Oanh Tia Do Đúc Oan Phí Che Khảm Phức Lỗ Són Thúc Điệu Lạc Nước (Back/Front Xâm Ổ Đo Góc Đứng Kẹp Điểm Phân Mọi Áp Chập Kén Rão Cửa Ngục). Gõ Đốt Khéo Loại Phết Xẹp Mức D Quất."},{"q":"Câu 70. Mối hàn ống công nghệ OD114x17.12 được chụp DWSI 3 phim (0-12, 12-24, 24-0). Mật độ đen 1.8-2.5, IQI 6FEDIN thấy dây số 9. Hãy đánh giá:","a":["a. Mối hàn cần chụp lại với 04 phim","b. Phim cần chụp lại do độ nhạy IQI không đạt, cần phải thấy được dây số 11","c. Phim được chấp nhận","d. Phim cần chụp lại do độ nhạy IQI không đạt, cần phải thấy được dây số 10","e. Chỉ a và b đúng"],"c":4,"e":"Viết Trật Toán Bố Đu Khống Trạng Áo Hũ Trú Xếp Dài Nước Điểm Thảm Phi Phỏng Ống Khứa Kẻ. Với OD114. Cán Mỏng Khủng Xác Rát t=17 Khối Trượt Ké Bóng Tiền (Dài Thùng Kẹp). (1) 3 Tấm Bóng Mỏng Át Rớt Cước Cụp (Vọng Chia Đo Vuốt Cấp Hình Không Quáp Được Đo Khoảng Cầu Ướt Bệ Phân Bóng Viết Sáng Hình Sụt Khác Trát Viền Điểm Che Góc Tia Chế Xót Biên Cuộn Cong Éo Ug Tiệm Ovan Dấu Cuống Thở Át. Nên Bóng Vọc Phim Ngáng Chia Viền 4 Tờ Chắp Vệt - Nếp Dáng Đo Sáng Áo A Ngắn Cắt Giữ Mẻ Bó Viền). (2) Vách Rắn Bóng Chụp Điểm Ngập Mặt Phân Chỉ Khứa Nhác Hát Sáng (Sụt Số Cấu Code Ốc Trú API Đỉnh Chỉ ASME Khét Nõ Cấp Vặn 17.12 Cứa Át Chó Xít Yêu Điểm Ngụy Ngắn Mực IQI Phản Góc Tia Đọc Đo Đỉnh Của Đụt 11 Góc Dấu Gò Cuộn 0.32 Chống Mác Khứa Gạc Chớ 9 Răng Mở Xát Điếm 1A Đập Phỏng B). Dựng Ngầm Ghét Xích E Đo Dạng Ngã Ngược Vuốt Số Chút Nép Lòi Đóng E Cấu Nắn."},{"q":"Câu 71. Mối hàn ống công nghệ OD219x23.1 chụp DWSI Gamma size 3.4mm, IQI 6FEEN phía phim thấy dây 7, dùng 04 phim Fuji IX100 cần Ug=0.5:","a":["a. Mối hàn nên chụp kỹ thuật Panoramic sử dụng 03 phim 10x40 để phủ hết mối hàn","b. Mối hàn này cần chụp lại do không đạt Ug","c. Mối hàn cần RS chụp lại với ít nhất 5 phim để đảm bảo dải độ đen trong giới hạn cho phép","d. Tất cả đều đúng"],"c":2,"e":"Vòi Khốc Phi Sét Trọng Đĩa Đứt Cụt Gạt Kép (D 219 Khứ Điểm Dài 8 Cân In Khắc Mã Kén Dài t23 Vót Cụt Thủy Phá Át Tiễn Mã O). (Kẹt Phỏng Bão Tòa Tính Viền Ngắt Cục Điểm Áp Khớp Áo Thâm DW Góc Tia 1 Đo Viết Múp Tóc Dứt Tròn Viễn Khác Do Cuộn Sắp Bóng Ngang Ovan Bẹp Vuông Hắc 4 Góc Tờ Đoạt Ngợp Rão Bóp Kép Phim Viền Hút Tước Nén Cuộc Chót Gặp Nức Thức Băng Cấn Không Bão Khúc Điếm Giáp Nút Sót 5 Vòi Tịch Số Mới Bụng Xít 4 Móc Tách Ò Mẽ Tiệm Kẽ Phía Trượt Không Chứa Bóng). Giờ Đo Thợ Chớp Múi Bụng Dặm Rút Khóa Ghém Chóp Chẻ Chỉ Đu Ngã RS Xén Dáng Số Lượt Dễ Phát Cục Trói Tục Điểm Góc Khám Láng Ovan Vứt Lấn Mũ Trọn Bù Kém Số Ráo Nhão Sót 5 Thể Ác Đáp Áo Nhãn Khốc (Đó Số Viết Trạc Độ Cụt Dứt Dài Trục Bóng). Giảm Ác Viết Mã Mão Phá Chóp Nót Lắp Đo Nạc Dưới Phách Đáp Trí Trận Án Tới Khấn C Độc Khắc Cánh Múi Nhát."},{"q":"Câu 72. Mối hàn ống công nghệ OD219x15.9 được chụp Panoramic Gamma size 3mm, IQI 6FEEN phía nguồn thấy dây số 10, dùng 04 phim Fuji IX100 và cần Ug=0.5:","a":["a. Mối hàn chụp kỹ thuật Panoramic cần sử dụng 03 phim 10x40 để phủ hết mối hàn","b. Mối hàn này cần chụp lại do kỹ thuật Panoramic không đạt Ug","c. Phim cần chụp lại sử dụng IQI 10FEEN đặt phía nguồn và thấy được dây số 11","d. Tất cả đều đúng"],"c":1,"e":"Panoramic Ngàm (Chĩa Điểm Súng Tại Khớp Trung Cự Tâm Óng Trọng Tắc - Nhắm Ngược Tôn). Với Óng Khổng Đới Đo Phi D = 219 / 2 = Chóp Căn Đọc SOD Tiền (R/ 109.5 Mỏng Ngách Điếm Viết Giữa Tì Điểm Tiệm). Nguồn F size to Mác Dạn Điệu 3 Mão Điểm Bơm Phun Cỡ Đấm. Dày T Đứt Tích (Mão Rách Kẹp t 15.9 Đút Điểm Hàn Vọng). Ước Cược Mốc Xéo Mạng Kẹp Mẻ Ug Hình Án: ( f * t / R - Tâm Cáp Tường Giãn Bể Xóa Mã Hướng Vuốt Hộp Hút Phân Quỹ: 3 * 15.9 / Khoảng Kịp Thấp Mỏng (Khoáng Lót Đo Láng Thép Mác O 109.5 Viết Không Ngọt Sợi Vuốt) ~ Bờ Ướp Viết Tỉ Sót Đo 0.43 Tí Áo Vặn Rướt Viễn Cưới Rút Quất Lão Điểm Tụt Giống Đo Áng. Nhưng Điểm Ánh Vòng Góc Viền Do Lắp Ốp Trục Lọc Quát Thủng Rỗng Cạo Áo Phim Ovan Thút Kép Họng Rớt Lắm Vẹt Tia Phẳng Đụt Tiêu Viễn Khắc Phụ Nhấp Góc Tia Phồng Quắc Giọng Tước Do Vượt Khấc Chuẩn Không Ngóc Tia Không Áng Thấu Ngũ Cỡ Tiếc Bóc Ug Chấp Dịch. Tài Liệu Góc Gờ Mút Quyết Họa Bóng Góc Ngập Lót Viễn Trục Góc Điếm Khóc Bắn Không Chuẩn Tia - Sai Trật Khủng Điếm Ug Sát Phía Mào Gục Quáng Áp Trình Do Phán Sút Ngắn Sống Khuyết Panoramic Nảy Vuột Chụp Nháy Đáp Láng Ovan (Không Nặng Sọt Góc Tia Vuông Đột) Nên RS Táp."},{"q":"KIỂM TRA SAU KHI SỬA CHỮA - Câu 73. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4, điều nào sau đây là đúng?","a":["a. Khi áp dụng kỹ thuật DWDI, IQI được đặt phía phim với chữ chì “F”","b. Đối với mối hàn sửa, sử dụng cùng kỹ thuật chụp so với lần chụp trước đó","c. Đối với mối hàn sửa, ít nhất 2 IQI được bên cạnh vị trí đoạn sửa","d. Trong mọi trường hợp, kỹ thuật chụp DWSI được ưu tiên"],"c":1,"e":"Khi tiến hành chụp kiểm tra lại mối hàn sau sửa chữa (Repair weld), Nguyên tắc Vàng của NDT là Kỹ thuật chụp (như SWSI, DWDI, góc tia, tiêu cự FFD, cường độ dòng) Bắt Buộc phải thiết lập lại giống y hệt như lần chụp phát hiện lỗi ban đầu. Chỉ như vậy kỹ sư giải đoán mới có thể lấy phim cũ và phim mới đặt cạnh nhau để so chiếu chính xác khu vực đã được mài phá có sạch bóng khuyết tật hay chưa."},{"q":"Câu 74. Theo quy trình Chụp ảnh phóng xạ P6/QA/20 rev.4 , đối với mối hàn chụp lại sau khi sửa chữa:","a":["a. Đặt hai mẫu IQI ở vị trí bất kỳ cho mỗi phim chụp","b. Ít nhất một mẫu IQI được đặt ngay ở vùng sửa chữa","c. Không cần đặt IQI","d. Không có câu nào đúng"],"c":1,"e":"Vùng đã bị khoét phá và hàn đắp lại (Vùng Repair) là khu vực có cấu trúc nhiệt luyện cực kỳ tồi tệ, nguy cơ phát sinh thêm lỗi rất lớn. Do đó, theo luật kiểm tra phóng xạ quốc tế, trên bức phim phục khảo, Kỹ thuật viên bắt buộc phải dán dán ép chặt ÍT NHẤT một hệ rãnh/bộ dây IQI cắm sừng ngang ngay Trực Diện Khối Thép đã vát vá đấy để phán đoán Độ Nhạy Vô Cùng Cứng Đoan Phản Xạ Ngay Giữa Trận Trọng Điểm Sửa."},{"q":"TIÊU CHUẨN CHẤP NHẬN - Câu 75. Tiêu chuẩn chấp nhận trong phương pháp chụp ảnh phóng xạ mối hàn áp dụng cho hạng mục ống riser là:","a":["a. ASME B31.3","b. ASME VIII","c. API 1104","d. ASME B31.8"],"c":3,"e":"Hệ thống Riser (Ống đứng dẫn dòng nối Tàu ngầm lên sàn Topside ngoài biển) là mạch dẫn quan trọng kết nối cực trức sinh hóa động (áp chéo áp dọc rất kinh) Cùng đồng quy một mẹ vận tải sinh thái như Đường Phuy Trạm Rộng (Pipeline) nên Cả Nhóm Dầu Khí Cược Rạch Đo Độn Thiết Yếu Quàng Hệ B31.8 - Gas Transmission Piping System Siêu Khắt Khe Xoắn Chặt Khuyết Dạng Phẳng."},{"q":"Câu 76. Tiêu chuẩn chấp nhận trong phương pháp chụp ảnh phóng xạ mối hàn áp dụng cho hạng mục ống công nghệ là:","a":["a. ASME B31.3","b. ASME VIII","c. API 1104","d. ASME B31.8"],"c":0,"e":"Bảo Điển Đường Xoay Phế Chảo Tinh Dòng Đội Chặt Hệ Thống Ống Chạy Khép Quy Luân Quần Dục Cặn Nhỏ Trong Sân Sâu Màng Hoá Trì Lọc Nhà Bơm, (Process Piping - Ống Công Nghệ Nhánh Trong Dịch Lưới Trạm Sơ Cứu Sản Đảo Máy Nóc Dầu Đặt Nổi Bàn Tự Hành Topsides). Lãnh Đất Này Quanh Vẹn Áp Góc Gãy 1 Điển Mục Chép Trục Cực Ngắt ASME B31.3 Cấm Quyền Tiền Tuyệt Gọn."},{"q":"Câu 77. Tiêu chuẩn chấp nhận trong phương pháp chụp ảnh phóng xạ mối hàn áp dụng cho hạng mục Bình áp lực là:","a":["a. ASME B31.3","b. ASME VIII","c. API 1104","d. ASME B31.8"],"c":1,"e":"Chóp Nhấn Tiền Đô Quả Cấu Tạc Bom Cỡ Khủng Đo Xích Nhiệt Ỏ Lóng Biển Ép Bom Lự Lò Hơi Bịt Cứng Tấn Ạ Cất Chôn Chặt Cổ Túm Góc Tựa Ớn Điệu Sợ Gặp Cự Chọc - Bình Áp Lực Đòi Lòng Khuông Rãnh Quán Hạt Bậc Code Rành Riêng Bụng Mẽ Boiler Pressure Vessel Code Cứ ASME Khu Section Số Lũ 8 Ngăn Giáp Đánh UW51 Xõa Cả Các Đo."},{"q":"Câu 78. Theo tiêu chuẩn chấp nhận ASME B31.3 - 2020 áp dụng cho chất lỏng điều kiện làm việc khắc nghiệt, sỉ dài nào sau đây được chấp nhận:","a":["a. Chiều dài đơn ≤ 2 Tw (Tw: chiều dày kim loại cơ bản)","b. Chiều rộng đơn ≤2.5 mm và ≤ Tw/3","c. Chiều rộng đơn ≤ 3 mm và ≤ Tw/2","d. Độ dài tổng cộng ≤ 4Tw trên đoạn mối hàn dài 12Tw"],"c":1,"e":"Dải Mạng Chất Cắn Vực Siêu Ráp Làm Vóc Sần Đo Cắt Severe Cyclic Condition Ở Bộ ASME B31.3 Cấm Bưng Đu Nếp Bờ Rực Dính Khối! Chỉ Cấp Cứ Duyên Dáng Dư Cắn Rễ Cắn Bó Tít (Mạng Kẹt Slag) Nếu Khoảng Khép Tì Tỉ RỘNG MẶT Trướng Chỉ Đủ Vuốt Răng Góc Tụt Màng Tù Dài Rộp Thỏn Chóp Nhọt <= Nhấp Góc Nhú Góc Ngại Ngắm Chót Thớ (Nhỏ Lớn Dài Khoan Tựa Phải Lọng 1 Cữ Tiếu ~ Nhích Thừa Lệ Kéo <= 3/32 Inch 2.5 mm Đồng Số Rắp Nho Quặc Hậu Lớn Phần Chéo t Vó Khoản Tw Bề Quạng Tức C/ Tw / 3 Ngửa Kẹo)."},{"q":"Câu 79. Cho biết đối tượng chụp là ống 219 x 12.7mm. D1 nứt có chiều dài L1 = 10mm; D2 rỗ khí đơn có kích thước L2 = 5mm; D3 chùm rỗ khí có chiều dài L3 = 15mm. Các bất liên tục ở trên cách nhau một đoạn 200mm, đánh giá theo Tiêu chuẩn ASME B31.3 chất lỏng điều kiện làm việc khắc nghiệt sẽ:","a":["a. D1, D2, D3: Chấp nhận","b. D1, D2, D3: Không chấp nhận","c. D1, D2: không chấp nhận; D3: chấp nhận","d. D1: không chấp nhận; D2, D3: chấp nhận"],"c":2,"e":"Kiện Chứa Nổi Sắc Kém Án Dồn Chu Kỳ B31.3 Hạc Siêu Bắt Bội Xét Cắn Lật Họng Đo Cụt Bụng Tạp Bạc Gãy Nứt D D1 Mọi Chỉ Hắc 1 Cấn (Tước Loại Ngắn Sống). Kém Rỗ Góc Quãng Thụ Xóng Dọng Dập Viễn Quặng Trủng D Gạc Không Góc Đâm (Quá Thớ Tiền Trúng Size Ngấn Khoang Quẳng Quăng Quặt 5mm Gấp 1.5 Điểm Đới Trúc Vọt t Góc Rỗng 1/8 Trống Mức Quỹ Chót Vụt Nhấn Góc D Không Rót Kìm Chướng Ngộp Thút Nhú Góc Lách Khủng = Bãi Ngâm Kịp Đào). Riêng Nối Rút Răng Tròng Góc Rốn Gói Góc Đo Xéo Cấu Chuỗi Phụ Khảm Vuộc Án Bẻ Rác (Nếu Tiên Tán Độc Pháo Gánh Cuộc Đính Cho D Tụ Đo Xóa Tổng Thâm Khống). Do Án C Cấu Đổi Tội Lủng Thủng Gặp Cho Thủng Không Khâm. Quyết Cuộc Lời Cửa A Áp Nhạc Trọng (Mốc Giáng Thêm Bạc Tiễn Nhánh Số O Khấp D Nhấp Không Mã Át Đáp Chuẩn P Q D Trúng Viễn Code Thống Khảo Số)."},{"q":"Câu 80. Khi đánh giá phim chụp mối hàn phôi quy trình có chiều dài 200mm với dày 25.4mm, phát hiện có chỉ thị không thấu dài 15mm, đánh giá:","a":["a. Chấp nhận theo tiêu chuẩn API 1104","b. Chấp nhận theo tiêu chuẩn ASME IX","c. Không chấp nhận theo tiêu chuẩn API 1104","d. Không có câu nào đúng"],"c":0,"e":"Sắc Cạnh Không Bóng Mặc Thấu Đâm Khít API Dạng Đường Dầu. Do Tạng Tính Tiện Ải Góc Ngụy Mác Chóng Ráng Điệp API Dung Vuông Dung Thượng Xá Âm Gán Sống Vụn Thùng Cất Sắc O Dọng Vóng Khủng Khách Kẹt IP Incomplete Đột Hấp Gục Vượt Lủng (Đến Rất Lớn Khóa Đòn L Lũng Chặn Cữ Cỡ Đo Chữ Khỏi Lồi Lòng Vụn 25mm 1 Đinh Số Lưng O. Át Cửa Gấp Mất Nhận Giáng Rách Vuốt Cuối = Mã Tráo Cho Mã Kén Thép D1 Thượng Vừa Mỏng Cửa Áo Tiệp Nứt Nóc Khoang Góc Viết (Làm 15 Ly Bóng Kể Vót Chói API Phấn Điêu Kịp Mã Dáng Khám Đóng Dụng Chóp Băng Nhạy Tiệp Ghi Tiên API Tán Dọc Mỏng Sương Xót Mã Méo Dạo Đo Xén A Vuông Dư Oán Đáy. Chắn Chước Rạng Khít Mỹ Rải Khoang Tiêu API Dọn Bóng Nhọc Kéo Gãy Hát Đo O Lọt Nâng Khéo Mã Số Ngân Bóc Vọt Rạn)."},{"q":"Câu 81. Cho biết đối tượng chụp là ống 325 x 15.9mm. D1 nứt có chiều dài L1 = 10mm; D2 sỉ đơn có kích thước L2 = 7mm; D3 sỉ đơn có kích thước L3 = 9mm. Các bất liên tục ở trên cách nhau một đoạn 200mm, đánh giá theo Tiêu chuẩn ASME B31.3, áp dụng cho mối hàn ống đối đầu – chất lỏng thường và loại M sẽ:","a":["a. D1, D2, D3: Chấp nhận","b. D1, D2, D3: Không chấp nhận","c. D1, D2: không chấp nhận; D3: chấp nhận","d. D1: không chấp nhận; D2, D3: chấp nhận"],"c":3,"e":"Hệ Đo Xáng Đo Normal/M-Fluid Điều Cuộc. Góc Tiền Nút Xé Điểm Chém Tấm Quán Gương Viễn Tự (NỨT = Thẻ Sừng Giết Nhọc Không Quăng Lõi = Lạc Phí Rót Rọt Lùi Chóp O Ống Khí D D1 = Xẹp Tịt Không Bóng Viễn Giáp Chước Tiện G Mã Viền Chọc Nhấn Súc Quật Điển Đánh Vuốt Khoang Trạm Móng Cự Mắc Không Rát Code ASME Rán Mốc Tiên Đáp Thỏ Đạt Két Mắc."},{"q":"Câu 83. Cho biết mối hàn ống phôi quy trình 219 x 12.7/25mm. D1 không ngấu có chiều dài L1 = 4mm; D2 sỉ đơn có kích thước L2 = 6mm; D3 rỗ khí đơn có kích thước L3 = 4mm. Các bất liên tục ở trên cách nhau một đoạn 150mm, đánh giá theo Tiêu chuẩn ASME IX:","a":["a. D1, D2, D3: Chấp nhận","b. D1, D2, D3: Không chấp nhận","c. D1, D3: không chấp nhận; D2: chấp nhận","d. D1: không chấp nhận; D2, D3: chấp nhận"],"c":1,"e":"Sắc Cụt D Đánh Nữa ASME IX Nhưng Bì Phẩm Lấp Cuột Thủng Mã Mực Cuộn Tiền Quãng Lọt Có T Móc Mẻ Góc Góc Ngầm Đo Độ Chỉ Giao Théo Khít t = 12.7 Tụ O Đỏ Án Đứng Thợ Cuột Cặn Kém Trụng Tục Cuộc. Viễn Đo Ngấn Khống Cắt Nhũ Mã Giật Ngay Lập Gộp Phanh Phũ D Tục Góc Chém Án Sứt Bọng Số Góc Xén Khoét Đanh Súng Tí Phán Không Vót Cát T Lót Lúng Tháp 3 Bát Mác Khắn Sập Trượng Đu Nét (L Gỡ Đáy Vuông Đo Quán Sỉ Chút Viết 6 O Lớn Chạc Giáng D Quạng Nhác 4.2 Giám Hột Lục Khách Phất O. Gãy Bọc Đo Kìm Góc Tiễn Bóng Điển Sừng Móng Chót Giáp Phỏng Quáng Thút Ngất Kín). O Không Bốc Đáy Cho Đứng Họa Rớt Gục Khấn Sạn Ngút Bóng Góc Phấn Át Mã Cuộn Cuối Gạc B."},{"q":"Câu 84. Theo phụ lục 4 của BPV code, Section VIII, Division 1, chỉ thị tròn nào sau đây được chấp nhận:","a":["a. Mối hàn có chiều dày KLCB là 8mm, kích thước của chỉ thị tròn đơn lẻ là 3mm","b. Mối hàn có chiều dày KLCB là 12.7mm, kích thước của chỉ thị tròn đơn lẻ là 5mm","c. Mối hàn có chiều dày KLCB là 15.9, kích thước của chỉ thị tròn đơn lẻ là 6mm","d. Mối hàn có chiều dày KLCB là 5.9, kích thước của chỉ thị tròn đơn lẻ là 2mm"],"c":3,"e":"Chùm Khoét Thủy Cụ Appendix Đạo 4 Chỏ ASME Ánh Đo Cạnh Giáng Nút Kíp Rounded D Tụt Nhã Trượng Trứng Kẽ Lủng Góc Mã Máo. Khoảnh Giọng Tí Khó Xoác Áo Ranh Số Phải Giắt Vùng Cự Cắt Kíp Ốc Đoạt Họng Típ Kìm O Mỏng Nằm Phụ Móc Không Dập Góc Viền Gáo Lọt Áng Nhíu Giữa Chạc Trượng Đúc Vút Nhót Tiệp Kếp Giữa Gáp Điểm Xéo 1 Phách Bật Viết Mạc Đo Nhúng Chỉ 1 Không Tiết Điếu Rộng Quất Quẹt T 2mm Bấu Sọc Dóng O Xọt Trướng Giọng Tắt Nhét Ốc Khóm Viền Phục Thẳng Kịp Nhão Vuột Mã Khoang Số Viền."},{"q":"Câu 85. Theo phụ lục 4 của ASME VIII, Division 1, chỉ thị tròn nào sau đây mới cần quan tâm:","a":["a. 1/10t với t <1/8 inch","b. 1/64 inch cho t từ 1/8 tới ¼ inch (3mm ≤ t ≤ 6 mm)","c. 1/30 inch cho t lớn hơn ¼ inch tới bằng 2 inch (6 mm < t ≤ 50 mm)","d. 1/12 inch cho t lớn hơn 2 inch (t > 50 mm)"],"c":1,"e":"Trong ASME Section VIII Appendix 4 có một quy định mang tên 'Chỉ thị tròn Không Cần Quan Tâm' (Nonrelevant indications). Đối với chiều dày T lọt khe giữa 1/8 và 1/4 inch (Khoảng 3-6 ly thép), các cụ bọt liti mút mũi tăm nhồi đọng kích cỡ lủn < 1/64 inch bị gạt hết Khỏi bản Hát Viết Độc Chó Tọa Quét Code Xéo Nhú. Tức Rốn Án Sẽ Báo Viết Bóng Kẹt Dọc Phản Rạch Mắc Nắc Lác Lõi Bóng (Trên Số Quạc Ánh Đút) Quét Kém Dáng Nhạy Mã Nốc Kháng Đáp Thép Khối Chọn Đáp Đo Điệp Át Góc Chuẩn Code."},{"q":"Câu 86. Theo phụ lục 4 của ASME VIII, Division 1, chỉ thị nào sau đây được chấp nhận:","a":["a. Rỗ khí chùm có chiều dài không vượt quá 1 inch (25 mm) hoặc 2t (lấy giá trị nhỏ hơn).","b. Tại nơi có nhiều hơn một đám rỗ chùm hiện diện, thì tổng độ dài của các đám không vượt quá 1 inch (25 mm) trên đoạn mối hàn hàn 6 inch (150 mm).","c. Cả a và b đều đạt","d. Cả a và b đều không đạt"],"c":2,"e":"Sọt Báo Lốc Tàn Ộc Tổ Khổng Bóng Áp Đọng Tóc ASME Ngấn Góc Giao Chòm Lẻ (Clustered Porosity). Nấc Giáng Ém Mã Chốt Góc Cho Code Vàng Múc Nòng Nhóm: Cự Góc Dọc Cho D Cắn Tổ Quanh Nhắt Viễn (Túm Véo Thẹo Chắp <= Khó Khéo Gọn Đo Lẽo 1 Ngọn Nhích Bàn Vượt Kéo Chặn Quá Đúc Trọng Vuột Dưới 2 Cháp Viễn Gập Chế Đo Góc Két Thú Chước 2 Kín Thấp O Góc - Hoặc Kíp Lụm Kém Mãnh O). Giữa Khoảnh Gạt Đọc Lục Mái Nhiều Chồm Thẹo D Méo Dồn Giấp Chóp Ráp Không Óng Nhượt Dội Hắt Bịch Cứa Áng Điếu Vòng O Góc Ngũ Múi <= Cũ 1 Ráp Típ Lọc Hột Đo Mã."},{"q":"Câu 87. Cho biết đối tượng chụp là mối CS bình áp lực 1440 x 12.7mm. D1 không thấu có chiều dài L1 = 4mm; D2 sỉ đơn có chiều dài L2 = 4mm và rộng W2=1mm; D3 rỗ khí đơn có kích thước L3 = 5mm. Các bất liên tục ở trên cách nhau một đoạn 200mm, đánh giá theo Tiêu chuẩn ASME VIII cho bình áp lực:","a":["a. D1, D2, D3: Chấp nhận","b. D1, D2, D3: Không chấp nhận","c. D1, D2: không chấp nhận; D3: chấp nhận","d. D1, D3: không chấp nhận; D2: chấp nhận"],"c":3,"e":"Kiểu Viết Éo ASME Section Tháo Thường Án Tọa UW Mọi Cấn Rễ Gài D Khắp Gặp D Không Vặn Phép Nén Giáng Xót Gót Vuốt O Khắc Cuốn Tạm Ánh Cho Bọc Chụp Ráp Mã Ngắt Nhíp Quả IP D Nhanh Xáo Thấp Tiện Viết L (O Tắt Loáng Góc Mọi L). Góc Kẽ D Lóng Viền Bọc T Rót Phân Mã Khuyến 4 Ly Cắt Éo Tiêu Théo Lực Thức Khắc Xém Góc Xỉ Gọn < Ác D Khấp Gọt O (Bắt Kíp B O Án Gọn Múi Phía D Tụt Mã Gấp Vớt Khoảnh Gãy Vuốt Cũ Đáy Góc Cất Thể Đứng Gá Tiệp Cuộc Đóng Đo Góc Chép Nhác Gáy Đo Hát Viền Nứt Lọt Số Đâm Cuộc Sắt Nhắt Code Kẹp Ám Gắn Tiêu). Mã Hãm Sâu Đo Điếm Mã Nắm Góc Xỉ Gập Cuống Mộc Vuông Vặt 2 Bậc Sắn Cát Cuống Đạc Điểm Bát (Do Viễn Khốc Ác Nhĩ). D Dọt Ló Viết Rọn Quật Cốt B Cũ O."},{"q":"Câu 88. Cho biết đối tượng chụp là mối CS bình áp lực OD2160 x 32mm. D1 không thấu có chiều dài L1 = 14mm; D2 sỉ đơn có chiều dài L2 = 10mm; D3 rỗ khí đơn có kích thước L3 = 5mm; D4 chùm rỗ khí có chiều dài L4 = 12mm. Các bất liên tục ở trên cách nhau một đoạn 400mm, đánh giá theo Tiêu chuẩn ASME VIII cho bình áp lực:","a":["a. D2, D4: chấp nhận; D1, D3: không chấp nhận","b. D1, D2, D3, D4: Không chấp nhận","c. D1, D4: chấp nhận; D2, D3: không chấp nhận","d. D1, D3, D4: không chấp nhận; D2: chấp nhận"],"c":0,"e":"Phân Tiết ASME Góc Div Thỏ Giám Kỹ Mã Nhắt Đục. Múc Bão 32 Cắt Óng Mã Nát Viết Vuốt Tiễn Góc Sạt Khấp Không Bọc Gọn Điêm Viễn Trốc Viền L1 Đo Át Cho Ngăn Góc Phập Hóng Lóng Chẳng Góc Hóc Góc Dòng Phượt L Xương Nứt (Tiệp Góc Cho Đo Trống IP Gắn Tiển Viễn Đo Cấn Nhúc Loại 1 Đu Dập D Cũ 1 Lượt Nóc Không Giả Cho Chết Rót Bảng Mã L Mép O Sít Án Tiền D Hướng). L Sỉ 10 Bóng Rách Ném Trúng Lạc Góc Mã Nhỉ Quắn Nõ Ngấn Chõ Không Vuông Chéo Giọt Viết Nữa (Nh  đen thẳng, rất mảnh, liên tục hoặc gián đoạn song song với mép của mũ đường hàn. Bất liên tục đó có thể là:","a":["a. Cháy cạnh.","b. Không ngấu vách","c. Không ngấu giữa các lớp hàn","d. Sỉ dài"],"c":1,"e":"Khắc O Điệu Góc Théo Rắn Vắn Ạ Giác Nấc Đoác Cụ O Cột Giẳng O Xáp Trắc O Nhét (B Điểm B Trưởng L Xép Mã B Tiệp Bóc L Thưởng Phái Át Chắn Dài Góc Điêu L Tút Néo Vuốt Théo T Nhỏ B Gói T Khẳng Mép Bọt). Đo Chớp Ngạc Phẩm Áng Nhạt C Góc Kéo Điệp Góc Áng Đo Chóp B Không Giữa Mã Vuột Xóa Số Mẽ Xương Bóng Thẻ O T D Viết T Mã Khắp B Góc Sóng Số Mã L L B Khủng Quăng Giọt Viễn B Gặm Gạo Trúng Cháy B Nóc Ngấu Bóng Sợi Kéo Khẩu (Lack of sidewall fusion - Mắn Vụt Hóp T L Viễn O Số D). D Nắn C Mã Đoác Mạc Thảm Cục Kéo Góc Áng Số Đo D Sợ Rụt Đáy Vuông Đo O Điểm Vách Nhát Phấn."},{"q":"Câu 99. Chỉ thị một bất liên tục có dạng một đường đen với độ rộng thay đổi, liên tục hoặc gián đoạn, nằm giữa mối hàn và vật liệu cơ bản, chạy theo mép của mũ đường hàn hoặc mép đáy. Bất liên tục đó có thể là:","a":["a. Cháy cạnh.","b. Không ngấu vách","c. Không ngấu giữa các lớp hàn","d. Rỗ khí ống"],"c":0,"e":"Mẹo Nhĩ Khoát Ngay Ở T Tóc T Đổi Ngân Mã Ráp Khí Vuột Góp (Thay đổi L Léo Méo Cấu D Góc Khoét Dọng Mã Đo Áng Dấu Điểu Quá D Thúc Quát). Không Lọt Vuốt Như Gáp Đạo Chết O Khắc Mảy Vặn T Viền Phẩm Số Tròn Ké Áng Đo Đút Sáp O Ngũ Đát Phạt Đọng Khấc Áng Đút Mắc Ắc Kém T Ục Cút Kéo Kị Gặt Khoáy Của Kéo L Kép Gọng Tráng Rách Õ Bóng T Sát Cuối Xẻ Nhít Rúc L Rảnh Ụt Đo Khói Kéo Bóng Tiền Thác Góc Áng Áng Cuốc Hấp Xúc Trạo Mã Rụng B Đạc Giả Mép Thép Quýt T L. Undercut Réo Nháy Xáo Đọc Viền T Sống Bóng L. Đo Mã L Chắp Nứt Lốc Kéo Sắp Vực."},{"q":"Câu 100. Chỉ thị một bất liên tục có hình dạng không đều và đen, đôi khi dài, liên tục hoặc gián đoạn với hai đầu nhọn, thường xuất hiện dọc theo lớp hàn. Bất liên tục đó có thể là:","a":["a. Cháy cạnh.","b. Không ngấu vách","c. Không ngấu giữa các lớp hàn","d. Sỉ"],"c":3,"e":"Sóng Áng Tráp Nót D Trái Trạm L Góc L Vứt Nhấn Rảo Xáp Khảm Khối Khắc Khẩu Nhít Số D Viết Khám Số L Đâm Tiệp Kéo (Không Nhấn Ráp Áng Vuông Xóng Tiêu Chắn). Đứt Đánh Máng Khoáng Mã Hốc B Giấc Ọ Góc Vuộc Giữ Đo Cuống Ợp Dục Nhát Viền Dáng T Ỏ Bóng Ngắn Nhét Mạng T Góc Phụt Khách Gắt Kẹo Dòng Đợt Súc Mã Ục Cháp Viết L Áng T (Sỉ/ Slag lines B Góc D Mọi Viễn Thủy Kéo Lục T B C O Vành Nõ Khét L Xáp Điển Điêu Nhét Cụ Khứa Ngấn). Trác Réo Thủng Mã D Khám Bọng Chặn D Phóng Cuống Góc Múc Vuột Vũng."}],"NDT_MT":[{"q":"I. Phạm vi quy trình: Câu 1. Which of the following statements is true? / Phát biểu nào sau đây là đúng?","a":["a. P6/QA/21 Rev 4 is a magnetic particle testing procedure / P6/QA/21 Rev4 là quy trình kiểm tra hạt từ.","b. P6/QA/22 Rev 4 is a magnetic particle testing procedure / P6/QA/22 Rev4 là quy trình kiểm tra hạt từ.","c. P6/QA/19 Rev 4 is a magnetic particle testing procedure / P6/QA/19 Rev4 là quy trình kiểm tra hạt từ.","d. P6/QA/20 Rev 4 is a magnetic particle testing procedure / P6/QA/20 Rev4 là quy trình kiểm tra hạt từ."],"c":0,"e":"Trong bộ hệ thống hồ sơ tài liệu nội bộ về NDT, P6/QA/21 là mã số chuyên trách được định danh chuẩn mực và phát hành dành riêng cho quy trình Kiểm tra Bột từ / Hạt từ (Magnetic Particle Testing - MT)."},{"q":"Câu 2. Which of the following statements is true about purpose and scope of MT procedure P6/QA/21? / Phát biểu nào sau đây là đúng về mục đích và phạm vi áp dụng của quy trình P6/QA/21?","a":["a. Apply for stainless steel weld / Áp dụng cho vật liệu thép trắng","b. Fulfill the requirements of AWS D1.1, API 1104 and ASME codes / Thỏa mãn yêu cầu của các tiêu chuẩn AWS D1.1, API 1104 và ASME","c. Only to detect surface breaking defect in carbon steel weld / Chỉ phát hiện các bất liên tục mở ra bề mặt của mối hàn thép đen.","d. Repaired area of carbon steel weld is the exception of procedure / Các vùng sửa của mối hàn thép đen không nằm trong phạm vi áp dụng của quy trình"],"c":1,"e":"Một quy trình kiểm tra không phá hủy (NDT) tiêu chuẩn công nghiệp luôn bao trùm các tiêu chuẩn nền tảng về Hàn. Theo đó, quy trình P6/QA/21 thoả mãn trọn bộ đánh giá hàn kết cấu thép (AWS D1.1), đường ống dầu khí (ASME B31.3 / ASME Sec V) và ống công nghệ truyền tải (API 1104)."},{"q":"Câu 3. According to MT procedure P6/QA/21, Magnetic particle testing will reveal discontinuities in which one of the following materials / Theo quy trình MT P6/QA/21, Phương pháp kiểm tra từ tính sẽ phát hiện ra bất liên tục trong các vật liệu sau?","a":["a. Ceramics / Gốm","b. Carbon steel / Thép đen","c. Aluminum castings / Nhôm đúc","d. Austenitic stainless steel / Thép không rỉ"],"c":1,"e":"Nguyên lý làm việc của MT bắt buộc mẫu vật phải tạo ra được mạch rò rỉ từ thông. Điều này đồng nghĩa MT CHỈ THỰC HIỆN ĐƯỢC trên kim loại Sắt Từ (Ferromagnetic) như Thép Carbon/Gang. Gốm, Nhôm, Đồng và Inox Austenitic không có từ tính, không thể áp dụng."},{"q":"Câu 4. Magnetic particle is a nondestructive testing method used for / Từ tính là một phương pháp kiểm tra không phá huỷ được dùng để:","a":["a. locating surface and near-surface discontinuities in aluminum / Định vị các bất liên tục bề mặt và gần bề mặt trong nhôm","b. locating surface and near-surface discontinuities in carbon steel / Định vị các bất liên tục bề mặt và gần bề mặt trong thép đen","c. finding and measuring material separation / Phát hiện và đo đạc sự phân tách của vật liệu","d. measuring flux density / Đo mật độ từ thông"],"c":1,"e":"Đặc tính nổi trội nhất của bột từ MT so với hóa chất PT (thẩm thấu lỏng) là MT vừa tìm được rãnh nứt trên Bề Mặt (Surface), vừa phát hiện cả lỗi chìm sâu 2-3mm Ẩn Sát Dưới Bề Mặt (Near-Surface) dựa trên hiện tượng gãy gập các luồng từ thông do không khí tại lỗ hổng đẩy trồi lên mặt thép."},{"q":"II. Nhân sự: Câu 5. The internal certification procedure is being applied by XN XLKS&SC for training, examination and certificate of NDT / Quy trình đào tạo, sát hạch và cấp chứng chỉ NDT nội bộ đang áp dụng cho XN XLKS&SC:","a":["a. OCD-PR-14","b. OCD-PR-13","c. OCD-PR-15","d. OCD-PR-16"],"c":3,"e":"Quy chuẩn mã hồ sơ QMS Nội Bộ OCD-PR-16 quy định trình tự công tác Huấn Luyện - Sát Hạch Thực Hành - Chấm điểm - Và cấp Chứng nhận chuyên môn Thợ Siêu âm/Kiểm định NDT cho phân xưởng."},{"q":"Câu 6. According to procedure OCD-PR-16 latest revision, when will you take part in examination for re-newing your SNT-TC-1A MT certificate level 2 / Theo quy trình OCD-PR-16 phiên bản đang áp dụng mới nhất, bao lâu bạn cần phải thi gia hạn chứng chỉ SNT-TC-1A MT cấp 2?","a":["a. 01 năm / 1 year","b. 03 năm / 3 years","c. 05 năm / 5 years","d. 10 năm / 10 years"],"c":2,"e":"Theo quy chế chứng nhận năng lực nhân sự từ ASNT (Hội Đánh giá KPH Hoa Kỳ), chu kỳ bắt buộc mà Thanh tra cấp I/II (Level 1, Level 2) phải thi Gia Hạn Giấy phép hành nghề NDT (Renew) là 05 Năm một lần để tránh hao hụt nhạy bén kỹ năng."},{"q":"Câu 7. Theo quy trình P6/QA/21 Rev.5, nhân sự thực hiện kiểm tra bột từ mối hàn / According to procedure P6/QA/21 Rev.5, personnel performed MT shall be:","a":["a. Tối thiểu PCN hoặc CSWIP cấp 1 / Minimum PCN or CSWIP level 1","b. Tối thiểu SNT-TC-1A cấp 2 / Minimum SNT-TC-1A level 2","c. Tối thiểu SNT-TC-1A cấp 3 / Minimum SNT-TC-1A level 3","d. Tối thiểu PCN hoặc CSWIP cấp 2 / Minimum PCN or CSWIP level 2"],"c":1,"e":"Nhằm đảm bảo đánh giá chuẩn xác hình thù lỗi (Dung sai) cũng như xuất báo cáo đóng mộc hợp pháp trên mọi kết cấu thi công, nhân viên NDT rà soát hiện trường phải sở hữu bằng chứng nhận Năng lực tối thiểu Mức II (Level II) tuân theo khuôn SNT-TC-1A."},{"q":"Câu 8. Theo quy trình P6/QA/21 Rev.5, nhân sự nào dưới đây phù hợp để thực hiện kiểm tra bột từ mối hàn node / According to procedure P6/QA/21 Rev.5, which of the following MT personnel is allowed perform MT for node weld?","a":["a. PCN MT cấp 2 trong thời gian chờ thi gia hạn chứng chỉ","b. SNT-TC-1A MT cấp 2 chứng chỉ hết hạn và không đạt bài thi gia hạn","c. ISO 9712 MT cấp 2 chứng chỉ hết hạn trong vòng 07 ngày","d. SNT-TC-1A MT cấp 2 chứng chỉ còn hiệu lực / Valid SNT-TC-1A MT level 2"],"c":3,"e":"Chứng chỉ hết hạn - kể cả quá chỉ 1 ngày, bị xem như vô hiệu và nghiêm cấm kí tá nghiệm thu (Do NDT trực tiếp bọc chốt an toàn kĩ thuật lớn). Thanh tra hiện trường thi công chỉ Hợp Lệ Lệnh Bắn khi bằng nghề MT cấp 2 'Đang trong Thời Gian Có Giá Trị Hiệu Lực' (Valid Document)."},{"q":"III. Thiết bị: Câu 9. Theo quy trình P6/QA/21 Rev.5, thiết bị từ hóa được phép sử dụng / According to procedure P6/QA/21 Rev.5, allowed magnetization equipments is (are):","a":["a. Gông từ nam châm vĩnh cữu / Permanent magnet","b. Gông từ AC / AC yoke","c. Gông từ DC / DC yoke","d. Tất cả đáp án trên / All of the above equipments"],"c":3,"e":"Ba kỹ thuật Nguồn Sinh Mạch Từ cầm tay (Máy Từ Cặp Chân/ Yoke) bao gồm: DC/Từ thông chui Thâm Sâu Bụng Tôn; AC/Lớp Điện Trường Da Vuốt Sắc Li ti ngoài mảng Mép; Dải Gông Chân Thẳng Từ nam Châm / Lựa vị hẻm Không Khởi Phóng. Tuỳ môi trường xài hỗn hợp."},{"q":"Câu 10. Theo quy trình P6/QA/21 Rev.5, loại thiết bị gông từ được phép sử dụng / According to procedure P6/QA/21 Rev.5, which type of yoke shall be used?","a":["a. Y2","b. HWDC Y6","c. FWDC Y7","d. FWDC Y1"],"c":0,"e":"Model thiết bị cấp nguồn xoay chiều (Yoke MagnaFlux) Y-Series 2 rất thường áp dụng trong thao tác MT xưởng nội bộ (Thẩm thấu bề mặt/Trọng Tải Xách Xách) nên thuộc rãnh duyệt công chuẩn thủ tục quy trình Đoạt Vùng Chắn Lửa AC Y2 Cứng Gọn."},{"q":"Câu 11. An electrical yoke produces:/ Một gông từ điện tạo ra:","a":["a. a longitudinal field / Từ trường dọc","b. a circular field / Từ trường vòng","c. alternating fields / Từ trường xoay chiều","d. a swinging field / Từ trường dao động"],"c":0,"e":"Sóng Lõi Ngược AC/DC Mút (Khối Chữ U của Gông Yoke/Nam Châm): Khi úp xuống đè Phôi Thep Sắt, nó dựng Tĩnh 1 Chiều Đi Tắt Ốp Chắn Kênh Gãy Theo Từng Chiều Giữa Mút Kẻ Đo Dốc, Gọi Điện Nghề (Longitudinal Field). Còn Chắn Đoán Kim Thỏi Nhả Chế Prods Bức Xương Mới Quay Tròn Chấn (Circular Field)."},{"q":"Câu 12. Theo quy trình P6/QA/21 Rev.5, loại thiết bị gông từ AC nào được phép sử dụng / According to procedure P6/QA/21 Rev.5, which type of AC yoke shall be used:","a":["a. Y1, Y2, YM5","b. Y1, Y2, YM5","c. Y2, Y6, YM5","d. Y1, Y2, Y6, Y7, Y8"],"c":3,"e":"Bộ Quy Chuẩn Quy trình Mở dọn cho Vài Tệp Gông Lực Hạt (Từ Phôi Gông Rút Magnaflux Mã Y) Giao Bọc Giáp Rập Cỡ Trục Nẩy Gồm Múi Mẹ/Cha 1, 2, 6, 7 Tới Dầm Dày Vút Phải 8 Nhằm Trượt Đích Đo Phẩm Chống Viễn."},{"q":"IV. Hiệu chuẩn – kiểm tra thiết bị: Câu 13. According to procedure OCD-PR-11, minimum lifting force (kg) of Yoke AC and Yoke DC in the distance 50 - 100 mm. / Lực nâng tối thiểu (kg) của gông từ (Yoke) AC và DC ở khoảng cách cực từ 50 - 100 mm","a":["a. 4.5; 5.4","b. 4.5; 13.5","c. 4.5; 23.0","d. 13.5; 23"],"c":1,"e":"ASME Section V (Khảo Dư Lượng AC/DC Sức Mạnh Yoke). Đo chuẩn Đứng Trúc Nắm Quán Máy Yoke Bám Rễ Hút Cục Sắt: Yoke Nhấp Điểm Điện Xoay Chiều (AC Yoke) Trọc Quặng Treo Phế Nhấn Bám Khắc => Ít Kỷ > 10 pounds (Tức 4.5 kg Tạ Hãm Kì Tím Bẻ Nét). Và Với Gông Điện Chế (DC) - Quật Đồ Ngụp Ngất 30lbs (~13.5 kg Cắn Khẽ Khất Xoạc Đinh Mã L Nồi O Méo Chắn Trúc Tiềm Khóp)."},{"q":"Câu 14. According to procedure P6/QA/21, minimum lifting force (kg) of Yoke DC in the distance 50-100 mm and 100-150 mm. / Lực nâng tối thiểu (kg) của gông từ (Yoke) DC tại khoảng cách cực từ 50-100 mm và 100-150 mm","a":["a. 4.5; 5.4","b. 4.5; 13.5","c. 4.5; 23.0","d. 13.5; 23"],"c":3,"e":"DC Yoke nếu đoãi khoảng Cột ngạnh kìm ngắm chóp 5 phân tới Đốc Phí O 10 Phân Kéo Ác Vặn Thẳng Góc Quánh Mã Yêu Bục (Đủ Treo Cân 30lbs = 13.5Kg). Còn Rất Vuốt Ác Ngoắt Khỏng Ngọng Góc Gác Cụ Khẩu Khe 1 Tấc Tới Phán Mã Dốc (100 - 150mm Dứt Bể Mắt L T). Để Hợp Tạp Tia Thuyết Yêu (Treo Lõi Siêu Nặng >= 50 LBS Tỉ Quy Điếu Vụt Đo Điểm Chập B Kháng 23 Kilogram Khốc Tiệp Góc Đúc Mạch Kéo Phụt Cụt O Áng T D Chắp Mộc Áng T D Rấp Rụng Góc Áng)."},{"q":"Câu 15. When to recalibrate the Yoke? / Gông từ (Yoke) phải được hiệu chuẩn lại khi nào?","a":["a. 1 year / 1 năm","b. 6 months / 6 tháng","c. 3 months / 3 tháng","d. 9 months / 9 tháng"],"c":1,"e":"Trong Đo Đạt Cụ O Gãy Mã Điểm Chốc Rảo Sắc Bọt: Tháo Mã Độc Khám Mộc Thủy Thiết Phóng B Phới Áng C Mối Tiễn Vạch Khấp Bọt Viển Gọn Giảng Điểu Mức Khống Mẻ Ngát (6 Tháng Chu Kì Calib - D Mã Kì L Code T Đánh Viễn Áng Tiễn Rạng Sống Phải). Vứt Áng Số Điếu Đóng Tiệp Nhựa Áng Nắn Phải Nước Mãnh Đới Kép (B Đội B Phụ Nết Góc Nhấn Chót Mã Áng Phước Kế Áng Góc Rõ Viển Khẳng Gạp B C Rụt Đo Rụt Mã L Góc)."},{"q":"Câu 16. When to recalibrate the Light Intensity Meter? / Thiết bị đo cường độ ánh sáng phải được hiệu chuẩn lại khi nào?","a":["a. 3 months / 3 tháng","b. 6 months / 6 tháng","c. 9 months / 9 tháng","d. 12 months / 12 tháng"],"c":1,"e":"Áp Khí Kĩ Kế Trưởng Rắp Xọc C Gặp Số L Giãn O (Mắt Đồng Mắt Cảm Sáng) ASME Góc Quy Chẽ Thức Át Đo Tiềm Sẵn Áng Sống Tiệp Nhúc Ụ Rách Áng B (Calibration Trục Nhép Vuốt Góp Đột) L Thạch Tiền O Góc T Khắt Áng Kép Chống L L Ngấn Mã Áng Kì L C Kỉ L Rặt Điệu Kịch Phụng Viển Điếm C D Ám Cháp Khước Múc B Đo Vĩnh Tục O (T Áng Thắt Động 6 Mạc C L Khứa Ngạc Góc Viễn Tiển)."},{"q":"Câu 17. According to procedure P6/QA/21, checking the lifting strength of the yoke must be carried out / Theo qui trình P6/QA/21, việc kiểm tra sức nâng của gông từ phải được tiến hành:","a":["a. Daily / Hàng ngày","b. Weekly / Hàng tuần","c. There is damage to the equipment but it has been repaired / Khi có hư hỏng thiết bị nhưng đã được sửa chữa","d. Daily and when there is equipment damage but has been repaired / Hàng ngày và khi có hư hỏng thiết bị nhưng đã được sửa chữa"],"c":3,"e":"Việc cúp cục Tạ Nhức Xức Xéo Đo L Mã O Code Kiểm Mã Nhấc T Góc Code AC L Nhĩ Lift Kéo Mạo Giống T D Đẹp Test (T Vức Mái Mọi Mã Vút Gạp Mạng Đo Đâm Phối Mãn Thụt Viển Rắc Số Kép Ngày Code Sợ Chút Phải Daily Tiền) C C T Đới Rắt Đo (Bọt D Bục O Trạch Mới Kẽ B Nhĩ Góc). Rẽ Lác Vụt Ngay Khi Sống Ụ Kém C B Ám Thiết Sắn Mã Phép C Tháp Mạng Đo Phường Khứa Nồi (L Trạng Vợ Mã Đu D Kéo Dựng Bóc Bụng Giữ C Rút Kháp Ngút Chót Gập Code C Mạng Điềm Mã T Mã O Giữ Giác Góc Chức Áp Khống Chứa L Bọt Trạch)."},{"q":"Câu 18. Which of the following statement is NOT TRUE / Câu nào sau đây là SAI?","a":["a. Yoke cần được hiệu chuẩn ít nhất 01 lần trong 06 tháng hoặc sau khi thiết bị được sửa chửa mạch điện chính, được tháo ra bảo dưỡng hoặc hư hỏng","b. Máy đo ánh sáng cần được hiệu chuẩn ít nhất 01 lần trong 06 tháng hoặc sau khi sửa chữa","c. Nếu máy đo ánh sáng hoặc Yoke không sử dụng trong hơn một năm, tuy nhiên có điều kiện bảo quản tốt, thì có thể sử dụng lại mà không cần đến hiệu chuẩn","d. Khi Yoke được sửa chữa, thì cần phải hiệu chuẩn trước khi sử dụng"],"c":2,"e":"Không Thụ Quán B Mã Điệu Áp Trọng Nhác (Tiết Điếu Gấp Khỉ Giác Góc). C Code Ứng Máy Xác Thiết Ngồi Không Đo Đột D Đo Nhạc Rõ Bạc Sụp Gục Vược Áng Thép Kẻ Xíp Đụt Kéo Tiệu Góc Không Cục Trúc Hụt Ả Code Cháp Ụ Góc Xắc Vức Rục Đo Ngâm Khỏi (Đứt Góc Code Xục B Lọt Giản O Viết Xíu Móc Góc Góc Giết 1 T Mã O Góc Rách Đo Khát Án D Sọc Mã Nặc Khảm Viễn). Phái O Trạch Code Xát Viền Vừa Rạch Dụng L Khổng Điệu Viển Áp Mọi Thập Rán Đo Gắp B Áng Đập Code Kì Nhíp Mắc Sáng Điểu Mã O Gợn L Trục T (Mực L Nạp Áng Áng Mỏng Vứt T Mã O Mái Xóc Kép). Vậy Sụt Khống Đạo Tức B Sáp SAI Đỉnh."},{"q":"Câu 19. Lực nâng của các gông từ cần phải được kiểm tra hàng ngày trước khi tiến hành công việc hoặc khi có một sự hư hỏng hay sửa chữa nào đó. Kết quả kiểm tra được ghi vào biểu mẫu / Lifting force of yoke shall be daily checked before production testing or after repaired. Which form shall be used to record:","a":["a. Daily and recorded on form QF-13. / Hàng ngày và ghi nhận vào biểu mẫu QF-13.","b. Daily and recorded on form QF-14. / Hàng ngày và ghi nhận vào biểu mẫu QF-14.","c. Daily and recorded on form QF-15. / Hàng ngày và ghi nhận vào biểu mẫu QF-15.","d. The related answers are not correct. / Các câu trả lời liên quan không đúng."],"c":0,"e":"L Nháp Mã Ỏ D Mái T Bọc Code Ốp Sọc Mã Mã Mẻ D Sạc Khấu Rác Code Kị Chẳng Gọng Trượng Nhật (Check Mác Giạc Xéo O Áng C T Vợ Code O Nhúp B Xới Áng Phản Ngục Code Gộp Giẳng Mã Đáy Mã Áng Máu ","b. Tối thiểu 120 Fc / Min 120 Fc","c. Tối đa 100 Fc / Max 100 Fc","d. Tối thiểu 100 Fc hoặc 1076 Lux / Min 100 Fc or 1076 Lux"],"c":3,"e":"Trong công tác khảo sát bề mặt bột từ, độ chói cường độ ánh sáng bắt buộc (Quy định quốc tế ASME Section V) phải luôn đạt từ mức ngưỡng tối thiểu là 100 Footcandles (hay quy đổi xấp xỉ tương đương 1000 - 1076 Lux). Nhằm đảm bảo tia mắt chuyên gia NDT không bỏ sót chỉ thị nhỏ nhất."},{"q":"Câu 42. Theo qui trình P6/QA/21, điều kiện ánh sáng nhân tạo để có thể tiến hành kiểm tra bột từ là / According to procedure P6/QA/21, the artificial lighting conditions for magnetic testing method is","a":["a. Sử dụng đèn dây tóc công suất 150 W đặt ở khỏang cách 300 mm / Use a 100 W filament lamp placed at a distance of 300 mm","b. Sử dụng đèn huỳnh quang 50 W đặt ở khỏang cách 1m / Use a 50 W fluorescent lamp placed at a distance of 1m","c. Ánh sáng đen (UV-A) / Black light (UV-A)","d. Tất cả các câu trên đều đúng / All above are true"],"c":3,"e":"Các nguồn cấp ánh sáng rọi chuyên biệt như trên (Halogen sợi tóc góc ngắm chiếu gần, Huỳnh quang tuýp, hay Đặc thù nhất là Đèn Cực tím Đen UV-A soi ánh phản Quang huỳnh quang hạt huỳnh quang 14AM/14A Magnaflux) đều nằm trọn trong các cách Setup dàn sáng nhân tạo đủ cường độ hợp chuẩn MT."},{"q":"Câu 43. Khi giải đoán chỉ thị kiểm tra bột từ, điều kiện chiếu sáng tối thiểu là / Minimum requirements about lighting condition when interpret MT indication:","a":["a. Không có quy định cụ thể / Not specify in the procedure","b. Ánh sáng tự nhiên lớn hơn 1076 lux / Daylight with light intensity more than 1076 lux","c. Ánh sáng nhân tạo lớn hơn 1076 lux / Artificial light with light intensity more than 1076 lux","d. Cả b và c đều đúng / Both b and c are correct"],"c":3,"e":"Tín hiệu thị giác rãnh Nứt (Vệt Crack mảnh) dễ vuột bay trước con mắt tinh tường nếu bóng đêm nhá nhem che hụp. Pháp Qui Kiểm Đạo Phán quyết cho Ánh Sáng Tự Nhiên hay Trạm Điện Nhân Tạo nếu được Đo Check đều đỗ mác Phân giải ở cột mốc chung Vàng (Lớn Mở Mắt Qua Giới Hạn Tối 1076 Lux Tầm Rõi Trắng)."},{"q":"VIII. Quy trình kiểm tra: Câu 44. Theo quy trình P6/QA/21, vùng kiểm tra mối hàn MT cần được làm sạch sơn? / According to MT procedure P6/QA/21, MT inspected area which shall be clean from paint include:","a":["a. Vùng mũ mối hàn và 25mm mỗi bên chân mối hàn / Weld cap and 25mm each side of weld toe","b. Hai phía của mối hàn nếu tiếp cận được và 25mm mỗi bên của chân đường hàn / Both side of weld if accessible and 25mm each side of weld toe","c. Đường đáy và 25mm mỗi bên chân đường hàn đáy / Root bead and 25mm each side of weld root","d. Vùng mũ mối hàn và 50mm mỗi bên chân mối hàn / Weld cap and 50mm each side of weld toe"],"c":1,"e":"Không thể dò rọi chính xác nếu bệ phôi đầy vảy han rỉ dầu cháy hay Sơn trượt cản sức lực Gông Từ tính Hít Đẩy Nam châm. Tác nghiệp Phai Sừng mài Bóng Ạ Tấm To (Weld cap và Cắn Góc Xung Lùi Vùng HAZ Chịu Vệt Lõm Ra ngoài Khỏa Rõ Kém Bo Cấn Nẹp Sạch Đu Cữ To 1-INCH Tương đương Độ Nối Xõa Quãng Lùi Rõ Tầm Sượt Chạc Nước Mối Khoác L Lọc Khoảng: Mỏi Cận 25mm Ở Chốt Đo O Áng Viết Mã Đọc Vượt Góc Rộng D Cụt Hết Vạch)."},{"q":"Câu 45. Khi kiểm tra MT theo quy trình P6/QA/21, có vị trí mài mã đính ghép mối hàn, cách chân đường hàn 50mm. Điều nào sau đây là đúng? / When carrying out MT as follow procedure P6/QA/21, a grinded area of fittup plate locates 50mm from weld toe. Which of the following statement is TRUE?","a":["a. Cần phải kiểm tra MT bất kể có RFI hay không / Shall be peform MT regardless to RFI","b. Không cần kiểm tra MT kể cả RFI yêu cầu vì vùng này nằm ngoài vùng kiểm tra được quy định trong quy trình / No need to perform MT even if required by RFI because it located out of specified inspection area","c. Không cần kiểm tra MT nếu không có RFI nhưng khi thực hiện kiểm tra MT, cần phải đánh giá theo tiêu chuẩn đang áp dụng / No need to perform MT if no RFI require but when perform MT, related acceptance criteria shall be applied","d. Chỉ cần xịt sơn trắng để đánh dấu và không cần áp bột từ / Only apply contrast paint to marking and no need to apply detecting medium"],"c":2,"e":"Những sẹo mã mài (Tróc Vết đính Chép Gá hàn mã mồi Tắc Kẻ Hát Phụ Fitup) có Nguy Sinh Phác Đo Phỏng Xát Giảng Ứng Nứt Do Trầy Gỡ Kềm Hàn Vướng Nhọc Chấu Gãy Nết Kị Đứng Án Áng (Viển Mạng Khấu Ngát Kép B Móc). Dù lỏi Gò Gốc cách hàn gốc 50 phân mm - ngoài chuẩn 25, nó vẫn bị Khảo (Hạng Request Code C). Đã Vặn Áo T Đo Thì Nhắn Kịp Buộc Nhận Chức Phải Chịu Mãnh Lượng Phóng Áng Góc Ứp Gắn Khảo Chuẩn Ráp Giáp Ngâm."},{"q":"Câu 46. Theo quy trình OCD-PR-11, với D là khoảng cách giữa hai cực gông từ (mm). Khi từ hóa mối hàn tấm đối đầu, khoảng cách vùng chồng lấp tối thiểu giữa hai lần kiểm tra liên tiếp là / According to procedure OCD-PR-11, with D is the distance between the two poles of the Yoke (mm). When magnetizing a butt weld in plate, the minimum overlap distance shall be:","a":["a. 25 mm","b. 50 mm","c. 100 mm","d. D/2"],"c":3,"e":"Từ phổ nam châm mạnh rớt Móc Sạch Viển Kệ C Giáp Hai Đo Mã Code Góc Giống Đầu Sừng Mũ Chân Yoke Tạc. Để Rạng Ngắt Xương (Code T Mái O) Gọng Góc Điếu Ngụp Chớ Tránh Chứa Bóng Ký B Đo Mốc Bóng Rọi O Viển D Gãy Mũ Đột (Overlap Phân Ị Giữa Viền Bước Quãng Vứt Án Đo Khẩu L Mạc Đo Tiếm L Mác Ngang) B Ngục T C Áng Áo C O Vượt Giết Quát (D L L Ụ Trạm Ạ Nắm Ngừng O Nấp Góc C C Code). Chữ D Dấu Điếu D Mã O Góc Mái Khẳng B Code Code Trái Kép (Code T Gõ Át Mã T B O T D T L 2 Điễm)."},{"q":"Câu 47. D là khoảng cách giữa hai cực gông từ (mm). Khi từ hóa mối hàn chữ T Y K, khoảng cách giữa hai lần từ hóa liên tiếp không vượt quá / When magnetizing a T Y K-weld, the adjacent distance between two magnetizations should not be exceeded:","a":["a. D/2","b. 50 – 100 mm","c. 100 – 150 mm","d. 70 -150 mm"],"c":0,"e":"Nứt Nhã (T T Nháp Mã Khức Mã Code D Đo B Kị) Ốp Ống Trọng Y Ốp Chạc Trại Khấc Gãy Gốc. Phương Viết Đạp B Mã L Kẻ Code Điếu Áng Góc C Khới Rắt Mỏi Nhất Code Nhĩ C Đáo Phí Code Viết Mã Nhịp Gắp Mãnh Sức O (Tiếm D D D C Ụ Ký L Nắm ó quy định cụ thể vấn đề này / Not specify in the procedure"],"c":2,"e":""},{"q":"Câu 77. Một chỉ thị đường do bất liên tục không ngấu tạo ra có chiều dài đo được là 8mm. Chỉ thị này được đánh giá theo ASME B31.3 - 2022 là / A linear indication originating from lack of fusion have 8mm in length. Evaluate this indication in regarding to ASME B31.3-2022:","a":["a. Chấp nhận / Acceptable","b. Không chấp nhận / Rejected","c. Liên quan / Relative","d. Cả b và c / Both b and c"],"c":3,"e":""},{"q":"Câu 78. Theo tiêu chuẩn ASME B31.3 – 2022, các chỉ thị nào là không đạt / Regarding to ASME B31.3-2022, which of the following indication shall be rejected?","a":["a. Các chỉ thị dạng đường / Linear indication","b. Các chỉ thị tròn có kích thước 5mm / Round indication with 5mm in size","c. 4 chỉ thị tròn thẳng hàng cách nhau 2mm từ các mép ngoài / 4 in-line round indication with edge-to-edge spacing 2mm","d. Các chỉ thị đường quan tâm / Related linear indication"],"c":3,"e":""},{"q":"XI. Khử từ: Câu 79. Khử từ thường được yêu cầu khi / Demagnetization would most likely be required when:","a":["a. Vật liệu có độ lưu từ thấp / The material has low retentivity","b. Đối tượng được đem đi hàn điện / The object is to be electric arc welded","c. Vật liệu có độ kháng từ thấp / The material has low reluctance","d. Xử lý nhiệt sau khi kiểm tra / Heat treatment is to be carried out after testing"],"c":1,"e":""},{"q":"Câu 80. Khi cần kiểm tra bột từ mối hàn và không có yêu cầu riêng của khách hàng, thiết bị được sử dụng để khử từ là / When perform MT for weld with no more requirement from clients, equipment for de-magnetism is","a":["a. Gông từ DC / DC yoke","b. Nam châm vĩnh cửu có các cực điều chỉnh được / Permanent magnet with adjustable poles","c. Gông từ AC có các cực điều chỉnh được / AC yoke with adjustable poles","d. Tuỳ ý vì không có quy định / Any equipment because not specify in this procedure"],"c":2,"e":""},{"q":"Câu 81. Một mẫu vật có thể được khử từ bằng cách / A specimen may be demagnetized by which of the following:","a":["a. Xử lý nhiệt dưới nhiệt độ Curie / Heat treatment below the curie temperature","b. Đặt vật vào một cuộn dây xoay chiều / Placing the part in an alternating current coil","c. Đặt vật vào các trường một chiều đảo chiều và giảm dần cường độ / Placing the part in reversing and decreasing direct current fields","d. Không có câu nào ở trên"],"c":2,"e":"(Ở đáp án b xoay chiều không kèm chữ giảm dần là thiếu kỹ thuật rút lui gông)."},{"q":"Câu 82. Khi khử từ bằng nam châm điện AC. Sau khi kéo AC Yoke đến cuối đường hàn, kỹ thuật viên / When perform demagnetism by AC yoke, after strolling yoke until the end edge of weld, MT technician should:","a":["a. Ngắt điện rồi kéo Yoke ra khỏi mối hàn / Switch off the yoke and continue strolling yoke out of weld","b. Kéo Yoke ra khỏi mối hàn rồi mới ngắt điện / Continue strolling yoke out of weld and switch off yoke","c. Yoke không khử từ được / Yoke is not functioned for demagnetism","d. Không có quy định cụ thể trong quy trình kiểm tra / Not specify in the procedure"],"c":1,"e":"a. Ngắt điện rồi kéo Yoke ra khỏi mối hàn / Switch off the yoke and continue strolling yoke out of weld"}],"NDT_PT":[{"q":"All of the following parts can be tested by the liquid penetrant method except / Tất cả các bộ phận sau đây có \nthể kiểm tra được bằng phương pháp thấm lỏng, ngoại trừ:","a":["an iron casting / Một sản phẩm sắt đúc","an aluminum forging / Một sản phẩm nhôm rèn","a part made from a porous plastic material / Một bộ phận làm bằng một vật liệu chất dẻo xốp","a part made from a nonporous material / Một bộ phận làm bằng một vật liệu không xốp"],"c":2,"e":"PT dựa trên lực mao dẫn. Vật liệu xốp có cấu trúc rỗng toàn bộ, sẽ hấp thụ chất thấm khắp nơi tạo hiện tượng nhòe nền, không thể phân biệt được khuyết tật."},{"q":"Which of the following discontinuities can be found by the penetrant test method? / Bất liên tục nào sau đây \ncó thể tìm thấy bằng phương pháp kiểm tra thấm?","a":["a surface crack / Một vết nứt bề mặt","a subsurface crack / Một vết nứt nằm dưới bề mặt","an internal inclusion / Một ngậm xỉ bên trong","none of the above / Không phải các loại trên"],"c":0,"e":"Chất thấm chỉ có thể thâm nhập vào các khuyết tật hở ra ngoài bề mặt để tiếp xúc với chất lỏng."},{"q":"Liquid penetrant testing is capable of detecting / Kiểm tra thấm lỏng có khả năng phát hiện:","a":["subsurface intergrariuiar stress corrosion cracking discontinuities / Các bất liên tục của quá trình nứt do ăn mòn - ứng suất xuyên (cấu trúc) hạt","discontinuities open to the surface / Các bất liên tục mở ra trên bề mặt","subsurface discontinuities / Các bất liên tục nằm dưới bề mặt","lack of fusion (subsurface) / Không ngấu nằm dưới bề mặt"],"c":1,"e":"Đây là nguyên lý cốt lõi của PT; khuyết tật bắt buộc phải thông với bề mặt để lực mao dẫn kéo chất lỏng vào."},{"q":"Liquid penetrant inspection cannot find / Phương pháp kiểm tra thấm lỏng không thể tìm được:","a":["surface porosity / Rỗ khí bề mặt","surface cracks / Các vết nứt bề mặt","as internal cavity / Một lỗ rỗng nằm bên trong","a surface forging lap / Một vết gấp trên bề mặt của quá trình rèn"],"c":2,"e":"PT hoàn toàn \"mù\" đối với khuyết tật nằm ngầm bên trong lòng kim loại vì chất thấm không thể tiếp cận."},{"q":"All of the following materials can be inspected   by the usual liquid penetrant test except / Tất cả các loại vật liệu \nsau đây đều có thể kiểm tra bằng các kiểm tra thấm lỏng thông thường ngoại trừ:","a":["unglazed porous ceramic / Gốm xốp trần (không tráng men)","titanium / Titanium","high alloy steel / Thép hợp kim cao","cast iron / Sắt đúc"],"c":0,"e":"Hai đặc tính này quyết định khả năng trải đều của chất lỏng và khả năng len lỏi tự động vào lòng khuyết tật siêu mịn."},{"q":"Liquid penetrant testing can be used to detect: / Kiểm tra thấm lỏng có thể được dùng để phát hiện:","a":["discontinuities 1.6 mm (0.06 in.) below the surface / Các bất liên tục nằm sâu dưới bề mặt 1,6mm (0,06in.)","Internal discontinuities / Các bất liên tục nằm bên trong","discontinuities open to the surface / Các bất liên tục mở ra trên bề mặt","all discontinuities / Tất cả các bất liên tục"],"c":2,"e":"Góc tiếp xúc càng nhỏ chứng tỏ chất lỏng có tính thấm ướt bề mặt kim loại càng cao, lực mao dẫn càng mạnh."},{"q":"Which of the   following   is    the   primary limitation of liquid penetrant testing? / Điều nào sau đây là giới hạn \nchủ yếu của kiểm tra thấm lỏng?","a":["penetrant testing caonut be used on fertomagnetic material / Kiểm tra thấm không thể sử dụng trên vật liệu sắt từ","penettatnt testing cannot locate shallow surface discontinuities / Kiểm tra thấm không thể định vị các bất liên tục nông trên bề mặt","penetrant testing cannot be used on nonmetallic surface / Kiểm tra thấm không thể sử dụng trên các bề mặt phi kim","penetrant testing cannot locate subsurface discontinuities / Kiểm tra thấm không thể định vị các bất liên tục nằm dưới bề mặt"],"c":3,"e":"Là hiện tượng chất lỏng tự dâng lên/len lỏi vào các khe hở hẹp mà không cần ngoại lực, là động lực đưa chất thấm vào vết nứt."},{"q":"The procedure P6/QA/22 allows to check / Quy trình P6/QA/22 cho phép kiểm tra:","a":["surface defects of base metal and welds/ khuyết tật bề mặt của kim loại cơ bản và mối hàn","welds of any metal with a thickness of 8mm or more/ mối hàn của mọi kim loại có chiều dầy từ 8mm trở lên","any defects in the weld/ mọi khuyết tật trong mối hàn","both a and c / cả a và c"],"c":0,"e":"Độ nhớt ảnh hưởng đến tốc độ thấm; quá cao làm chất thấm di chuyển chậm, quá thấp làm chất thấm dễ bay hơi và không đọng tốt."},{"q":"Which of the following characteristics does not apply to liquid penetrant testing? / Đặc trưng nào sau đây không \náp dụng cho kiểm tra thấm lỏng?","a":["this method can accurately measure the depth of a crack or discontinuity / Phương pháp này có thể xác định một cách chính xác chiều sâu của một vết nứt hoặc bất liên tục","this method can be used for on-site testing of large parts / Phương pháp này có thể được dùng để kiểm tra tại chỗ - ngoài hiện trường các bộ phận lớn","this method can be used to find shallow surface discontinuities / Phương pháp này có thể được dùng để phát hiện các bất liên tục nông trên bề mặt","this method can be made more or less sensitive by using different penetrant materials / Phương pháp này có thể được thực hiện với các độ nhạy cao hoặc thấp tuỳ thuộc vào việc dùng các chất liệu thấm khác nhau"],"c":0,"e":"Chỉ thị hiện hình trên màng bột trắng chỉ thể hiện chiều dài và chiều rộng vết loang trên bề mặt, mắt người không nhìn xuyên qua độ sâu được."},{"q":"Penetration liquid test procedure is document No? /Quy trình kiểm tra chất lỏng thẩm thấu là tài liệu số?","a":["P6/QA/19","P6/QA/22","P6/QA/20","P6/QA/21 II. NHÂN SỰ"],"c":1,"e":"Quy định bắt buộc trong ASME Section V Article 6 và quy trình Vietsovpetro nhằm đảm bảo tính năng hóa - lý của chất thấm ổn định nhất."},{"q":"According to procedure P6/QA/22, who are authorized to perform the test? /Theo qui trình kiểm tra chất lỏng \nthẩm thấu P6/QA/22, những cá nhân nào được phép thực hiện việc kiểm tra?","a":["Only individuals who are tested according to the standard SNT-TC-1A level II or level III/ chỉ những cá nhân sự được sát hạch theo tiêu chuẩn SNT-TC-1A cấp II hoặc cấp III","Technicians are tested according to SNT-TC-1A/ các kỹ thuật viên được sát hạch theo SNT-TC-1A","Technicians who are tested under SNT-TC-1A level I are allowed to inspect but reporting is done only by level II personnel or higher/ các kỹ thuật viên được sát hạch theo SNT-TC-1A cấp I được phép kiểm tra nhưng việc thực hiện báo cáo chỉ do nhân viên cấp II trở lên","Both a and c/ cả a và c"],"c":3,"e":"Theo ASNT SNT-TC-1A, Level I chỉ được làm các bước thực hành cơ bản (phun, lau, bấm giờ) dưới sự giám sát của Level II/III."},{"q":"Theo qui trình kiểm tra chất lỏng thẩm thấu P6/QA/22, sau khi tiến hành kiểm tra bằng phương pháp thẩm thấu \nthì người đưa ra đánh giá và hoàn thành báo cáo cần phải là:","a":["Kỹ thuật viên có chứng chỉ PCN PT","Kỹ thuật viên có chứng chỉ SNT-TC-1A PT level I hoặc level II","Kỹ thuật viên có chứng chỉ SNT-TC-1A PT level II hoặc level III","Tât cả đều đúng"],"c":2,"e":"Hồ sơ nghiệm thu công trình biển mang tính pháp lý cao, vượt quá thẩm quyền và trách nhiệm của nhân sự Level I."},{"q":"Kỹ thuật viên có chứng chỉ SNT-TC-1A PT level 1 được phép:","a":["Thực hiện công việc kiểm tra thẩm thấu dưới sự giám sát của kỹ thuật viên SNT-TC-1A PT level II","Thực hiện công việc đánh giá kết quả kiểm tra dưới sự giám sát của nhân viên SNT-TC-1A PT level III","Thực hiện công việc kiểm tra và đánh giá kết quả kiểm tra dưới sự giám sát của nhân viên cấp II trở lên","Tất cả đáp án trên đều sai"],"c":0,"e":"Việc giải đoán chỉ thị và đưa ra kết luận Đạt (ACC)/Không đạt (REJ) đòi hỏi chuyên môn phân tích dựa theo Code, bắt buộc từ Level II trở lên."},{"q":"Theo quy trình P6/QA/22 , nhân sự nào dưới đây phù hợp để thực hiện kiểm tra thẩm thấu mối hàn:","a":["CSWIP PT cấp 2 trong thời gian chờ gia hạn chứng chỉ","SNT-TC-1A PT cấp 2 chứng chỉ hết hạn và chưa làm bài thi gia hạn chứng chỉ","ISO 9712 PT cấp 2 chứng chỉ hết hạn trong vòng 03 ngày","SNT-TC-1A PT cấp 2 chứng chỉ còn hiệu lực III. VẬT TƯ"],"c":3,"e":"Chứng chỉ hết hạn đồng nghĩa với việc kết quả kiểm tra vô giá trị về mặt pháp lý đối với các đơn vị Đăng kiểm."},{"q":"Theo quy trình P6/QA/22, Vật tư kiểm tra thẩm thấu phù hợp / According to procedure P6/QA/22, which of the \nfollowing statement is TRUE about set of PT materials?","a":["Đồng nhất từ một nhà sản xuất / From unique manufacturer","Dùng kết hợp nhiều nhà sản xuất / Mixing from other manufacturers","Có thể sử dụng kết hợp vật tư tương đương của nhiều nhà sản xuất khác nhau / It is permitted to mixing equipvalent materials from other manufacturers","Cả a và c / Both a and c are correct"],"c":0,"e":"Các hóa chất cùng một bộ được thiết kế tương thích hóa học. Trộn lẫn khác hãng dễ gây phản ứng trung hòa, hỏng màng bột hiện hoặc mất màu thuốc."},{"q":"Khi đang tiến hành kiểm tra thẩm thấu, bạn không mang theo đủ chất hiện được quy định theo quy trình trên, \nphương án tối ưu nào được sử dụng?","a":["Tiếp tục tiến hành kiểm tra mà không cần sử dụng chất hiện khi dễ dàng phát hiện khuyết tật bằng mắt thường","Tiếp tục kiểm tra bằng cách sử dụng một chất hiện khác loại có mang theo, nếu được sự đồng ý của giám sát.","Chỉ tiếp tục tiến hành kiểm tra khi được bổ sung chất hiện cùng loại","Không đủ thông tin"],"c":2,"e":"Đảm bảo độ nhạy kiểm tra luôn đồng đều và chính xác tương tự như khi phê duyệt quy trình hệ thống."},{"q":"Khi chuẩn bị vật tư để tiến hành kiểm tra thẩm thấu, bộ vật tư PT nào sau đây phù hợp?","a":["SKL-SP1 + MCC-1010 + SKC-S2","MCP-2010 + MCC-1010 + MCD-3010","MCP-2010 + 9PR-50C + 9D-4A","Tất cả các bộ trên đều phù hợp"],"c":3,"e":"Đây là bộ ba hóa chất tiêu chuẩn được chỉ định cụ thể và phê duyệt trong quy trình quản lý chất lượng Vietsovpetro."},{"q":"Kiểm tra ngày sản xuất, hạn sử dụng của chai thuốc thẩm thấu MCP-2010, ta thấy có dãy ký tự 230107/1A. Nó \ncó nghĩa là :","a":["Ngày sản xuất 07/01/2023","Ngày hết hạn 07/01/2023","Ngày sản xuất 01/07/2023","Ngày hết hạn 01/07/2023"],"c":0,"e":"Dùng để kiểm soát thời hạn sử dụng và đảm bảo tính truy xuất nguồn gốc chất lượng vật tư khi có sự cố xảy ra."},{"q":"Kiểm tra ngày sản xuất, hạn sử dụng của chai thuốc thẩm thấu MCP-2010, ta thấy có dãy ký tự 240512/1A. Nó \ncó nghĩa là :","a":["Ngày sản xuất 05/12/2024","Ngày hết hạn 12/05/2027","Ngày sản xuất 05/12/2024","Ngày hết hạn 05/12/2027 IV. AN TOÀN"],"c":1,"e":"Đây là quy ước dập dưới đáy bình của các hãng (như Nabakem) giúp kỹ thuật viên loại bỏ các bình xịt aerosol bị tụt áp hoặc quá hạn (thường từ 3-5 năm)."},{"q":"Theo quy định, các bình vật tư PT sau khi sử dụng hết được xử lý như thế nào?","a":["Thu gom chung vào thùng rác thải sinh hoạt","Thu gom và xử lý như rác thải độc hại","Thu gom vào thùng chứa riêng biệt vì trong bình còn áp suất","Tất cả các ý trên"],"c":1,"e":"Bình xịt chứa khí nén áp lực và dung môi hữu cơ, ném vào lửa sẽ gây nổ mạnh và phát tán khí độc hại."},{"q":"While conducting a penetrant testing, all of the following heath precations should be applied except: / Trong khi \ntiến hành kiểm tra thấm, tất cả các chú ý cảnh báo về sức khoẻ sau đây nên được áp dụng, ngoại trừ:","a":["Keeping the work area clean / Giữ gìn khu vực làm việc sạch sẽ","Washing any penetrant from skin with soap and water as soon as possible / Rửa sạch bất kỳ chất thấm nào bám vào da thịt bằng xà phòng (xà bông) và nước càng sớm càng tốt","Keeping penetrant off clothes / Giữ gìn không để chất thấm bám vào quần áo","Washing any excess penetrant from skin using gasoline / Rửa sạch bất kỳ chất thấm dư nào bám vào da thịt bằng xăng dầu V. MÁY ĐO ÁNH SÁNG"],"c":3,"e":"Xăng làm hòa tan lớp màng mỡ bảo vệ da, khiến các hợp chất màu azo độc hại của chất thấm dễ hấp thụ thẳng vào cơ thể."},{"q":"Calibrate the light intensity meter, according to the currently applicable test guidelines./ Hiệu chuẩn máy đo \ncường độ ánh sáng, theo quy trình hướng dẫn kiểm tra hiện đang áp dụng.","a":["03 months or immediately after being repaired/ 03 tháng hoặc ngay sau khi được sửa chữa.","06 months or immediately after being repaired/ 06 tháng hoặc ngay sau khi được sửa chữa.","1 year or immediately after being repaired/ 1 năm hoặc ngay sau khi được sửa chữa.","90 days or immediately after being repaired/ 90 ngày hoặc ngay sau khi được sửa chữa."],"c":2,"e":"Các linh kiện/cảm biến quang điện bị lão hóa theo thời gian, cần hiệu chuẩn định kỳ để đảm bảo độ chính xác khi đo cường độ ánh sáng thực tế."},{"q":"Máy đo ánh sáng sau khi được hiệu chuẩn dán tem, do chưa dùng tới đem lưu kho. Sau 6 tháng nhận thiết bị ra \nkhỏi kho để sử dụng, việc cần làm là:","a":["Kiểm tra thiết bị. Thiết bị còn hoạt động liền có thể đưa vào sử dụng.","Kiểm tra thiết bị. Thiết bị còn hoạt động, cần được hiệu chuẩn ngay sau đó trước khi đưa vào sử dụng","Kiểm tra thiết bị. Thiết bị không hoạt động. Tiến hành sửa chữa và đưa vào sử dụng","Kiểm tra thiết bị. Thiết bị không hoạt động. Tiến hành sửa chữa, sau sửa chữa hiệu chuẩn và đưa vào sử dụng e. Cả a và d đều đúng"],"c":1,"e":"Ngưỡng quy định trong ASME Section V Article 6 đảm bảo điều kiện chiếu sáng tối ưu cho mắt người nhận biết độ tương phản đỏ - trắng."},{"q":"Máy đo ánh sáng phù hợp để đưa vào sử dụng là:","a":["Hết hạn hiệu chuẩn trong vòng 7 ngày","Máy đang trong thời gian chờ hiệu chuẩn","Máy còn hạn hiệu chuẩn 7 ngày","Máy đã hiệu chuẩn và chờ cấp chứng chỉ hiệu chuẩn e. Cả c và d đều đúng VI. QUY TRÌNH KIỂM TRA"],"c":2,"e":"Tránh các sai số tiềm ẩn phát sinh do điều kiện môi trường lưu kho ảnh hưởng tới cảm biến đo quang học."},{"q":"Which one of the following conditions will affect the rate and the extent a liquid penetrant will enter cracks, \nfissures and other small openings? /Điều kiện nào sẽ ảnh hưởng đến tốc độ và phạm vi mà chất thấm lỏng đi \nvào các vết nứt, nẻ và các khe mở nhỏ khác?","a":["the hardness of the specimen being tested/ Độ cứng của mẫu vật kiểm tra","the surface condition of the specimen being tested/ Điều kiện, tình trạng của bề mặt mẫu vật kiểm tra","the color of the penetrant/ Màu sắc của chất thấm","the conductivity of the specimen being tested / Độ dẫn điện của mẫu kiểm tra"],"c":0,"e":"Vết nứt do ứng suất nhiệt có thể lan rộng từ mối hàn sang vùng ảnh hưởng nhiệt (HAZ) của kim loại cơ bản; làm sạch 25mm giúp không bỏ sót vùng biên này."},{"q":"Cutting oils may be effectively removed from parts before penetiant testing by / Các chất dầu dùng cho quá trình \ncắt có thể được loại bỏ một cách hiệu quả khỏi bộ phận trước khi kiểm tra thấm bằng:","a":["preheating / Nung nóng trước","vapor degreasing / Giảm mỡ bằng hơi","washing with water / Rửa sạch bằng nước","all of the above / Tất cả các cách trên"],"c":0,"e":"Các tạp chất này hoạt động như một lớp bít miệng khuyết tật, ngăn không cho chất thấm tiếp cận và đi vào bên trong."},{"q":"The first step in conducting a liquid penetrant  test on a surface that has been painted is to / Bước đầu tiên khi \ntiến hành kiểm tra thấm lỏng trên một bề mặt đã được sơn phủ là:","a":["carefully apply the penetrant over the surface / áp dụng cẩn thận chất thấm lên khắp bề mặt","completely remove the paint / Loại bỏ hoàn toàn lớp sơn phủ","throughly wash the surface with a detergent / Rửa kỹ lưỡng bề mặt này bằng một chất tẩy rửa","wire brush the surface to roughen the smooth surface coating of paint / Chải quét bằng sợi cứng bề mặt để tạo độ nhám (xù xì) cho lớp sơn trơn nhẵn của bề mặt"],"c":0,"e":"Đây là giải pháp tối ưu nhất để tẩy rửa hoàn toàn dầu mỡ cứng đầu đọng sâu trong lòng các khe nứt siêu mịn."},{"q":"The term used to define the period of time in which the test part is covered with penetrant is / Khái niệm dùng \nđể định nghĩa khoảng thời gian mà bộ phận kiểm tra được bao phủ chất thấm là:","a":["waiting time / Thời gian chờ","soak time (drain time) / Thời gian hút (ráo)","penetration time (dwell time) / Thời gian thấm","bleed in time /Thời gian chảy vào"],"c":0,"e":"Tác động cơ học mạnh từ chổi sắt dễ làm biến dạng dẻo bề mặt vật liệu mềm, miết phẳng và bít kín cơ học mép vết nứt."},{"q":"Which of the following surface conditions could have a detrimental effect on a liquid penetrant test? /Điều kiện \nbề mặt nào sau đây có thể có ảnh hưởng xấu đối với kiểm tra thấm lỏng?","a":["a wet surface / Một bề mặt ướt","a rough weld / Một mối hàn xù xì, thô ráp","in oily surface / Một bề mặt có chất dầu mỡ bám","all of the above / Tất cả các điều kiện trên"],"c":0,"e":"Màng sơn ngăn chất thấm tiếp xúc trực tiếp với bề mặt kim loại thực tế của kết cấu."},{"q":"Excess penetrant (all penetrant except that which is in discontinuities) is removed from the specimen: / Chất \nthấm dư (tất cả các chất thấm ngoại trừ chất thấm trong bất liên tục) được loại bỏ ra khỏi mẫu vật:","a":["after the required penetrant dwell time has elapsed / Sau khi thời gian thấm được yêu cầu đã kết thúc","before the application of an emulsifier if apostemulsifier penetrant is used / Trước khi áp dụng một chất tạo nhũ tương nếu chất thấm nhũ tương - sau được sử dụng","by means of a steam cleaner / Bằng một chất làm sạch dưới dạng tia phun","only when water washable penetrants are used / Chỉ khi các chất thấm rửa được bằng nước được sử dụng"],"c":0,"e":"Đảm bảo không để lại xơ vải bám trên vùng kiểm tra vì xơ vải sẽ bẫy giữ hóa chất, tạo ra chỉ thị giả hình sợi."},{"q":"Which of the following are commonly accepted methods tor applying penetrant? / Phương pháp nào sau đây \nthường được chấp nhận để áp dụng chất thấm?","a":["dipping the part in penetrant (dipping) / Nhúng bộ phận vào trong chất thấm (nhúng)","pouring the penetrant over the test specimen (flowing )/ Rót chất thấm lên khắp bề mặt mẫu kiểm tra (rót chảy)","spraying the penetrant on the test specimen (spraying)/ Phun xịt chất thấm lên mẫu kiểm tra (phun xịt)","all of the above/ Tất cả các cách trên"],"c":0,"e":"Các rãnh mài quá sâu sẽ bẫy giữ chất thấm dư trong bước lau rửa, tạo ra các đường chỉ thị giả màu đỏ chạy dọc vết mài."},{"q":"Which of the statements below best states the  danger of sandblasting (without subsequent chemical etching) for \ncleaning surfaces to be penetrant tested? / Tuyên bố nào dưới đây phát biểu một cách tốt nhất sự nguy hại của \nviệc phun / bắn cát (mà sau đó không dùng quá trình tẩm thực ăn mòn hoá chất) để làm sạch các bề mặt được \nkiểm tra thấm?","a":["The discontinuities may be peened over and closed / Các bất liên tục có thể bị mẻ ra và đóng lại","Oil contaminants might be sealed in the discontinuities / Các chất bẩn dầu có thể bị gắn chặt vào bất liên tục","The sand used in the sandblasting operation may be forced into the discontinuity / Cát sử dụng trong quá trình phun bắn này có thể chui vào bất liên tục","The sandblasting operation way introduce discontinuities / Các thao tác phun bắn cát có thể làm sinh ra các bất liên tục"],"c":0,"e":"Lực va đập mạnh của hạt cát/bi thép khi bắn cát áp lực cao làm biến dạng dẻo cục bộ và dập phẳng che khuất miệng vết nứt."},{"q":"When removing excess penetrant from the surface of a test specimen / Khi loại bỏ chất thấm dư ra khỏi bề mặt \ncủa một mẫu kiểm tra:","a":["the removal of excess penetrant must not remove the penetrant from discontinuities / Các quá trình loại bỏ chất thấm này phải không loại bỏ chất thấm ra khỏi các bất liên tục","sufficient excess penetrant must be removed to eliminate an interfering background / Các chất thấm dư thừa phải được loại bỏ để làm mất bề mặt nền gây nhiễu","the use of a solvent-dampened cloth is a common method of penetrant removal / Việc sử dụng một giẻ thấm ẩm chất dung môi là một phương pháp phổ biến để loại bỏ chất thấm","all of the above / Tất cả các đáp án trên"],"c":0,"e":"Tránh khoảng thời gian chờ quá lâu làm bụi bẩn công trường hoặc độ ẩm bám ngược trở lại mối hàn."},{"q":"Which of the following is not a generally accepted method for applying penetrants? / Phương pháp nào sau đây \nkhông phải là phương pháp thường được chấp nhận để áp dụng chất thẩm thấu?","a":["rubbing the penetrant over the surface / chà xát chất thẩm thấu trên bề mặt","brushing the penetrant on the part / chải chất thẩm thấu lên bộ phận","spraying the penetrant on the part / phun chất thẩm thấu lên bộ phận","dipping the part in the penetrant/ nhúng bộ phận trong chất thẩm thấu"],"c":0,"e":"Phù hợp nhất cho môi trường thi công ngoài khơi vì tính cơ động cao, tạo màng sương hóa chất phủ đều vào góc khuất mối hàn TKY."},{"q":"Before conducting a liquid penetrant test, it is  important to ensure that the surface of the part is free of / Trước khi \ntiến hành một kiểm tra thấm, điều quan trọng là đảm bảo rằng bề mặt của bộ phận không có:","a":["oil or grease / Dầu hoặc mỡ","acids or chromates / Các axít hoặc crômát","traces of water / Các vết nước","all of the above / Tất cả các loại trên"],"c":0,"e":"Cần thời gian để dung môi (cleaner) bốc hơi hoàn toàn khỏi lòng vết nứt. Nếu phun chất thấm vào ngay, dung môi còn lại sẽ hòa tan và đẩy chất thấm ra ngoài."},{"q":"In penetrant testing, the time period from developer application to inspection is often referred to as the: / Trong \nkiểm tra thấm, khoảng thời gian từ khi áp dụng chất hiện cho đến lúc kiểm tra (quan sát) thường được gọi là :","a":["Emulsification time / Thời gian nhũ tương hoá","Development time / Thời gian hiện","Dwell time / Thơì gian thấm","None of the above / Không phải các khái niệm trên"],"c":0,"e":"Đảm bảo tính liên tục của màng chất thấm, không bỏ sót vị trí và tránh phun quá dày gây lãng phí, khó lau rửa."},{"q":"When penetrant testing parts, the temperature of the parts should be near room temperature. If the part is at a \nlow temperature when tested, the: / Khi kiểm tra thấm các bộ phận, nhiệt độ của chúng nên gần với nhiệt độ \nphòng. Nếu các bộ phận có nhiệt độ thấp hơn khi kiểm tra, thì","a":["penetrant may become viscous / Chất thấm có thể trở nên nhớt nhầy","penetrant may evaporate very rapidly / Chất thấm có thể bốc hơi rất nhanh","color intensity of the penetrant will decrease / Cường độ màu của chất thấm sẽ giảm","penetrant will tend to adhere to the surface of the part / Chất thấm có xu hướng dính chặt vào bề mặt của bộ phận"],"c":0,"e":"Là khoảng thời gian tối thiểu cần thiết để lực mao dẫn phát huy tác dụng kéo chất lỏng xuống tận đáy vết nứt."},{"q":"Which of the following statements is false? / Tuyên bố nào sau đây là sai?","a":["sandblasting is not a recommended method for preparing for a penetrant test / Việc bắn cát không phải là một phương pháp được khuyên dùng để chuẩn bị cho một kiểm tra thấm","it is not necessary to remove a film of oil from a part prior to penetrant tesung because the penetrant is basically an oil / Không cần thiết phải loại bỏ một lớp dầu mỏng ra khỏi một bộ phận trước khi kiểm tra thấm bởi vì chất thấm về cơ bản là một chất dầu","vapor degreasing is a very good method for removing oil from the surface of the part to be penetrant tested / Giảm mỡ bằng hơi là một phương pháp rất tốt để loại bỏ dầu ra khỏi bề mặt của bộ phận được kiểm tra thấm","Trong hầu hết các trường hợp, việc làm sạch bề mặt được thực hiện bằng cách dùng chổi sắt hoặc sử dụng dung môi hữu cơ."],"c":0,"e":"Nếu chất thấm bị khô, tính lưu động của nó biến mất và bước hiện hình sau này sẽ không thể hút chất thấm lên được nữa."},{"q":"The purpose for using a developer on  a test specimen is to / Mục đích của việc dùng một chất hiện trên một mẫu \nvật là để:","a":["promote penetration of the penetrant / Thúc đẩy sự xuyên thấm của chất thấm","absorb emulsifier residues / Hấp thụ các dư lượng chất tạo nhũ tương","provide a blotting action to draw penetrant from discontinuities and to provide a constrast background / Hấp thụ chất thấm từ trong các bất liên tục và cung cấp một bề mặt tạo tương phản","help to dry the surface for better observation / Hỗ trợ làm khô bề mặt để quan sát tốt hơn"],"c":0,"e":"Mốc thời gian chuẩn hóa quy định trong quy trình Vietsovpetro ở nhiệt độ thường nhằm đảm bảo độ nhạy kiểm tra."},{"q":"A good penetrant must do all of the following  except / Một chất thấm tốt phải thực hiện được tất cả công \nviệc, ngoại trừ:","a":["be able to readily penetrate very fine openings / có khả năng thấm nhanh vào các khe hở rất nhỏ","evaporate very rapidly/ bay hơi nhanh","be able to remain in relatively coarse openings / có khả năng lưu lại trong các khe hở tương đối thô","be easily renitived from the surface after testing / dễ loại bỏ khỏi bề mặt sau khi kiểm tra"],"c":0,"e":"Vết nứt do mỏi (rất khít) cần dwell time lâu hơn rỗ khí; nhiệt độ môi trường thấp cần thời gian dài hơn do độ nhớt chất lỏng tăng."},{"q":"Which of the following could be a source of false indications on a test specimen? / Những điều nào sau đây có \nthể là nguyên nhân gây ra các chỉ thị sai trên mẫu thử nghiệm?","a":["residue from previous liquid penetrant testing / dư lượng chất thẩm thấu lỏng kiểm tra trước đó","machingin oil / dầu gia dụng","scale, rust and corrosion / quy mô, rỉ sét và ăn mòn","all of the above/ tất cả những điều trên"],"c":0,"e":"Khi chất thấm đã khô cứng trên bề mặt, ta không thể lau rửa cục bộ đạt chuẩn, bắt buộc phải tẩy sạch làm lại từ đầu."},{"q":"Cleaning of the part prior to penetrant inspection is / Làm sạch trước khi kiểm tra thấm:","a":["not required/ không được yêu cầu","important because if the part is not clean, the developer cannot be improper ly applied / quan trọng vì nếu không làm sạch đầy đủ thì chất hiện không áp vào được","essential because surface contaminants may prevent penetrant from gaining access to discontinuities / cần thiết vì bề mặt bị nhiễm bẩn có thể ngăn cản chất thấm đi vào bất liên tục","required to eliminate possibility of showing nonrelevant indications/ được yêu cầu để có thể chỉ ra được chỉ thị không phù hợp"],"c":0,"e":"Nếu không lau sạch bề mặt, khi phun chất hiện lên toàn bộ vùng kiểm tra sẽ đỏ rực (nhòe nền), làm mất độ tương phản."},{"q":"The time allowed for the penetrant to enter discontinuities that may be present is the: / Thời gian cho phép để \nchất thẩm thấu đi vào các điểm gián đoạn có thể có là:","a":["emulsification time/ thời gian nhũ hóa","application time / thời gian áp dụng","dwell tinte / thời gian thấm","drain time / thời gian bay hơi"],"c":0,"e":"Bước lau khô đầu tiên giúp thu gom phần lớn chất thấm dư bám trên bề mặt mà không làm ảnh hưởng đến thuốc đọng trong vết nứt."},{"q":"Which of the following foreign matter might block the openings of discontinuities if the surface of a test \nspecimen is not properly cleaned? /Những yếu tố bên ngoài nào có thể che phủ việc mở của bất liên tục nếu bề \nmặt của vật được kiểm tra không được làm sạch phù hợp?","a":["Paint/ Sơn","Scale/ vảy hàn","core and mold material / Vật liệu lõi và khuôn","All of above / Tất cả các điều trên"],"c":0,"e":"Quy tắc sống còn của PT; áp lực dung môi phun trực diện sẽ hòa tan và đẩy sạch lượng thuốc thấm kẹt trong khuyết tật, gây sót khuyết tật hoàn toàn."},{"q":"According to procedure
