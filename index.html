<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Thi Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .bg-card { background: #1e293b; border: 1px solid #334155; }
        .option-item { background: rgba(30, 41, 59, 0.5); border: 1px solid #475569; transition: 0.3s; }
        .option-item:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .option-item.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        .nav-box { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #475569; font-size: 13px; }
        .nav-box.active { background: #3b82f6; border-color: #3b82f6; font-weight: bold; }
        .nav-box { border-radius: 4px; }
        .nav-box.correct-nav { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .nav-box.wrong-nav { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .nav-box.skipped { border-color: #eab308; color: #eab308; background: rgba(234, 179, 8, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto">
    <!-- MÀN HÌNH CHÍNH -->
    <div id="home-screen">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center"><i class="fas fa-graduation-cap mr-2"></i>KHO KHÓA HỌC</h1>
        <div id="subject-list" class="grid gap-4 mb-8"></div>
        <button onclick="openEditor('')" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition shadow-lg">+ Thêm Môn Học Mới</button>
    </div>

    <!-- MÀN HÌNH TRÌNH BIÊN SOẠN -->
    <div id="editor-screen" class="hidden">
        <h2 id="editor-title" class="text-xl font-bold mb-4 text-blue-400">Thêm Môn Học Mới</h2>
        <div class="bg-card p-6 rounded-xl">
            <input type="text" id="subject-name" placeholder="Tên môn học (Ví dụ: Cơ khí AWS)" class="w-full bg-slate-800 border border-slate-600 p-3 rounded mb-4 focus:outline-none focus:border-blue-500 font-bold">
            <textarea id="json-input" rows="12" placeholder='Dán JSON câu hỏi vào đây...' class="w-full bg-slate-800 border border-slate-600 p-3 rounded text-sm font-mono focus:outline-none focus:border-blue-500"></textarea>
            <div class="flex gap-4 mt-6">
                <button onclick="saveSubject()" class="flex-1 bg-green-600 hover:bg-green-500 p-3 rounded-lg font-bold transition">Lưu lại</button>
                <button onclick="showScreen('home-screen')" class="flex-1 bg-slate-600 hover:bg-slate-500 p-3 rounded-lg font-bold transition">Hủy</button>
            </div>
        </div>
    </div>

    <!-- KHUNG NHẬP MẬT KHẨU (NỔI LÊN) -->
    <div id="password-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-card p-8 rounded-xl w-96 max-w-[90%] text-center border border-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.3)]">
            <i class="fas fa-lock text-4xl text-blue-400 mb-4"></i>
            <h3 class="text-xl font-bold mb-6">NHẬP MẬT KHẨU BẢO MẬT</h3>
            <input type="password" id="pass-input" placeholder="***" class="w-full bg-slate-800 border border-slate-600 p-3 rounded mb-6 text-center tracking-widest text-2xl font-bold focus:outline-none focus:border-blue-500">
            <div class="flex gap-3">
                <button onclick="closePassModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 p-3 rounded-lg font-bold transition">Hủy</button>
                <button onclick="verifyPass()" class="flex-1 bg-blue-600 hover:bg-blue-500 p-3 rounded-lg font-bold transition shadow-lg">Vào Học</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="hidden">
        <div class="mb-4 text-yellow-500 font-bold uppercase tracking-wider">Câu hỏi <span id="cur-idx-text">1</span> / <span id="total-idx-text">10</span></div>
        <div class="bg-card p-6 rounded-lg mb-6 border-l-4 border-blue-500">
            <div id="question-text" class="text-xl leading-relaxed"></div>
        </div>
        <div id="options-container" class="space-y-3 mb-8"></div>
        <div class="flex flex-wrap gap-2 justify-between border-t border-slate-700 pt-6">
            <div class="flex gap-2">
                <button onclick="prevQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">← Trước</button>
                <button onclick="showHint()" class="bg-yellow-600/20 text-yellow-500 border border-yellow-500/50 px-6 py-2 rounded text-sm font-medium hover:bg-yellow-600 hover:text-white transition">💡 Gợi ý</button>
            </div>
            <button onclick="checkAnswer()" class="bg-blue-600 px-10 py-2 rounded font-bold shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:bg-blue-500">Trả lời</button>
            <div class="flex gap-2">
                <button onclick="showScreen('home-screen')" class="bg-slate-700 px-4 py-2 rounded text-sm font-medium">Dừng</button>
                <button onclick="nextQuestion()" class="bg-slate-700 px-6 py-2 rounded text-sm font-medium hover:bg-slate-600">Tiếp →</button>
            </div>
        </div>
        <div id="hint-box" class="hidden mt-6 p-4 bg-blue-900/30 border border-blue-500/30 rounded-lg text-blue-200 italic text-sm"></div>
        <div class="mt-10">
            <div class="text-sm font-bold mb-4 uppercase text-slate-400">Danh sách câu</div>
            <div id="question-grid" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // DÁN LẠI KHỐI DỮ LIỆU CŨ CỦA BẠN VÀO THAY THẾ CHỮ { } NHÉ!
    const KHO_DU_LIEU = {"RT_Tia x":[{"q":"Tia X là gì?","a":["Là sóng âm có năng lượng cao","Là dạng sóng cơ học có bước sóng dài","Là sóng điện từ có bước sóng ngắn và năng lượng cao","Là ánh sáng nhìn thấy được bằng mắt thường"],"c":2,"e":"Tia X là sóng điện từ bước sóng cực ngắn (0,01 đến 10 nm)."},{"q":"Phát biểu nào sau đây đúng về khả năng xuyên thấu của tia X?","a":["Tia X không thể xuyên qua kim loại","Tia X chỉ truyền được qua không khí","Tia X có khả năng xuyên qua vật liệu không trong suốt","Tia X không ảnh hưởng đến sức khỏe con người"],"c":2,"e":"Tia X có khả năng đâm xuyên qua các vật thể mà ánh sáng thường không qua được."},{"q":"Điều gì quyết định chất lượng (độ xuyên thấu) của tia X?","a":["Dòng điện của ống","Thời gian chụp","Điện áp (kV)","Loại phim sử dụng"],"c":2,"e":"kV càng cao, bước sóng càng ngắn, khả năng xuyên thấu càng mạnh."},{"q":"Phát biểu nào đúng về hiệu ứng phát huỳnh quang của tia X?","a":["Tia X không gây huỳnh quang","Tia X chỉ làm huỳnh quang trong kim loại","Tia X có thể làm một số chất phát huỳnh quang","Tia X bị hấp thụ hoàn toàn bởi các tinh thể"],"c":2,"e":"Tia X làm phát quang một số muối kim loại như bạch kim cyanua bari."},{"q":"Cường độ tia X phụ thuộc vào yếu tố nào sau đây?","a":["Điện áp kV","Loại vật liệu","Cường độ dòng điện mA","Loại film"],"c":2,"e":"mA quyết định số lượng photon (cường độ) của chùm tia."},{"q":"Bia trong ống phát tia X thường được làm bằng vật liệu gì?","a":["Kẽm","Bạc","Tungsten","Nhôm"],"c":2,"e":"Tungsten có nhiệt độ nóng chảy rất cao, chịu được luồng electron bắn phá."},{"q":"Cửa sổ phát tia X thường làm bằng:","a":["Chì","Beryllium","Tungsten","Thép"],"c":1,"e":"Beryllium cho tia X đi qua với độ hấp thụ thấp nhất."},{"q":"Ảnh chụp bằng tia X có độ tương phản tốt hơn vì:","a":["Năng lượng cố định","Phổ vạch thu hẹp","Có thể tối ưu năng lượng theo vật liệu","Không phụ thuộc độ dày"],"c":2,"e":"Việc điều chỉnh kV giúp tối ưu độ tương phản cho từng loại vật liệu."},{"q":"Khi nhiệt độ sợi đốt tăng, điều gì xảy ra?","a":["Dòng điện giảm","Tia X yếu đi","Sự phát xạ nhiệt electron tăng","Không ảnh hưởng đến tia X"],"c":2,"e":"Sợi đốt nóng hơn giải phóng nhiều electron hơn để tạo tia X."},{"q":"Ống tia X hoạt động trong môi trường:","a":["Không khí","Khí SF6","Chân không","Khí nito"],"c":2,"e":"Cần môi trường chân không cao để electron không va chạm với phân tử khí."},{"q":"Máy CP300C có góc phát tối đa:","a":["60x40","180x20","360x40","90x90"],"c":2,"e":"Model CP300C là dòng máy phát tia bức xạ tròn (Panoramic) 360 độ."},{"q":"Tán xạ ngược (Back Scatter) là gì?","a":["Tán xạ từ vách bên vật","Tán xạ do tia bị hấp thụ","Tán xạ chiếu ngược từ phía sau phim","Tán xạ giữa các hạt electron"],"c":2,"e":"Tia X đập vào vật dụng phía sau phim và dội ngược lại làm mờ ảnh."},{"q":"Điều gì xảy ra nếu dòng điện ống quá cao?","a":["Tăng độ nét ảnh","Giảm nhiệt độ","Gây hư hỏng anode","Tăng thời gian chụp"],"c":2,"e":"mA quá cao tạo nhiệt lượng cực lớn làm nóng chảy bia Anode."},{"q":"Điều nào sau đây giúp tăng độ nét ảnh X-ray?","a":["Tăng mA","Dùng màn chì","Tăng điện áp","Giảm thời gian gian"],"c":1,"e":"Màn chì hấp thụ các tia tán xạ năng lượng thấp, làm ảnh rõ nét hơn."},{"q":"Trong ống tia X, khoảng 97% năng lượng chuyển thành:","a":["Tia gamma","Tia X","Nhiệt","Cơ năng"],"c":2,"e":"Chỉ khoảng 1-3% năng lượng tạo ra tia X, còn lại tỏa nhiệt."},{"q":"Hệ số chuyển đổi chiều dày tương đương của vật liệu dùng để:","a":["Tăng độ tương phản","Giảm tia tán xạ","Quy đổi chiều dày giữa vật liệu khác nhau","Chọn dòng điện phù hợp"],"c":2,"e":"Dùng để tính toán thời gian chụp khi thay đổi từ thép sang nhôm/đồng..."},{"q":"Tia X được tạo ra khi:","a":["Electron va vào cathode","Electron va vào anode","Tungsten nóng chảy","Điện áp tăng nhanh"],"c":1,"e":"Electron từ Cathode bắn phá bia Anode tạo ra bức xạ hãm."},{"q":"Tia X gây hại nếu:","a":["Tiếp xúc gần, lâu và cường độ cao","Tiếp xúc ngoài không khí","Dưới 100kV","Được lọc bởi màn chì"],"c":0,"e":"Liều lượng tích lũy gây tổn thương tế bào sống."},{"q":"So với tia gamma, phổ tia X có đặc điểm?","a":["Chỉ có 1 vài bước sóng","Có dải bước sóng liên tục","Có năng lượng phát xạ cố định","Chỉ phát ra năng lượng thấp"],"c":1,"e":"Tia X có phổ liên tục (Bremsstrahlung), tia Gamma có phổ vạch."},{"q":"Khi điện áp tăng thì điều gì xảy ra","a":["Năng lượng tia X giảm","Tia X trở nên mềm hơn","Tia X có khả năng xuyên thấu cao hơn","Tia X bị triệt tiêu"],"c":2,"e":"kV tăng làm tăng năng lượng photon tia X."},{"q":"Phát biểu nào đúng khi so sánh tia X và tia gamma?","a":["Tia X luôn có năng lượng cao hơn","Tia gamma có phổ liên tục","Tia X có thể điều chỉnh năng lượng","Tia gamma phát ra từ cathode"],"c":2,"e":"Tia X chỉnh được bằng cách thay đổi kV trên máy, tia Gamma cố định theo nguồn."},{"q":"Năng lượng tia X phát ra tỉ lệ với:","a":["Thời gian chụp","Diện tích film","Điện áp","Loại film sử dụng"],"c":2,"e":"Năng lượng photon tỷ lệ thuận với điện áp kV."},{"q":"CP300C có dải điện áp hoạt động:","a":["30–300kV","10–300kV","20–300kV","60–300kV"],"c":0,"e":"Thông số tiêu chuẩn của dòng máy CP300C."},{"q":"Điều gì không nên thực hiện khi chụp ở mức điện áp dưới 100kV?","a":["Sử dụng màn chì","Tăng thời gian chụp","Tăng dòng điện","Giảm khoảng cách"],"c":0,"e":"Ở kV thấp, tia X yếu, màn chì sẽ hấp thụ sạch cả tia hữu ích."},{"q":"Tán xạ bên trong vật (internal scatter) xảy ra khi:","a":["Do chồng hình","Do lớp chì phản xạ","Do chính cấu trúc của vật kiểm","Do tia gamma gây ra"],"c":2,"e":"Do sự tương tác của tia X với các nguyên tử bên trong vật kiểm."},{"q":"Yêu cầu khi làm việc với máy X-ray?","a":["Không cần đào tạo","Chỉ cần PPE","Phải có chứng chỉ RT và ATBX","Chỉ cần giám sát an toàn"],"c":2,"e":"Bắt buộc có chuyên môn về Chụp ảnh phóng xạ và An toàn bức xạ."},{"q":"Máy X-ray không nên dùng nguồn điện quá:","a":["220V","240V","264V","280V"],"c":2,"e":"Giới hạn điện áp nguồn cấp để bảo vệ mạch điện tử của máy."},{"q":"Màn chắn đồng phía sau cửa sổ tia X có tác dụng:","a":["Tăng điện áp","Tạo dòng electron","Lọc tia X năng lượng thấp","Phát sáng khi gặp tia"],"c":2,"e":"Đồng (Cu) đóng vai trò bộ lọc (Filter) làm cứng chùm tia."},{"q":"Công suất cực đại của máy X-ray CP300C là bao nhiêu?","a":["850 watt","600 watt","900 watt","750 watt"],"c":2,"e":"Công suất tối đa ghi trong catalogue thiết bị."},{"q":"Máy CP300C được sử dụng cho kỹ thuật chụp ảnh nào là tối ưu nhất?","a":["SWSI","DWSI","Panoramic","DWDI"],"c":2,"e":"C cho 'Circular' - chuyên dùng để chụp toàn cảnh mối hàn chu vi ống."},{"q":"Hệ thống máy X-ray CP300DM có dải điện áp hoạt động là bao nhiêu?","a":["30 đến 300 kV","20 đến 300 kV","10 đến 250 kV","60 đến 300 kV"],"c":1,"e":"Dòng DM có dải kV rộng hơn, khởi đầu từ 20kV."},{"q":"Tín hiệu lỗi 'E10: T0 INV MAX' có nghĩa là gì?","a":["Áp suất khí SF6 quá cao","Nhiệt độ anode quá cao","Nhiệt độ ống phóng quá cao","Thiết bị phát không hoạt động"],"c":2,"e":"Lỗi bảo vệ quá nhiệt của ống phóng (Tube Temperature)."},{"q":"Loại màn cửa sổ nào được sử dụng khi chụp ở điện áp dưới 50kV?","a":["Màn chi chì (Pb)","Màn nhôm (Al)","Màn Beryllium (Be)","Màn kẽm (Zn)"],"c":2,"e":"Be là vật liệu lọc ít nhất cho tia X năng lượng cực thấp."},{"q":"Khi sử dụng CP300DM, nếu thiết lập điện áp trên 50kV ở chế độ cửa sổ Beryllium, hệ thống sẽ:","a":["Tự động chụp ảnh","Hiển thị cảnh báo không chụp được","Tăng dòng điện mA","Giảm điện áp về 50kV"],"c":1,"e":"Chế độ Be chỉ dùng cho kV thấp để bảo vệ an toàn."},{"q":"Dòng điện tối đa của CP300C khi hoạt động ở điện áp tối đa là:","a":["3.5 mA","3.0 mA","2.5 mA","6.0 mA"],"c":2,"e":"Ở 300kV, dòng tối đa được giới hạn để không vượt quá công suất 750W-900W."},{"q":"Dòng điện hoạt động của CP300DM dao động trong khoảng:","a":["0.5 đến 10 mA","0.5 đến 6.0 mA","1 đến 5 mA","0.3 đến 6.5 mA"],"c":1,"e":"Thông số vận hành của dòng máy DM."},{"q":"Phím nào dùng để dừng hoạt động máy X-ray khẩn cấp?","a":["START","STOP","OK","√"],"c":1,"e":"Nút STOP trên bàn điều khiển có chức năng ngắt tia ngay lập tức."},{"q":"CP300DM sử dụng các kỹ SP khi áp dụng máy phát tia X nên áp dụng kỹ thuật hỗ trợ thêm như nào","a":["Sử dụng thêm các lá chì sau phim để chống tán xạ ngược","Che chắn tấm chì khi sấy máy","Kết nối các dây tiếp địa khi sử dụng máy","Tất cả đều đúng"],"c":3,"e":"Đây là các biện pháp an toàn và kỹ thuật bắt buộc."},{"q":"Loại tán xạ nào sau đây có thể được kiểm soát:","a":["Tán xạ ngược","Tán xạ bên trong vật kiểm","Cả a và b đều có thể kiểm soát","Cả a và b đều không thể kiểm soát"],"c":0,"e":"Tán xạ ngược kiểm soát được bằng cách đặt tấm chì sau phim."},{"q":"Điều nào sau đây bị cấm khi dùng thiết bị phát tia X","a":["Cấp nguồn điện 380V","Để đầu quạt thông gió sát tường bê tông","Chụp mối hàn ở mức công suất tối đa liên tục","Tất cả đều bị cấm"],"c":3,"e":"Vi phạm các nguyên tắc vận hành an toàn và bảo vệ thiết bị."},{"q":"Nguyên tắc an toàn khi sử dụng máy X-ray:","a":["Kiểm tra đèn cảnh báo và xoay chìa khóa về “0“ sau khi chụp","Kiểm tra phim sau khi chụp","Đo nhiệt độ bàn điều khiển sau khi chụp","Kiểm tra hạn hiệu chuẩn máy đo liều sau khi chụp"],"c":0,"e":"Đảm bảo máy đã ngắt tia hoàn toàn sau ca làm việc."},{"q":"Khi nhập thông số FFD để tính toán thời gian chụp, nhân sự vận hành cần đo từ:","a":["Từ điểm phát ống phóng đến phim chụp","Từ vỏ ngoài thân ống phóng đến phim","Từ điểm phát ống phóng đến vật chụp","Tất cả đều sai"],"c":0,"e":"FFD = Focus to Film Distance."},{"q":"Khi so sánh phim chụp bằng bức xạ năng lượng thấp với chụp bằng năng lượng cao thì:","a":["Năng lượng thấp tạo ra phim có độ tương phản tốt hơn","Bức xạ năng lượng thấp khó hấp thụ hơn năng lượng cao","Bức xạ năng lượng thấp thể hiện rõ hơn khi có sự thay đổi về chiều dày","Tất cả đều sai"],"c":0,"e":"Tia X 'mềm' nhạy cảm hơn với sự thay đổi độ dày nhỏ."},{"q":"Trong ống tia X, nguồn electron được tạo ra từ:","a":["Nguồn điện áp vào","Cathode được đốt nóng","Phát ra từ bia tungsten","Anode được đốt nóng"],"c":1,"e":"Cathode (sợi đốt) giải phóng electron tự do qua hiệu ứng phát xạ nhiệt."},{"q":"Chức năng chính của bộ lọc ở cửa sổ phát tia là:","a":["Che chắn suất liều","Lọc bớt các tia X năng lượng thấp","Lọc bớt các tia X năng lượng cao","Lọc bớt các tia gamma phát ra ngoài ý muốn"],"c":1,"e":"Loại bỏ tia 'mềm' không có tác dụng xuyên thấu nhưng làm mờ ảnh."},{"q":"Khi tiến hành chụp mẫu ống đồng có chiều dày 1.5mm bằng mức điện áp 220kV, cần cài đặt thông số như nào:","a":["Chọn vật liệu “Cu“ và đặt chiều dày 1.5mm","Chọn vật liệu “Al“ và đặt chiều dày 0.18mm","Chọn vật liệu “Fe“ và đặt chiều dày 1.5mm","Chọn vật liệu “Fe“ và đặt chiều dày 2.1mm"],"c":3,"e":"Sử dụng hệ số quy đổi: Đồng 1.5mm tương đương Thép 2.1mm ở 220kV."},{"q":"Khi tiến hành chụp mẫu ống đồng có chiều dày 2.0mm bằng mức điện áp 100kV, cần cài đặt thông số như nào:","a":["Chọn vật liệu “Cu“ và đặt chiều dày 2.0mm","Chọn vật liệu “Al“ và đặt chiều dày 3.0mm","Chọn vật liệu “Fe“ và đặt chiều dày 2.0mm","Chọn vật liệu “Fe“ và đặt chiều dày 3.0mm"],"c":3,"e":"Hệ số quy đổi vật liệu từ Đồng sang Thép ở mức 100kV là 1.5."},{"q":"Theo quy định của VSP, máy X-ray CP300C được sử dụng trong dải điện áp và chiều dày lớn nhất bao nhiêu:","a":["Chọn dải điện áp 160-240kV với chiều dày 40mm","Chọn dải điện áp 30-300kV với chiều dày 52mm","Chọn dải điện áp 30-300kV với chiều dày 40mm","Chọn dải điện áp 160-240kV với chiều dày 52mm"],"c":0,"e":"Giới hạn làm việc an toàn và hiệu quả cho CP300C tại VSP."},{"q":"Theo quy định của VSP, máy X-ray CP300DM được sử dụng trong dải điện áp và chiều dày lớn nhất bao nhiêu:","a":["Chọn dải điện áp 160-240kV với chiều dày 55mm","Chọn dải điện áp 20-300kV với chiều dày 66mm","Chọn dải điện áp 20-300kV với chiều dày 55mm","Chọn dải điện áp 160-240kV với chiều dày 66mm"],"c":0,"e":"Giới hạn làm việc cho CP300DM tại VSP."},{"q":"Theo tài liệu kỹ thuật, kích thước điểm hội tụ và công suất cực đại của dòng máy phát tia X CP300C là:","a":["5.5 x 0.5mm và 750W","4.5 x 0.5mm và 900W","3mm và 750W","3mm và 900W"],"c":0,"e":"Thông số tiêu điểm (Focal spot) của CP300C."},{"q":"Theo tài liệu kỹ thuật, kích thước điểm hội tụ và công suất cực đại của dòng máy phát tia X CP300DM là:","a":["5.5 x 0.5mm và 750W","4.5 x 0.5mm và 900W","3mm và 750W","3mm và 900W"],"c":3,"e":"Thông số tiêu điểm (Focal spot) của CP300DM."}],"NDT_UT":[{"q":"Quy trình siêu âm P6/QA/19 được áp dụng cho dạng mối hàn chế tạo từ loại vật liệu nào?","a":["Thép carbon","Inox","Thép không gỉ và thép carbon","Duplex"],"c":0,"e":"Theo phạm vi áp dụng, quy trình này chủ yếu được thiết kế để kiểm tra siêu âm cho các cấu kiện và đường ống chế tạo từ vật liệu thép Carbon (Carbon Steel). Các vật liệu như Inox hay Duplex yêu cầu quy trình siêu âm riêng (sóng dọc, phased array) do cấu trúc hạt thô gây nhiễu sóng."},{"q":"Theo Quy trình siêu âm P6/QA/19, kết quả kiểm tra sẽ thỏa mãn theo yêu cầu của tiêu chuẩn nào?","a":["AWS D1.1, API 1104","ASME B31.8, ASME B31.3","Tiêu chuẩn được yêu cầu bởi khách hàng","Tất cả đều đúng"],"c":3,"e":"Quy trình UT (P6/QA/19) được xây dựng để đáp ứng đa dạng các bộ tiêu chuẩn quốc tế phổ biến trong ngành Dầu khí như AWS D1.1 (kết cấu), ASME B31.3/B31.8 (đường ống), API 1104, hoặc linh hoạt theo Đặc tả kỹ thuật (Spec) riêng của khách hàng."},{"q":"Quy trình siêu âm P6/QA/19 được áp dụng cho mối hàn có chiều dày?","a":["Từ 8mm trở lên","Từ 6mm trở lên","Theo yêu cầu của tiêu chuẩn hoặc khách hàng","Bất kỳ chiều dày nào"],"c":2,"e":"Mặc dù kiểm tra siêu âm (UT) thông thường áp dụng hiệu quả nhất cho chiều dày từ 8mm trở lên (hoặc 5/16 inch theo AWS D1.1), nhưng quy trình thực tế luôn ưu tiên tính linh hoạt, áp dụng theo đúng yêu cầu cụ thể của từng mã tiêu chuẩn dự án hoặc chỉ định từ khách hàng."},{"q":"Quy trình siêu âm P6/QA/19 được áp dụng cho loại mối hàn?","a":["Mối hàn nối tấm và ống","Mối hàn TYK trên tấm","Mối hàn node","Tất cả các cấu hình trên"],"c":3,"e":"Quy trình bao phủ toàn diện các cấu hình mối hàn trên giàn khoan và đường ống: từ nối tấm (Plate), ống đối đầu (Pipe/Tubular), cho đến các nút giao cắt (node) ống T, Y, K với cấu hình hình học phức tạp."},{"q":"Theo Quy trình P6/QA/19, việc kiểm tra và đánh giá kết quả siêu âm phải được thực hiện bởi kỹ thuật viên có chứng chỉ:","a":["Chứng chỉ siêu âm ASNT level II hoặc level III","Chứng chỉ siêu âm CSWIP/PCN level II hoặc level III","Chứng chỉ siêu âm level II hoặc III theo tiêu chuẩn quốc gia được công nhận","Một trong các chứng chỉ trên đều được chấp nhận"],"c":3,"e":"Nhân sự NDT (UT) phải được chứng nhận theo các hệ thống chứng chỉ năng lực quốc tế uy tín như ASNT SNT-TC-1A (Mỹ), PCN (Anh)/CSWIP, hoặc một hệ thống theo tiêu chuẩn ISO 9712 được quốc gia sở tại công nhận."},{"q":"Theo Quy trình P6/QA/19, nhân sự thực hiện kiểm tra và đánh giá kết quả siêu âm cần có chứng chỉ nào sau đây?","a":["Tối thiểu có chứng chỉ ASNT UT cấp 3","Chứng chỉ ASNT UT cấp 1","Chứng chỉ CSWIP/PCN UT cấp 2 hoặc cấp 3","Tất cả các điều trên"],"c":2,"e":"Để trực tiếp thực hiện kiểm tra (Scan), hiệu chuẩn máy và đánh giá kết quả độc lập, kỹ thuật viên bắt buộc tối thiểu phải đạt Chứng chỉ Bậc 2 (Level II) của hệ thống PCN/CSWIP. Kỹ thuật viên Bậc 1 (Level 1) chỉ được phép thao tác dưới sự giám sát của Bậc 2/3."},{"q":"Theo Quy trình P6/QA/19, nhân sự thực hiện kiểm tra và đánh giá kết quả siêu âm cần có chứng chỉ nào sau đây?","a":["Chứng chỉ PAUT cấp 2","Chứng chỉ SNT-TC-1A UT cấp 2 hoặc cấp 3","Chứng chỉ CSWIP/PCN UT cấp 1","Tất cả các điều trên"],"c":1,"e":"Theo thông lệ của Vietsovpetro (hoặc các nhà thầu EPC), người đánh giá kết quả phải có năng lực tương đương Level II hoặc Level III theo chương trình thực hành thực tiễn của nhà tuyển dụng dựa trên ASNT SNT-TC-1A."},{"q":"Theo Quy trình P6/QA/19, máy siêu âm sử dụng là loại máy kiểu xung phản hồi, có khả năng hiển thị kiểu:","a":["A-scan","B-scan","C-scan","D-scan"],"c":0,"e":"Thiết bị siêu âm truyền thống dùng trong NDT thủ công (Manual UT) là loại xung phản hồi (Pulse-Echo). Tín hiệu được hiển thị trên màn hình dưới dạng đồ thị A-scan, thể hiện biên độ (chiều cao xung) theo thời gian truyền âm (khoảng cách)."},{"q":"Theo Quy trình P6/QA/19, máy siêu âm sử dụng là loại máy kiểu xung phản hồi, có khả năng làm việc trong khoảng tần số:","a":["Từ 1MHz đến 5MHz.","Từ 2MHz đến 6MHz.","Từ 1MHz đến 6MHz.","Từ 2MHz đến 10MHz"],"c":2,"e":"Dải tần số tiêu chuẩn và tối ưu nhất cho thiết bị siêu âm kiểm tra khuyết tật mối hàn thép là từ 1 MHz đến 6 MHz. Tần số thấp giúp sóng đâm xuyên tốt qua vật liệu dày, trong khi tần số cao giúp tăng độ phân giải để phát hiện lỗi nhỏ."},{"q":"Theo Quy trình P6/QA/19, máy siêu âm sử dụng là loại máy kiểu xung phản hồi, có khả năng độ lợi điều chỉnh được và có bước nhảy không vượt quá:","a":["1.0 dB","2.0 dB","4.0 dB","6.0 dB"],"c":1,"e":"Để đánh giá chính xác kích thước khuyết tật (đặc biệt khi dùng kỹ thuật 6dB drop hoặc 20dB drop), thiết bị phải có khả năng điều chỉnh độ khuếch đại (Gain) với bước nhảy tinh chỉnh tối đa không vượt quá 2.0 dB."},{"q":"Máy siêu âm USM 35X đang được sử dụng tại VSP có bước điều chỉnh dB nhỏ nhất:","a":["0.2 dB","0.5 dB","1.5 dB","2.0 dB"],"c":0,"e":"Dòng máy dò khuyết tật siêu âm Krautkramer USM 35X (GE) rất phổ biến trong ngành, hỗ trợ các bước tinh chỉnh Gain rất nhỏ để định lượng lỗi chính xác. Các bước nhảy có sẵn là: 0.5 dB, 1 dB, 2 dB, 6 dB... Mức nhỏ nhất là 0.5 dB (mặc dù thực tế sử dụng có thể tinh chỉnh mịn 0.2dB ở một số phiên bản nâng cấp, nhưng 0.2dB là đáp án kiểm tra phần cứng)."},{"q":"Theo Quy trình P6/QA/19, máy siêu âm sử dụng là loại máy kiểu xung phản hồi, có khả năng nào sau đây?","a":["Hiển thị Quét A-scan","Làm việc trong khoảng tần số 1MHz đến 6MHz","Độ lợi điều chỉnh được và có bước nhảy không vượt quá 2dB","Tất cả các điều trên"],"c":3,"e":"Một máy UT đạt tiêu chuẩn thi công dự án phải đáp ứng đồng thời 3 yếu tố phần cứng: Màn hình hiển thị A-scan rõ nét, băng thông tần số linh hoạt 1-6MHz, và độ khuếch đại (Gain) phải tinh chỉnh được với bước nhảy <= 2dB."},{"q":"Theo Quy trình siêu âm P6/QA/19, đầu dò 0 độ nào được phép sử dụng?","a":["Đầu dò tần số 1-6MHz tinh thể đơn hoặc kép","Đầu dò tần số 2-5MHz tinh thể đơn hoặc kép","Đầu dò tinh thể đơn","Đầu dò tinh thể kép"],"c":1,"e":"Đối với kiểm tra kim loại cơ bản (Base metal scan) hoặc đo chiều dày bằng đầu dò thẳng (0 độ), dải tần 2-5 MHz (tinh thể đơn hoặc kép/TR probe) là dải tiêu chuẩn mang lại sự cân bằng hoàn hảo giữa độ đâm xuyên và độ phân giải bề mặt."},{"q":"Theo Quy trình siêu âm P6/QA/19, yêu cầu tiết diện biến tử của đầu dò 0 độ như thế nào?","a":["Không lớn hơn 1/2 in2 (323mm2)","Không nhỏ hơn 1 in2 (645mm2)","Không nhỏ hơn 1/2 in2 (323mm2) và không lớn hơn 1 in2 (645mm2)","Tất cả đều đúng"],"c":2,"e":"Theo quy định của AWS D1.1, diện tích biến tử (active area) của đầu dò thẳng không được quá nhỏ (làm giảm năng lượng truyền vào vật) và không được quá lớn (khó tiếp xúc đồng đều trên bề mặt cong). Kích thước tiêu chuẩn thường là từ 1/2 in² đến 1 in²."},{"q":"Theo Quy trình P6/QA/19, đầu dò 0 độ biến tử tròn sử dụng khi thực hiện việc kiểm tra siêu âm có bán kính nhỏ nhất tương đương:","a":["10 mm","15 mm","20 mm","25 mm"],"c":0,"e":"Với đầu dò biến tử tròn, kích thước được quy định chặt chẽ để đảm bảo vùng cận trường (Near field) và độ loang chùm tia (Beam spread) ở mức cho phép. Bán kính tối thiểu thường tương đương khoảng 10mm (đường kính ~20mm)."},{"q":"Theo Quy trình P6/QA/19, đầu dò 0 độ (biến tử tròn) sử dụng khi thực hiện việc kiểm tra siêu âm có đường kính lớn nhất được cho phép:","a":["14 mm","15 mm","28 mm","30 mm"],"c":2,"e":"Để đảm bảo đầu dò có độ bám dính (coupling) tốt trên các bề mặt vật liệu thực tế không bao giờ phẳng hoàn toàn, đường kính đầu dò 0 độ biến tử tròn thường bị giới hạn tối đa khoảng 28mm (~1.1 inch)."},{"q":"Theo Quy trình siêu âm P6/QA/19, đầu dò góc nào được sử dụng?","a":["Các đầu dò góc 45 độ, 60 độ, 70 độ có tần số 2-5MHz","Các đầu dò góc 45 độ, 60 độ, 70 độ có tần số 1-6MHz","Các đầu dò góc 45 độ, 60 độ, 70 độ tinh thể đơn sóng dọc","Các đầu dò góc 45 độ, 60 độ, 70 độ tinh thể kép sóng trượt"],"c":0,"e":"Bộ ba góc kinh điển 45°, 60°, 70° là bắt buộc để kiểm tra toàn diện thể tích mối hàn, từ vùng nắp, thân đến chân mối hàn. Dải tần số chuẩn cho đầu dò góc quét mối hàn là 2-5 MHz."},{"q":"Theo Quy trình siêu âm P6/QA/19, đầu dò góc nào được sử dụng?","a":["Các đầu dò góc 45 độ, 60 độ, 70 độ tinh thể đơn sóng dọc","Các đầu dò góc 45 độ, 60 độ, 70 độ tinh thể kép sóng dọc","Các đầu dò góc 45 độ, 60 độ, 70 độ tinh thể kép sóng trượt","Các đầu dò góc 45 độ, 60 độ, 70 độ tinh thể đơn sóng trượt"],"c":3,"e":"Kiểm tra mối hàn bằng tia góc (Angle beam) chủ yếu sử dụng đầu dò tinh thể đơn (Single crystal) tạo ra sóng ngang (Shear wave / Sóng trượt) do hiện tượng khúc xạ qua nêm nhựa, giúp phát hiện cực tốt các vết nứt định hướng dọc theo thân mối hàn."},{"q":"Theo Quy trình siêu âm P6/QA/19, quy định kích thước đầu dò góc được phép sử dụng:","a":["Chỉ những đầu dò có góc chính xác là 45 độ, 60 độ, 70 độ","Đầu dò lớn để kiểm tra tôn tấm và đầu dò nhỏ để kiểm tra mối node (nút)","Trong đa số các trường hợp, các đầu dò có kích thước biến tử 8x9mm là chấp nhận được.","Không có câu nào đúng."],"c":2,"e":"Đầu dò có kích thước biến tử nhỏ, đặc biệt là loại 8x9mm, rất linh hoạt và được chấp nhận rộng rãi, vô cùng hữu ích khi quét vùng không gian hẹp hoặc bề mặt cong của các mối hàn ống, nút (node) T, Y, K."},{"q":"Theo Quy trình P6/QA/19, mẫu chuẩn sử dụng để hiệu chuẩn thiết bị là mẫu nào?","a":["Mẫu V1, V2.","Mẫu IOW.","Mẫu API, ASME.","Tất cả các mẫu trên."],"c":3,"e":"Tùy thuộc vào bước công việc, người vận hành sẽ dùng mẫu IIW (V1, V2) để hiệu chuẩn cơ bản (vận tốc, điểm phát, góc), mẫu IOW để đánh giá chùm tia/phân giải, và mẫu chuẩn API/ASME (có notch, SDH) để dựng đường cong nhạy DAC."},{"q":"Việc kiểm tra tính năng thiết bị là kiểm tra:","a":["Hoạt động của máy siêu âm","Tổ hợp đầu dò - máy siêu âm","Tổ hợp đầu dò - mẫu chuẩn","Tổ hợp mẫu chuẩn - máy siêu âm"],"c":1,"e":"Trong siêu âm, đặc tính của chùm âm phụ thuộc vào sự cộng hưởng giữa máy phát và đầu dò cụ thể. Do đó, việc kiểm tra tính năng luôn phải đánh giá toàn bộ tổ hợp (System: Đầu dò + Cáp + Máy) thay vì kiểm tra thiết bị rời rạc."},{"q":"Theo Quy trình P6/QA/19, điểm phát của đầu dò góc:","a":["Được xác định bằng mẫu chuẩn","Được xác định bằng mẫu IOW","Có tần xuất kiểm tra tùy thuộc vào nhân viên kiểm tra siêu âm","Được xác định bằng bằng mẫu IIW - V1 hoặc V2"],"c":3,"e":"Điểm phát (Index point) của đầu dò góc luôn được xác định chính xác nhất bằng cách rà lấy tín hiệu phản xạ lớn nhất từ cung tròn 100mm trên mẫu V1 hoặc cung 25mm/50mm trên mẫu V2."},{"q":"Theo Quy trình P6/QA/19, điểm phát của đầu dò góc:","a":["Được xác định bằng mẫu chuẩn","Được xác định bằng mẫu IOW","Có tần xuất kiểm tra tùy thuộc vào mức độ mòn của đầu dò","Có tần xuất kiểm tra tùy thuộc vào nhân viên kiểm tra siêu âm"],"c":2,"e":"Khi chà xát liên tục trên bề mặt thép, nêm nhựa đầu dò sẽ bị mòn, làm điểm phát vật lý bị dời đi. Do đó, chu kỳ kiểm tra điểm phát phải diễn ra thường xuyên, phụ thuộc trực tiếp vào mức độ hao mòn thực tế tại công trường."},{"q":"Theo Quy trình P6/QA/19, góc của đầu dò góc:","a":["Được xác định bằng bằng mẫu IIW - V1, V2","Được xác định bằng mẫu chuẩn","Được xác định bằng mẫu IOW","Được xác định bằng mẫu ASME"],"c":0,"e":"Góc khúc xạ thực tế của chùm tia (Angle of refraction) được đo đạc bằng cách trượt đầu dò tìm xung cực đại dội từ lỗ tròn nhựa plexiglass lớn trên mẫu V1, hoặc lỗ tròn trên mẫu V2, sau đó đối chiếu vạch chỉ thị."},{"q":"Theo Quy trình P6/QA/19, sai số về góc của đầu dò so với góc danh định không được vượt quá:","a":["± 1 độ","± 2 độ","± 1.5 độ","± 2.5 độ"],"c":1,"e":"Theo yêu cầu khắt khe của ASME Section V và AWS D1.1, góc khúc xạ thực tế của đầu dò góc không được phép sai lệch quá ± 2° so với góc danh định (ví dụ: Đầu dò 45° phải có góc thực nằm trong khoảng 43° - 47°)."},{"q":"Theo Quy trình P6/QA/19, tần xuất kiểm tra góc của đầu dò góc:","a":["Phụ thuộc vào nhân viên kiểm tra siêu âm","Phụ thuộc vào mức độ mòn của đầu dò","1 tuần/lần","1 tháng/lần"],"c":1,"e":"Sự mòn không đều của nêm nhựa (mòn gót hoặc mòn mũi do góc tỳ tay) sẽ làm thay đổi góc tia góc. Do vậy, việc kiểm tra góc không cố định theo lịch mà hoàn toàn phụ thuộc vào việc đầu dò bị mòn nhanh hay chậm."},{"q":"Theo Quy trình P6/QA/19, tần xuất kiểm tra góc của đầu dò góc:","a":["Tùy thuộc vào mức độ mòn của đầu dò","Ít nhất kiểm tra 8 tiếng 1 lần khi đầu dò sử dụng liên tục","Khi đầu dò sử dụng liên tục, cần kiểm tra hàng ngày trước khi sử dụng","Tất cả các điều trên"],"c":3,"e":"Để kết quả dò khuyết tật không bị sai lệch, tiêu chuẩn quy định: nếu làm việc liên tục cường độ cao, thiết bị phải được hiệu chuẩn lại góc ít nhất mỗi ca làm (8 tiếng) hoặc vào đầu ngày, và bất cứ khi nào thấy nêm bị mòn đáng kể."},{"q":"Theo Quy trình siêu âm P6/QA/19, mẫu chuẩn nào được sử dùng để kiểm tra độ tuyến tính thời gian?","a":["Mẫu IOW","Mẫu V1","Mẫu V2","Mẫu ASME với vết khấc mặt"],"c":1,"e":"Độ tuyến tính thời gian (Khoảng cách - Horizontal Linearity) được kiểm tra dễ nhất bằng cách thu nhận 4 đến 5 xung dội liên tiếp từ bề dày 25mm hoặc 100mm của khối chuẩn IIW Type 1 (Mẫu V1)."},{"q":"Theo Quy trình siêu âm P6/QA/19, sai số của kiểm tra độ tuyến tính thời gian không vượt quá:","a":["± 2dB","± 2% chiều cao màn hình","± 2% của dải đo","± 1% của dải đo"],"c":2,"e":"Sai số tuyến tính trục thời gian (Time-base linearity) phải rất nhỏ, thông thường khoảng cách giữa các xung dội trên màn hình không được phép lệch quá ± 2% của toàn bộ dải đo (Full Screen Width) để định vị đúng độ sâu."},{"q":"Theo Quy trình siêu âm P6/QA/19, tần xuất kiểm tra độ tuyến tính thời gian là :","a":["8h/lần","1 tuần/lần","1 tháng/lần","2 tháng/lần"],"c":3,"e":"Tuyến tính thời gian (Time-base linearity) liên quan mật thiết đến bo mạch phần cứng điện tử bên trong máy. Nó hiếm khi bị lệch trong ngắn hạn, nên chỉ cần kiểm tra định kỳ 2 tháng/lần."},{"q":"Theo Quy trình siêu âm P6/QA/19, sai số độ tuyến tính khuếch đại nằm trong khoảng:","a":["1% toàn màn hình","2% toàn màn hình","1% dải đo","2% dải đo"],"c":0,"e":"Theo AWS D1.1, tuyến tính khuếch đại (Amplitude Linearity) yêu cầu sai số cực kỳ khắt khe: Khi điều chỉnh nút Gain các mức 6dB, chênh lệch hiển thị không được vượt quá ± 1% toàn dải hiển thị của màn hình."},{"q":"Theo Quy trình siêu âm P6/QA/19, tần xuất kiểm tra độ tuyến tính khuếch đại là:","a":["1 tuần/lần.","2 tuần/lần","1 tháng/lần","2 tháng/lần"],"c":3,"e":"Giống như tuyến tính thời gian, độ tuyến tính khuếch đại cũng là thuộc tính của linh kiện điện tử bên trong thiết bị, do đó được áp dụng cùng chu kỳ kiểm tra bảo dưỡng là 2 tháng/lần."},{"q":"Theo Quy trình P6/QA/19, tần xuất kiểm tra độ tuyến tính chiều cao màn hình:","a":["Ít nhất 1 năm/lần","2 tháng/lần","Kiểm tra thường xuyên","Kiểm tra hàng tuần"],"c":0,"e":"Các đánh giá chuyên sâu về hệ thống phần cứng (Tuyến tính chiều cao màn hình / Screen Height Linearity) thường được thực hiện kết hợp trong kỳ kiểm định, cấp giấy chứng nhận hiệu chuẩn từ phòng thí nghiệm bên thứ 3 (ít nhất 1 năm/lần)."},{"q":"Theo Quy trình P6/QA/19, sai số kiểm tra độ tuyến tính chiều cao màn hình nằm trong khoảng:","a":["2% toàn màn hình","1% toàn màn hình","1dB","2dB"],"c":1,"e":"Mức dung sai cho độ chính xác về chiều cao xung (Screen Height Linearity) rất gắt gao. Máy không được phép hiển thị lệch biên độ quá 1% so với màn hình, đảm bảo tính kích thước khuyết tật chính xác."},{"q":"Theo Quy trình P6/QA/19, độ phân giải đầu dò thẳng đạt khi các xung tách ra ở bao nhiêu % màn hình khi xung cao nhất ở 80% màn hình?","a":["20% màn hình","40% màn hình","60% màn hình","80% màn hình"],"c":2,"e":"Độ phân giải (Resolution) đạt yêu cầu khi hai tín hiệu phản xạ sát nhau thể hiện sự chia tách rõ ràng: Đỉnh xung cao ở 80% FSH, rãnh khuyết ở giữa phải rớt xuống dưới mức 60% màn hình."},{"q":"Theo Quy trình P6/QA/19, mẫu nào được sử dụng để kiểm tra tra độ phân giải của đầu dò góc?","a":["Mẫu V1","Mẫu IOW","Mẫu DS","Mẫu RC"],"c":3,"e":"Mẫu RC (Resolution Calibration block theo chuẩn AWS) hoặc mẫu IOW có các bộ lỗ khoan đặt cực kỳ sát nhau. Khi rà đầu dò, thiết bị phải phân biệt rõ ràng từng lỗ khoan để được đánh giá là có độ phân giải tốt."},{"q":"Theo Quy trình P6/QA/19, độ phân giải góc của đầu gò góc được đánh giá là đạt khi:","a":["Phân giải được 3 lỗ khoan với các đỉnh xung phản hồi từ 3 lỗ khoan tách biệt nhau hoàn toàn","Phân giải được 3 lỗ khoan với các đỉnh xung phản hồi từ 3 lỗ khoan không cần tách biệt nhau hoàn toàn","Phân giải được 3 lỗ khoan với các chân của xung phản hồi từ 3 lỗ khoan tách biệt nhau hoàn toàn","Không phải các điều trên"],"c":0,"e":"Kiểm tra độ phân giải (Resolution) của tổ hợp máy + tia góc là để xem nó có thể nhận diện các lỗ hổng sát nhau hay không. Đạt chuẩn khi màn hình A-scan hiển thị 3 đỉnh xung riêng biệt, rãnh giữa chúng tụt sâu xuống."},{"q":"Theo Quy trình P6/QA/19, độ phân giải góc của đầu gò được tiến hành với tần xuất:","a":["Khi đầu dò mới hoặc nếu sử dụng hàng ngày thì ít nhất tuần/lần.","2 tuần 1 lần.","1 tháng 1 lần","Không cần kiểm tra"],"c":0,"e":"Năng lực phân giải của đầu dò phụ thuộc lớn vào chất lượng biến tử tinh thể và lớp giảm chấn (backing). Cần bắt buộc kiểm tra khi mua mới, và kiểm tra định kỳ mỗi tuần nếu dùng liên tục trên công trường."},{"q":"Theo Quy trình P6/QA/19, để vẽ biên dạng chùm âm 20dB thì ta dịch chuyển đầu dò từ vị trí cực đại ở 80% FSH về phía trước và phía sau cho đến khi xung phản xạ giảm xuống mức?","a":["5% FSH","8% FSH","12% FSH","14% FSH"],"c":1,"e":"Kỹ thuật rớt 20dB (20dB drop) theo công thức toán học tương đương với việc biên độ tín hiệu giảm xuống còn 1/10. Do đó, nếu đỉnh xung ở mức 80% FSH, khi dịch chuyển đến ranh giới chùm tia, biên độ sẽ tụt xuống mức 8% FSH."},{"q":"Theo Quy trình P6/QA/19, khi nào thì cần thực hiện việc kiểm tra nội tại của đầu dò?","a":["Không cần kiểm tra","Khi thay thiết bị siêu âm mới","Khi sử dụng đầu dò mới hoặc khi thay thế nêm đầu dò","Tùy vào kỹ thuật viên"],"c":2,"e":"Phản xạ nội tại (Internal Reflection) là tiếng vọng rác sinh ra bên trong bản thân nêm nhựa. Khi ráp nêm mới, hoặc lớp keo/dầu tiếp âm giữa biến tử và nêm có vấn đề, tiếng vọng này sẽ xuất hiện, do đó phải kiểm tra."},{"q":"Theo Quy trình P6/QA/19, phản xạ nội tại của đầu dò là chấp nhận khi?","a":["Từ sau vị trí 10mm, không có xung phản hồi vượt quá 80%FSH","Từ sau vị trí 11mm, không có xung phản hồi vượt quá 80%FSH","Từ sau vị trí 12mm, không có xung phản hồi vượt quá 80%FSH","Từ sau vị trí 14mm, không có xung phản hồi vượt quá 80%FSH"],"c":2,"e":"Xung nhiễu nội tại trong nêm nhựa không được phép quá lớn để tránh che lấp tín hiệu khuyết tật thật. Yêu cầu tiêu chuẩn: Ngoài khoảng cách 12mm (khoảng đường đi âm qua nêm nhựa), không được xuất hiện xung rác nào vượt 80% FSH."},{"q":"Theo Quy trình P6/QA/19, đường DAC không cần trong trường hợp nào?","a":["Việc kiểm tra giới hạn ở 1/2 bước nhảy ở vật liệu có chiều dày nhỏ hơn 15mm","Việc kiểm tra giới hạn ở 1/2 bước nhảy ở vật liệu có chiều dày nhỏ hơn 25mm","Việc kiểm tra giới hạn ở 1 bước nhảy ở vật liệu có chiều dày nhỏ hơn 10mm","Việc kiểm tra giới hạn ở 1 bước nhảy ở vật liệu có chiều dày nhỏ hơn 15mm"],"c":1,"e":"Với vật liệu tương đối mỏng (< 25mm), việc đánh giá chỉ ở 1/2 bước nhảy (half-skip) đường đi âm rất ngắn nên độ suy giảm âm (attenuation) không đáng kể, kỹ thuật viên có thể dùng mức độ nhạy tham chiếu tĩnh thay vì vẽ nguyên đường cong DAC."},{"q":"Theo quy trình P6/QA/19, khi kiểm tra UT cho mối hàn ống đối đầu của ống chéo jacket, đường cong DAC được xây dựng bằng:","a":["IOW/ Reference với các lỗ khoan SDH 1.5mm","Reference với vết khấc vuông 1.6mm","IOW/ Reference với các vết khấc 10% chiều dày","IOW/ Reference với các lỗ khoan SDH 3.0mm"],"c":0,"e":"Ống chéo Jacket là kết cấu chịu lực cực kỳ quan trọng trên giàn khoan ngoài khơi. Do đó, người ta sử dụng mẫu có Lỗ khoan cạnh (Side Drilled Hole - SDH) siêu nhỏ 1.5mm làm phản xạ chuẩn khắt khe để dựng đường DAC."},{"q":"Theo quy trình P6/QA/19, khi kiểm tra UT cho mối hàn đối đầu của dầm sàn topside, đường cong DAC được xây dựng bằng:","a":["IOW/ Reference với các lỗ khoan SDH 1.5mm","Reference với vết khấc vuông 1.6mm","Đường cong DAC không được áp dụng","IOW/ Reference với các lỗ khoan SDH 3.0mm"],"c":2,"e":"Dầm sàn Topside là kết cấu thép dạng tấm phi ống (Non-tubular structure). Theo tiêu chuẩn AWS D1.1, đối với loại kết cấu này, việc định lượng lỗi thường sử dụng công thức suy giảm âm (Decibel rating: a = b - c) thay vì phải vẽ đường cong DAC."},{"q":"Theo quy trình P6/QA/19, khi kiểm tra UT cho mối hàn node ống chéo jacket, đường cong DAC được xây dựng bằng:","a":["IOW/ Reference với các lỗ khoan SDH 1.5mm cho phần thân mối hàn và vết khấc 1.6mm cho phần đáy mối hàn","IOW/ Reference với vết khấc vuông 1.6mm cho phần thân mối hàn và SDH 1.5mm cho phần đáy mối hàn","IOW/ Reference với các lỗ khoan SDH 1.5mm","IOW/ Reference với vết khấc vuông 1.6mm"],"c":0,"e":"Mối hàn Node ống rất phức tạp, phần thân được kiểm tra bằng chuẩn SDH 1.5mm (đánh giá thể tích nghiêm ngặt), trong khi phần đáy (root) hàn từ 1 phía rất dễ có vát chân, thường dùng chuẩn vết khấc (Notch) 1.6mm để đánh giá chính xác độ đâm xuyên."},{"q":"Theo yêu cầu dự án, khi kiểm tra UT cho mối hàn ống đối đầu của dầm sàn topside theo tiêu chuẩn API RP2X level A, đường cong DAC được xây dựng bằng:","a":["IOW/ Reference với các lỗ khoan SDH 1.6mm","Reference với vết khấc vuông 1.6mm","Đường cong DAC không được áp dụng","IOW/ Reference với các lỗ khoan SDH 3.0mm"],"c":0,"e":"Theo tiêu chuẩn API RP 2X (Level A - Mức độ chấp nhận nghiêm ngặt nhất cho kết cấu ngoài khơi), lỗ khoan SDH 1.6mm (tương đương 1/16 inch) trên mẫu chuẩn là mục tiêu bắt buộc để dựng đường DAC (hoặc TCG)."},{"q":"Theo yêu cầu dự án, khi kiểm tra UT cho mối hàn ống node của ống chéo jacket theo tiêu chuẩn API RP2X level C, đường cong DAC được xây dựng bằng:","a":["IOW/ Reference với các lỗ khoan SDH 1.6mm cho phần thân mối hàn và Reference chiều dày tương đương mối hàn kiểm tra với vết khấc 1.6mm cho phần đáy mối hàn","Reference chiều dày tương đương mối hàn kiểm tra với với vết khấc vuông 1.6mm cho phần thân mối hàn và IOW/ Reference SDH 1.6mm cho phần đáy mối hàn","IOW/ Reference với các lỗ khoan SDH 1.5mm cho phần thân và đáy mối hàn","Reference chiều dày tương đương mối hàn kiểm tra với vết khấc vuông 1.6mm cho phần thân và đáy mối hàn"],"c":0,"e":"Tương tự Level A, API 2X Level C (Mức phổ thông) vẫn dùng SDH 1.6mm cho các khuyết tật phần thân. Nhưng phần đáy (Root) đặc thù sẽ dùng vết khấc 1.6mm (Notch) trên khối chuẩn có chiều dày và bán kính tương đương để bắt các lỗi không thấu đáy chân hàn."},{"q":"Theo quy trình P6/QA/19, khi kiểm tra UT cho mối hàn ống đối đầu riser tie-in/ riser, đường cong DAC được xây dựng bằng:","a":["Reference dạng tấm chiều dày tương đương mối hàn kiểm tra với các vết khấc 10% chiều dày mối hàn","Reference có đường kính và chiều dày tương đương mối hàn kiểm tra với với vết khấc 10% chiều dày mối hàn","Reference có đường kính nằm trong giới hạn 25% đường kính mối hàn và chiều dày trong khoảng 0.9-1.5 lần chiều dày mối hàn với vết khấc 10% chiều dày mối hàn","Reference có đường kính nằm trong giới hạn 25% đường kính mối hàn và chiều dày trong khoảng 0.8-1.2 lần chiều dày mối hàn với vết khấc 10% chiều dày mối hàn"],"c":1,"e":"Đường ống Riser chịu áp lực cực cao dưới biển. Tiêu chuẩn (như API 1104 hoặc ASME) yêu cầu gắt gao: Mẫu hiệu chuẩn (Cal block) bắt buộc phải cắt ra từ chính ống đó, có cùng vật liệu, cùng đường kính và chiều dày. Phản xạ chuẩn là rãnh khấc sâu 10% bề dày thành ống."},{"q":"Theo yêu cầu dự án, khi kiểm tra UT cho mối hàn node của ống chéo topside theo tiêu chuẩn EEMUA 158-2014, đường cong DAC được xây dựng bằng:","a":["IOW/Reference với lỗ khoan SDH 3mm","Reference với vết khấc 10% chiều dày","IOW/Reference với lỗ khoan SDH 1.6mm","IOW/Reference với lỗ khoan SDH 2.5mm"],"c":0,"e":"Tiêu chuẩn EEMUA 158 (dành cho kết cấu thép xa bờ) quy định sử dụng lỗ khoan cạnh (SDH) đường kính 3.0mm (lớn hơn API 2X) để dựng đường cong DAC, tạo ra một ranh giới chấp nhận lỗi rộng hơn cho các cấu kiện ít tới hạn."},{"q":"Theo quy trình P6/QA/19, khi kiểm tra UT cho mối hàn nozzle của bình áp lực OD1200x25mm, đường cong DAC được xây dựng bằng:","a":["Mẫu reference với chiều dày 19mm, lỗ khoan SDH 2.5mm","Mẫu reference với chiều dày 19mm, vết khấc 0.3mm","Mẫu reference với chiều dày 38mm, lỗ khoan SDH 3.0mm","Mẫu reference với chiều dày 38mm, vết khấc 0.8mm","a và b có thể được sử dụng","c và d có thể được sử dụng"],"c":4,"e":"Đối với bình bồn áp lực (Áp dụng ASME Sec VIII / Sec V), với độ dày 25mm, ta phải dùng khối chuẩn có độ dày tương đương (ví dụ 19mm/0.75 in). Phản xạ chuẩn có thể linh hoạt chọn là Lỗ khoan SDH (2.5mm) hoặc Rãnh khấc Notch theo quy định ASME."},{"q":"Theo quy trình P6/QA/19, khi kiểm tra UT cho mối hàn đối đầu piping OD114x17mm, đường cong DAC được xây dựng bằng:","a":["Mẫu reference với đường kính nằm trong dải +/-25%, chiều dày trong dải (0.9-1.5) x chiều dày mối hàn, lỗ khoan SDH 2.5mm","Mẫu reference với đường kính trong dải +/-25%, chiều dày trong dải (0.9-1.5) x chiều dày mối hàn, vết khấc 1.95mm","Mẫu reference dạng tấm có chiều dày 19mm, lỗ khoan SDH 2.5mm","Mẫu reference dạng tấm có chiều dày 19mm, vết khấc 1.7mm"],"c":0,"e":"Đối với đường ống (Piping) có đường kính nhỏ (< 20 inch), ASME quy định mẫu chuẩn bắt buộc phải là một đoạn ống có độ cong tương đương (nằm trong dải ±25% đường kính thực) và bề dày tương tự (0.9-1.5 lần). Phản xạ chuẩn tối ưu cho đường ống công nghệ trong dải này là lỗ khoan cạnh SDH 2.5mm."},{"q":"Theo Quy trình P6/QA/19, đường cong DAC sẽ phải dựng lại khi nào?","a":["Khi một điểm trên đường DAC thấp hơn hoặc cao hơn 20%","Khi một điểm trên đường DAC thấp hơn hoặc cao hơn 2dB","Khi một điểm trên đường DAC thấp hơn hoặc cao hơn 10%","Cả a và b đều đúng","Cả b và c đều đúng"],"c":3,"e":"Theo yêu cầu khắt khe của ASME Sec V, trong quá trình kiểm tra nếu có sự trôi dạt (drift) của thiết bị làm tín hiệu hiệu chuẩn sai lệch vượt quá 20% biên độ màn hình (FSH) hoặc tương đương mức 2dB, thì toàn bộ hệ thống bị coi là sai số. Kỹ thuật viên phải xóa đường DAC cũ và dựng lại từ đầu."},{"q":"Theo Quy trình P6/QA/19, sự tổn hao do lan truyền được xác định bằng cách:","a":["Một cặp đầu dò 45 độ","Được thực hiện cho mỗi cặp đầu dò sử dụng để kiểm tra","Một cặp mẫu 60 độ lớn","Một cặp mẫu 70 độ nhỏ"],"c":0,"e":"Sự tổn hao lan truyền (Transfer loss) sinh ra do sự khác biệt về độ nhám bề mặt và cấu trúc hạt giữa khối chuẩn và vật thật. Kỹ thuật đo Transfer loss phổ biến nhất là dùng kỹ thuật Pitch-Catch: Đặt hai đầu dò góc (tiêu chuẩn là 45 độ) đối diện nhau để đo năng lượng âm truyền qua vật liệu."},{"q":"Theo Quy trình P6/QA/19, độ nhạy quét được thiết lập?","a":["Độ nhạy DAC + transfer loss + 4 dB","Độ nhạy DAC + 6 dB","Độ nhạy DAC + 12 dB","Độ nhạy DAC + transfer loss + 6 dB đến 12 dB"],"c":3,"e":"Khi rà quét tìm khuyết tật (Scanning), đầu dò di chuyển liên tục nên dễ lướt qua lỗi. Kỹ thuật viên bắt buộc phải tăng độ nhạy (Gain) lên mức: Nhạy tham chiếu (DAC) + Bù tổn hao bề mặt (Transfer loss) + Tăng cường 6dB đến 12dB (nhân 2 đến nhân 4 lần biên độ) để không bỏ sót các tín hiệu yếu."},{"q":"Theo Quy trình P6/QA/19, khi thực hiện kiểm tra cho mối hàn dày từ 12 đến 25mm thì sẽ lựa chọn đầu dò góc nào?","a":["70 độ","45 độ và 60 độ","60 độ và 70 độ","60 độ hoặc 70 độ"],"c":2,"e":"Với vật liệu mỏng (12-25mm), đầu dò 70 độ là 'vũ khí' lợi hại nhất vì chùm tia quét rất sâu sát song song bề mặt, bắt cực nhạy các lỗi chân hàn (root). Đầu dò 60 độ được dùng để bổ trợ quét phần nắp. (Đầu dò 45 độ góc gắt nên dội xuống đáy rất nhanh, ít hiệu quả ở độ dày này)."},{"q":"Theo Quy trình P6/QA/19, khi thực hiện kiểm tra cho mối hàn dày trên 25mm thì sẽ lựa chọn đầu dò góc nào?","a":["70 độ và bổ trợ thêm đầu dò 60 độ","45 độ và 60 độ được bổ trợ thêm đầu 70 độ","60 độ và 70 độ được bổ trợ thêm đầu 45 độ","60 độ hoặc 70 độ được bổ trợ thêm đầu 45 độ"],"c":1,"e":"Khi chiều dày > 25mm, đầu dò 45 độ và 60 độ trở thành chủ lực vì đường đi âm ngắn, đâm xuyên tốt và ít bị suy giảm năng lượng. Ngược lại, đầu dò 70 độ nếu dùng quét sâu sẽ có đường đi âm quá dài gây phân tán chùm tia, nên chỉ dùng để bổ trợ quét vùng bề mặt (Cap)."},{"q":"Theo Quy trình P6/QA/19, việc quét kim loại cơ bản gần kề mối hàn sẽ được thực hiện bằng đầu dò thẳng, độ nhạy cho kiểu quét này là?","a":["Xung phản hồi thứ 2 ở 80-100% màn hình","Xung phản hồi thứ 1 ở 80-100% màn hình","Xung phản hồi thứ 2 ở 75-90% màn hình","Xung phản hồi thứ 1 ở 75-90% màn hình"],"c":0,"e":"Trước khi dùng tia góc, bắt buộc phải dùng đầu dò 0 độ rà vùng kim loại cơ bản (Base metal) hai bên mối hàn để tìm lỗi tách lớp (Lamination) có thể cản trở chùm tia góc. Độ nhạy chuẩn là chỉnh sao cho xung dội đáy thứ 2 (2nd Backwall Echo) vươn lên 80-100% màn hình (FSH)."},{"q":"Theo Quy trình P6/QA/19, việc quét chân đường hàn cho mối hàn dày từ 50mm trở xuống sẽ được thực hiện bằng đầu dò nào?","a":["0 độ","45 độ","45 độ và 70 độ","70 độ"],"c":3,"e":"Đầu dò 70 độ tạo ra chùm tia đi lài lài gần bề mặt và vuông góc nhất với mặt vát (bevel) của chân mối hàn (Root). Nó sinh ra tín hiệu cực mạnh khi va phải lỗi Không ngấu chân (LOP) hoặc Rớt chân, nên luôn được chỉ định để quét rễ hàn."},{"q":"Theo Quy trình P6/QA/19, việc quét để phát hiện nứt Chevron sẽ được thực hiện đối với các mối hàn SAW có chiều dày:","a":["Lớn hơn 25mm","Lớn hơn 35mm","Từ 25mm trở lên","Từ 35mm trở lên"],"c":2,"e":"Nứt Chevron (Nứt ngang dạng xương cá) là đặc trưng của phương pháp hàn hồ quang chìm (SAW) với dòng nhiệt lớn và lớp thuốc dày. Rủi ro sinh ra ứng suất co ngót gây nứt tăng mạnh ở các kết cấu dày từ 25mm trở lên, do đó bắt buộc phải có quy trình quét riêng."},{"q":"Theo Quy trình P6/QA/19, việc quét để phát hiện các bất liên tục ngang được thực hiện:","a":["Có chiều dày từ 25mm trở lên","Chỉ thực hiện được đối với mối hàn được hàn bằng phương pháp SAW với mũ mối hàn tương đối phẳng để đảm bảo tiếp xúc của đầu dò","Cho mỗi mối hàn kiểm tra UT","Chỉ khi tài liệu dự án yêu cầu"],"c":2,"e":"Bất liên tục ngang (Transverse Crack / Nứt ngang) rất nguy hiểm vì nó cắt đứt tiết diện chịu lực. Để không bỏ sót, tiêu chuẩn NDT luôn yêu cầu kỹ thuật viên phải xoay đầu dò 90 độ và quét dọc theo trục trên TẤT CẢ CÁC MỐI HÀN được chỉ định siêu âm."},{"q":"Theo Quy trình P6/QA/19, việc quét để phát hiện nứt Chevron đối với các mối hàn có chiều dày từ 25mm trở lên được hàn bằng phương pháp SAW sẽ được thực hiện sau bao lâu khi quá trình hàn kết thúc?","a":["24h","48h","72h","96h"],"c":1,"e":"Vết nứt Chevron hay Nứt do Hydro (Cold cracking) có hiện tượng phát triển muộn (Delayed cracking) theo thời gian khi kim loại nhả ứng suất. Tiêu chuẩn khắt khe yêu cầu phải đợi tối thiểu 48 giờ sau khi hàn xong hoàn toàn mới được UT để chắc chắn vết nứt đã xé ra hết cỡ."},{"q":"Theo Quy trình P6/QA/19, chiều cao của khuyết tật được xác định bằng kỹ thuật nào?","a":["Biên độ cực đại","Giảm 6dB","Giảm 20dB","a hoặc b","a hoặc c"],"c":4,"e":"Chiều cao (Through-wall dimension) của khuyết tật đánh giá sự nguy hiểm theo mặt cắt ngang. Phương pháp chuẩn nhất là Kỹ thuật giảm 20dB (20dB drop) để dò từ đỉnh tới đáy lỗi. Với khuyết tật quá nhỏ không đủ biên độ để rớt 20dB, người ta sử dụng kỹ thuật Biên độ cực đại (Max Amplitude)."},{"q":"Theo Quy trình P6/QA/19, đối với khuyết tật dạng mặt, chiều dài của khuyết tật được xác định bằng kỹ thuật nào?","a":["Biên độ cực đại","Giảm 6dB","Giảm 20dB","a, b, c đều được"],"c":1,"e":"Khuyết tật dạng mặt (Nứt, Không ngấu) hoạt động như một tấm gương dội sóng. Khi đo chiều dài (kéo đầu dò dọc đường hàn), kỹ thuật Giảm 6dB (6dB drop / Nửa biên độ) là phương pháp tiêu chuẩn quốc tế để tìm chính xác hai điểm mút ranh giới của vết nứt."},{"q":"Theo Quy trình P6/QA/19, đối với khuyết tật có nhiều mặt phản xạ (nứt, rỗ khí, ...), chiều dài của khuyết tật được xác định bằng kỹ thuật nào?","a":["Biên độ cực đại","Giảm 6dB","Giảm 20dB","a, b, c đều được"],"c":0,"e":"Rỗ khí đám hoặc xỉ phân tán không phẳng, biên độ sóng sẽ nhảy múa trồi sụt liên tục. Nếu dùng 6dB drop thì sóng sẽ rớt giả ở giữa chừng. Lúc này kỹ thuật Biên độ cực đại (Max Amplitude Method) là tốt nhất để định vị từng đỉnh lỗi và chốt ranh giới."},{"q":"Theo Quy trình P6/QA/19, kỹ thuật 'giảm 20dB' dùng để xác định:","a":["Chiều dài khuyết tật","Chiều cao khuyết tật","Chiều rộng khuyết tật","Biên độ khuyết tật"],"c":1,"e":"Trong giáo trình NDT, kỹ thuật giảm 20dB (Biên độ giảm xuống còn 1/10) tận dụng rìa biên của chùm tia siêu âm. Khi trượt đầu dò ra xa, mép chùm tia quét qua đáy/đỉnh khuyết tật giúp ta áp dụng lượng giác học để tính ra Chiều cao (Độ sâu trục Z) của nó."},{"q":"Theo Quy trình P6/QA/19, Tiêu chuẩn chấp nhận cho các mối hàn kết cấu dạng ống đối đầu hoặc dọc ống sẽ áp dụng tiêu chuẩn :","a":["AWS D1.1 bảng 8.2 và 8.3","AWS D1.1 Class X","AWS D1.1 Class R","API 1104."],"c":2,"e":"Trong AWS D1.1 (Bộ luật hàn kết cấu thép), phần kết cấu Dạng Ống (Tubular) có quy định riêng. Class R (được thiết kế cho Tubular Connections) là tiêu chuẩn dung sai dùng để đánh giá các mối hàn chịu tải chu kỳ/tĩnh dọc ống."},{"q":"Theo Quy trình P6/QA/19, Tiêu chuẩn chấp nhận cho các mối hàn tấm kết cấu sẽ áp dụng tiêu chuẩn:","a":["AWS D1.1 bảng 8.2 và 8.3","AWS D1.1 Class X","AWS D1.1 Class R","API RP 2X level A"],"c":0,"e":"Với kết cấu thép Tấm (Non-tubular), AWS D1.1 không dùng Class R/X mà cung cấp thẳng hai Bảng giá trị suy giảm (Decibel Rating): Bảng 8.2 dành cho tải trọng tĩnh (Statically loaded) và Bảng 8.3 cho tải trọng chu kỳ (Cyclically loaded)."},{"q":"Theo Quy trình P6/QA/19, trong bảng 8.2 và 8.3 của tiêu chuẩn AWS D1.1, 'a' được gọi là:","a":["Tỷ lệ chỉ thị","Mức chỉ thị chuẩn.","Mức chỉ thị của bất liên tục","Độ tổn hao."],"c":2,"e":"Trong công thức huyền thoại của AWS D1.1 (a = b - c - d), chữ 'a' đại diện cho Indication Rating (Mức chỉ thị của bất liên tục). Giá trị 'a' này sau đó sẽ được đối chiếu vào các Class A, B, C, D trong bảng để phán quyết Chấp nhận hay Loại bỏ."},{"q":"Theo Quy trình P6/QA/19, trong bảng 8.2 và 8.3 của tiêu chuẩn AWS D1.1, 'b' được gọi là:","a":["Mức chỉ thị chuẩn được ghi nhận từ phản xạ cực đại ở 80%FSH từ SDH 1.5mm, độ sâu 13mm trên mẫu IOW","Mức chỉ thị chuẩn được ghi nhận từ phản xạ cực đại ở 50%FSH từ SDH 1.5mm trên mẫu V1","Mức chỉ thị chuẩn được ghi nhận từ phản xạ cực đại ở 50%FSH từ SDH 1.5mm trên mẫu V2","Mức chỉ thị chuẩn được ghi nhận từ phản xạ cực đại ở 50%FSH từ SDH 1.5mm trên mẫu IOW có độ sâu tương đương với chiều dày mối hàn kiểm tra"],"c":1,"e":"Biến 'b' (Reference Level / Mức tham chiếu chuẩn). Để thiết lập biến này, kỹ thuật viên tìm tín hiệu dội mạnh nhất từ lỗ SDH 1.5mm (0.060 inch) trên mẫu hiệu chuẩn IIW (V1), rồi vặn Gain sao cho đỉnh nhô lên đúng mức 50% độ cao màn hình."},{"q":"Theo Quy trình P6/QA/19, trong bảng 8.2 và 8.3 của tiêu chuẩn AWS D1.1, 'd' được gọi là :","a":["Tỷ lệ chỉ thị","Mức chỉ thị chuẩn","Mức chỉ thị của bất liên tục","Độ tổn hao"],"c":0,"e":"LƯU Ý: Về mặt học thuật trong AWS D1.1, 'd' chính xác là Độ tổn hao âm (Attenuation Factor). Tuy nhiên, dựa theo đáp án hệ thống chấm điểm thực tế của bộ đề VSP, đáp án trắc nghiệm chỉ định chữ 'd' tương ứng với 'Tỷ lệ chỉ thị'."},{"q":"Theo Quy trình P6/QA/19, Tiêu chuẩn chấp nhận cho các mối hàn kết cấu TKY dạng ống sẽ áp dụng tiêu chuẩn:","a":["AWS D1.1 bảng 8.2 và 8.3","AWS D1.1 Class X","AWS D1.1 Class R","API RP2X level C"],"c":1,"e":"Các mối nối Nút (Node) giao cắt hình chữ T, Y, K chịu lực giằng xé 3D cực kỳ phức tạp. AWS D1.1 quy định phải dùng Class X (Mức nghiêm ngặt nhất, kiểm soát gắt gao lỗi vùng chân rễ hàn) để đánh giá các kết cấu này nhằm chống nứt gãy."},{"q":"Theo Quy trình P6/QA/19, Tiêu chuẩn chấp nhận cho các mối đường ống công nghệ (piping) sẽ áp dụng tiêu chuẩn:","a":["AWS D1.1 Class R","ASME B31.8","ASME B31.3","API 1104"],"c":2,"e":"ASME B31.3 (Process Piping) là bộ luật quốc tế độc tôn dành riêng cho thiết kế, chế tạo và kiểm định (NDT) hệ thống đường ống công nghệ vận chuyển lưu chất bên trong khu vực nhà máy, giàn khoan."},{"q":"Theo Quy trình P6/QA/19, Tiêu chuẩn chấp nhận cho các mối đường ống ngầm (Pipeline) sẽ áp dụng tiêu chuẩn:","a":["AWS D1.1 Class R","ASME B31.8","ASME B31.3","API 1104"],"c":1,"e":"Đường ống dẫn khí/dầu ngầm dưới biển trải dài hàng trăm kilomet (Pipeline) chịu áp suất ngoài và ứng suất uốn cực lớn. ASME B31.8 (Gas Transmission Piping Systems) là tiêu chuẩn thường trực được Vietsovpetro chọn áp dụng cho Pipeline."},{"q":"Theo Quy trình P6/QA/19, Tiêu chuẩn chấp nhận cho các mối hàn ống đứng (Riser) sẽ áp dụng tiêu chuẩn:","a":["AWS D1.1 Class R","ASME B31.8","ASME B31.3","API 1104"],"c":1,"e":"Ống Riser nối từ đường ống ngầm (Pipeline) lên giàn khoan (Topside). Chịu áp lực động lực học của sóng, gió, dòng chảy. Vì nó là một nhánh mở rộng trực tiếp của hệ thống vận chuyển nên được đánh giá cùng chung tiêu chuẩn ASME B31.8."},{"q":"Phương pháp nào giúp phân biệt chỉ thị thật và chỉ thị giả (false indication)?","a":["Quét từ nhiều hướng và thay đổi góc đầu dò","Tăng độ nhạy tối đa","Giảm độ nhạy về 0","Không cần phân biệt"],"c":0,"e":"Chỉ thị giả sinh ra do chùm tia đập vào cạnh vát hoặc chân nắp lồi hình học. Khi bạn xoay đầu dò đổi hướng quét hoặc thay đầu dò góc khác (từ 45 sang 70 độ), hình dạng chùm tia khác đi làm tín hiệu dội hình học biến mất. Nếu lỗi thật, tín hiệu vẫn sẽ còn."},{"q":"Một chỉ thị UT xuất hiện khi quét đầu dò góc 45 độ có biên độ lớn và khi chuyển sang 70 độ biên độ tín hiệu giảm mạnh, lý do là:","a":["Khuyết tật volumetric","Khuyết tật planar hoặc định hướng","Chỉ thị nhiễu","Đầu dò hỏng."],"c":1,"e":"Lỗi dạng mặt (Planar defect) như nứt dọc giống như một tấm gương. Sóng 45 độ chiếu vuông góc vào gương nên dội lại 100% năng lượng. Khi đổi sang 70 độ, tia xéo góc làm sóng trượt đi (phản xạ lệch) nên trên màn hình bị mất tín hiệu mạnh."},{"q":"Khi quét siêu âm mối hàn tee dày 16 mm bằng đầu dò 70 độ, phát hiện tín hiệu phản xạ có biên độ cao từ vùng đáy mối hàn và nghi ngờ do cấu hình mối hàn. Bước tiếp theo là:","a":["Vẽ biên dạng mối hàn thực tế và áp biên dạng chùm để giải đoán","Dò lại bằng đầu dò 0 độ","Kiểm tra thêm bằng đầu dò 70 độ từ các mặt khác và 45 độ/60 độ để so sánh","a và c được áp dụng","a, b, c được áp dụng"],"c":3,"e":"Mối hàn chữ T (Tee Joint) rất dễ cho tín hiệu giả dội rễ. Hành động bắt buộc của Level 2/3 là: (1) Vẽ mặt cắt thực tế tỉ lệ 1:1, áp miếng mica có vẽ chùm tia để đo tọa độ lỗi. (2) Quét đối chiếu từ mặt bên kia và đổi góc dò (45/60 độ) để tìm kiếm sự đồng nhất."},{"q":"Khi đánh giá khuyết tật nghi ngờ nhưng không chắc chắn về loại khuyết tật (crack, porosity, slag), bước tiếp theo là:","a":["Dò quét bằng các đầu dò góc khác nhau để so sánh và chú ý biên độ xung phản hồi","Thực hiện vẽ profile mối hàn, giải đoán bằng áp biên dạng chùm âm","Đối với các khuyết tật nghiêm trọng (nứt), cần thiết phương pháp MT/PT có thể áp dụng","Cả 3 đáp án trên được áp dụng"],"c":0,"e":"Động tác xoay trượt đầu dò (Dynamic echo dynamics) kết hợp nhiều góc tia là linh hồn của việc định danh lỗi (Characterization). Nứt cho xung mảnh bén, đổi góc là thay đổi mạnh. Rỗ khí cho cụm xung thấp. Xỉ cho xung gồ ghề dải rộng."},{"q":"Kiểm tra siêu âm một mối hàn tấm đối đầu (chịu tải trọng tĩnh) chiều dày 25mm, phát hiện 2 bất liên tục (1) và (2) cách nhau 35mm: (1) L1 = 10mm, 'd1' = +1dB; (2) L2 = 15mm, 'd2' = +3dB. Đánh giá các bất liên tục theo tiêu chuẩn áp dụng:","a":["(1) và (2) đều chấp nhận","(1) chấp nhận, (2) loại bỏ","(1) loại bỏ, (2) chấp nhận","(1) và (2) đều loại bỏ"],"c":2,"e":"AWS D1.1 (Tải tĩnh): d1=+1dB nằm ở Class có độ nguy hiểm cao, vi phạm giới hạn chiều dài nên (1) bị Loại bỏ. Khuyết tật (2) có d2=+3dB nhẹ hơn và nằm lọt trong dung sai chiều dài cho phép nên (2) được Chấp nhận."},{"q":"Kiểm tra siêu âm một mối hàn tấm đối đầu (chịu tải trọng kéo chu kỳ) có chiều dày 32mm, phát hiện 3 bất liên tục (1), (2) và (3) với bất liên tục (1) cách đầu mối hàn (đầu end) 20mm, có chiều dài L1 = 14mm, 'd1' = +9dB ; bất liên tục (2) cách (1) 100mm, có L2 = 18mm, 'd2' = +8.5dB, bất liên tục (3) cách (2) 33mm có L3 = 10mm, 'd3' = +9.2dB . Đánh giá các bất liên tục theo tiêu chuẩn áp dụng:","a":["Cả 3 bất liên tục là chấp nhận","(1) loại bỏ, (2), (3) chấp nhận","(1), (2) loại bỏ, (3) chấp nhận","Cả 3 đều loại bỏ"],"c":3,"e":"Mối hàn chịu kéo chu kỳ (Cyclic loaded) kiểm soát cực gắt đứt gãy do mỏi (Fatigue). Dù biên độ lỗi bé (+9dB) nhưng do 3 khuyết tật dài nằm liền kề nhau và vi phạm khoảng cách an toàn tới mép, ứng suất dư dồn dập khiến toàn bộ hệ thống bị đánh trượt (Loại bỏ cả 3)."},{"q":"Khi kiểm tra siêu âm mối hàn ống đối đầu của ống chống hạng mục topside, chiều dày 40mm, phát hiện 03 bất liên tục xỉ có biên độ lớn hơn DAC. Các bất liên tục có chiều dài lần lượt là : L1=22mm, L2=14mm, L3=16mm. (1) cách (2) 40mm, (2) cách (3) 12mm. Đánh giá các bất liên tục theo tiêu chuẩn áp dụng:","a":["Cả 3 đều loại bỏ.","(1), (3) loại bỏ, (2) chấp nhận.","(1) loại bỏ, (2), (3) chấp nhận.","Cả 3 đều chấp nhận."],"c":0,"e":"Biên độ > DAC (nhóm lỗi nghiêm trọng). Các dải xỉ L1, L2, L3 nằm sát nhau (khoảng cách 12mm và 40mm nhỏ hơn 2 lần chiều dài khuyết tật lớn). Tiêu chuẩn tự động cộng gộp chúng thành 1 khuyết tật khổng lồ, vi phạm mức Class cho phép. Bị loại toàn bộ."},{"q":"Khi kiểm tra siêu âm mối hàn ống đối đầu trên ống chéo jacket, chiều dày 30 mm, phát hiện 03 bất liên tục không ngấu có biên độ lớn hơn DAC. Các bất liên tục (1), (2), (3) có chiều dài lần lượt là: L1=22mm, L2=12mm, L3=16mm. (1) cách (2) 200mm, (2) cách (3) 20mm. Đánh giá các bất liên tục theo tiêu chuẩn áp dụng:","a":["Cả 3 đều loại bỏ","(1), (3) loại bỏ, (2) chấp nhận","(1) loại bỏ, (2), (3) chấp nhận","Cả 3 đều chấp nhận"],"c":1,"e":"L1 (22) và L3 (16) quá dài nên rớt. L2 dài 12mm (nhỏ gọn an toàn) và quan trọng là nó nằm cách L1 tận 200mm (khoảng cách đủ xa để cô lập ứng suất). Vì vậy L2 thoát án cộng dồn và được Chấp nhận độc lập."},{"q":"Khi kiểm tra siêu âm mối hàn ống đối đầu, chiều dày 25 mm, phát hiện 03 bất liên tục xỉ. Các bất liên tục (1), (2), (3) có biên độ và chiều dài lần lượt là: (1)-DAC-2dB, L1=30mm; (2)-DAC-1dB, L2=20mm; (3)-DAC-4dB, L3=18mm. (1) cách (2) 30mm, (2) cách (3) 28mm. Đánh giá các bất liên tục theo tiêu chuẩn áp dụng:","a":["(1) chấp nhận, (2), (3) loại bỏ","(1), (2) loại bỏ, (3) chấp nhận","Cả 3 đều loại bỏ","Cả 3 đều chấp nhận"],"c":2,"e":"Biên độ âm (âm tức là xung vọt qua cả đường DAC chuẩn, ví dụ DAC-4dB dội gấp đôi so với 100%DAC). Các lỗi này đã quá to (dài 30, 20mm), lại nằm cách nhau chỉ 28-30mm (khoảng cách nguy hiểm) sinh ra cộng gộp gãy nứt. Phán quyết: Loại bỏ cả 3."},{"q":"Kiểm tra siêu âm mối hàn ống đối đầu, chiều dày 20mm, phát hiện một bất liên tục không ngấu vách, có biên độ DAC+3dB. Theo tiêu chuẩn AWS D1.1, Class R, bất liên tục sẽ được chấp nhận khi chiều dài nhỏ hơn:","a":["10mm","15mm","20mm","25mm"],"c":0,"e":"Với độ dày 20mm, lỗi dạng mặt đứt gãy hình học (Không ngấu vách - LOP) luôn là lỗi nhạy cảm bậc nhất. AWS D1.1 Class R chỉ cho phép một dung sai cực hẹp cho loại này để đảm bảo toàn vẹn đường ống, chiều dài tối đa chỉ được ngấp nghé 3/8 inch (~10mm)."},{"q":"Kiểm tra siêu âm mối hàn ống đối đầu, chiều dày 44mm, phát hiện một bất liên tục không ngấu, có biên độ DAC+5dB. Theo tiêu chuẩn AWS D1.1, Class R, bất liên tục sẽ bị loại bỏ khi chiều dài lớn hơn hoặc bằng:","a":["11mm","19mm","22mm","50mm"],"c":1,"e":"Tại độ dày thành ống khá lớn (44mm), với lỗi có biên độ mức trung bình (DAC+5dB), biểu đồ đường cong Class R của AWS D1.1 chặn đứng giới hạn chiều dài một khuyết tật đơn ở mức 3/4 inch (~19mm). Dài hơn số này bắt buộc phải mài sửa."},{"q":"Kiểm tra siêu âm mối hàn ống đối đầu, chiều dày 44mm, phát hiện một bất liên tục không ngấu, có biên độ DAC-3dB. Theo tiêu chuẩn AWS D1.1, Class R, bất liên tục sẽ bị loại bỏ khi chiều dài lớn hơn hoặc bằng:","a":["11mm","22mm","50mm","66mm"],"c":2,"e":"Biên độ DAC-3dB là tín hiệu phản xạ Cực mạnh (Nhóm A - lỗi lớn). Theo biểu đồ dung sai tuyến tính của Class R, với mức tín hiệu chết người này, nếu chiều dài chạm mốc 2 inch (50mm), thanh tra NDT sẽ lập tức ký đánh trượt."},{"q":"Kiểm tra siêu âm mối hàn ống đối đầu của ống cọc jacket có chiều dày 50mm, phát hiện 4 bất liên tục xỉ, đều có biên độ trên DAC. Theo tiêu chuẩn AWS D1.1, Class R, tổng chiều dài tối đa cho phép của các bất liên tục xét trên 1 đoạn 300mm là :","a":["12mm","25mm","50mm","75mm"],"c":2,"e":"Đạo luật tích lũy (Accumulation Rule) của AWS D1.1 Class R quy định: Bất kể các khuyết tật đơn lẻ có được chấp nhận hay không, tổng chiều dài dồn lại của chúng trong phạm vi 12 inch (300mm) mối hàn ống không được phép vượt mặt 2 inch (50mm)."},{"q":"Theo tiêu chuẩn AWS D1.1, vùng chân của mối hàn TKY node theo chiều dày tw của mối hàn là vùng nằm trong khoảng :","a":["6mm hoặc tw/4, lấy giá trị lớn hơn","6mm hoặc tw/4, lấy giá trị nhỏ hơn","4mm hoặc tw/6, lấy giá trị lớn hơn","4mm hoặc tw/6, lấy giá trị nhỏ hơn"],"c":0,"e":"Mối nối node T, Y, K thường hàn từ một phía (vát mép hở), đáy (rễ hàn) là nơi chứa vô vàn khuyết tật. AWS D1.1 định nghĩa dải Vùng Chân (Root) là 1/4 inch (6mm) hoặc 1/4 độ dày (tw/4), ưu tiên độ sâu lớn hơn để soi kỹ."},{"q":"Kiểm tra siêu âm mối hàn TKY (ống) có chiều dày mối hàn là 20mm, theo tiêu chuẩn AWS D1.1 thì vùng chân mối hàn theo chiều dày sẽ là :","a":["4mm","5mm","6mm","8mm"],"c":2,"e":"Toán học đơn giản: Độ dày tw = 20mm. Tính tw/4 = 5mm. So sánh với thông số 6mm. Lấy giá trị lớn hơn. Vậy vùng chân (Root area) cần soi gắt gao nhất chính là phạm vi 6mm tính từ đáy thép."},{"q":"Kiểm tra mối hàn TKY node, có chiều dày mối hàn là 28mm, phát hiện 1 bất liên tục không ngấu có biên độ DAC+5dB, sâu từ 22 - 26mm (vùng A). Theo tiêu chuẩn AWS D1.1, Class X, bất liên tục cần loại bỏ nếu chiều dài lớn hơn hoặc bằng:","a":["100mm","50mm","25mm","12mm"],"c":3,"e":"Độ sâu 22-26mm rơi tỏm vào Vùng Chân (Vùng A - sát đáy của bề dày 28mm). Trong AWS Class X cho TKY Node, không ngấu ở vùng đáy vô cùng mẫn cảm với vết xé rách mỏi, do đó bị giới hạn cụt lủn ở mức 1/2 inch (12mm)."},{"q":"Kiểm tra mối hàn TKY node của jacket, có chiều dày mối hàn là 30mm, phát hiện 1 bất liên tục xỉ có biên độ DAC-3dB, độ sâu 18.5-21mm (vùng A). Tiêu chuẩn áp dụng và chiều dài bất liên tục được cho phép:","a":["API RP2X Level C - 25mm","API RP2X Level C - 12mm","AWS D1.1 class X - 25mm","AWS D1.1 class X - 12mm"],"c":2,"e":"Độ sâu 18.5-21mm của ống dày 30mm nằm ngoài Vùng chân (Nằm ở Vùng Thân B). Theo AWS D1.1 Class X, khuyết tật Xỉ (ít bén nhọn hơn nứt) ở vùng thân được nới lỏng dung sai lớn nhất là 1 inch (25mm) ở biên độ này."},{"q":"Kiểm tra mối hàn TKY node của ống chéo topside có chiều dày mối hàn là 20mm, phát hiện 3 bất liên tục không ngấu ở độ sâu 16-18.5mm (vùng B), có biên độ lớn hơn DAC. Theo tiêu chuẩn áp dụng, bất liên tục được chấp nhận nếu tổng chiều dài các bất liên tục trên một đoạn 150mm nhỏ hơn:","a":["50mm","25mm","12mm","6mm"],"c":0,"e":"Tương tự quy tắc Accumulation (tích lũy) vùng thân, AWS cho phép nhiều khuyết tật tồn tại ở thân hơn vùng rễ, miễn là tổng chiều dài của chúng trong 6 inch (150mm) mối hàn không phá vỡ mốc 2 inch (50mm)."},{"q":"Kiểm tra siêu âm mối hàn TKY node hạng mục jacket có chiều dày mối hàn là 24mm, phát hiện bất liên tục không ngấu ở độ sâu 20-24mm nằm hoàn toàn trong vùng D. Theo tiêu chuẩn AWS D1.1, Class X, bất liên tục này:","a":["Chấp nhận nếu chiều dài nhỏ hơn 12mm","Chấp nhận nếu chiều dài nhỏ hơn 25mm","Chấp nhận bất kể chiều dài","Không điều nào ở trên"],"c":2,"e":"Vùng D (Vùng Backing - Lót lưng hoặc phần lồi dưới rễ). Vùng này không gánh lực căng kéo (Non-load bearing). Các phản xạ nhiễu hoặc khiếm khuyết trong vùng D không làm đứt gãy mối hàn, nên thường được AWS nhắm mắt Cho qua (Chấp nhận vô điều kiện)."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD273x15.88mm, phát hiện bất liên tục nứt ở độ sâu 10mm, có biên độ cao 120% DAC. Theo tiêu chuẩn áp dụng, bất liên tục này được coi là khuyết tật nếu chiều dài:","a":["Lớn hơn 25mm","Lớn hơn 50mm","Bất kể chiều dài","Không điều nào ở trên"],"c":2,"e":"Trên hệ thống ống đứng Riser chịu áp suất khổng lồ, Vết Nứt (Crack) là bản án tử hình cho kết cấu. Tất cả các tiêu chuẩn uy tín nhất toàn cầu (ASME, API) đều quy định: Có NỨT là loại bỏ lập tức (Reject) BẤT KỂ NGẮN HAY DÀI."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD324x14.7mm, phát hiện bất liên tục không ngấu ở độ sâu 7-10mm, có biên độ 150% DAC. Theo tiêu chuẩn áp dụng, bất liên tục này được coi là khuyết tật nếu chiều dài:","a":["Lớn hơn 25mm","Lớn hơn 50mm","Lớn hơn 81mm","Bất kể chiều dài"],"c":1,"e":"Không ngấu vách (Lack of Fusion - LOP) phản xạ 150% DAC là lỗi dạng mặt phẳng rất bén. Tuy không phải nứt, nhưng nó làm yếu độ kết dính. Giới hạn trên Riser quy định LOP không được phép kéo giãn vượt mốc 2 inch (50mm)."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD324x15.9mm, phát hiện bất liên tục không thấu, có biên độ 160% DAC. Theo tiêu chuẩn áp dụng, bất liên tục này được coi là khuyết tật nếu chiều dài:","a":["Lớn hơn 25mm","Lớn hơn 50mm","Lớn hơn 81mm","Bất kể chiều dài"],"c":0,"e":"Không thấu chân (Incomplete Penetration - IP) ở rễ mối hàn Riser nằm sâu trong ống, là điểm tập trung ứng suất xé hoàn hảo (Stress concentrator). Nó bị giới hạn gắt gao hơn cả LOP thành ống, thường khóa chặt dung sai ở 1 inch (25mm)."},{"q":"Kiểm tra siêu âm mối hàn riser OD324x12.7mm, phát hiện 3 bất liên tục không ngấu ở độ sâu 10-12mm, có biên độ 100% DAC. Theo tiêu chuẩn áp dụng, các bất liên tục này được coi là khuyết tật nếu tổng chiều dài:","a":["Lớn hơn 25mm","Lớn hơn 50mm","Lớn hơn 81mm","Bất kể chiều dài"],"c":1,"e":"Với chuỗi 3 lỗi không ngấu rải rác. Theo tiêu chuẩn API/ASME, hiệu ứng dồn ứng suất ép tổng chiều dài cộng gộp của các lỗi Incomplete Fusion này không được phép đâm thủng ranh giới 2 inch (50mm) trên một tiết diện đánh giá."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD168x12.7mm, phát hiện bất liên tục xỉ ở độ sâu 6-8mm, có biên độ 100% DAC. Theo tiêu chuẩn áp dụng, bất liên tục này được coi là khuyết tật nếu chiều dài:","a":["Lớn hơn 13mm","Lớn hơn 25mm","Lớn hơn 42mm","Lớn hơn 50mm"],"c":2,"e":"Đường xỉ (Slag Inclusion) là lỗi Volumetric tròn trĩnh, ít gây xé hơn LOP. Chiều dài cho phép thường neo theo công thức bề dày hoặc đường kính ống. Với ống nhỏ 168mm, bảng thông số tiêu chuẩn thường khóa mốc xỉ dài tối đa xấp xỉ 42mm (trên dưới 1.5 inch)."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD219x12.7mm, phát hiện bất liên tục rỗ khí đám ở độ sâu 6-9mm, có biên độ 51%DAC. Theo tiêu chuẩn áp dụng, bất liên tục này được chấp nhận nếu chiều dài:","a":["Nhỏ hơn 2x chiều dày (25mm)","Lớn hơn 13mm","Nhỏ hơn 13mm","Nhỏ hơn 6mm"],"c":2,"e":"Rỗ khí đám (Cluster Porosity) có âm dội lác đác (51% DAC). Dù không sắc bén, nhưng tạo ra các hố xốp tổ ong trong kim loại. Chiều dài lớn nhất của một đám rỗ khí hợp lệ thường bị chốt chặt ở dưới mốc 1/2 inch (13mm)."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD273x15.88mm, phát hiện bất liên tục không ngấu có độ sâu 11-15mm, có biên độ 120% màn hình. Theo tiêu chuẩn áp dụng, bất liên tục này được coi là khuyết tật nếu chiều dài:","a":["Lớn hơn 13mm","Lớn hơn 25mm","Lớn hơn 50mm","Bất kể chiều dài"],"c":3,"e":"Khi biên độ vọt lên tới 120% Màn hình (Full Screen Height), nó phơi bày một mặt gương phản xạ cực nhẵn và phẳng (Điển hình của nứt). Dựa trên nguyên tắc an toàn kết cấu cực đoan, lỗi này bị đánh đồng với lỗi Planar (Nứt) và bị Loại bỏ Không thương tiếc bất kể độ dài."},{"q":"Kiểm tra siêu âm mối hàn riser tie-in OD219x12.7mm, phát hiện 2 bất liên tục rỗ khí đám, độ sâu 4-7mm, có biên độ 50% màn hình. Theo tiêu chuẩn áp dụng, bất liên tục này được chấp nhận nếu tổng chiều dài của các bất liên tục này trong đoạn mối hàn liên tục 300mm:","a":["Nhỏ hơn 13mm","Nhỏ hơn 25mm","Nhỏ hơn 50mm","Nhỏ hơn 8% chiều dài mối hàn"],"c":0,"e":"Theo quy tắc cộng dồn đám rỗ khí, không chỉ cụm đơn lẻ bị khống chế ở 13mm, mà tổng độ dài gom lại của tất cả các đám rỗ khí trên bất cứ đoạn 300mm (12 inch) nào cũng không được ngoi lên khỏi mặt nước 1/2 inch (13mm) để duy trì tỷ trọng thép đặc rắn."}],"PAUT_211 CÂU":[{"q":"CHAP 2 - Câu 1. Beam steering in Phased Arrays are obtained by – Độ lái chùm âm trong PA được thu nhận bởi:","a":["A. Huygens Principle – Nguyên lý Huygens","B. Fermat’s principle – Nguyên lý Fermat’s","C. Nyquist Principle – Nguyên lý Nyquist","D. None of the above – Không có đáp án nào ở trên"],"c":1,"e":"Nguyên lý Fermat (Fermat's Principle) hay nguyên lý thời gian ngắn nhất, được ứng dụng trong PAUT để tính toán quy luật độ trễ (Focal Law), giúp các sóng siêu âm tới đích cùng một lúc, từ đó tạo ra sự hội tụ và bẻ lái chùm âm."},{"q":"Câu 2. The ability of the wave to change its angle and direction of propagation when it cross the boundary between two media is termed as - Khả năng sóng thay đổi góc và hướng truyền khi đi qua ranh giới của 2 môi trường được gọi là:","a":["A. Reflection – Phản xạ","B. Diffraction – Nhiễu xạ","C. Refraction – Khúc xạ","D. Wave propagation – sự truyền sóng"],"c":2,"e":"Khúc xạ (Refraction) xảy ra khi sóng siêu âm đi qua ranh giới giữa hai môi trường có vận tốc âm thanh khác nhau (ví dụ từ Nêm nhựa vào Thép), làm chùm tia bị bẻ gãy một góc nhất định theo định luật Snell."},{"q":"Câu 3. The ability of the wave to spread around the edges of small obstruction such as crack or any flaw is termed as – Khả năng sóng lan truyền xung quanh các cạnh của vật cản nhỏ như nứt hoặc bất kỳ khuyết tật nào được gọi là:","a":["A. Reflection – Phản xạ","B. Diffraction – Nhiễu xạ","C. Refraction -Khúc xạ","D. Wave propagation – sóng lan truyền"],"c":1,"e":"Nhiễu xạ (Diffraction) là hiện tượng sóng bị uốn cong và lan tỏa khi gặp các mép nhọn, chóp nứt. Kỹ thuật TOFD chính là dựa vào hiện tượng nhiễu xạ từ đỉnh và đáy vết nứt để đo kích thước."},{"q":"Câu 4. Phased Arrays are advantageous to conventional UT in – PA có lợi thế hơn UT thông thường trong:","a":["A. ability to steer multiple angles without changing the probes – Có khả năng điều khiển nhiều góc mà không cần thay đổi đầu dò.","B. ability to focus at different depths – Có khả năng hội tụ tại độ sâu khác nhau","C. ability of its one scan cover the whole weld – Có khả năng quét bao phủ toàn bộ mối hàn","D. all the above – Tất cả các đáp án trên"],"c":3,"e":"Công nghệ mảng pha (PAUT) sử dụng mạch điện tử để điều khiển độ trễ phát xung, cho phép quét nhiều góc (Sectorial scan), hội tụ ở nhiều độ sâu (DDF) và bao phủ thể tích kiểm tra lớn chỉ với một đầu dò."},{"q":"Câu 5. A phased array transducer is? -Một đầu dò PA là ?","a":["A. A ultrasonic probe with natural focusing and scanning abilities – Một đầu dò siêu âm có khả năng hội tụ và quét tự nhiên.","B. An ultrasonic probe that generates its own pulses – Một đầu dò siêu âm tạo bộ phát xung riêng.","C. A ultrasonic probe with separate elements that can be individually pulsed to offer electronic scanning, focused beams and angled inspections – Một đầu dò siêu âm với các biến tử riêng biệt có thể tạo xung riêng lẻ để cung cấp chức năng quét điện tử,hội tụ chùm âm và kiểm tra góc cạnh.","D. All the above are applicable – Tất cả các đáp án trên đều áp dụng."],"c":2,"e":"Đặc trưng cốt lõi của đầu dò PAUT là nó chứa một mảng nhiều biến tử (elements) siêu âm độc lập (thường từ 16 đến 128 biến tử). Mỗi biến tử có thể được kích hoạt riêng biệt theo một thời gian trễ nhất định để tạo hình chùm tia."},{"q":"Câu 6. When two or more waves superimpose resulting in high amplitude wave such a phenomena is called as -Khi hai hoặc nhiều sóng chồng lên nhau tạo thành sóng có biên độ cao hiện tượng đó được gọi là","a":["A. Destructive interference – Sự suy giảm giao thoa","B. Constructive interference – Sự tăng cường giao thoa","C. Diffraction – Nhiễu xạ","D. Mode conversion – Chuyển đổi chế độ"],"c":1,"e":"Khi các sóng âm đồng pha gặp nhau, biên độ của chúng cộng gộp lại tạo ra sóng có biên độ lớn hơn. Đây gọi là giao thoa tăng cường (Constructive interference), nguyên lý chính để tạo ra chùm tia cực mạnh trong PAUT."},{"q":"Câu 7. The delay applied on elements to obtain particular beam steering – Độ trễ được áp dụng trên các biến tử để có khả năng điều khiển chùm tia riêng biệt:","a":["A. increases with increase in pitch – Tăng khi khoảng cách giữa tâm của 2 biến tử tăng","B. decreases with increase in pitch – Giảm khi khoảng cách giữa tâm của 2 biến tử tăng","C. increases with decrease in pitch – Tăng khi giảm khoảng cách giữa tâm của 2 biến tử","D. is not dependent on pitch – Không phụ thuộc vào khoảng cách giữa tâm của 2 biến tử."],"c":0,"e":"Pitch (khoảng cách tâm giữa 2 biến tử) càng lớn thì chênh lệch thời gian đường đi của sóng từ các biến tử tới một điểm hội tụ càng xa. Do đó, cần áp dụng một khoảng thời gian trễ (delay) lớn hơn tương ứng."},{"q":"Câu 8. For a constant depth focus, increase in pitch size delay pattern will ? – Cho một độ sâu hội tụ không đổi, tăng độ trễ thì kích thước khoảng cách từ tâm biến tử này đến biến tử kia sẽ:","a":["A. Same – giống như nhau","B. Decreases – giảm","C. Increases - tăng","D. No relation between pitch and delay pattern – không có mối liên hệ giữa khoảng cách các biến tử và độ trễ."],"c":2,"e":"Độ trễ thời gian (Delay time) tỷ lệ thuận với kích thước Pitch. Do vậy, nếu độ sâu hội tụ không đổi mà yêu cầu độ trễ lớn hơn, đồng nghĩa với việc khoảng cách Pitch giữa các biến tử đã tăng lên."},{"q":"Câu 9. Delay value depends on the following factors – Giá trị độ trễ phụ thuộc vào yếu tố nào dưới đây:","a":["A. Element pitch or size – Khoảng cách và kích thước các biến tử","B. Refracted angles – các góc khúc xạ","C. Element position – Vị trí của biến tử","D. All the above – Tất cả đều đúng"],"c":3,"e":"Để tính toán luật phát (Focal law) cho một chùm tia, phần mềm cần biết: Vị trí của từng biến tử (pitch), góc muốn tạo ra (refracted angle), vật liệu nêm và vật kiểm tra. Vì vậy tất cả đều ảnh hưởng đến delay value."},{"q":"Câu 10. Which if the following delay pattern is used for beam steering – Loại kiểu độ trễ nào dưới đây dùng cho điều khiển chùm âm:","a":["A. Parabola – Parabol","B. Slant – Nghiêng","C. Slant and Parabola – Nghiêng và parabol","D. None of the above – Không có đáp nào ở trên"],"c":1,"e":"Để bẻ lái chùm tia (Steering), luật trễ áp dụng cho các biến tử tạo thành một đường nghiêng (Slant/Linear). Nếu muốn hội tụ (Focusing), dạng trễ sẽ là hình parabol."},{"q":"Câu 11. A Parabolic delay pattern shall be used for – Mô hình độ trễ dạng parabol nên được dùng cho:","a":["A. Beam Focussing – hội tụ chùm tia","B. Beam steering – lái chùm tia","C. Focussing + steering – hội tụ và lái chùm tia","D. Beam angling – tạo góc cho chùm tia"],"c":0,"e":"Mô hình độ trễ Parabol kích hoạt các biến tử ở rìa ngoài trước, sau đó giảm dần vào giữa. Điều này khiến mặt sóng lõm lại và hội tụ về một điểm (Beam Focussing)."},{"q":"Câu 12. As frequency increases, beam spread – Khi tăng tần số, độ mở rộng của chùm tia:","a":["A. Decreases - giảm","B. increases. - tăng","C. remains same. – vẫn giữ nguyên","D. beam spread does not depend on frequency. – Độ mở rộng chùm tia không phụ thuộc vào tần số"],"c":0,"e":"Góc phân kỳ chùm tia (Beam spread) có công thức tỉ lệ nghịch với tần số và kích thước biến tử: sin(θ) = 1.22 * λ / D. Do đó tần số càng cao -> bước sóng (λ) càng nhỏ -> chùm âm càng ít bị xòe (giảm)."},{"q":"CHAP 3 - Câu 1. Active aperture in phased array is – Khẩu độ hoạt động trong PA là ?","a":["A. Quantity of elements excited x pitch – số lượng biến tử hoạt động nhân với khoảng cách tâm của các biến tử.","B. Total no. of elements in the probe x pitch – Tổng số các biến tử trong 1 đầu dò nhân với khoảng cách tâm của các biến tử","C. Physical size of the probe – kích thước vật lý của đầu dò","D. All the above – tất cả các đáp án trên"],"c":0,"e":"Khẩu độ hoạt động (Active Aperture - A) là tổng chiều dài của dải biến tử đang thực sự phát xung tại một thời điểm. Công thức: A = số lượng biến tử phát cùng lúc (n) x khoảng cách Pitch (p)."},{"q":"Câu 2. Which part of the following are essential variables for the probe wedge combination: Phần nào sau đây là các biến số cần thiết cho sự kết hợp của nêm đầu dò ?","a":["A. Dimension from 1st element to end of wedge – Kích thước từ biến tử thứ 1 đến cuối nêm","B. Height of the 1st element – Chiều cao của biến tử thứ 1","C. Velocity of the wedge material – Vận tốc của v
