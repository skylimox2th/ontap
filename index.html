ật liệu nêm","D. All of the above – Tất cả các phương án trên"],"c":3,"e":"Để thiết bị PAUT tính toán chính xác đường đi của tia siêu âm (Beam exit point, Index offset) và luật phát, nó cần tất cả các thông số hình học của nêm, cũng như vận tốc truyền âm của chất liệu làm nêm."},{"q":"Câu 3. Passive aperture dimension in phased array examination – Kích thước khẩu độ thụ động trong kiểm tra PA là:","a":["A. Affects the detection capability – Ảnh hưởng đến khả năng phát hiện","B. Affects the sizing capability in active aperture plane - Ảnh hưởng đến khả năng xác định kích thước trong mặt phẳng khẩu độ hoạt động.","C. Affects the sizing capability in passive aperture plane – Ảnh hưởng đến khả năng kích cỡ trong mặt phẳng khẩu độ thụ động.","D. All the above are affected – Tất cả các điều trên đều bị ảnh hưởng."],"c":2,"e":"Khẩu độ thụ động (Passive aperture / Elevation plane) là bề rộng cố định của biến tử (không chia mảng). Nó quyết định chiều cao chùm tia trong mặt phẳng không điều khiển, từ đó ảnh hưởng tới độ phân giải trong mặt phẳng thụ động."},{"q":"Câu 4. The ability to distinguish between the initial echo and a defect close to the near surface... – Khả năng phân biệt giữa âm dội ban đầu và một khuyết tật ở gần bề mặt... được gọi là ?","a":["A. Far surface resolution – Độ phân giải bề mặt xa","B. Near Surface resolution – Độ phân giải bề mặt gần","C. Axial resolution - Độ phân giải hướng trục","D. Lateral Resolution – Độ phân giải cạnh"],"c":1,"e":"Initial echo là xung do bề mặt tiếp xúc tạo ra. Nếu khuyết tật nằm quá sát bề mặt này, xung của nó sẽ bị hòa vào initial echo. Khả năng tách biệt chúng được gọi là Độ phân giải bề mặt gần (Near surface resolution)."},{"q":"Câu 5. The ability to distinguish between the back wall echo and a defect close to the back wall... – Khả năng phân biệt giữa xung phản xạ từ bề mặt đáy và một khuyết tật ở gần bề mặt đáy... được gọi là ?","a":["A. Far surface resolution – Độ phân giải bề mặt xa","B. Near Surface resolution -Độ phân giải bề mặt gần","C. Axial resolution – Độ phân giải hướng trục","D. Lateral Resolution – Độ phân giải ngang"],"c":0,"e":"Back wall echo là xung phản dội từ đáy phôi. Khả năng phát hiện một khuyết tật nằm cực sát vùng đáy này mà không bị xung đáy lấn át được gọi là Độ phân giải bề mặt xa (Far surface resolution)."},{"q":"Câu 6. Linear 1 D probes have the following features compared to other type of transducers – Đầu dò tuyến tính 1D có các tính năng so với các loại đầu dò khác (ma trận hoặc hình khuyên) .","a":["A. Easy to manufacture – Dễ dàng sản xuất","B. Costs less that other type – Chi phí thấp hơn loại khác","C. Easy programming and simulation – Lập trình và mô phỏng dễ dàng","D. All the above – Tất cả các đáp án trên"],"c":3,"e":"Đầu dò Linear 1D chỉ cắt mảng theo một chiều dọc. Do cấu tạo đơn giản, nó rẻ hơn, dễ chế tạo và phần mềm phân tích/tính toán luật hội tụ cũng nhẹ hơn nhiều so với đầu dò Matrix 2D."},{"q":"Câu 7. For 5L128 Transducer used on 64/128 maximum active aperture is always measured as – Đối với đầu dò 5L128 sử dụng khẩu độ hoạt động tối đa 64/128 luôn được đo bằng ?","a":["A. total no. of active elements X pitch","B. Total no. of pulsers X pitch – Tổng số bộ tạo xung nhân với khoảng cách tâm giữa 2 biến tử","C. no. of active elements chosen X pitch","D. all the above - Tất cả các đáp án trên"],"c":1,"e":"Máy PAUT 64/128 nghĩa là phần cứng chỉ có 64 bộ phát xung (pulsers) hoạt động đồng thời. Dù đầu dò có 128 biến tử, khẩu độ lớn nhất cũng chỉ kích hoạt được 64 biến tử cùng lúc (64 x Pitch)."},{"q":"Câu 8. Which part of the following is not an essential variables for the probe wedge combination: - Phần nào dưới đây không phải là một biến số cần thiết cho sự kết hợp nêm đầu dò ?","a":["A. Dimension from 1st element to end of wedge – Kích thước từ biến tử thứ 1 đến cuối của nêm.","B. Height of the 1st element – Chiều cao của biến tử thứ 1","C. Encoder calibration – Hiệu chuẩn bộ mã hóa","D. Velocity of the wedge material – vận tốc của vật liệu nêm."],"c":2,"e":"Bộ mã hóa (Encoder) dùng để ghi lại khoảng cách cơ học của cơ cấu di chuyển (scan), không liên quan đến cấu tạo vật lý hay toán học của chùm tia siêu âm đi qua Nêm - Đầu dò."},{"q":"Câu 9. The role of a wedge in phased array based inspection is very important. What will happen when you select wrong wedge in the software.- Vai trò của nêm trong kiểm tra PA... Điều gì sẽ xảy ra nếu bạn chọn sai nêm trong phần mềm ?","a":["A. Test data shall be corrected before analysis – Dữ liệu phải kiểm tra chính xác trước khi phân tích","B. Test data might be incorrect, need re-scan – Dữ liệu có thể không chính xác ,cần quét lại","C. Depends on which wedge you selected – Phụ thuộc vào loại nêm bạn đã chọn","D. All of the above statements applies – Tất cả các phát biểu trên đều được áp dụng."],"c":1,"e":"Nếu chọn sai Nêm, máy sẽ tính toán sai luật trễ (Delay laws), dẫn đến chùm âm phát ra sai góc, sai hội tụ. Dữ liệu siêu âm thu được hoàn toàn mất giá trị định vị khuyết tật, bắt buộc phải thiết lập lại và quét lại."},{"q":"Câu 10. What is L in 5L32 – Kí hiệu “ L ‘’ Trong 5L32 có nghĩa là gì ?","a":["A. Annular Probe – Đầu dò hình khuyên","B. Matrix Probe – Đầu dò ma trận","C. Designates longitudinal wave – Ký hiệu sóng dọc","D. Designates linear probe- element layout - Ký hiệu mạng lưới biến tử đầu dò tuyến tính"],"c":3,"e":"Theo quy ước đặt tên PAUT: Số đầu tiên (5) = Tần số 5 MHz. Chữ L = Linear (Biến tử xếp theo 1 hàng tuyến tính). Số cuối (32) = Tổng số biến tử trong đầu dò."},{"q":"Câu 11. What is the common type of probe used in weld examination – Loại đầu dò thường dùng trong kiểm tra mối hàn ?","a":["A. Linear - Đầu dò thẳng tuyến tính","B. Matrix Probe – Đầu dò ma trận","C. Annular – Đầu dò hình khuyên","D. 1.5 D linear – Đầu dò thẳng 1.5 D"],"c":0,"e":"Đầu dò Linear (1D) là phổ biến và tiêu chuẩn nhất trong kiểm tra mối hàn nhờ khả năng tạo chùm Sectorial Scan hoặc Linear scan, giá thành hợp lý và độ bao phủ hàn hoàn hảo."},{"q":"Câu 12. The ability to resolve two adjacent defects separated by small depth (sound path) is called as – Khả năng phân giải 2 khuyết tật liền kề tách biệt bởi độ sâu nhỏ( đường truyền âm) được gọi là ?","a":["A. Far surface resolution – Độ phân giải của bề mặt xa","B. Near Surface resolution – Độ phân giải của bề mặt gần","C. Axial resolution – Độ phân giải hướng trục","D. Lateral Resolution – Độ phân giải ngang"],"c":2,"e":"Hai khuyết tật nằm chồng lên nhau dọc theo trục truyền sóng (sound path/depth) được phân biệt nhờ Độ phân giải hướng trục (Axial Resolution). Độ phân giải này phụ thuộc vào chiều dài xung."},{"q":"Câu 13. Good Axial resolution can be achieved by – Độ phân giải hướng trục có thể đạt được bằng cách ?","a":["A. Short pulse duration – Thời lượng xung ngắn","B. Highly damped probes – Đầu dò có độ làm nhụt lớn","C. High frequency probes – Đầu dò có tần số cao","D. All the above – Tất cả các câu trên"],"c":3,"e":"Để phân giải 2 mục tiêu sát nhau theo chiều sâu, xung âm cần cực kỳ ngắn (Short pulse). Để có xung ngắn, ta cần đầu dò tần số cao (High freq) và vật liệu cản âm tốt phía sau (Highly damped) để cắt đuôi xung nhanh."},{"q":"Câu 14. Long pulse duration will produce – Thời lượng xung phát dài sẽ tạo ra ?","a":["A. Poor axial resolution - Độ phân giải hướng trục kém.","B. Good axial resolution - Độ phân giải hướng trục tốt","C. Good Lateral resolution - Độ phân giải ngang tốt","D. None of the above - Không có câu nào ở trên"],"c":0,"e":"Xung phát dài sẽ làm cho chùm âm bị kéo giãn trên trục truyền âm. Nếu 2 khuyết tật nằm gần nhau, 2 xung dội về sẽ chập vào nhau (overlap), làm suy giảm độ phân giải hướng trục (Axial resolution)."},{"q":"Câu 15. Calculate the Maximum active Aperture for the 5L32Probe, pitch 0.6mm with 16:128 Equipment. – Tính toán khẩu độ hoạt động tối đa cho đầu dò 5L32, Pitch 0.6 với thiết bị 16:128.","a":["A. 15mm","B. 9.6mm","C. 12mm","D. 19.2mm"],"c":1,"e":"Thiết bị là 16:128 -> Tối đa phát cùng lúc 16 biến tử. Đầu dò có Pitch = 0.6mm. Vậy khẩu độ hoạt động A = số biến tử (n) x pitch (p) = 16 x 0.6 = 9.6mm."},{"q":"Câu 16. Calculate the Maximum active Aperture for the 5L64 Probe, pitch 0.6mm, active elements 20, with 32:128 Equipment. - Tính toán khẩu độ hoạt động tối đa cho đầu dò, Pitch 0,6mm, số biến tử hoạt động 20, với thiết bị 32:128","a":["A. 15mm","B. 9.6mm","C. 12mm","D. 19.2mm"],"c":2,"e":"Khẩu độ hoạt động (Active Aperture) = Số biến tử đang hoạt động (20) x Khoảng cách tâm Pitch (0.6mm). Ta có: A = 20 x 0.6 = 12mm."},{"q":"Câu 17. The ability to resolve two adjacent defects of same depth (range/sound path) along the acoustical is called as – Khả năng phân giải 2 khuyết tật liền kề cùng độ sâu (dải/đường truyền âm) dọc theo đường âm được gọi là","a":["A. Far surface resolution – Độ phân giải bề mặt xa","B. Near Surface resolution – Độ phân giải bề mặt gần","C. Axial resolution – Độ phân giải hướng trục","D. Lateral Resolution – Độ phân giải ngang"],"c":3,"e":"Khi 2 khuyết tật nằm cạnh nhau ở cùng một độ sâu, việc chùm siêu âm có tách biệt được chúng hay không phụ thuộc vào bề rộng chùm tia (Beam width). Đặc tính này gọi là Độ phân giải ngang (Lateral Resolution)."},{"q":"Câu 18. Long pulse duration with a narrow beam width will produce – Thời lượng xung dài với độ rộng chùm âm hẹp sẽ tạo ra:","a":["A. Good lateral resolution – Độ phân giải ngang tốt","B. Good lateral resolution and poor axial resolution – Độ phân giải ngang tốt và độ phân giải hướng trục kém","C. Good lateral resolution and near surface resolution - Độ phân giải ngang và độ phân giải gần bề mặt tốt","D. Poor lateral and axial resolution – Độ phân giải ngang và độ phân giải hướng trục kém"],"c":1,"e":"Chùm âm hẹp (Narrow beam) giúp phân biệt tốt các điểm nằm cạnh nhau (Lateral resolution tốt). Xung thời gian dài (Long pulse) làm nhòe tín hiệu theo chiều sâu (Axial resolution kém)."},{"q":"Câu 19. For 5L128, pitch 0.6mm Transducer used on 64/128 phased array system using maximum elements on fire, active aperture is - Cho đầu dò 5L128 với pitch 0.6 sử dụng trên hệ thống PA 64/128 chùm âm sử dụng tối đa các biến tử, khẩu độ hoạt động là:","a":["A. 32mm","B. 64mm","C. 38 mm","D. 54 mm"],"c":2,"e":"Hệ thống 64/128 => số biến tử hoạt động tối đa (n) = 64. Pitch (p) = 0.6mm. Khẩu độ hoạt động A = n x p = 64 x 0.6 = 38.4 mm (làm tròn 38mm)."},{"q":"Câu 20. Resolution is increased by – Độ phân giải tăng bởi:","a":["A. focusing in the range of interest – Tập trung vào phạm vi cần quan tâm","B. focusing beyond range of interest – Tập trung ngoài phạm vi cần quan tâm","C. none of the above – Không có câu nào ở trên"],"c":0,"e":"Khi thiết lập Focus (Hội tụ) tại đúng độ sâu của vùng khuyết tật (Range of interest), chùm âm tại đó sẽ bị bóp hẹp nhất, mật độ năng lượng cao nhất, từ đó cho độ phân giải ngang (Lateral resolution) sắc nét nhất."},{"q":"CHAP 4 - Câu 1. What are the advantages of increasing the number of elements used to direct an angle into material?/ Ưu điểm của việc tăng số lượng biến tử dùng để định hướng một góc vào vật liệu là gì?","a":["A. Increased steering./ Tăng khả năng lái","B. Decreased focal spot size./ Giảm kích thước tiêu điểm","C. Increase S/N ratio./ Tăng tỉ lệ S/N (tín hiệu trên nhiễu)","D. All of the above./ Tất cả đáp án trên"],"c":3,"e":"Đáp án D: Tăng số lượng biến tử đồng nghĩa với việc tăng khẩu độ hoạt động (Active Aperture). Khẩu độ lớn giúp chùm tia có năng lượng mạnh hơn (tăng SNR), khả năng bẻ góc (steering) tốt hơn và tiêu điểm hội tụ sắc nét hơn (giảm kích thước vết tiêu điểm)."},{"q":"Câu 2. Which of the following is true regarding near field distances?/ Điều nào sau đây là đúng khi nói về khoảng cách trường gần?","a":["A. Near field length is dependent upon effective probe aperture, wedge used and the specific refracted angle generated/ Độ dài trường gần phụ thuộc vào khẩu độ hiệu dụng đầu dò, nêm được sử dụng và góc khúc xạ cụ thể được tạo ra.","B. Near field length does not change with refracted angle/ Độ dài trường gần không thay đổi theo góc khúc xạ","C. Near fields are always calculated using only the probe aperture/ Các trường gần luôn được tính toán chỉ bằng khẩu độ đầu dò.","D. All of the above are true regarding near fields/ Tất cả những điều trên đều đúng đối với các trường gần"],"c":0,"e":"Đáp án A: Trong PAUT, trường gần (Near field) không chỉ phụ thuộc vào tần số và kích thước biến tử mà còn bị ảnh hưởng bởi quá trình truyền âm qua nêm (vận tốc âm trong nêm) và sự thay đổi khẩu độ hiệu dụng theo từng góc khúc xạ."},{"q":"Câu 3. To increase the detection and sizing of near surface defect, it is recommended that the operator:/ Để tăng khả năng phát hiện và định cỡ khuyết tật bề mặt gần, người vận hành nên:","a":["A. Uses more elements/ Sử dụng nhiều biến tử hơn","B. Uses less elements/ Sử dụng ít biến tử hơn","C. Decreases the frequency/ Giảm tần số","D. Increases the pitch/ Tăng khoảng cách"],"c":1,"e":"Đáp án B: Sử dụng ít biến tử hơn (khẩu độ nhỏ lại) sẽ làm giảm khoảng cách trường gần (Near field). Điều này giúp vùng hội tụ và độ nhạy kéo gần lại phía bề mặt kiểm tra, giúp phát hiện khuyết tật sát bề mặt tốt hơn."},{"q":"Câu 4. What is the main factor which affects the ability to steer the beam:/ Yếu tố chính nào ảnh hưởng đến khả năng điều khiển chùm tia:","a":["A. Element position along the array/ Vị trí biển tử dọc theo mảng","B. Element width (size) and pitch/ Chiều rộng (kích thước) và khoảng cách biến tử","C. Element height/ Chiều cao biến tử","D. Element’s passive exist/ Tồn tại thụ động của biến tử"],"c":1,"e":"Đáp án B: Chiều rộng biến tử (Element width) và khoảng cách giữa chúng (Pitch) quyết định giới hạn góc bẻ lái (Steering limit). Nếu Pitch quá lớn so với bước sóng, chùm tia sẽ sinh ra các thùy cách tử (Grating lobes) gây nhiễu và làm mất khả năng lái tia."},{"q":"Câu 5. The difference between Linear scanning and sectorial scanning/ Sự khác biệt giữa quét tuyến tính và quét hình quạt:","a":["A. Different focal laws are applied on different element to obtain linear sector while same focal laws are applied for sectorial scanning/ Các luật phát khác nhau được áp dụng trên biến tử khác nhau để thu được chùm tia linear...","B. Different focal laws are applied on different elements for sectorial and same focal laws are applied for all elements to obtain linear scanning/ Các luật phát khác nhau được áp dụng trên các biến tử khác nhau ở quét hình quạt và các luật phát giống nhau được áp dụng cho tất cả các biến tử để thu được quét tuyến tính","C. Linear scanning can be performed with different angles while sectorial by same angle./ Quét tuyến tính có thể được thực hiện với các góc khác nhau...","D. Linear scanning cannot be performed with longitudinal wave./ Quét tuyến tính không thể được thực hiện với sóng dọc."],"c":1,"e":"Đáp án B: Quét Linear sử dụng CÙNG MỘT luật trễ (same focal laws) di chuyển dọc theo dải biến tử để quét ra một chùm tia song song. Quét Sectorial sử dụng CÁC LUẬT TRỄ KHÁC NHAU (different focal laws) trên cùng một nhóm biến tử để thay đổi góc liên tục tạo hình quạt."},{"q":"Câu 6. Which of the following defects would probably be missed/ Khuyết tật nào sau đây có thể sẽ bị bỏ qua:","a":["A. Defect A/ Khuyết tật A","B. Defect B/ khuyết tật B","C. Defect C/ Khuyết tật C","D. Both Defect B and C/ khuyết tật B và C"],"c":3,"e":"Đáp án D: Trong siêu âm, khuyết tật nằm dọc (như khuyết tật B và C) song song với hướng truyền của chùm tia siêu âm sẽ cung cấp tiết diện phản xạ rất nhỏ, do đó rất dễ bị bỏ sót nếu không quét bằng nhiều góc độ (Sectorial) hoặc dùng kỹ thuật nhiễu xạ (TOFD)."},{"q":"Câu 7. Effective near field is dependent on/ Trường gần hiệu dụng phụ thuộc vào:","a":["A. Incident angle in wedge/ Góc tới trong nêm","B. Refracted angle of wedge/ Góc khúc xạ của nêm","C. Effective near field is same as near field/ Trường gần hiệu dụng giống như trường gần","D. Both A & B above/ Cả A và B"],"c":3,"e":"Đáp án D: Trường gần hiệu dụng (Effective near field) trong PAUT được tính bằng cách bù trừ chiều dài đường truyền âm qua nêm, do đó nó phụ thuộc vào cả Góc tới trong nêm (Incident angle) và Góc khúc xạ vào vật liệu (Refracted angle)."},{"q":"Câu 8. Strong focusing power is obtained when focusing is performed/ Có được khả năng hội tụ mạnh mẽ khi thực hiện hội tụ","a":["A. 0.1 to 0.29 focusing coefficient/ 0.1 đến 0.29 hệ số hội tụ","B. 0.1 to 0.67 focusing coefficient/ 0.1 đến 0.67 hệ số hội tụ","C. 0.67 to 1.0 focusing coefficient/ Hệ số hội tụ từ 0.67 đến 1.0","D. None of the above is true/ Không có điều nào ở trên là đúng"],"c":0,"e":"Đáp án A: Hệ số hội tụ (Focusing coefficient) càng nhỏ (đặc biệt trong dải 0.1 - 0.29) thì sự chênh lệch năng lượng và độ nén chùm tia (pinching) càng lớn, tạo ra chùm âm được hội tụ siêu mạnh tại điểm đó."},{"q":"Câu 9. Apodization is defined as/ Sự cách điệu (Apodization) được định nghĩa là:","a":["A. The phased array probe length/ Chiều dài đầu dò mảng pha","B. A feature that applies lower voltage to the outside elements to reduce grating lobes/ Một tính năng áp dụng điện áp thấp hơn cho các phần tử bên ngoài để giảm các thùy cách tử","C. The capability to modify the refracted beam generated by the probe array/ Khả năng điều chỉnh chùm tia khúc xạ","D. The same as a sectorial scan / Tương tự như quét theo hình quạt"],"c":1,"e":"Đáp án B: Apodization là kỹ thuật cung cấp điện áp kích thích mạnh ở các biến tử trung tâm và giảm dần điện áp về phía các biến tử rìa ngoài. Điều này giúp triệt tiêu năng lượng của các thùy nhiễu (Grating lobes/Side lobes)."},{"q":"Câu 10. Determine the limit of focus for 7.5L64 transducer with a pitch of 0.59mm used on 32/128 PA equipment for a test material 5.9mm/μSec./ Tính giới hạn độ hội tụ?","a":["A. 54mm","B. 32mm","C. 114mm","D. 108mm"],"c":2,"e":"Đáp án C: Khẩu độ A = 32 x 0.59 = 18.88mm. Bước sóng Lambda = V/f = 5.9 / 7.5 = 0.786 mm. Giới hạn hội tụ (Near field) N = (A^2) / (4 x Lambda) = (18.88^2) / (4 x 0.786) ≈ 113.3 mm (Gần nhất với 114mm)."},{"q":"Câu 11. Calculate the Beam width at the limit of focus for the above problem/ Tính độ rộng chùm tia tại giới hạn hội tụ cho bài toán trên","a":["A. 2.4mm","B. 4.8mm","C. 1.2mm","D. 3mm"],"c":1,"e":"Đáp án B: Công thức tính Beam diameter tại vị trí hội tụ: BD ≈ A x 0.2568. Ta có Khẩu độ A = 18.88mm. BD = 18.88 x 0.2568 ≈ 4.84 mm (Kết quả 4.8mm)."},{"q":"Câu 12. Grating lobes occur when/ Thùy lưới (thùy cách tử) xảy ra khi","a":["A. element size is less than wavelength./ kích thước biến tử nhỏ hơn bước sóng.","B. pitch is less than wave length/ khoảng cách nhỏ hơn chiều dài sóng","C. element size is equal to or more than wavelength./ kích thước biến tử bằng hoặc lớn hơn bước sóng.","D. All of the above./ Tất cả những điều trên."],"c":2,"e":"Đáp án C: Thùy cách tử (Grating lobes) là sóng nhiễu nguy hiểm sinh ra do cấu tạo mảng của đầu dò. Nó xuất hiện khi Pitch (hoặc kích thước biến tử Element size) lớn hơn hoặc bằng bước sóng (Lambda) của tần số đang kiểm tra."},{"q":"Câu 13. Calculate the beam width size you can achieve for the following data, (No. of elements: 32, pitch: 0.9mm, Frequency:5MHz, Velocity:6000m/s)","a":["A. 10mm","B. 7mm","C. 8mm","D. 3mm"],"c":1,"e":"Đáp án B: V = 6000m/s = 6mm/μs. Bước sóng Lambda = 6/5 = 1.2mm. Khẩu độ A = 32 x 0.9 = 28.8mm. Chiều dài trường gần N = (28.8^2) / (4x1.2) = 172.8mm. Độ rộng chùm tia B = (N x Lambda) / A = (172.8 x 1.2) / 28.8 = 7.2mm (Gần nhất 7mm)."},{"q":"Câu 14. As element size is increased/ Khi kích thước biến tử tăng lên:","a":["A. Beam steering is affected/ Lái chùm tia bị ảnh hưởng","B. Beam steering is improved/ Hệ thống lái chùm tia được cải thiện","C. Beam steering can be achieved for wide sweep range./ Có thể lái chùm tia cho phạm vi quét rộng.","D. All of the above/ tất cả những điều trên"],"c":0,"e":"Đáp án A: Kích thước biến tử càng lớn thì càng dễ vi phạm điều kiện Pitch < Bước sóng. Lúc này khi bẻ lái góc cao sẽ sinh ra các thùy cách tử (Grating lobes) làm mất năng lượng và nhiễu sóng, khiến việc lái chùm tia bị ảnh hưởng nghiêm trọng."},{"q":"Câu 15. Near Field is given by {A*A / 4*Lambda). Calculate the maximum focal distance... frequency of 5MHz, velocity 5920m/s, elements 32, pitch 0.6mm.","a":["A. 312","B. 112","C. 78","D. 85"],"c":2,"e":"Đáp án C: Vận tốc V = 5.92 mm/μs. Tần số f = 5 MHz -> Bước sóng Lambda = 1.184 mm. Khẩu độ A = 32 x 0.6 = 19.2 mm. Khoảng cách trường gần (Focal distance max) N = (19.2^2) / (4 x 1.184) = 77.8 mm."},{"q":"Câu 16. When you have detected defects by both lower and higher angle in Phased array sectorial scan (45 - 70 degrees). Which one you think will have large depth of field/ Một khuyết tật được phát hiện tại góc cao và góc thấp... Góc nào có ảnh hưởng độ sâu trường nhất ?","a":["A. Lower Angle/ Góc dưới","B. Higher angle/ Góc cao hơn","C. Both the above/ Cả hai điều trên","D. None of the above/ Không đáp án nào ở trên"],"c":1,"e":"Đáp án B: Khi bẻ góc càng lớn (Góc cao - Higher angle), khẩu độ hiệu dụng của đầu dò bị thu hẹp lại theo định lý hình chiếu (A*cosθ). Khẩu độ nhỏ hơn sẽ làm giảm khả năng hội tụ nhưng lại kéo dài Depth of Field (Độ sâu trường hội tụ)."},{"q":"Câu 17. What is the reason for your answer for the above question?/ Lý do bạn trả lời câu hỏi trên là gì?","a":["A. Beam width decreases as angle increases/ Độ rộng chùm tia giảm khi góc tăng","B. Beam width reduces as angle decreases/ Độ rộng chùm tia giảm khi góc giảm","C. Beam Width remains same as angle increases / Chiều rộng chùm tia vẫn giữ nguyên khi tăng góc","D. None of the above/ Không có điều nào ở trên"],"c":1,"e":"Đáp án B: Ở góc chùm tia thấp (góc giảm), khẩu độ hiệu dụng lớn nên khả năng ép chùm tia (focus) mạnh hơn, khiến bề rộng chùm tia hẹp lại (Beam width reduces)."},{"q":"Câu 18. Grating lobes are generated by which of the following/ Các thùy cách tử được tạo ra bởi yếu tố nào sau đây","a":["A. Even sampling/ Các biến tử cách nhau đều đặn","B. Uneven sampling/ Biến tử cách nhau không đồng đều","C. Decreasing frequency/ Giảm tần số","D. All of the above/ Tất cả những điều trên"],"c":0,"e":"Đáp án A: Thùy cách tử (Grating lobes) là hiện tượng giao thoa phụ sinh ra do sự phân bổ đều đặn và chu kỳ (Even sampling) của các biến tử trên mảng đầu dò giống như một cách tử nhiễu xạ quang học."},{"q":"Câu 19. Grating lobes may be reduced by/ Thùy lưới có thể được giảm bớt bằng cách","a":["A. Increasing pitch size/ Tăng kích thước khoảng cách","B. Increasing frequency/ Tăng tần số","C. Subdicing/ Cắt bớt biến tử","D. All of the above/ tất cả những điều trên"],"c":2,"e":"Đáp án C: Kỹ thuật Subdicing là việc cắt một biến tử lớn thành nhiều biến tử nhỏ (thu nhỏ Element size và Pitch), giúp thỏa mãn điều kiện Pitch < Bước sóng (Lambda), từ đó triệt tiêu sự hình thành của thùy cách tử."},{"q":"Câu 20. Limit of focus is limited to/ Giới hạn hội tụ là được giới hạn ở:","a":["A. near field/ Trường gần","B. Aperture size/ Kích thước khẩu độ","C. element size/ Kích thước biến tử","D. all the above/ tất cả những điều trên"],"c":0,"e":"Đáp án A: Trong siêu âm mảng pha, bạn chỉ có thể lập trình để hội tụ (Focus) chùm tia ở khoảng cách nằm TRONG phạm vi Trường gần (Near field). Vượt ra khỏi trường gần, chùm tia sẽ tự động phân kỳ và không thể hội tụ được nữa."},{"q":"Câu 21. Determine the limit of focus for 2.5L64 transducer with a pitch of 0.59mm used on 32/128 PA equipment for a test material 5.9mm/μSec.","a":["A. 54mm","B. 38mm","C. 114mm","D. 108mm"],"c":1,"e":"Đáp án B: A = 32 x 0.59 = 18.88 mm. Bước sóng Lambda = 5.9 / 2.5 = 2.36 mm. N = (18.88^2) / (4 x 2.36) = 37.76 mm (Làm tròn 38mm)."},{"q":"Câu 22. Which one of the following has large focusing distance/ Đáp án nào sau đây có khoảng cách hội tụ lớn","a":["A. 5L64, element qty 32, pitch 1 mm","B. 5L128, element qty 32, pitch 1mm","C. both A & B/ Cả A và B","D. None of the above"],"c":2,"e":"Đáp án C: Cả 2 trường hợp đều dùng tần số 5MHz, cùng sử dụng số lượng biến tử là 32 và Pitch = 1mm. Do đó khẩu độ A và tần số là như nhau, dẫn đến khoảng cách hội tụ (Near field) của cả 2 hệ thống là hoàn toàn bằng nhau và lớn."},{"q":"Câu 23. Sizing Height of defect depends on/ Kích thước Chiều cao của khuyết tật phụ thuộc vào","a":["A. Depth of defect/ Độ sâu khuyết tật","B. Focal depth/ Độ sâu hội tụ","C. Angle at which detected/ góc phát hiện","D. All of the above/ tất cả những điều trên"],"c":3,"e":"Đáp án D: Khi đo chiều cao khuyết tật bằng PAUT, độ phân giải chùm tia bị chi phối bởi độ sâu hội tụ, góc chùm tia lúc đập vào khuyết tật và độ sâu thực tế của khuyết tật. Do đó tất cả đều ảnh hưởng đến kết quả đo."},{"q":"Câu 24. Depth of field depends on/ Độ sâu trường phụ thuộc vào","a":["A. Focal depth/ Độ sâu hội tụ","B. Beam Dimension/ Kích thước chùm tia","C. Both a and b/ Cả a và b","D. None of the above/ Không có điều nào ở trên"],"c":2,"e":"Đáp án C: Độ sâu trường (Depth of Field) là phạm vi mà chùm tia duy trì được độ sắc nét quanh tiêu điểm. Nó bị chi phối bởi chính khoảng cách của điểm hội tụ đó (Focal depth) và kích thước mở rông hình học của chùm tia (Beam Dimension)."},{"q":"Câu 25. If the focussing factor or power increases, focal depth and depth of field will/ Nếu hệ số hội tụ hoặc công suất tăng, độ sâu hội tụ và độ sâu trường sẽ","a":["A. Increase and decreases/ Tăng và giảm","B. Both increases/ cùng tăng","C. Decrease and increase/ Giảm và tăng","D. Both decreases/ Cùng giảm"],"c":3,"e":"Đáp án D: Năng lượng hội tụ càng mạnh (Pinching mạnh) thì chùm tia bị bóp nghẹt tại một điểm rất ngắn và rất gần. Do đó cả tiêu cự (Focal depth) và dải hội tụ sắc nét (Depth of field) đều bị thu hẹp (giảm) lại."},{"q":"Câu 26. Grating lobes can be minimized if/ Thùy lưới có thể được giảm thiểu nếu","a":["A. Element width is greater than λ/ Độ rộng biến tử lớn hơn λ","B. Element width is less than λ/ Chiều rộng biến tử nhỏ hơn λ","C. Element width is less than ½ λ/ Chiều rộng biến tử nhỏ hơn ½ λ","D. Element width is greater than 2λ/ Chiều rộng biến tử lớn hơn 2 λ"],"c":2,"e":"Đáp án C: Theo nguyên lý PAUT, để triệt tiêu hoàn toàn sự xuất hiện của các thùy cách tử (Grating lobes) ở bất kỳ góc lái nào từ -90 đến 90 độ, khoảng cách (Pitch) và độ rộng biến tử cần phải nhỏ hơn một nửa bước sóng (λ/2)."},{"q":"Câu 27. Reducing the Pitch size and increasing the number of elements will affect the grating lobe amplitude/ Giảm kích thước Pitch và tăng số lượng biến tử sẽ ảnh hưởng đến biên độ thùy cách tử","a":["A. Increases/ Tăng","B. Decreases/ Giảm","C. Remains same/ Vẫn giữ nguyên","D. No grating lobes/ Không có thùy lưới"],"c":1,"e":"Đáp án B: Việc giảm Pitch xuống nhỏ hơn bước sóng sẽ dập tắt nhiễu cách tử. Tuy nhiên nếu chưa đạt đến mức triệt tiêu hoàn toàn (như λ/2), việc giảm Pitch kết hợp tăng số lượng biến tử sẽ giúp hạ thấp đáng kể biên độ của các thùy nhiễu này (Giảm)."},{"q":"Câu 28. Dead elements in a phased array probe can cause/ Các biến tử chết trong đầu dò mảng pha có thể gây ra","a":["A. Missing data/ Dữ liệu bị mất","B. Couplant loss/ Mất chất ghép","C. Strong grating lobes/ Thùy lưới mạnh","D. Black lines/ Đường màu đen"],"c":2,"e":"Đáp án C: Biến tử bị hỏng (Dead element) làm gián đoạn chuỗi phát sóng liên tục của mảng, phá vỡ tính đồng nhất (hoặc lớp Apodization). Sự ngắt quãng này tạo ra các khe hở phát sinh giao thoa phụ, hình thành các thùy cách tử (Grating lobes) rất mạnh làm nhiễu dữ liệu."},{"q":"Câu 29. To achieve better focussing, which of the following statement is true/ Để đạt được khả năng hội tụ tốt hơn, câu nào sau đây là đúng","a":["A. More the active elements, beam width is decreased and better the focussing/ Càng có nhiều biến tử hoạt động, độ rộng chùm tia giảm và khả năng hội tụ tốt hơn","B. More the active elements, beam width is increased and better the focussing/ Nhiều biến tử hoạt động hơn, độ rộng chùm tia được tăng lên và khả năng hội tụ tốt hơn","C. Less active elements, beam width is decreased/ Các biến tử ít hoạt động hơn, độ rộng chùm tia giảm","D. None of the above/ Không có điều nào ở trên"],"c":0,"e":"Đáp án A: Càng tăng số lượng biến tử (Active elements), khẩu độ (Aperture) càng lớn. Khẩu độ lớn tạo ra một hiệu ứng bóp chùm tia mạnh hơn, giúp Beam Width hẹp lại (giảm) và kết quả hội tụ tại tiêu điểm sắc nét hơn."},{"q":"Câu 30. Which of the following factors affects the beam width/ Yếu tố nào sau đây ảnh hưởng đến độ rộng chùm tia","a":["A. Beam width increase as beam angle increases/ Độ rộng chùm tia tăng khi góc chùm tia tăng","B. Beam width increase as Focal depth increases/ Độ rộng chùm tia tăng khi Độ sâu hội tụ tăng","C. Beam width decreases as beam angle increases/ Độ rộng chùm tia giảm khi góc chùm tia tăng","D. Both A and B/ Cả A và B"],"c":3,"e":"Đáp án D: Chiều rộng chùm tia (Beam width) tỷ lệ thuận với Khoảng cách (Focal depth) – hội tụ càng xa chùm tia càng to. Đồng thời, khi góc lái tăng, khẩu độ hiệu dụng bị thu nhỏ theo dạng hình chiếu (cos góc), dẫn đến chùm tia cũng bị loe rộng ra."},{"q":"Câu 31. As the beam is steered through various angles, the beam width/ Khi chùm tia được điều khiển theo các góc khác nhau, chiều rộng chùm tia","a":["A. Narrows/ Thu hẹp","B. Remains unchanged/ Vẫn không thay đổi","C. Broadens/ Mở rộng","D. Changes only after some angle is reached/ Chỉ thay đổi khi đạt đến một số góc"],"c":3,"e":"Đáp án D: Theo tài liệu gốc, đáp án chính xác được đánh dấu đỏ là D. Thông thường độ rộng chùm sẽ tăng khi bẻ góc lớn do giảm khẩu độ hiệu dụng."},{"q":"Câu 32. If a linear scan is being performed and each VPA uses 16 elements with e being 0.6mm and g 1 mm, how large is a single VPA?","a":["A. 32 mm","B. 10 mm","C. 25 mm","D. Equal to total aperture length./ Bằng tổng chiều dài khẩu độ."],"c":2,"e":"Đáp án C: Kích thước 1 biến tử e = 0.6mm, khe hở g = 1mm => Pitch khoảng cách tâm p = e + g = 1.6mm. Khẩu độ 1 VPA (16 biến tử) = (16 - 1) x 1.6 + 0.6 = 24.6 mm. Đáp án xấp xỉ gần nhất là 25mm."},{"q":"Câu 33. Calculate the limit of focus for 5L32 probe with pitch 1mm in steel with a velocity of 5920m/s. Equipment used is 16:128./ Tính giới hạn độ hội tụ ?","a":["A. 52","B. 32","C. 78","D. 85"],"c":0,"e":"Đáp án A: Thiết bị 16:128 nên khẩu độ tối đa là 16 biến tử. A = 16 x 1 = 16mm. Lambda = 5.92 / 5 = 1.184mm. N = (16^2) / (4 x 1.184) = 54mm. Tài liệu chọn đáp án A (52) là giá trị tiệm cận nhất được thiết lập cho bài toán này."},{"q":"Câu 34. The distance along the acoustic axis where the maximum amplitude response is obtained is called as /Biên độ thu nhận tối đa dọc theo trục âm được gọi là.","a":["A. focal depth or depth of focus /Độ sâu tập trung hay độ sâu hội tụ.","B. depth of field /Độ sâu trường","C. Near field /Trường gần","D. Focusing factor /Nhân tố hội tụ"],"c":0,"e":"Đáp án A: Tại vị trí hội tụ (Focal depth), chùm tia siêu âm bị nén lại nhỏ nhất, mật độ năng lượng dày đặc nhất nên khi gặp khuyết tật sẽ cho ra biên độ phản xạ cực đại (maximum amplitude response)."},{"q":"Câu 35. What is the beam width at the focal depth for 5L60 probe with 1 mm pitch /Tính độ rộng chùm tia tại độ sâu hội tụ ?","a":["A. 60 mm","B. 10 mm","C. 15 mm","D. 20 mm"],"c":2,"e":"Đáp án C: Khẩu độ A = 60x1 = 60. Lambda = 5.92/5 = 1.184. N = 60^2 / (4x1.184) = 760mm. Độ rộng chùm tại tiêu cự Dst = (Lambda x N) / A = (1.184 x 760) / 60 = 14.9mm (Làm tròn thành 15mm)."},{"q":"CHAP 5 - Câu 1. What is the difference between testing with more VPA’s and lesser VPA’s in linear sector phased array examination – Sự khác biệt giữa thử nghiệm nhiều VPA’s và ít VPA’s trong kiểm tra tuyến tính PA.","a":["A. more VPA’s will provide better focus closer discontinuities","B. less VPA’s provide better focus for closer discontinuities","C. focusing power is more in more VPA’s","D. focusing is not related to VPA’s – Độ hội tụ không có mối quan hệ với VPA"],"c":3,"e":"Đáp án D: Virtual Probe Aperture (VPA) đại diện cho một nhóm biến tử gộp lại để quét (Linear scan). Việc tăng số lượng VPA chỉ làm tăng độ mịn (step) của quá trình quét di chuyển, chứ không thay đổi độ lớn của nhóm biến tử đó, nên không hề liên quan đến khả năng hội tụ (Focusing)."},{"q":"Câu 2. An Encoder in PA terminology is – Bộ mã hóa theo thuật ngữ trong PA là ?","a":["A. A means of implement data security – ý nghĩa thực hiện bảo mật dữ liệu","B. A means of plotting the mechanical axis – Ý nghĩa vẽ biểu đồ theo trục cơ học.","C. A software routine in phase FX – một chương trình phần mềm","D. Is required to run UT studio on a PC – yêu cầu chạy chương trình"],"c":1,"e":"Đáp án B: Encoder (Bộ mã hóa cơ học) là thiết bị gắn trên xe quét, nó lăn trên bề mặt để đo quãng đường di chuyển và đồng bộ hóa với hệ thống máy PAUT. Nhờ đó, máy vẽ được hình ảnh cắt lợp (Scan plot) theo trục vị trí thực tế."},{"q":"Câu 3. Electronic scanning is – Quét điện tử là ?","a":["A. Using a robot to automatically scan a component","B. Utilizing a linear scan with a defined aperture to increment along an array and scan a component with no mechanical movement.","C. Is the PA term that equates to PRF in conventional UT","D. Is the process of digitizing an analogue signal"],"c":1,"e":"Đáp án B: Quét điện tử (Electronic Scanning / Linear Scan) là việc sử dụng mạch dồn kênh (multiplexer) để kích hoạt lần lượt các nhóm biến tử (VPA) dọc theo đầu dò. Nó tạo ra một chùm tia di chuyển tịnh tiến mà KHÔNG CẦN DỊCH CHUYỂN CƠ HỌC ĐẦU DÒ."},{"q":"Câu 4. Which statement is a true of sectorial scanning – Phát biểu nào là đúng khi nói đến quét quạt.","a":["A. Ability to scan a complete sector of volume without any probe movement. – Khả năng quét hoàn thiện khối bộ phận, mà không cần dịch chuyển đầu dò.","B. Scanning is performed at a constant angle along the probe length","C. Scanning extent is limited by the number of channels","D. Scanning extent is limited by the shape of element in array"],"c":0,"e":"Đáp án A: Đặc trưng của Sectorial Scan (Quét hình quạt) là nó sử dụng các luật trễ điện tử thay đổi liên tục để quét một dải góc lớn (ví dụ từ 40 đến 70 độ) xuyên qua toàn bộ thể tích mối hàn mà đầu dò hoàn toàn đứng yên tại chỗ."},{"q":"Câu 5. For depth focusing, the focal law delay applied (firing sequence) is – Cho độ sâu hội tụ,độ trễ của luật phát được áp dụng(trình tự đốt nóng) là:","a":["A. extreme end elements delayed and center elements timed first","B. extreme end elements are timed first and center elements are delayed – Các biến tử ở cuối phát trước và các biến tử ở trung tâm phát trễ","C. extreme left end is timed first gradual increments to the right end","D. none of the above are true"],"c":1,"e":"Đáp án B: Để hội tụ sóng âm (Focusing), mặt sóng phẳng ban đầu phải được uốn cong thành dạng lõm. Để làm được điều này, các biến tử ở hai mép ngoài cùng (extreme end) phải phát sóng trước (timed first), các biến tử ở giữa (center) phát sau (delayed) để đợi các sóng ngoài bắt kịp."},{"q":"Câu 6. Read the following delay pattern and answer the which of the following statements – Đọc mô hình độ trễ (3 hình A, B, C) và trả lời câu nào sau đây đúng:","a":["A. A is for Sectorial Scan – A biểu diễn cho quét quạt","B. B is for Depth focusing – B biểu diễn độ sâu hội tụ","C. C is for Electronic Scan - C biểu diễn quét điện tử","D. None of the above is true - Không có đáp nào đúng"],"c":3,"e":"Đáp án D: Trong hình (trên file gốc): Mô hình A phẳng ngang là quét điện tử 0 độ. Mô hình B dốc nghiêng là quét quạt Sectorial. Mô hình C dạng lõm Parabol là Focus. Do đó tất cả các đáp án A, B, C đưa ra trong câu hỏi đều sai sự thật."},{"q":"Câu 7. In Question above, the Figure B is a delay pattern for – Trong câu hỏi ở trên, hình B (đường dốc nghiêng) là mô hình độ trễ cho:","a":["A. Sectorial – quét quạt","B. Electronic Scanning – quét điện tử","C. Focusing – độ hội tụ","D. All the above – tất cả các đáp án trên"],"c":0,"e":"Đáp án A: Hình B là một đường chéo tuyến tính (Slant delay). Sự chênh lệch độ trễ nghiêng như vậy tạo ra hiệu ứng bẻ lái chùm tia sang một góc xác định (Steering), đây là cơ chế cốt lõi của Sectorial Scan."},{"q":"Câu 8. If a linear scan is being performed and each VPA uses 16 elements with e being 1 mm and g 1 mm, how large is a single VPA?","a":["A. 32 mm","B. 10 mm","C. 31 mm","D. Equal to total aperture length."],"c":2,"e":"Đáp án C: Pitch p = e + g = 1+1 = 2mm. Khẩu độ VPA (16 phần tử) = (16-1) x 2 + 1 = 30 + 1 = 31 mm."},{"q":"Câu 9. 5L128 probe with 0.6mm pitch used for weld examination using 16/128 phased array system, Maximum no. of VPA?- Đầu dò 5L128... sử dụng hệ thống PA 16/128 thì giá trị cực đại của VPA là bao nhiêu ?","a":["A. 112","B. 113","C. 57","D. 25"],"c":1,"e":"Đáp án B: Số lượng Virtual Probe Aperture (VPA) khi chạy Linear Scan được tính theo công thức: [Tổng số biến tử đầu dò] - [Số biến tử mỗi VPA] + 1. Ở đây ta có: 128 - 16 + 1 = 113 VPA."},{"q":"Câu 10. How many VPA’s can be achieved in a linear sector scan using 64 elements while firing 8 elements at a time.","a":["A. 56","B. 8","C. 57","D. 64"],"c":2,"e":"Đáp án C: Tương tự như công thức tính step của quét tịnh tiến: Số VPA = Tổng biến tử (64) - Số biến tử phát cùng lúc (8) + 1 = 57 VPA."},{"q":"Câu 11. Electronic scanning is - quét điện tử là ?","a":["A. Associate with sectorial group – Liên kết với nhóm quét kiểu quạt","B. Associate with linear scanning – Liên kết với kiểu quét tuyến tính","C. Associate with PRF – Liên kết với PRF","D. Associate with pulse width duration – Liên kết với độ rộng xung"],"c":1,"e":"Đáp án B: Quét điện tử (Electronic Scanning) là tên gọi bản chất kỹ thuật của thao tác Quét tuyến tính (Linear Scanning), nơi máy sử dụng mạch điện tử chuyển dời cửa sổ phát qua từng biến tử dọc theo chiều dài đầu dò."},{"q":"Câu 12. Read the following delay pattern and answer... – Đọc mô hình độ trễ (A-Phẳng, B-Nghiêng, C-Parabol) và trả lời:","a":["A. A is for Sectorial Scan – A kiểu biểu diễn quét quạt","B. B is for linear or electronic scan – B kiểu biểu diễn quét tuyến tính","C. C is for depth focusing – C biểu diễn độ sâu hội tụ","D. None of the above is true - không có đáp án nào đúng ở trên"],"c":2,"e":"Đáp án C: Trong hình, biểu đồ C có dạng hình Parabol chữ U (các biến tử ngoài cùng kích hoạt sớm, biến tử giữa kích hoạt trễ). Đây chính xác là định dạng luật phát dùng để tạo ra độ hội tụ theo chiều sâu (Depth focusing)."},{"q":"Câu 13. In Question above, the Figure A is a delay pattern for- Trong câu hỏi ở trên, hình minh họa A (đường phẳng ngang) là kiểu biểu diễn độ trễ cho.","a":["A. Sectorial – Biểu diễn quét quạt","B. Electronic Scanning – Biểu diễn quét điện tử","C. Focusing – Độ hội tụ","D. All the above – Tất cả các đáp án trên"],"c":1,"e":"Đáp án B: Hình A là đường phẳng hoàn toàn (Độ trễ = 0). Có nghĩa là tất cả các biến tử phát xung CÙNG MỘT LÚC. Điều này tạo ra một chùm tia thẳng góc 0 độ, đặc trưng của quét điện tử cơ bản (Electronic Scanning)."},{"q":"Câu 14. If you are to use DDF where do you focus (transmit & receiving)? If the area of interest is between 50 - 150mm.","a":["A. Transmit focus at 75mm, Receive focus at 50 -150mm","B. Transmit focus at 50mm, Receive focus at 50 -150mm","C. Transmit focus at 100mm, Receive focus at 50 -150mm – Điểm hội tụ truyền đi tại 100mm, Điểm hội tụ thu nhận tại 50 – 150mm","D. None of the above"],"c":2,"e":"Đáp án C: Kỹ thuật Hội tụ động (Dynamic Depth Focusing - DDF) hoạt động bằng cách phát xung (Transmit) hội tụ ở một độ sâu lớn cố định (ví dụ giữa vùng quan tâm 100mm). Sau đó, máy tính sẽ thay đổi luật trễ liên tục theo thời gian thực ở phần Thu (Receive) để bắt nét dọc theo toàn bộ dải 50-150mm."},{"q":"Câu 15. The term used to describe the scan orientation in a phased array is called as – Thuật ngữ dùng để trình bày sự định hướng quét trong PA được gọi là.","a":["A. Index","B. Skew","C. Offset","D. None of the above"],"c":1,"e":"Đáp án B: Skew (Góc vát/Định hướng) là thuật ngữ mô tả góc xoay của thân đầu dò PAUT so với phương dọc của đường hàn (ví dụ Skew 90 độ là vuông góc với mối hàn)."},{"q":"Câu 16. Which of the following statements are true – Phát biểu nào dưới đây là đúng.","a":["A. Sectorial scanning is more sensitive than linear scanning","B. Linear scanning is more sensitive than sectorial scanning","C. Linear or sectorial depending of weld bevel, thickness and purpose of PAUT examination.- Kiểu tuyến tính hay quét quạt sẽ phụ thuộc vào góc vát mép của mối hàn, chiều dày và mục đích kiểm tra","D. Scanning extent is limited for sectorial whereas not affected for linear."],"c":2,"e":"Đáp án C: Không có kiểu quét nào nhạy hơn kiểu nào một cách tuyệt đối. Việc lựa chọn Linear hay Sectorial phụ thuộc hoàn toàn vào biên dạng vát mép (bevel) của mối hàn, độ dày vật liệu và hướng nằm kỳ vọng của khuyết tật."},{"q":"Câu 17. Which of the following statement is best suitable for the applied – Phát biểu nào sau đây là phù hợp nhất cho mô hình độ trễ kiểu bậc thang dốc lên từ trái qua phải:","a":["A. The delay will focus the beam at 0 degree – Độ trễ sẽ hội tụ ở chùm tia 0 độ","B. The delay will steer the beam in direction from left to right – Độ trễ sẽ điều khiển chùm tia theo hướng từ trái qua phải.","C. The delay will steer the beam in direction from right to left","D. The beam is focussed and steered"],"c":1,"e":"Đáp án B: Hình bậc thang dốc từ trái qua phải có nghĩa là các biến tử bên trái được phát xung SỚM NHẤT (độ trễ ít nhất), sóng của chúng đi trước. Biến tử bên phải phát muộn. Kết quả mặt sóng tổng hợp sẽ bị nghiêng và truyền lệch từ Trái sang Phải."},{"q":"Câu 18. Which of the following statement is best suitable for the applied delay – Phát biểu nào phù hợp cho mô hình độ trễ bậc thang dốc lên từ phải qua trái nhưng kèm dạng đường cong parabol:","a":["A. The delay will focus the beam at 0 degree","B. The beam is focussed and steered in direction from right to left","C. The delay will steer the beam in direction from right to left","D. The beam is focussed and steered in direction from left to right – Chùm tia hội tụ và điều khiển theo hướng từ trái qua phải."],"c":3,"e":"Đáp án D: Đồ thị vừa có độ dốc nghiêng (Steer) từ trái qua phải (bên trái độ trễ thấp phát trước), vừa có độ võng hình parabol lõm (Focus). Do đó chùm tia đang bị Bẻ lái từ trái qua phải ĐỒNG THỜI Hội tụ tại một khoảng cách."},{"q":"Câu 19. Which of the following statement is best suitable for the applied delay – Đồ thị độ trễ hình phễu Parabol chữ U đối xứng tâm:","a":["A. The delay will focus the beam at 0 degree – Độ trễ sẽ hội tụ chùm tia tại góc 0 độ","B. The beam is focussed and steered in direction from right to left","C. The delay will steer the beam in direction from right to left","D. The beam is focussed and steered in direction from left to right"],"c":0,"e":"Đáp án A: Đồ thị đối xứng qua trục giữa (không có độ dốc lệch) biểu thị chùm tia đâm thẳng góc 0 độ. Hình dáng Parabol võng ở giữa cho biết thêm đây là chùm tia thẳng nhưng bị ép Hội tụ (Focus)."}],"PAUT_PHẦN 2":[{"q":"CHAP 6 - Câu 1. BIA (góc tới của chùm tia- Beam Incident Angle) rất quan trọng trong kiểm tra siêu âm thông thường và trong kiểm tra PA. Nó có liên quan đến điều gì?","a":["a. Chùm tia siêu âm tới liên quan với khuyết tật","b. Góc của chùm tia siêu âm tới liên quan tới vùng ngấu.","c. Góc của chùm tia siêu âm tới liên quan tới vùng đáy.","d. Không câu nào đúng."],"c":1,"e":"BIA (Beam Incident Angle) là góc đập của chùm tia siêu âm so với mặt vát mép (vùng ngấu/bevel) của mối hàn. Để đạt năng lượng phản xạ cao nhất từ khuyết tật thiếu ngấu (Lack of Fusion - LOF), góc BIA nên được thiết lập vuông góc nhất có thể (gần 0 độ) với mặt vát này."},{"q":"Câu 2. Đối với thiết bị PA 16/128. Số lượng biến tử tối đa có thể phát đồng thời là.","a":["a. 8 biến tử","b. 16 biến tử","c. 32 biến tử","d. 64 biến tử"],"c":1,"e":"Trong ký hiệu thiết bị PAUT (ví dụ 16/128), con số đầu tiên (16) cho biết số lượng bộ tạo xung/thu sóng (Pulsers/Receivers) có khả năng kích hoạt đồng thời. Con số sau (128) là tổng số biến tử của đầu dò mà hệ thống có thể kết nối vật lý."},{"q":"Câu 3. Trong khi kiểm tra các mối hàn sử dụng phương pháp PAUT, người dùng phải hiểu.","a":["a. Độ sâu hội tụ yêu cầu là bao nhiêu.","b. Chùm tia quét góc bao nhiêu.","c. Qui trình và góc vát của mối hàn","d. Tất cả điều trên."],"c":3,"e":"Để lập được phương án quét (Scan Plan) chuẩn xác, kỹ thuật viên bắt buộc phải nắm rõ hình học vát mép và độ dày (c), từ đó tính toán giải pháp phủ sóng góc (b) và xác định độ sâu hội tụ tối ưu (a) để bắt nét khuyết tật."},{"q":"Câu 4. Nếu index offset của chùm tia với nêm là -25mm, skew đầu dò là 90. Vậy index offset của chùm tia với tâm mối hàn là bao nhiêu nếu nêm cách tâm mối hàn -25mm.","a":["a. Một đoạn xa","b. -100mm","c. 100mm","d. -50mm"],"c":3,"e":"Mép nêm cách tâm mối hàn là -25mm. Điểm phát tia (Beam Index) nằm lùi sâu trong nêm thêm -25mm nữa. Vậy khoảng cách tổng cộng từ điểm phát tia của chùm âm tới tâm mối hàn là (-25) + (-25) = -50mm."},{"q":"Câu 5. Sự khác biệt giữa Index Offset và Beam Index Offset là gì?","a":["a. Cả hai đều chỉ khoảng cách giữa tâm của đầu dò đến đường tâm của mối hàn","b. Cả hai đều chỉ tổng khoảng cách từ đường tâm của mối hàn đến mặt trước của nêm với khoảng cách từ mặt trước của nêm đến điểm ra của chùm tia.","c. Điểm ra của đầu dò là khoảng cách từ đường tâm của mối hàn đến mặt trước của nêm. Còn Index offset là khoảng cách từ mặt trước của nêm đến điểm ra của chùm tia.","d. Index offset là khoảng cách từ đường tâm của mối hàn đến mặt trước của nêm. Beam Index Offset tổng khoảng cách từ đường tâm của mối hàn đến mặt trước của nêm với khoảng cách từ mặt trước của nêm đến điểm ra của chùm tia"],"c":3,"e":"Index offset (Wedge delay/Offset) dùng để chỉ khoảng cách cơ học từ mép nêm đến đường tâm hàn. Trong khi Beam Index Offset là khoảng cách thực tế của điểm mà chùm tia đâm vào bề mặt (Probe emission point) tính tới đường tâm mối hàn."},{"q":"Câu 6. Index offset là một tham số quan trọng trong việc chuẩn bị phương án quét (scan plan) vì","a":["a. Độ bao phủ mối hàn phụ thuộc vào thông số này.","b. Góc tới của chùm tia với mặt ngấu phụ thuộc vào thông số này.","c. Nếu chọn xa quá độ nhạy kiểm tra sẽ giảm do tổn hao.","d. Tất cả điều trên."],"c":3,"e":"Vị trí đặt nêm (Index offset) quyết định chùm tia sẽ đâm vào vị trí nào trên mối hàn. Đặt đúng giúp bao phủ hoàn toàn thể tích hàn và có góc BIA tốt. Đặt quá xa sẽ làm quãng đường âm dài ra, gây suy hao năng lượng mạnh."},{"q":"Câu 7. TCG trong kiểm tra PAUT sử dụng để","a":["a. Bổ sung độ lợi theo thời gian.","b. Bổ sung độ lợi theo quãng đường âm.","c. Bổ sung độ lợi theo độ sâu.","d. Tất cả điều trên."],"c":3,"e":"TCG (Time Corrected Gain) là thuật toán khuếch đại tín hiệu điện tử bù đắp năng lượng suy hao. Do thời gian truyền sóng, quãng đường âm và độ sâu có mối quan hệ trực tiếp tỷ lệ thuận với nhau, nên TCG bù đắp cho cả 3 yếu tố này."},{"q":"Câu 8. Phát biểu nào sau đây là đúng cho TCG.","a":["a. Tạo ra biên độ đồng đều cho tất cả các góc ở mặt phản xạ (giống nhau) ở độ sâu khác nhau.","b. Tạo ra biên độ đồng đều cho một số góc đặc biệt ở mặt phản xạ (giống nhau) ở độ sâu khác nhau.","c. Bổ sung cho chùm tia khi đi qua môi trường trong nêm và các vị trí khác nhau tại điểm ra.","d. Cân bằng độ nhạy (biên độ) cho tất cả các góc với một điểm phản xạ cho trước."],"c":0,"e":"Đặc quyền của TCG trong PAUT (khác với siêu âm thông thường) là ngoài việc cân bằng năng lượng theo chiều sâu, nó còn phải chỉnh lưu biên độ cho TẤT CẢ các góc khác nhau trong chùm Sectorial, đảm bảo hiển thị phản xạ đồng nhất."},{"q":"Câu 9. Phát biểu nào sau đây là không đúng trong kiểm tra PAUT.","a":["a. Bạn có thể lái được chùm siêu âm.","b. Khả năng phát hiện khuyết tật tốt hơn","c. Kiểm tra nhanh hơn","d. Phát hiện tất cả các khuyết tật trong 1 lần quét."],"c":3,"e":"Mặc dù PAUT rất mạnh, nhưng không thể có chuyện 'phát hiện tất cả khuyết tật chỉ trong 1 lần quét'. Những khuyết tật nằm ở góc khuất, song song hướng truyền âm hoặc xa chùm tia vẫn yêu cầu quét nhiều Index (nhiều pass) hoặc quét từ 2 bên mới đủ."},{"q":"Câu 10. “16” là gì trong thiết bị kiểm tra PA 16/128.","a":["a. Số lượng bộ phát xung (Pulsers)","b. Số lượng bộ phát xung nhỏ nhất (Pulser)","c. Số lượng bộ thu nhận xung nhỏ nhất.","d. Số lượng kênh lớn nhất."],"c":1,"e":"Theo tài liệu gốc đã đánh dấu, thuật ngữ mô tả số lượng 16 của Pulsers là bộ phận phát xung đồng thời."},{"q":"Câu 11. Trước khi thực hiện phân tích dữ liệu. Điều quan trọng nhất bạn cần biết là gì?","a":["a. Góc vát","b. Qui trình hàn","c. Bề rộng mối hàn","d. Tất cả điều trên."],"c":3,"e":"Khi phân tích dữ liệu siêu âm mối hàn (Data Analysis), việc ốp lớp phủ Overlay của mối hàn lên S-scan/C-scan là bắt buộc. Do đó, người phân tích cần biết chính xác biên dạng góc vát, quy trình hàn và bề rộng mũ hàn để phán đoán nguồn gốc tín hiệu."},{"q":"Câu 12. Tất cả các hiệu chuẩn sau đây ảnh hưởng đến độ nhạy phát hiện ngoại trừ.","a":["a. Độ nhạy","b. Trễ nêm","c. TCG","d. Encoder."],"c":3,"e":"Encoder (Bộ mã hóa cơ học vòng quay) chỉ phục vụ mục đích ghi nhận tọa độ cơ học dọc theo hướng quét của thiết bị. Nó không tham gia vào bất kỳ thuật toán xử lý độ lớn xung phản xạ hay tính toán năng lượng (Gain/Sensitivity) nào."},{"q":"Câu 13. Giá trị 65 biểu thị điều gì sau khi encoder đã được hiệu chuẩn.","a":["a. Xung/mm hay bước/mm","b. Tốc độ của encoder","c. Điện thế của encoder","d. Không câu nào đúng."],"c":0,"e":"Trong quá trình hiệu chuẩn (Calibration) bộ mã hóa Encoder, kết quả thu được là Độ phân giải của bộ đếm (Resolution). Giá trị 65 có nghĩa là bánh xe lăn được 1 milimet thì hệ thống đếm được 65 xung điện tử tử Encoder (Steps/mm)."},{"q":"Câu 14. PA ưu điểm hơn siêu âm thường chỗ nào.","a":["a. Có khả năng quét nhiều góc mà không cần thay đầu dò","b. Có khả năng hội tụ chùm âm ở các độ sâu khác nhau.","c. Có khả năng 1 lần quét có thể kiểm soát được toàn bộ mối hàn","d. Tất cả điều trên."],"c":3,"e":"Đó chính là 3 ưu điểm vượt trội tạo nên kỷ nguyên Phased Array: Góc quét điện tử thay thế hàng tá nêm góc thông thường; Hội tụ (DDF) nâng cao độ sắc nét; Quét điện tử dọc thân đầu dò che phủ thể tích rất lớn cực kỳ nhanh."},{"q":"Câu 15. Nếu index offset của chùm tia với nêm là 75mm, skew đầu dò là 270. Vậy index offset của chùm tia với tâm mối hàn là bao nhiêu nếu nêm cách tâm mối hàn 25mm.","a":["a. Một đoạn xa","b. -100mm","c. 100mm","d. -50mm"],"c":2,"e":"Skew góc 270 độ tức là đầu dò đang soi ngược hướng (từ mặt bên kia dội lại). Khoảng cách từ mép nêm đến tâm mối hàn là 25mm, khoảng cách từ Beam Index đến mép nêm là 75mm. Cùng chiều chiếu tới nên tổng khoảng cách là 25 + 75 = 100mm."},{"q":"Câu 16. Hiệu chuẩn độ nhạy trong quét quạt ( sector scan) là","a":["a. Cân bằng độ nhạy (biên độ) cho tất cả các góc với một điểm phản xạ cho trước.","b. Cân bằng độ nhạy (biên độ) cho tất cả các khoảng với một điểm phản xạ cho trước.","c. Cân bằng độ nhạy (biên độ) giữa lỗ khoan cạnh (SDH) so với phản xạ từ cung 100 trên mẫu V1.","d. Cân bằng độ nhạy (biên độ) cho tất cả các độ sâu hội tụ với một điểm phản xạ cho trước."],"c":0,"e":"Hiệu chuẩn ACG (Angle Corrected Gain) có vai trò bù đắp sự sụt giảm năng lượng ở các góc lái khác nhau (các góc nghiêng lớn bị giảm tiết diện phát âm). Việc hiệu chuẩn giúp một lỗ chuẩn (Ví dụ SDH) luôn hiển thị ở cùng một mức biên độ (ví dụ 80% FSH) trên toàn dải quét hình quạt."},{"q":"Câu 17. Phương án quét(scanplan) là rất quan trọng trước khi kiểm tra mối hàn vì nó cung cấp.","a":["a. Biết được chùm tia có bao phủ hết mối hàn không.","b. Biết được khả năng phát hiện khuyết tật của chùm tia.","c. Biết được đặt đầu dò ở đâu và phải quét mấy lần.","d. Tất cả điều trên."],"c":3,"e":"Lập Scan Plan trên máy tính mô phỏng chính xác sự giao thoa của chùm tia vào mặt cắt vật liệu. Giúp kỹ thuật viên tìm ra vị trí Index tối ưu nhất, số lần quét bù và khả năng chùm tia va đập vuông góc (BIA) vào khuyết tật tiềm năng."},{"q":"Câu 18. Điều gì xảy ra nếu nêm được hiệu chuẩn không đúng.","a":["a. Độ sâu của khuyết tật bị sai","b. Độ nhạy giảm","c. Khuyết tật có thể bị sót","d. Tất cả điều trên là đúng."],"c":3,"e":"Hiệu chuẩn trễ nêm (Wedge delay) sai sẽ làm cho tọa độ không gian (Độ sâu, độ xa) tính toán bị lệch hoàn toàn. Nó còn ảnh hưởng đến việc thiết lập thuật toán luật trễ điện tử, làm chùm tia suy giảm năng lượng dẫn đến dễ sót lỗi."},{"q":"Câu 19. Nếu một mối hàn có thể kiểm tra với các khoảng cách 12, 15, 30 bạn sẽ chọn cái nào.","a":["a. Cái nào cũng được.","b. 15 vì nó bao phủ hết mối hàn và tổn hao ít nhất.","c. 12 vì nó bao phủ hết mối hàn và tổn hao ít nhất.","d. Không cái nào ở trên."],"c":2,"e":"Trong siêu âm NDT, tín hiệu âm thanh bị suy yếu đi khi truyền qua quãng đường dài do tán xạ và hấp thụ (Attenuation). Do đó quy tắc vàng là: LUÔN sử dụng khoảng cách đặt đầu dò ngắn nhất (Index offset 12) miễn sao nó vẫn bao phủ toàn bộ vùng quan tâm."},{"q":"Câu 20. Nếu encoder hiệu chuẩn không đúng thì","a":["a. Vị trí khuyết tật bị sai","b. Độ nhạy bị giảm","c. Không thể tiến hành kiểm tra được","d. Không có điều nào đúng."],"c":0,"e":"Encoder đo trục quét cơ học (Scan Axis). Nó không liên quan đến việc thu nhận sóng siêu âm mà chỉ dùng để lập bản đồ vị trí. Hiệu chuẩn sai số xung/mm sẽ dẫn đến tọa độ dọc theo chiều dài mối hàn của khuyết tật bị định vị sai."},{"q":"Câu 21. Trong 2 phương án quét dưới đây bạn chọn phương án nào?","a":["a. Cả hai phương án đều được","b. Phương án A","c. Phương án B","d. Không có hai phương án nào dùng được."],"c":3,"e":"Nhìn vào ảnh minh họa Scan Plan, chùm tia góc đập vào các mặt vát của mép hàn ở một góc độ rất xiên (Góc tới BIA quá lớn). Tín hiệu siêu âm sẽ bị trượt đi chỗ khác chứ không dội ngược lại đầu dò, do đó không phương án nào đạt chuẩn."},{"q":"Câu 22. Bạn sẽ làm gì để có một góc tới hợp lý khi biết trước góc vát mối hàn.","a":["a. Điều chỉnh góc tới","b. Quét nhiều index","c. Chuyển từ quét quạt sang quét một góc (linear)","d. Tất cả ý trên."],"c":3,"e":"Khi biết góc vát, mục tiêu là làm sao cho chùm tia vuông góc (0 độ BIA) với mép đó. Ta có thể thay đổi vị trí đầu dò (Index offset), đổi sang luật quét phẳng (Linear Scan) hoặc thiết lập quét Sector với một góc độ cụ thể để tối ưu hướng đâm."},{"q":"Câu 23. Có bao nhiêu VPA trong cách quét linear sector 32 biến tử, 8 biến tử phát đồng thời.","a":["a. 32","b. 24","c. 25 (32-8+1)","d. 49"],"c":2,"e":"Số bước quét tịnh tiến (Virtual Probe Aperture - VPA) =[Tổng số biến tử] - [Số biến tử kích hoạt một lúc] + 1. Theo bài toán ta có 32 - 8 + 1 = 25 VPA."},{"q":"Câu 24. Độ phân giải của encoder là gì?","a":["a. Tốc độ mã hóa","b. Tỉ số giữa vòng quay và chiều dài di chuyển.","c. Tốc độ quét","d. Loại encoder."],"c":1,"e":"Độ phân giải Encoder (Encoder resolution) là hằng số đại diện cho số lượng xung đếm kỹ thuật số sinh ra tương ứng với quãng đường cơ học bánh xe thực sự lăn (VD: số count / milimet)."},{"q":"Câu 25. Điều nào sau đây là lợi thế và tính năng độc đáo của thiết bị PAUT?","a":["a. Mã hóa dữ liệu thu nhận.","b. Đầu dò chỉ cần quét một lần là kiểm soát hết toàn bộ mối hàn.","c. Khả năng thực hiện hiệu chuẩn độ trễ nêm.","d. Khả năng hiệu chỉnh độ nhạy."],"c":0,"e":"Tính năng mã hóa dữ liệu theo không gian (Data Encoding) cho phép PAUT lưu lại trọn vẹn toàn bộ hình thái A-Scan của suốt quá trình quét để vẽ lại khối không gian màu C-Scan, S-Scan lưu trữ trên ổ cứng (Offline analysis)."},{"q":"Câu 26. Để đạt được BIA với 5 độ cho góc vát một nửa là 35 độ","a":["a. Thực hiện quét với góc từ 55-60 độ.","b. Thực hiện quét với góc từ 50-60 độ.","c. Thực hiện quét với phân giải góc là 0.5 độ.","d. Tất cả các ý trên."],"c":1,"e":"Mép vát góc 35 độ so với đường vuông góc mặt phôi. Vậy để chùm tia có thể đánh vuông góc vào mép vát này (tức là góc BIA tiệm cận 0-5 độ), thì chùm quét PAUT phải được lái nghiêng vào khoảng 90 - 35 = 55 độ. Dải quét quạt Sector 50-60 độ sẽ bao trùm hoàn hảo."},{"q":"CHAP 7 - Câu 1. Khi bạn thực hiện phân tích dữ liệu về các chỉ thị, độ dài của khuyết tật có thể được xác định trong các kiểu quét sau","a":["a. Hiển thị kiểu A (A – Scan).","b. Hiển thị kiểu B (B – Scan).","c. Hiển thị kiểu C (C – Scan).","d. Tất cả các kiểu trên."],"c":3,"e":"Chiều dài khuyết tật là sự phân bổ dọc theo đường quét. A-scan phản ánh theo số tín hiệu nảy lên, B-scan hiển thị hình chiếu ngang và C-scan hiển thị hình chiếu bằng tổng quát. Cả 3 đều hỗ trợ việc đánh dấu ranh giới chiều dài khuyết tật."},{"q":"Câu 2. Điều nào sau đây là đúng đối với các chế độ xem dữ liệu thu được bằng cách tiến hành quét 1 đường thẳng dọc theo mối hàn kiểm tra.","a":["a. B-Scan biểu thị độ dài hoàn chỉnh (Trục quét) cho góc cụ thể trong S-Scan.","b. C-Scan biểu thị độ dài hoàn chỉnh (Trục quét) cho góc cụ thể trong S-Scan.","c. C-Scan biểu thị độ dài hoàn chỉnh (Trục quét) cho tất cả các góc trong S-Scan.","d. Câu a và c đúng."],"c":3,"e":"B-Scan (End view) là lát cắt chiều dài của một góc quét nhất định. Trong khi C-Scan (Top view) là tổng hợp toàn bộ các góc quét nén lại từ phía trên xuống bao phủ theo toàn bộ trục chiều dài di chuyển. Vậy A và C đều là nguyên lý đúng."},{"q":"Câu 3. Trong thiết bị PAUT Omni Scan, hiển thị kiểu B","a":["a. Độ sâu thực với chiều quét.","b. Độ sâu thực với biên độ.","c. Độ sâu thực với độ lệch trục.","d. Độ sâu thực với góc."],"c":0,"e":"Trong máy OmniScan, cửa sổ B-Scan hiển thị mặt cắt theo trục quét cơ học. Tức là trục Y (Dọc) là Độ sâu thực (True depth) của vật kiểm, và trục X (Ngang) là quãng đường di chuyển của Encoder (Scan axis/chiều quét)."},{"q":"Câu 4. Trong thiết bị PAUT Omni Scan, phát biểu nào là không đúng.","a":["a. C-Scan là kiểu hiển thị các phản hồi từ tất cả các góc theo chiều trục quét.","b. A-Scan là kiểu hiển thị độ sâu thực với biên độ từ tất cả các góc.","c. A-Scan là kiểu hiển thị độ sâu thực với biên độ của chỉ 1 góc.","d. B-Scan là kiểu hiển thị toàn bộ chiều dài quét của 1 góc cùng một lúc."],"c":1,"e":"A-scan truyền thống là tín hiệu biên độ đồ thị dao động trên miền thời gian (hoặc quãng đường âm). Nó là thông tin thu được ở một tia độc lập (1 góc cắt duy nhất) ở một thời điểm, KHÔNG PHẢI tổng hợp từ 'tất cả các góc' cùng lúc."},{"q":"Câu 5. Tại sao bạn hợp nhất dữ liệu trong phần mềm phân tích.","a":["a. Giảm thời gian phân tích.","b. Bạn có thể thấy hết tất cả dữ liệu trong một lần xem.","c. Có thể phát hiện các khuyết tật khó.","d. Câu b và câu c là đúng."],"c":3,"e":"Thuật toán Hợp nhất thể tích (Volumetric merge) sẽ ép toàn bộ dữ liệu 3D, tất cả các nhóm quét, tất cả các góc lên cùng một bản đồ phẳng chiếu bằng. Điều này giúp nhìn thấy toàn cảnh mà không bỏ sót bất kì chỉ thị lệch góc nào."},{"q":"Câu 6. Về hiển thị trong thiết bị Omniscan, hiển thị nào sau đây là chưa đúng.","a":["a. Hiển thị kiểu A (A – Scan).","b. Hiển thị kiểu S (S – Scan).","c. Hiển thị kiểu C (C – Scan).","d. Hiển thị kiểu B (B – Scan)."],"c":2,"e":"Câu hỏi này trên tài liệu gốc thường nhằm mục đích trắc nghiệm tính năng cụ thể bị giới hạn của phiên bản phần mềm OmniScan nhất định ở một cấu hình, trong đó C-Scan đôi khi cần phải qua chỉnh sửa/Merge mới hiển thị chuẩn."},{"q":"Câu 7. Kiểu quét S (S – Scan) trong PA là thông tin tập hợp từ tất cả các góc của:","a":["a. Kiểu quét E (E– Scan).","b. Tổng hợp các quét A (A – Scan).","c. Kiểu quét C chưa chỉnh sửa (C – Scan).","d. Tất cả các kiểu trên."],"c":1,"e":"Quét hình quạt (S-Scan / Sectorial Scan) thực chất là sự ghép nối liên tục của hàng chục đường tia A-Scan riêng lẻ chạy ở các góc khác nhau (VD từ 40 đến 70 độ) tạo thành một khối không gian mặt cắt 2D."},{"q":"Câu 8. B-scan đặc biệt hữu ích để xác định những điều sau đây","a":["a. Xác định diện tích khuyết tật.","b. Xác định khuyết tật đáy.","c. Đo chiều cao vết nứt.","d. Tất cả những điều trên."],"c":1,"e":"B-Scan có một chỉ báo gọi là 'Đường xung đáy' (Backwall echo) rất rõ ràng do nó quét dọc theo chiều dài mối hàn. Nếu khu vực nào mất tín hiệu đáy, ta có thể dễ dàng nhận biết vùng đó có khuyết tật không ngấu đáy hoặc nứt rễ."},{"q":"Câu 9. Phát biểu nào sau đây là đúng với hiển thị S-Scan?","a":["a. S Scan - hiển thị dữ liệu tại vị trí đầu dò (được liên kết với con trỏ quét trong B hoặc C Scan) cho một góc trong quét quạt hoặc quét tuyến tính.","b. S Scan - hiển thị toàn bộ dữ liệu theo chiều dài...","c. S Scan- hiển thị dữ liệu tại vị trí đầu dò (được liên kết với con trỏ quét trong B hoặc C Scan) cho tất cả các góc trong quét quạt hoặc quét tuyến tính.","d. Không có câu nào đúng."],"c":2,"e":"S-scan biểu diễn một LÁT CẮT TRỤC NGANG toàn diện chứa TẤT CẢ CÁC GÓC của chùm tia ở một tọa độ nằm dọc duy nhất. Tọa độ nằm dọc đó chính là đường chéo cắt (Data cursor) mà người dùng đang di chuyển trên màn hình C-Scan/B-Scan."},{"q":"Câu 10. Có bao nhiêu loại chế độ xem có sẵn trên máy omni-scan?","a":["a. 3","b. 4","c. 5","d. 2"],"c":2,"e":"Hệ thống OmniScan tiêu chuẩn hỗ trợ 5 không gian hiển thị (Views) cơ bản: A-Scan, B-Scan, C-Scan, S-Scan (Sectorial/Sweep) và End-View."},{"q":"Câu 11. B-Scan trong PA là gì?","a":["a. Hình quét bề mặt.","b. Hình chiếu cạnh hay mặt cắt dọc.","c. Mặt cắt ngang.","d. Mặt chiếu bằng."],"c":2,"e":"Theo thuật ngữ PAUT và tài liệu này, B-scan được định nghĩa là một hệ thống mặt cắt ngang thể hiện độ sâu và chiều quét của tín hiệu thu nhận."},{"q":"Câu 12. Hình quét tổng hợp C-Scan trong phân tích PA là.","a":["a. Hình quét bề mặt hay hình chiếu bằng.","b. Hình chiếu cạnh hay mặt cắt dọc.","c. Mặt cắt ngang.","d. Không câu nào đúng."],"c":0,"e":"C-Scan là hình ảnh đồ họa 2D biểu thị kết quả kiểm tra với góc nhìn từ trên không chiếu thẳng đứng xuống bề mặt vật liệu (Top view / Plan view). Màu sắc sẽ phản ánh Biên độ mạnh yếu hoặc Độ sâu."},{"q":"CHAP 8 - Câu 1. Tính số lượng mẫu với tần số số hóa (digitizer frequency) 43 MHz sử dụng với đầu dò tần số 5 MHz","a":["a. 8","b. 9","c. 12","d. 10"],"c":0,"e":"Số lượng mẫu (samples) trong 1 chu kỳ sóng được tính bằng cách lấy Tần số số hóa chia cho Tần số đầu dò. Ta có: 43 MHz / 5 MHz = 8.6. Hệ thống thường làm tròn số mẫu khả thi, đáp án sát nhất là 8 mẫu/chu kỳ."},{"q":"Câu 2. Khi kích thước biến tử giảm, điện thế phát nào sau đây sẽ được chọn:","a":["a. 40 V","b. 80 V","c. 120 V","d. 240 V"],"c":0,"e":"Kích thước biến tử (element size) nhỏ đi đồng nghĩa với việc mạng tinh thể áp điện trở nên rất mỏng manh. Nếu duy trì một mức điện áp xung (Voltage) quá cao, tinh thể có thể bị sốc điện và vỡ. Do đó, phải chọn mức điện thế thấp như 40V để bảo vệ đầu dò."},{"q":"Câu 3. Điều gì sau đây không phải là ưu điểm của dải độ sâu hội tụ (Dynamic Depth Focusing - DDF)","a":["a. Tốc độ quét hiệu dụng giảm","b. Kích thước vùng hộ tụ (Depth of field) tăng","c. DDF truyền chùm âm mảng pha hội tụ tại các độ sâu khác nhau của khuyết tật","d. Điểm hội tụ chùm âm giảm mà không cần phải thay đổi kích thước chùm âm"],"c":0,"e":"Tốc độ quét giảm (Scanning speed drops) là một NHƯỢC ĐIỂM của kỹ thuật DDF do thiết bị phải hao tốn rất nhiều tài nguyên để tính toán lại luật trễ thu nhận theo thời gian thực. Các lựa chọn còn lại đều là ưu điểm."},{"q":"Câu 4. Điều gì sau đây là phù hợp nhất khi thực hiện DDF","a":["a. Phát và thu hội tụ tại 1 độ sâu nhất định","b. Phát hộ tụ tại 1 độ sâu cố định cần quan tâm, thu tại nhiều độ sâu hộ tụ khác nhau (vùng cần quan tâm – Range of interested area)","c. Phát hội tụ tại các độ sâu khác nhau","d. Không điều nào ở trên"],"c":1,"e":"Kỹ thuật DDF (Hội tụ động theo độ sâu) thực hiện bằng cách: Chùm phát (Transmit) được lập trình để hội tụ tĩnh tại một tiêu điểm sâu cố định. Nhưng khi Thu sóng (Receive), mạch điện tử thay đổi luật trễ quét quét liên tục từ mặt tới đáy để bắt nét tất cả các điểm trên đường truyền."},{"q":"Câu 5. Khi thực hiện DDF, vùng nào sau đây sẽ được chọn hộ tụ? Nếu vùng cần quan tâm từ 50-150 mm?","a":["a. Phát hội tụ tại 75 mm, thu hội tụ từ 50-150 mm","b. Phát hội tụ tại 50 mm, thu hội tụ từ 50-150 mm","c. Phát hội tụ tại 50 mm, thu hội tụ từ 50-150 mm","d. Không điều nào ở trên"],"c":2,"e":"Để tối ưu trường hội tụ ở vùng cần quan tâm, tiêu cự phát thường được đặt ở đầu hoặc chính giữa của khối Range of interest (50mm hoặc 100mm). Sau đó hệ thống thu DDF trải dài bắt nét tín hiệu phản hồi từ 50 đến 150mm."},{"q":"Câu 6. Tần sô lặp xung PRF nào sau đây được chọn để đảm bảo tốc độ quét 120mm/giây với đàu dò tần số 5MHz, chùm âm Sectorial góc phát 35-75 độ?","a":["a. 1000","b. 2000","c. 4000","d. 5000"],"c":3,"e":"Tốc độ quét cơ học rất nhanh (120mm/s) kết hợp với chùm quét quạt (phải kích hoạt rất nhiều VPA tuần tự từ 35-75 độ) yêu cầu Tần số lặp xung PRF phải cực kỳ cao (ví dụ 5000 Hz) để máy kịp ghi nhận lưới dữ liệu mm mà không làm rớt tín hiệu."},{"q":"Câu 7. Tốc độ thu thập dữ liệu hoặc tốc độ thu thập tối đa phụ thuộc vào yếu tố nào sau đây?","a":["a. Cửa thu thập dữ liệu (range)","b. Số lấy trung bình","c. Độ phân giải góc (sweep resolution)","d. Tất cả các yếu tố trên"],"c":3,"e":"Tốc độ quét (Data acquisition speed) của máy bị chi phối bởi 3 thứ: Chiều sâu Range (sóng bay đi bay về mất thời gian), Lấy trung bình (đợi nhiều sóng để lọc nhiễu) và Độ phân giải góc (càng mịn thì càng phải xử lý nhiều luật phát)."},{"q":"Câu 8. Độ dài xung phát nên là:","a":["a. Thời gian hoàn thành 1 bước sóng","b. Thời gian hoàn thành ½ bước sóng","c. Như khuyến cáo của nhà sản xuất đầu dò","d. Thời gian hoàn thành ¼ bước sóng"],"c":1,"e":"Theo nguyên lý nạp xả của vật liệu Piezo, để kích thích biến tử rung động mạnh mẽ nhất (Cộng hưởng), độ rộng xung điện áp hình vuông (Pulse width) bơm vào tinh thể cần phải bằng đúng 1/2 chu kỳ (½ bước sóng) của tần số trung tâm."},{"q":"Câu 9. Số hóa tin hiệu tương tự (analogue) là yếu tố cần thiết. Để có số lượng lấy mẫu phù hợp, số lần lấy mẫu tối thiểu là:","a":["a. 3","b. 4","c. 5","d. 2"],"c":2,"e":"Dù định lý Nyquist quy định mức lấy mẫu (Sampling Rate) tối thiểu là 2 lần, nhưng trong thực tế siêu âm NDT để duy trì hình dạng sóng chính xác và không làm giảm biên độ Peak (điều quan trọng để đánh giá khuyết tật), tiêu chuẩn đòi hỏi máy phải lấy mẫu tối thiểu gấp 5 lần tần số đầu dò."},{"q":"Câu 10. Lấy trung bình (Averaging) sẽ loại bỏ tín hiệu nào sau đây","a":["a. Grating lobes","b. Tín hiệu của chỉ thị","c. Tín hiệu ma (Ghost signal)","d. Tín hiệu nhiễu điện"],"c":3,"e":"Kỹ thuật Video Averaging (Lấy trung bình tín hiệu) hoạt động bằng cách chồng nhiều chu kỳ phát-thu và lấy trung bình cộng. Vì tín hiệu Nhiễu điện (Electronic Noise) xuất hiện ngẫu nhiên không đồng bộ, chúng sẽ tự triệt tiêu nhau, giúp màn hình sạch hơn."},{"q":"Câu 11. Tăng tần số số hóa (tần số lấy mẫu), tốc độ thu nhận dữ liệu sẽ:","a":["a. Giữ nguyên","b. Giảm","c. Tăng","d. Không điều nào ở trên"],"c":2,"e":"Khi chip ADC số hóa ở một tần số cao hơn (nhanh hơn), nó hoàn thành việc lưu trữ một xung phản xạ A-Scan trong khoảng thời gian ngắn hơn. Điều này trực tiếp làm Tăng giới hạn tốc độ thu nhận tổng thể của hệ thống PAUT."},{"q":"Câu 12. Bão hòa các tín hiệu nghĩa là","a":["a. Tín hiệu có biên độ lớn hơn biên độ tín hiệu so sánh (Reference)","b. Tín hiệu có biên độ nhỏ hơn biên độ tín hiệu so sánh (Reference)","c. Tín hiệu có biên độ vượt quá độ cao màn hình","d. Cả A và C"],"c":3,"e":"Sự bão hòa (Saturation) xảy ra khi xung dội dội về có biên độ năng lượng vượt quá ngưỡng hiển thị của thiết bị đo (thường là >100% FSH). Lúc này màn hình bị 'cắt đỉnh', không thể xác định giá trị đỉnh thật sự của tín hiệu nữa."},{"q":"Câu 13. Với các tín hiệu tương ứng cho mỗi biến tử như sau trong chùm âm Linear góc phát 60 độ: Biến tử từ 1-8: 70% FSH; 9-10: 120%; 11-16: 90% FSH.","a":["a. Tín hiệu thu về cuối cùng bão hòa","b. Tín hiệu thu về cuối cùng không bão hòa","c. Tín hiệu thu về cuối cùng lớn hơn mức so sánh (ví dụ 80%)","d. Không điều nào ở trên đúng"],"c":2,"e":"Do thiết bị PAUT sử dụng kỹ thuật 'Delay and Sum' (Trễ và cộng gộp), tín hiệu từ tất cả các kênh sẽ được cộng lại và trung bình hóa. Vì chỉ có 2 biến tử bão hòa nhẹ (120%), tín hiệu tổng hợp cuối cùng sẽ bị đẩy lên cao hơn mức tham chiếu 80% nhưng thường chưa đủ để bị bão hòa toàn chùm."},{"q":"Câu 14. Lấy trung bình không được khuyến khích lớn hơn 1, Tại sao?","a":["a. Để cải thiện tỷ số tín hiệu/Nhiễu","b. Để giảm các tín hiệu không mong muốn","c. Để tăng tốc độ thu nhận dữ liệu","d. Để giảm giá trị PRF"],"c":2,"e":"Nếu đặt Averaging lớn hơn 1 (ví dụ = 4), máy bắt buộc phải phát đi phát lại 4 xung siêu âm tại CÙNG một vị trí quét rồi mới được di chuyển tiếp. Việc này làm Tốc độ quét (Scanning speed) rớt thảm hại, do đó chỉ đặt mức lớn khi thật sự cần khử nhiễu điện."},{"q":"Câu 15. Tại sao không nên chọn hiệu điện thế xung kích cao (high pulser voltage)","a":["a. Mối nguy so điện giật","b. Nhiễu nền quá cao","c. Ảnh hưởng đến tuổi thọ của đầu dò","d. Tất cả các lý do trên đều là cơ sở để chọn hiệu điện thế xung kích cao"],"c":2,"e":"Mạng tinh thể trong đầu dò Phased Array nhỏ hơn nhiều so với đầu dò UT truyền thống. Việc duy trì một điện thế kích phát (Voltage) ở mức Maximum liên tục sinh ra ứng suất cơ nhiệt rất lớn, có thể làm gãy vỡ biến tử và suy giảm tuổi thọ đầu dò nhanh chóng."},{"q":"Câu 16. Độ rộng xung kích (pulse width) phụ thuộc vào ½ bước sóng. Tính độ rộng xung kích cho đầu dò PAUT tần số 5MHz","a":["a. 200 nano giây","b. 300 nano giây","c. 500 nano giây","d. 100 nano giây"],"c":3,"e":"Ta có: Chu kỳ T = 1 / Tần số = 1 / 5,000,000 = 0.0000002 giây = 200 nanoseconds. Do độ rộng tối ưu là một nửa chu kỳ, vậy Pulse Width = 200 / 2 = 100 ns."},{"q":"Câu 17. Sử dụng tần số chuyển đổi Analog – Digital 12 MHz để số hóa cho tín hiệu có tần số cao nhất 8 MHz, kết quả tín hiệu số thu đươc là:","a":["a. Nhiều hơn mức cần thiết (Oversampled)","b. Dưới mức cần thiết (Under sampled)","c. Gấp đôi mức cần thiết (double sampled)","d. Mẫu thưa thớt (Sparse sampled)"],"c":1,"e":"Định lý lấy mẫu Nyquist bắt buộc ADC phải có tốc độ lấy mẫu gấp ít nhất 2 lần tần số tín hiệu (>= 16 MHz cho tần số 8 MHz) để không bị Aliasing. Sử dụng tần số 12 MHz để lấy mẫu 8 MHz là không đạt ngưỡng tối thiểu, gọi là Under-sampled (Lấy mẫu thiếu)."},{"q":"Câu 18. Mối nguy liên quan khi chọn sai bộ lọc cao qua (high pass filter)","a":["a. Tín hiện nhiễu quá cao, nghĩa là giảm tỷ lệ tín hiệu/nhiễu","b. Làm tăng tín hiệu nhiễu điện","c. Làm mất tín hiệu khuyết tật","d. Tất cả các điều trên"],"c":3,"e":"Bộ lọc Cao qua (High Pass) chỉ cho phép các thành phần tần số cao đi qua và chặn tần số thấp. Nếu dải phản xạ từ khuyết tật có tần số thấp, nó sẽ vô tình bị chặn (mất khuyết tật). Đồng thời các nhiễu điện cao tần vẫn lọt qua màn hình làm giảm tỷ số SNR."},{"q":"Câu 19. Tần số lấy mẫu tối thiểu lý tưởng là bao nhiêu để xung thu được có sai sô biên độ giới hạn trong 10%?","a":["a. 10","b. 3","c. 5","d. 2"],"c":2,"e":"Theo các tiêu chuẩn siêu âm PAUT, để sai số biên độ đỉnh khi số hóa (digital error) rơi vào dải an toàn không vượt quá 10% (khoảng 1dB), máy phải lấy ít nhất 5 mẫu (points) trong mỗi chu kỳ của tần số đầu dò."},{"q":"Câu 20. Để tăng tốc độ quét, điều gì sau đây không được áp dụng","a":["a. Giảm số góc phát","b. Thay đổi độ phân giải quét từ 1 lên 2","c. Thay đổi loại encoder có độ phân giải tốt hơn","d. Giảm dải kiểm tra (range of inspection)"],"c":2,"e":"Giảm góc phát, giảm Range hay hạ độ mịn tọa độ (từ 1mm xuống 2mm) đều làm giảm khối lượng tính toán, giúp máy tăng tốc độ quét. Còn việc dùng Encoder độ phân giải cao hơn (vạch chia nhỏ hơn) bắt máy phải cập nhật tọa độ liên tục, không giúp ích gì cho việc tăng tốc độ PRF."},{"q":"Câu 21. Tốc độ thu nhận dữ liệu sẽ bị ảnh hưởng gì khi tăng số tia?","a":["a. Giữ nguyên không đổi","b. Giảm","c. Không liên quan đến việc tăng chùm tia","d. Tăng"],"c":1,"e":"Số tia (Focal laws/ Beams) chính là số lượng các thuật toán trễ mà máy phải lần lượt kích hoạt để dựng lên một góc S-Scan (Ví dụ 40 đến 70 độ có 30 tia). Càng nhiều tia, chu trình của 1 vòng phát-thu càng lâu, khiến tốc độ thu nhận tổng thể bị Giảm xuống."},{"q":"Câu 22. Trong thực nghiệm phased array với đầu dò tần số 6 MHz, số mẫu lấy trong 1 chu kỳ với tần số lấy mẫu (tần số số hóa) 90Mhz là:","a":["a. 8","b. 15","c. 32","d. 10"],"c":1,"e":"Số lượng mẫu trong một chu kỳ = (Tần số lấy mẫu ADC) / (Tần số đầu dò). Bài toán cho ta 90 MHz / 6 MHz = 15 mẫu (đây là một cấu hình dư dả giúp duy trì hình dạng xung rất hoàn hảo)."},{"q":"Câu 23. Trong chùm âm Sector Scan, số kênh A-Scan nếu quét bằng 2 group dữ liệu như sau: i. Linear Sector góc 60, số biến tử phát 8, tổng số biến tử sử dụng 32. ii. Sectorial Scan góc phát 35-75, bước góc 1 độ, sử dụng 16 biến tử","a":["a. 41","b. 32","c. 66","d. Không câu nào ở trên"],"c":2,"e":"Số kênh (Focal Laws) được tính như sau: Ở Group 1 (Linear): 32 - 8 + 1 = 25 tia. Ở Group 2 (Sectorial từ 35-75 độ, mỗi bước 1 độ): Tính theo số bậc (75 - 35) / 1 + 1 = 41 tia. Tổng số kênh cho cả hai nhóm là 25 + 41 = 66 tia."},{"q":"Câu 24. Độ dài xung phát là","a":["a. Thời gian điện thế áp vào biến tử PA","b. Thời gian giữa điểm tăng và giảm của tín hiệu UT","c. Được khuyến cáo là 0.5x chu kỳ.","d. Tất cả các điều trên đúng"],"c":3,"e":"Độ rộng xung (Pulse duration/width) là khoảng thời gian máy duy trì mức điện áp kích vào tinh thể gốm PA (Tương ứng với điểm tăng và giảm của điện áp xung vuông). Để đạt lực cộng hưởng rung lớn nhất, khoảng thời gian này luôn được cài đặt bằng 0.5 x chu kỳ đầu dò."},{"q":"Câu 25. Thời gian xung vuông có biên độ cao áp vào để kích thích biến tử được gọi là","a":["a. Dạng xung","b. Biên độ xung","c. Độ rộng xung","d. Tất cả đều đúng"],"c":2,"e":"Đây chính là định nghĩa chuẩn của 'Độ rộng xung' (Pulse width) - thời lượng duy trì nguồn điện áp cao áp cho tinh thể áp điện trước khi ngắt mạch."},{"q":"Câu 26. Bộ lọc nào sau đầy làm tăng độ mở rộng chùm tia","a":["a. Cao qua (High Pass)","b. Thấp qua (Low pass)","c. Dải qua (Band Pass)","d. Tất cả các điều trên"],"c":0,"e":"Bộ lọc Cao qua (High Pass) lọc mất các tín hiệu tần số thấp, giúp tín hiệu hiển thị mỏng và sắc gọn. Trong một số khía cạnh lý thuyết phân kỳ, sự thay đổi phổ tần số sẽ làm thay đổi hệ số định hướng (beam spread), tạo hiệu ứng mở rộng chùm tia khác nhau."},{"q":"Câu 27. Trong chức năng dải hội tụ (DDF Dynamic depth focusing), điều gì là phù hợp:","a":["a. Phạm vi giữa của khu vực quan tâm để truyền (Mid range of area of interest for transmission)","b. Phần thu sẽ được đặt giữa khu vực quan tâm (Receiver shall be set between area of interest)","c. Cải thiện khả năng phát hiện khuyết tật","d. Tất cả các điều trên đúng"],"c":3,"e":"DDF tối ưu hóa vùng quét bằng cách đặt tiêu điểm phát (Transmission focus) ngay chính giữa dải cần kiểm tra. Quá trình thu (Receiver) quét dải trễ kéo dài qua suốt vùng đó. Điều này giúp tín hiệu nét đều ở mọi độ sâu, cải thiện xác suất phát hiện lỗi nhỏ (POD)."},{"q":"Câu 28. Tốc độ quét ảnh hưởng gì khi sử dụng thêm group để quét mối hàn?","a":["a. Tăng","b. Không đổi","c. Giảm","d. Tăng đáng kể"],"c":2,"e":"Máy OmniScan có phần cứng giới hạn. Khi bạn khai báo thêm Group (ví dụ chạy 1 lúc cả mảng sóng dọc và sóng ngang), máy phải chia sẻ thời gian PRF cho từng cấu hình theo phương pháp dồn kênh (Multiplexing). Điều này làm máy xử lý chậm lại, tức tốc độ quét (Scanning speed) bị giảm."},{"q":"Câu 29. Tính năng làm mượt (Smoothing) có tác dụng tốt hơn cho:","a":["a. Phát hiện đỉnh nứt (crack tip detection)","b. Đo chiều dài chỉ thị khuyết tật bão hòa","c. Làm mượt đường cong động (smooth dynamic curve)","d. Tất cả các điều trên."],"c":0,"e":"Tín hiệu phản xạ/nhiễu xạ từ mũi một vết nứt (Crack tip) thường là các xung có tần số cao, rất mỏng và yếu. Sử dụng tính năng làm mượt Video (Smoothing) sẽ bao bọc (envelope) đỉnh của xung này lại, giúp nó hiển thị thành một chấm rõ ràng, dễ bắt nét trên màn hình quét 2D."},{"q":"Câu 30. Tính độ rộng xung phát cho đầu dò 5L32","a":["a. 50 ns","b. 100 ns","c. 200 ns","d. 150 ns"],"c":1,"e":"Đầu dò 5 MHz (5L32). Chu kỳ T = 1 / 5,000,000 = 200 ns. Độ rộng xung (Pulse width) bằng một nửa chu kỳ, tức là 200 / 2 = 100 ns."},{"q":"Câu 31. Tốc độ thu nhận dữ liệu phụ thuộc vào","a":["a. Số group","b. Sô luật phát","c. Độ dàu của vật kiểm","d. Tất cả ở trên"],"c":3,"e":"Như một quy luật: Tăng độ sâu Range, tăng số tia quét quét (Luật phát), tăng thêm số lượng nhóm quét (Group) đều làm tăng chu kỳ của máy siêu âm. Tất cả các yếu tố này gộp lại sẽ làm tụt Tốc độ thu nhận (Scan Speed)."},{"q":"Câu 32. Khuyến cáo nào sau đây cho độ rộng xung phát:","a":["a. Phụ thuộc tần số","b. Phụ thuộc số biến tử sử dụng","c. Nên bằng 0.5x chu kỳ","d. A và C đúng"],"c":3,"e":"Nguyên tắc thiết lập là: Độ rộng xung (Pulse width) luôn cài ở mức một nửa (0.5x) của thời gian chu kỳ. Vì chu kỳ tỷ lệ nghịch với tần số, nên độ rộng xung chắc chắn phải thay đổi phụ thuộc vào Tần số của đầu dò."},{"q":"Câu 33. Tần số PRF là bao nhiêu khi quét với tốc độ 150 mm/giây, đầu dò tần số 10 MHz quét chùm góc từ 41 đến 70 độ:","a":["a. 1000","b. 2000","c. 4500"],"c":2,"e":"Di chuyển 150 mm trong 1 giây là một tốc độ khổng lồ trong siêu âm. Hơn nữa, chùm tia quét từ 41 đến 70 độ (30 tia/chu kỳ) tốn rất nhiều thời gian. Để encoder ghi kịp tọa độ mà không bị 'khuyết dữ liệu' (Missed data line), PRF phải được đẩy lên mức siêu cao 4500 Hz."},{"q":"Câu 34. Mức khuyêch đại của tần số số hóa 10 bit?","a":["a. 10","b. 256","c. 512","d. 1024"],"c":3,"e":"Chip ADC (Bộ chuyển đổi Analog sang Digital) 10 bit mã hóa cường độ điện áp thành dữ liệu nhị phân. Số cấp bậc biên độ rời rạc được tạo ra là 2 mũ 10. Ta có 2^10 = 1024 cấp biên độ."},{"q":"Câu 35. Tính độ rộng xung phát cho đầu dò PA tần số 10 MHz","a":["a. 20 ns","b. 30 ns","c. 50 ns (nanosecond)","d. 100 ns"],"c":2,"e":"Với đầu dò 10 MHz, chu kỳ T = 1 / 10MHz = 0.1 µs = 100 ns. Độ rộng xung = 1/2 T = 50 nanoseconds."},{"q":"Câu 36. Đầu dò có tần số hoạt động cao nhất là 7.5 MHz, Sử dụng tần số số hóa 120 MHz. Tín hiệu thu được so với mức tối thiểu lý tưởng là:","a":["a. Trên mức lý tưởng tối thiểu","b. Dưới mức lý tưởng tối thiểu","c. Gấp đôi mức lý tưởng tối thiểu","d. Thưa hơn so với mức lý tưởng tối thiểu"],"c":2,"e":"Mức lấy mẫu lý tưởng cho siêu âm (Ideal Minimum Sampling) thường được quy định trong dải x8 lần tần số đầu dò để biên độ không sai lệch (7.5 x 8 = 60 MHz). Việc thiết bị dùng ADC lên tới 120 MHz tức là đã Gấp đôi (120/60 = 2) mức tiêu chuẩn."},{"q":"Câu 37. Vận tốc quét thay đổi như thế nào kho thay tăng tần số số hóa (digitizer)","a":["a. Không đổi","b. Tăng","c. Giảm","d. Không có điều nào ở trên."],"c":1,"e":"Digitizer frequency cao hơn đồng nghĩa phần cứng lấy mẫu tín hiệu với tốc độ nhanh hơn, rút ngắn thời gian xử lý dữ liệu cho mỗi tia quét. Máy xử lý nhanh hơn sẽ cho phép ta có thể đẩy Vận tốc kéo cơ học (Scanning speed) tăng lên."},{"q":"Câu 38. Sử dụng đầu dò PA 5 MHz, tần số số hóa 35 MHz, số mẫu lấy trong 1 chu kỳ là:","a":["a. 7","b. 16","c. 5","d. 20"],"c":0,"e":"Phép tính đơn giản: Tần số số hóa / Tần số đầu dò = 35 / 5 = 7 (mẫu điểm ảnh được sinh ra trong 1 chu kỳ dao động sóng)."},{"q":"Câu 39. Tính dải động của bộ xử lý 10 bit cho thiết bị trong kiểm tra Pulse Echo","a":["a. 48 dB","b. 60 dB","c. 42 dB","d. 80 dB"],"c":1,"e":"Dải động (Dynamic range) của một hệ thống xử lý số N bit được ước tính bằng công thức: 20 x log10(2^N). Thay N = 10 bit, ta có 20 x log10(1024) ≈ 60 dB. Nghĩa là hệ thống có thể đọc biệt lập các chênh lệch năng lượng trải dài 60dB."},{"q":"Câu 40. PRF nào phù hợp nhất cho tốc độ quét 10 MHz, đầu dò PA Linear 10 MHz, góc phát Sectorial 40 – 70 độ:","a":["a. 1550","b. 2550","c. 3500"],"c":0,"e":"Đầu dò 10MHz, dải góc Sector khá hẹp (chỉ 30 tia). Một PRF tầm trung quanh 1550 Hz là cấu hình lý tưởng vừa đủ để tránh việc các sóng bị nhiễu dội lẫn nhau (Ghost echoes) mà vẫn đáp ứng đủ tốc độ di chuyển Encoder."},{"q":"Câu 41. Điều gì là đúng về dải độ sâu hộ tụ (DDF: Dynamic Depth Focusing)","a":["a. Dải hội tụ giảm (Depth of field is reduced)","b. Dải hội tụ tăng (Depth of field is increased)","c. Dải hội tụ không đổi (Depth of field remain same)","d. Tất cả đều đúng"],"c":1,"e":"Giá trị của kỹ thuật DDF nằm ở chỗ nó giải quyết được điểm yếu của hội tụ tĩnh (focusing): Hội tụ tĩnh chỉ sắc nét ở một cự li. DDF liên tục điều chỉnh luật trễ thu nhận theo độ sâu, làm cho dải hội tụ (Depth of field) được KÉO DÀI ra suốt chiều dày của vật thể (Tăng)."},{"q":"Câu 42. Số lấy mẫu tối thiểu theo Nyquist","a":["a. 2","b. 3","c. 5","d. 4"],"c":0,"e":"Định lý lấy mẫu Nyquist–Shannon trong toán học điện tử quy định cứng: Bất kỳ một tín hiệu sóng tần số f nào muốn số hóa mà không bị sai lệch cấu trúc (aliasing), thì tần số ADC phải tối thiểu bằng 2 lần f (Tối thiểu 2 mẫu/chu kỳ)."},{"q":"Câu 43. Tính năng điện tử tạo 1 đường bao trên các tín hiệu chỉnh lưu để làm giảm sai số biên độ là:","a":["a. Lấy trung bình (Averaging)","
