 cho một phông nền quá dày đặc","Cả a và b","Không điều nào ở trên đúng"],"c":2,"e":"Nồng độ thấp làm khuyết tật bị thiếu hạt từ bám, gây ra chỉ thị mờ/yếu; nồng độ cao làm bẩn nền giảm độ tương phản. Do đó, cần duy trì hàm lượng tối ưu (Cả a và b)."}],"ASNT_MT LEVEL 1&2 (CẤP 2)":[{"q":"Việc giải đoán các chỉ thị hạt từ có thể được trợ giúp bằng cách :","a":["Quan sát với một kính phóng đại (kính lúp)","Quan sát các chỉ thị khi chúng được hình thành","Tái tạo lại chỉ thị bằng từ trường dư","Tất cả các cách trên"],"c":3,"e":""},{"q":"Từ trường dư có thể hữu ích như một công cụ trợ giúp :","a":["Trong việc đánh giá chất lượng kim loại hàn","Trong việc giải đoán và đánh giá các chỉ thị","Trong việc khử từ","Tất cả các việc trên"],"c":1,"e":""},{"q":"Một sự gián đoạn về cấu trúc vật lý hay cấu hình bình thường của một bộ phận tạo ra một chỉ thị MT, được gọi là :","a":["Một bất liên tục","Một khuyết tật","Một chỉ thị","Một biến dạng"],"c":0,"e":""},{"q":"Khi so sánh các bộ phận đã được từ hoá vòng với các bộ phận đã được từ hoá dọc, loại nào lưu giữ từ trường dư ‘’ khó chịu nhất ‘’ nếu không khử từ ?","a":["Từ trường dọc","Từ trường vòng","Từ trường vector","Từ trường dư nhỏ"],"c":1,"e":""},{"q":"Loại từ hoá nào sử dụng công thức : Ampere - vòng = 45 000 / LD ?","a":["Vòng","Dọc","Song song","Vector"],"c":1,"e":""},{"q":"Tại sao các miếng tiếp xúc rộng, mềm bằng đồng hay chì được dùng cho các bề mặt hay đầu kẹp ?","a":["Để tăng diện tích tiếp xúc và giảm nguy cơ đốt nóng bộ phận","Do điểm nóng chảy thấp của các vật liệu này","Bởi vì chúng hỗ trợ đốt nóng kim loại do đó làm cho việc cảm ứng từ dễ dàng","Để tăng diện tích tiếp xúc và mật độ thông lượng"],"c":0,"e":""},{"q":"Một sản phẩm rèn thô, không xử lý thêm, được kiểm tra hạt từ. Một chỉ thị quan sát được có nhánh phát triển theo mọi hướng.Nó có vẻ như ăn sâu vào bộ phận và chạy thẳng góc với bề mặt. Nó rất sắc nét. Danh tính khả dĩ của chỉ thị này là :","a":["Nứt nổ do rèn","Chồng lấp","Tạp chất","Đường khâu"],"c":0,"e":""},{"q":"Một bộ số với các chân răng và ổ trục được làm cứng vỏ, được kiểm tra MT. Các chỉ thị đơn lẻ được phát hiện trên năm răng và trên một bề mặt cuối của ổ trục. Mặc dù các chỉ thị này rất sắc nét và phân tách rõ ràng, nhưng chúng không phát triển ra đến các gờ cạnh của bộ phận. Danh tính khả dĩ của chỉ thị này là gì ?","a":["Các vết nứt do mài","Các xỉ ngậm","Rỗ","Nứt do tôi (Quenching)"],"c":3,"e":""},{"q":"Nếu một mẫu hình tổng thể (thường là các đường tròn) xuất hiện trên các bề mặt kiểm tra, kiểm tra viên nên xử lý bộ phận kiểm tra này như thế nào ?","a":["Kiểm tra lại với một cường độ dòng điện cao hơn","Khử từ","Kiểm tra lại với cường độ dòng điện thấp hơn","Cả a và b"],"c":1,"e":""},{"q":"Một cân nhắc quan trọng khi lựa chọn một loại bột được sử dụng như một chất liệu hạt từ là việc lựa chọn một loại bột :","a":["Có độ tương phản cao với bề mặt kiểm tra","Có độ tương phản thấp với bề mặt kiểm tra","Sẽ bám dính vào bề mặt kiểm tra","Cần có dòng điện khử từ cường độ cao để loại bỏ nó"],"c":0,"e":""},{"q":"Khi kiểm tra tìm các vết nứt mảnh và nông trên bề mặt, phương pháp MT được ưa dùng sẽ là :","a":["AC khô","DC khô","AC ướt","DC ướt"],"c":2,"e":""},{"q":"Điều nào sau đây là một ưu điểm của phương pháp khô so với phương pháp ướt ?","a":["Phương pháp khô nhạy hơn với các vết nứt mảnh trên bề mặt","Phương pháp khô có khả năng tốt hơn để bao phủ toàn bộ bề mặt các bộ phận có hình dạng bất thường","Phương pháp khô dễ sử dụng hơn cho việc kiểm tra tại hiện trường với thiết bị xách tay","Phương pháp khô nhanh hơn phương pháp ướt khi kiểm tra một số các bộ phận nhỏ"],"c":1,"e":""},{"q":"Khi kiểm tra một thanh tròn có tỷ số L / D bằng bốn trong một cuộn dây có mười vòng, dòng điện được yêu cầu là :","a":["1125 ampere","18 000 ampere","45 000 ampere","Không biết, cần có thêm thông tin"],"c":0,"e":""},{"q":"Các chốt trục bên trong và các lỗ khoan song song hoặc gần bề mặt kiểm tra sẽ gây ra :","a":["Các chỉ thị rộng, mờ ảo, nằm thẳng hàng với đường nét bên trong đó của bộ phận","Các chỉ thị sắc nét, rõ ràng, nằm thẳng hàng với đường nét bên trong đó của bộ phận","Không có chỉ thị nào","Cả a và b"],"c":0,"e":""},{"q":"Một số hạn chế của kỹ thuật từ hoá bằng cuộn dây là :","a":["Cuộn dây phải có đường kính nhỏ nhất trong mối tương quan với bộ phận","Trường hiệu dụng nói chung bị giới hạn trên các bề mặt của cuộn dây","Các bộ phận có đường kính nhỏ nên được đặt gần với cuộn dây","Tất cả các điều trên"],"c":3,"e":""},{"q":"Hình vẽ nào sau đây mô tả dạng sóng của dòng AC chỉnh lưu ba pha - toàn sóng ?","a":["Dạng sóng a","Dạng sóng b","Dạng sóng c","Dạng sóng d"],"c":0,"e":""},{"q":"Khuyết tật nào sau đây của quá trình đúc là do quá trình nguội không đồng đều làm tăng ứng suất gây đứt đoạn bề mặt kim loại ?","a":["Co ngót","Rách nóng (hot tear)","Rỗ","Xỉ sắt"],"c":0,"e":""},{"q":"Đại lượng được dùng để mô tả sự cản trở toàn diện dòng điện chạy bởi một hiệu ứng tổ hợp của điện trở, độ cảm ứng, và điện dung của một mạch điện là :","a":["Điện kháng","Trở kháng","Từ trở","Phân huỷ"],"c":1,"e":""},{"q":"Một quá trình từ hoá bằng cuộn dây được thực hiện sau quá trình từ hoá bằng đầu kẹp sử dụng phương pháp liên tục ướt. Để tiến hành việc từ hoá bằng cuộn dây một cách phù hợp, cần phải :","a":["Loại bỏ tất cả các chất lỏng chứa hạt từ ướt ra khỏi bộ phận bằng các giẻ thấm khô, sạch","Khử từ bộ phận xen kẽ giữa quá trình từ hoá bằng đầu kẹp và quá trình từ hoá bằng cuộn dây","Đặt bộ phận vào cuộn dây và tiếp tục kiểm tra sau khi đã đánh giá các chỉ thị của quá trình từ hoá bằng đầu kẹp","Không phải những điều trên"],"c":1,"e":""},{"q":"Khi bổ sung thêm hàm lượng vào bất kỳ một chất lỏng chứa hạt từ ướt nào, phương pháp chung là :","a":["Thêm bột trực tiếp vào chất lỏng chứa này","Làm một lượng nhỏ hỗn hợp kiểm tra dạng bột nhão","Cả hai cách trên","Không phải cách nào ở trên"],"c":1,"e":""},{"q":"Một tính chất được ưa thích của các hạt từ dùng làm chất liệu kiểm tra cho cả phương pháp khô lẫn phương pháp ướt là chúng :","a":["Không độc hại","Có tính thấm từ cao","Có độ lưu giữ từ thấp","Có tất cả các đặc trưng trên"],"c":3,"e":""},{"q":"Điều kiện nào sau đây có thể gây ra các chỉ thị hạt từ không liên quan ?","a":["Các mối nối giữa các kim loại khác nhau","Các mối nối Brazing","Các vết cắt của công cụ thô trên bề mặt","Tất cả các điều kiện trên"],"c":3,"e":""},{"q":"Các cực ngoài quá mạnh để có thể kiểm tra tốt một bộ phận rất có thể tạo ra khi sử dụng :","a":["Từ hoá vòng","Từ hoá dọc","Từ hoá phân cực","Từ hoá dư"],"c":1,"e":""},{"q":"Một bất liên tục của sản phẩm rèn thô có những đặc trưng sau đây : nó có thể xuất hiện trên bề mặt hoặc bên trong; nó gắn liền với quá trình xử lý ở nhiệt độ thấp; Nó thường do các công việc gia công quá mức gây ra; và nó tạo ra các vết lõm thẳng hoặc hình dạng bất thường với kích thước biến đổi. Bất liên tục này có thể được nhận dạng hoặc phân loại như :","a":["Một vết nứt nổ","Co ngót","Một rỗ hình ống","Một tách lớp"],"c":0,"e":""},{"q":"Các bất liên tục trong tôn phẳng, tấm hoặc lá mỏng do rỗ hình ống, ngậm xỉ hoặc lỗ khí thoát trong các khối đúc lớn ban đầu, mà chúng sau quá trình cán, thường bị ép dẹt phẳng và song song với bề mặt ngoài, được gọi là :","a":["Các đường khâu","Các tách lớp","Các vết nứt","Các vết chồng lấp"],"c":1,"e":""},{"q":"Các vết chồng lấp của quá trình rèn liên quan thế nào với hướng trục của một bộ phận?","a":["Có thể xảy ra ở bất kỳ nơi nào trên bề mặt và có thể không liên quan gì đến hướng trục của bộ phận","Thường luôn được tìm thấy trên đường trung tâm nhiệt","Được tìm thấy trên bề mặt của bộ phận vuông góc 90 độ với trục dài","Có thể xảy ra ở bất kỳ nơi nào trong bộ phận và thường luôn chạy song song theo hướng gia công"],"c":3,"e":""},{"q":"Sự tích tụ các hạt từ tại một vị trí trên bề mặt bộ phận, được tập trung và giữ lại vào vị trí đó bởi từ trường rò rỉ, được gọi là :","a":["Một bất liên tục","Một khuyết tật","Một chỉ thị","Nhiễu từ"],"c":2,"e":""},{"q":"Khi các hạt từ bị hút về một vị trí trên bề mặt của một bộ phận do một từ trường rò rỉ gây bởi một tình trạng như một vết nứt, chồng lấp, hoặc các điều kiện khác không thể chấp nhận so với tiêu chuẩn áp dụng cho bộ phận, thì chúng ta có :","a":["Một bất liên tục","Một khuyết tật","Một chỉ thị không liên quan","Tất cả các điều trên"],"c":1,"e":""},{"q":"Dòng AC chỉnh lưu nửa sóng (HWDC) được dùng để phát hiện :","a":["Chỉ các khuyết tật bề mặt","Chỉ các khuyết tật gần bề mặt","Các khuyết tật bề mặt và gần bề mặt","Không phải các loại khuyết tật ở trên"],"c":2,"e":""},{"q":"Kỹ thuật nào sau đây được dùng để loại bỏ một lớp dầu hoặc mỡ mỏng là không thể chấp nhận được trước khi tiến hành kiểm tra hạt từ :","a":["Rửa sạch bằng dung môi","Giảm mỡ bằng phương pháp bay hơi","Rắc phấn hoặc vôi bột lên bề mặt, sau đó lau bằng rẻ khô và sạch","Chải, quét bề mặt bằng bàn chải sợi cứng"],"c":1,"e":""},{"q":"Cách nào sau đây là một kỹ thuật được dùng phổ biến nhằm lưu giữ các hình ảnh chỉ thị MT ?","a":["Sơn dính trong suốt","Băng keo (dính)","Chụp hình","Tất cả các kỹ thuật trên"],"c":3,"e":""},{"q":"Tất cả các bất liên tục sau đây được tìm thấy phổ biến trong các sản phẩm cán, ngoại trừ :","a":["Các đường (seams)","Tach lop","Nứt nguội (Cold shut)","Các vết nứt"],"c":1,"e":""},{"q":"Tất cả các bất liên tục sau đây được tìm thấy phổ biến trong các sản phẩm rèn ngoại trừ :","a":["Các vết chồng lấp","Co ngót","Nứt nổ","Xỉ nhỏ rải rác"],"c":1,"e":""},{"q":"Cái nào sau đây là một khuyết tật thường gắn liền với các quá trình hàn","a":["Không thấu","Xỉ nhỏ rải rác","Các đường khâu","Các dạng phân lớp"],"c":0,"e":""},{"q":"Loại nứt nào sau đây có thể xuất hiện như một hình mẫu bất thường, theo vạch ô sọc hoặc rải rác của các đường mảnh, thường là do quá trình nung nóng quá mức gây ra :","a":["Các vết nứt mỏi","Các vết nứt do mài","Các vết nứt rạn","Các vết nứt trong vùng ảnh hưởng nhiệt (HAZ)"],"c":1,"e":""},{"q":"Loại bất liên tục nào sau đây được xem là nguy hại nhất cho tuổi thọ sử dụng của một hạng mục ?","a":["Các ngậm xỉ nằm dưới bề mặt","Các rỗ hoặc lỗ rỗng nằm dưới bề mặt","Các vết nứt mở ra trên bề mặt","Tất cả các loại trên"],"c":2,"e":""},{"q":"Nếu một vật dẫn bằng đồng được đặt xuyên qua một hình trụ bằng sắt và có một dòng điện chạy qua vật dẫn này, thì từ trường (mật độ thông lượng) trong hình trụ sẽ :","a":["Có cường độ và phân bố như trong vật dẫn","Lớn hơn trong vật dẫn","Nhỏ hơn trong vật dẫn","Là như nhau bất kể sự gần sát của nó đến thành hình trụ"],"c":2,"e":""},{"q":"một bộ phận dài được từ hoá bằng dòng điện chạy từ đầu này đến đầu kia :","a":["ảnh hưởng đến độ thấm từ của bộ phận","Làm thay đổi độ lớn của từ trường","Không ảnh hưởng đến độ lớn của từ trường","Làm cho từ trường biến đổi"],"c":2,"e":""},{"q":"Nếu các thanh tròn có các đường kính 25mm (1in.) và 51mm (2in.) được từ hoá bằng cách cho cùng một dòng điện như nhau chạy qua chúng, các từ trường sẽ :","a":["Như nhau đối với cả hai thanh","Mạnh hơn trong thanh đường kính 51mm (2in.)","Yếu hơn trong thanh đường kính 25mm (1in.)","Mạnh hơn trong thanh đường kính 25mm"],"c":3,"e":""},{"q":"Nếu một dòng điện có cùng cường độ chạy qua hai vật dẫn có các kích thước giống nhau, một vật dẫn là loại từ tính, còn vật dẫn kia là loại không từ tính, thì từ trường xung quanh hai vật dẫn này sẽ :","a":["Mạnh hơn đối với vật dẫn từ tính","Mạnh hơn đối với vật dẫn không từ tính","Biến đổi theo độ thấm từ","Như nhau đối với cả hai vật dẫn"],"c":3,"e":""},{"q":"Phương pháp MT hiệu quả nhất để kiểm tra một sản phẩm đúc lớn là sử dụng","a":["Từ hoá nhiều hướng","Một vật dẫn trung tâm","Kiểm tra bằng que châm theo hai hướng","Từ hoá trực tiếp"],"c":0,"e":""},{"q":"Cơ chế hư hỏng phổ biến nhất gắn liền với các chỗ gấp sắc nhọn, các vết khấc khứa, các vết lõm sắc (undercut) và các đường khâu là:","a":["Quá trình nứt do mỏi","Quá trình tinh thể hoá","Co ngót","Quá trình khử các bon"],"c":0,"e":""},{"q":"Khi đã tin rằng một khuyết tật đã được loại bỏ bằng các quá trình bào, mài, hoặc cắt bằng tia lửa, qóa trình thao tác tiếp theo là :","a":["Sửa chữa nó","Đo nó để xem liệu có còn lại chiều dày tối thiểu hay không","Kiểm tra lại khu vực có khuyết tật này bằng phương pháp hạt từ","Dừng bộ phận này lại"],"c":2,"e":""},{"q":"Khi việc khử từ hoàn toàn sẵn có được mong đợi và việc này được thực hiện bằng cách đặt bộ phận trong một cuộn dây được cấp năng lượng bằng dòng AC có cường độ giảm dần, sự định hướng của trục dọc bộ phận được ưa thích nhất là","a":["Đông - Tây","Bắc - Nam","Nam - Tây","Bắc - Tây"],"c":0,"e":""},{"q":"Các chỉ thị không liên quan do các cực cục bộ từ dư gây ra làm nhiễu đến việc kiểm tra hạt từ. Để quá trình kiểm tra thành công, người ta nên","a":["Sử dụng cường độ dòng cao hơn nữa","Khử từ, sau đó từ hoá lại theo hướng mong muốn","Sử dụng cường độ dòng thấp hơn","Từ hoá theo hướng khác"],"c":1,"e":""},{"q":"Để làm giảm bớt những vấn đề của các chỉ thị do quá trình gia công nguội gây nên trong một bộ phận, bộ phận này nên được :","a":["Khử từ, sau đó kiểm tra lại","Kiểm tra lại sau quá trình khử ứng suất","Kiểm tra lại theo hướng ngược lại","Từ hoá lại với cường độ cao hơn"],"c":0,"e":""},{"q":"Đại lượng đo một đường thông lượng đi qua diện tích một centimet vuông là :","a":["Oersted","Ohm","Gauss","Ampere"],"c":2,"e":""},{"q":"Khả năng của vật chất này hút một vật chất khác về phía nó là một hiện tượng gắn liền với :","a":["Độ lớn của từ trường","Từ tính","Lực cưỡng bức","độ lớn cực"],"c":1,"e":""},{"q":"Các vật liệu bị hút mạnh về một nam châm được gọi là :","a":["Được từ hoá","Không từ tính","Sắt từ","Được phân cực"],"c":2,"e":""},{"q":"Các vật liệu bị hút từ yếu được gọi là:","a":["Thuận từ","Nghịch từ","Sắt từ","Không từ tính"],"c":0,"e":""},{"q":"Các vật liệu bị đẩy từ yếu được gọi là:","a":["Thuận từ","Nghịch từ","Sắt từ","Không từ tính"],"c":1,"e":""},{"q":"Đầu của một nam châm mà tại đó các đường từ thông được nghĩ là đi vào thanh nam châm, là :","a":["Cực bắc","Cực Nam","Cả cực bắc và cực nam","Không phải các điều trên"],"c":1,"e":""},{"q":"Một quy tắc chung được sử dụng để xác định khả năng phát hiện các bất liên tục bề mặt bằng kiểm tra hạt từ là :","a":["Chiều sâu và chiều rộng không ảnh hưởng gì đến nhau","Chiều sâu nên ít nhất bằng 5 lần chiều rộng mở của khuyết tật trên bề mặt","Chiều sâu nên ít nhất có tỷ số 1 : 1 so với chiều rộng","Không phải các điều trên"],"c":2,"e":""},{"q":"Khái niệm chung được dùng để nói về sự đứt đọan kimloại trong một bộ phận kiểm tra là :","a":["Bất liên tục","Nứt","Đường khâu","Chồng lấp"],"c":0,"e":""},{"q":"Hình ảnh các hạt bột sắt được rắc lên một tờ giấy đặt qua một thanh nam châm được gọi là :","a":["Khảo sát trường","Nam châm kế","Từ phổ","Thông lượng kế"],"c":2,"e":""},{"q":"Các đường lực tạo thành một con đường xung quanh một vết nứt trong một thanh nam châm hình vòng xuyến được gọi là :","a":["Các đường từ","Thông lượng rò rỉ","Độ lớn của từ trường","Trường dọc"],"c":1,"e":""},{"q":"Do các đường lực từ trong một thanh nam châm chạy dọc theochiều dài của thanh này, nên nó được nói là :","a":["Được từ hoá ngẫu nhiên","Được từ hoá vĩnh cửu","Được từ hoá vòng","Được từ hoá dọc"],"c":3,"e":""},{"q":"Các đường thông lượng được nghĩ là rời một thanh nam châm tại :","a":["Cực bắc","Cực nam","Cả cực bắc và cực nam","Không phải các điều trên"],"c":0,"e":""},{"q":"Một bất liên tục từ tính là một đứt đoạn trong sự đồng nhất về từ của một bộ phận, là liên quan đến một sự thay đổi đột ngột về :","a":["Độ tự cảm","Điện trở","Điện dung","Độ từ thẩm"],"c":3,"e":""},{"q":"Để phát hiện các khuyết tật trong các hướng khác nhau trong một vật liệu bằng phương pháp kiểm tra hạt từ, tốt nhất là sử dụng :","a":["Hai hoặc nhiều hơn các trường trong các hướng khác nhau","Chỉ một trường","Các đầu dò khác nhau","Một trường tần số cao"],"c":0,"e":""},{"q":"Các bộ phận là các miếng phôi được cắt ra từ các thanh thỏi sắt cán. Chúng đã được gia công sơ bộ. Việc kiểm tra được thực hiện bằng phương pháp liên tục, sử dụng từ hoá vòng, làm phát lộ ra các đường sắc nét nhưng không liên tục, chạy song song với với trục trên một số miếng và không có chỉ thị nào trên một số miếng khác. Các đường đứt quãng này dài từ 6 đến 25 mm (0,25in, đến 1 in.). Các chỉ thị này là thể hiện của:","a":["Co ngót","Các vết rách xé do gia công","Các vết đánh dấu kiểm tra bề mặt","Các ngậm xỉ phi kim loại"],"c":3,"e":""},{"q":"Một sản phẩm rèn lớn được sửa chữa bằng quá trình hàn. Kiểm tra hạt từ mối hàn sửa chữa phát hiện thấy một chỉ thị bất thường song song với các lớp hàn. Chỉ thị này nằm ở tâm của đáy chỗ hàn và bắt đầu và kết thúc lại hơi lệch khỏi hướng của trục. Chỉ thị này là thể hiện của :","a":["Các ngậm xỉ","Các vết nứt hình sao","Các vết nứt hàn do co ngót","Các vết đánh dấu kiểm tra bề mặt"],"c":2,"e":""},{"q":"Giá trị nào là công suất được sử dụng chung cho các bóng đèn thuỷ ngân bay hơi dùng cho kiểm tra hạt từ huỳnh quang ?","a":["200W","50W","100W","75W"],"c":2,"e":""},{"q":"Một ví dụ về một chỉ thị không liên quan được đánh giá như là một bất thường về từ chứ không phải là một bất liên tục do:","a":["Một túi xỉ","Các vết nứt do mài","Một sự thay đổi đột ngột về độ cứng của bộ phận","Không phải các điều trên"],"c":2,"e":""},{"q":"Việc phát hiện các khuyết tật nằm sâu dưới bề mặt (6 đến 51mm) trong một mối hàn lớn là :","a":["Rất giống như việc phát hiện các vết nứt trên bề mặt","Không khó khăn nếu các khuyết tật này là các rỗ khí nhỏ","Đơn giản nếu chiều rộng của khuyết tật có thể ước lượng được","Rất không thể"],"c":3,"e":""},{"q":"Trong kiểm tra hạt từ, tốt nhất là :","a":["Kiểm tra lại tất cả các bất liên tục còn nghi vấn để đảm bảo không có các bộ phận sai hỏng được chấp nhận","Đảm bảo rằng các bộ phận đáp ứng các tiêu chuẩn chấp nhận được chỉ định","Chắc chắn rằng các bộ phận tốt hơn tiêu chuẩn được chỉ định và không chứa một bất liên tục nào cả","Kiểm tra lại các bộ phận còn nghi vấn bằng cách sử dụng phương pháp NDT khác"],"c":1,"e":""}]} ;



    // ================= TỪ ĐÂY TRỞ XUỐNG BẠN ĐỪNG CHẠM VÀO NHÉ =================
    let subjects = JSON.parse(localStorage.getItem('pro_subjects')) || {};
    
    // Logic: Nếu khách lạ vào (hoặc bị lỗi trang), hệ thống tự lấy đống F12 đổ ra cho họ xài
    if (Object.keys(subjects).length === 0) {
        subjects = KHO_DU_LIEU;
        localStorage.setItem('pro_subjects', JSON.stringify(subjects));
    }

    let currentSubject =[];
    let currentIdx = 0;
    let selectedOption = null;
    let results =[];

    function showScreen(id) {
        document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'home-screen') renderSubjects();
    }

    function renderSubjects() {
        const list = document.getElementById('subject-list');
        list.innerHTML = '';
        Object.keys(subjects).forEach(name => {
            const div = document.createElement('div');
            div.className = 'bg-card p-5 rounded-xl flex justify-between items-center';
            div.innerHTML = `
                <div>
                    <div class="font-bold text-lg text-blue-300">${name}</div>
                    <div class="text-sm text-slate-400">${subjects[name].length} Câu hỏi</div>
                </div>
                <div class="flex gap-3">
                    <button onclick="startQuiz('${name}')" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">Vào học</button>
                    <button onclick="deleteSub('${name}')" class="text-red-400 p-2"><i class="fas fa-trash"></i></button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function saveSubject() {
        const name = document.getElementById('subject-name').value;
        const json = document.getElementById('json-input').value;
        try {
            subjects[name] = JSON.parse(json);
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            showScreen('home-screen');
        } catch(e) { alert("Lỗi định dạng JSON!"); }
    }

    function startQuiz(name) {
        currentSubject = subjects[name];
        currentIdx = 0;
        results = new Array(currentSubject.length).fill(null);
        showScreen('quiz-screen');
        renderGrid();
        loadQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('question-grid');
        grid.innerHTML = '';
        currentSubject.forEach((q, i) => {
            const box = document.createElement('div');
            let extraClass = '';
            
            if (i === currentIdx) { extraClass = 'active'; } 
            else if (typeof results[i] === 'number') {
                if (results[i] === q.c) { extraClass = 'correct-nav'; } 
                else { extraClass = 'wrong-nav'; }
            } 
            else if (results[i] === 'skipped') { extraClass = 'skipped'; }

            box.className = `nav-box ${extraClass}`;
            box.innerText = (i + 1).toString().padStart(2, '0');
            box.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(box);
        });
    }

    function loadQuestion() {
        selectedOption = null;
        const q = currentSubject[currentIdx];
        document.getElementById('cur-idx-text').innerText = currentIdx + 1;
        document.getElementById('total-idx-text').innerText = currentSubject.length;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('hint-box').classList.add('hidden');
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const hasAnswered = typeof results[currentIdx] === 'number';

        q.a.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item p-4 rounded-lg flex items-center gap-3';
            div.innerHTML = `<div class="w-5 h-5 border-2 border-slate-500 rounded-full flex-shrink-0 flex items-center justify-center"></div> <span>${opt}</span>`;
            
            if (hasAnswered) {
                div.style.cursor = 'default';
                if (i === q.c) {
                    div.classList.add('correct');
                    div.querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
                }
                if (i === results[currentIdx] && i !== q.c) {
                    div.classList.add('wrong');
                    div.querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
                }
            } else {
                div.className += ' cursor-pointer';
                div.onclick = () => selectOption(div, i);
            }
            container.appendChild(div);
        });

        if (hasAnswered) { showHint(); }
        renderGrid();
    }

    function selectOption(el, i) {
        if (typeof results[currentIdx] === 'number') return;
        document.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('div').innerHTML = '';
        });
        el.classList.add('selected');
        el.querySelector('div').innerHTML = '<div class="w-full h-full bg-blue-500 rounded-full scale-75"></div>';
        selectedOption = i;
    }

    function checkAnswer() {
        if(selectedOption === null) return; 
        if(typeof results[currentIdx] === 'number') return; 

        const q = currentSubject[currentIdx];
        const items = document.querySelectorAll('.option-item');
        results[currentIdx] = selectedOption;
        
        if (selectedOption === q.c) {
            items[selectedOption].classList.add('correct');
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        } else {
            items[selectedOption].classList.add('wrong'); 
            items[selectedOption].querySelector('div').innerHTML = '<i class="fas fa-times text-white text-xs"></i>';
            items[q.c].classList.add('correct'); 
            items[q.c].querySelector('div').innerHTML = '<i class="fas fa-check text-white text-xs"></i>';
        }

        items.forEach(item => item.onclick = null);
        showHint();
        renderGrid();
    }

    function showHint() {
        const box = document.getElementById('hint-box');
        if(currentSubject[currentIdx].e) {
            box.innerText = "Gợi ý: " + currentSubject[currentIdx].e;
            box.classList.remove('hidden');
        }
    }

    function nextQuestion() {
        if(typeof results[currentIdx] !== 'number') { results[currentIdx] = 'skipped'; }

        if(currentIdx < currentSubject.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            let firstSkippedIndex = results.findIndex(r => r === 'skipped' || r === null);
            if(firstSkippedIndex !== -1) {
                currentIdx = firstSkippedIndex;
                loadQuestion();
                alert("🔄 Đã hết 1 lượt! Hệ thống tự động quay lại các câu bạn đã bỏ qua (ô màu vàng).");
            } else {
                alert("🎉 Tuyệt vời! Bạn đã hoàn thành toàn bộ câu hỏi trong bộ đề này.");
            }
        }
        renderGrid();
    }

    function prevQuestion() {
        if(currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function deleteSub(name) {
        if(confirm('Xóa môn này?')) {
            delete subjects[name];
            localStorage.setItem('pro_subjects', JSON.stringify(subjects));
            renderSubjects();
        }
    }

    renderSubjects();
</script>
